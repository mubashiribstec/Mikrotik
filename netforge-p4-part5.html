<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NetForge — MikroTik Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #070c18; overflow: hidden; font-family: Inter, sans-serif; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  </style>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const A = { bg: '#0B1220', surface: 'rgba(255,255,255,0.035)', border: 'rgba(255,255,255,0.07)', text: '#E6EAF2', textDim: 'rgba(230,234,242,0.62)', textFaint: 'rgba(230,234,242,0.42)', accent: '#3B82F6', accentSoft: 'rgba(59,130,246,0.16)', good: '#22C55E', warn: '#F59E0B', bad: '#EF4444', mono: '"JetBrains Mono"', ui: 'Inter, sans-serif' };

const ACard = ({ children, pad = 12 }) => <div style={{ background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12, padding: pad, backdropFilter: 'blur(8px)', animation: 'slideIn 0.4s ease-out' }}>{children}</div>;

const APill = ({ children, tone = 'dim' }) => {
  const tones = { dim: { bg: 'rgba(255,255,255,0.05)', fg: A.textDim, dot: A.textFaint }, good: { bg: 'rgba(34,197,94,0.12)', fg: '#86EFAC', dot: A.good }, bad: { bg: 'rgba(239,68,68,0.12)', fg: '#FCA5A5', dot: A.bad } }[tone];
  return <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '3px 9px 3px 8px', borderRadius: 999, background: tones.bg, fontSize: 11, color: tones.fg, fontWeight: 500 }}><span style={{ width: 6, height: 6, borderRadius: 999, background: tones.dot }} />{children}</span>;
};

const AStatCard = ({ label, value, unit, icon }) => (
  <ACard pad={12}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
      <div style={{ fontSize: 24 }}>{icon}</div>
      <div>
        <div style={{ fontSize: 11, color: A.textFaint }}>{label}</div>
        <div style={{ fontSize: 20, fontWeight: 700, color: A.accent }}>{value}<span style={{ fontSize: 12, color: A.textDim }}>{unit}</span></div>
      </div>
    </div>
  </ACard>
);

const AProtocolCard = ({ name, port, status, peers, traffic }) => (
  <ACard pad={14}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: 12 }}>
      <div>
        <div style={{ fontSize: 13, fontWeight: 600, color: A.text }}>{name}</div>
        <div style={{ fontSize: 11, color: A.textFaint }}>Port {port}</div>
      </div>
      <APill tone={status === 'enabled' ? 'good' : 'dim'}>{status}</APill>
    </div>
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, fontSize: 11, color: A.textDim }}>
      <div><span style={{ color: A.textFaint }}>Peers:</span> <span style={{ color: A.text, fontWeight: 600 }}>{peers}</span></div>
      <div><span style={{ color: A.textFaint }}>Traffic:</span> <span style={{ color: A.accent, fontWeight: 600 }}>{traffic}</span></div>
    </div>
  </ACard>
);

const AQrGenerator = ({ text }) => (
  <div style={{ background: A.surface, padding: 16, borderRadius: 8, border: `1px solid ${A.border}`, textAlign: 'center', marginTop: 12 }}>
    <div style={{ width: 120, height: 120, background: '#fff', borderRadius: 4, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, color: '#000' }}>
      QR: {text.substring(0, 10)}...
    </div>
    <div style={{ fontSize: 10, color: A.textFaint, marginTop: 8 }}>Scan to connect</div>
  </div>
);

const ClientsScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>DHCP & Clients</h2>

    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 12, marginBottom: 16 }}>
      <AStatCard label="Active Leases" value="42" unit="" icon="📋" />
      <AStatCard label="Pool Usage" value="68" unit="%" icon="📊" />
      <AStatCard label="Reserved" value="12" unit="" icon="🔒" />
      <AStatCard label="Unknown" value="3" unit="" icon="❓" />
    </div>

    <h3 style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12, textTransform: 'uppercase' }}>Connected Devices</h3>
    {[
      { vendor: 'Apple', ip: '192.168.1.100', mac: '00:1A:2B:3C:4D:5E', iface: 'ether1', lease: '18h', rx: 420, tx: 850 },
      { vendor: 'Samsung', ip: '192.168.1.105', mac: '00:2A:3B:4C:5D:6E', iface: 'ether2', lease: '14h', rx: 650, tx: 1200 },
      { vendor: 'Linux', ip: '192.168.1.110', mac: '00:3A:4B:5C:6D:7E', iface: 'ether1', lease: '12h', rx: 280, tx: 540 },
      { vendor: 'Windows', ip: '192.168.1.115', mac: '00:4A:5B:6C:7D:8E', iface: 'wifi', lease: '8h', rx: 190, tx: 380 },
    ].map(c => (
      <ACard key={c.mac} pad={12} style={{ marginBottom: 8 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
          <div>
            <div style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{c.vendor}</div>
            <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>{c.ip}</div>
          </div>
          <APill tone="good">{c.iface}</APill>
        </div>
        <div style={{ fontSize: 10, color: A.textFaint, fontFamily: A.mono, marginBottom: 6 }}>{c.mac}</div>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: A.textDim }}>
          <span>Lease: {c.lease}</span>
          <span>↓{c.rx}MB / ↑{c.tx}MB</span>
        </div>
      </ACard>
    ))}
  </div>
);

const HotspotScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>Hotspot & PPPoE</h2>

    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 }}>
      <AStatCard label="Online Users" value="8" unit="" icon="👥" />
      <AStatCard label="Total Users" value="24" unit="" icon="👤" />
    </div>

    <h3 style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12, textTransform: 'uppercase' }}>Active Users</h3>
    {[
      { name: 'user1@example.com', plan: 'Premium 10M', online: true, uptime: '4h 32m', data: '2.3 GB' },
      { name: 'user2@example.com', plan: 'Basic 5M', online: true, uptime: '2h 15m', data: '0.8 GB' },
      { name: 'user3@example.com', plan: 'Premium 10M', online: false, uptime: '-', data: '1.5 GB' },
      { name: 'user4@example.com', plan: 'Standard 8M', online: true, uptime: '8h 47m', data: '3.2 GB' },
    ].map(u => (
      <ACard key={u.name} pad={12} style={{ marginBottom: 8 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
          <div>
            <div style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{u.name}</div>
            <div style={{ fontSize: 11, color: A.textFaint }}>{u.plan}</div>
          </div>
          <APill tone={u.online ? 'good' : 'dim'}>{u.online ? 'Online' : 'Offline'}</APill>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: A.textDim, paddingTop: 8, borderTop: `1px solid ${A.border}` }}>
          <span>Uptime: {u.uptime}</span>
          <span style={{ color: A.accent, fontWeight: 600 }}>{u.data}</span>
        </div>
      </ACard>
    ))}
  </div>
);

const WirelessScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>Wireless SSIDs</h2>

    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 }}>
      <AStatCard label="Active SSIDs" value="3" unit="" icon="📡" />
      <AStatCard label="Clients" value="18" unit="" icon="📱" />
    </div>

    <h3 style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12, textTransform: 'uppercase' }}>SSIDs</h3>
    {[
      { name: 'NetForge-Main', freq: '2.4 GHz', clients: 12, signal: 92 },
      { name: 'NetForge-Guest', freq: '2.4 GHz', clients: 4, signal: 78 },
      { name: 'NetForge-5G', freq: '5 GHz', clients: 2, signal: 88 },
    ].map(s => (
      <ACard key={s.name} pad={12} style={{ marginBottom: 12 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 10 }}>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text }}>{s.name}</div>
            <div style={{ fontSize: 11, color: A.textFaint }}>{s.freq}</div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.accent }}>{s.signal}%</div>
            <div style={{ fontSize: 11, color: A.textDim }}>{s.clients} clients</div>
          </div>
        </div>
        <div style={{ height: 6, background: A.border, borderRadius: 3, overflow: 'hidden' }}>
          <div style={{ width: `${s.signal}%`, height: '100%', background: A.accent, transition: 'width 0.3s' }} />
        </div>
      </ACard>
    ))}
  </div>
);

const VpnScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>VPN Protocols</h2>

    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 }}>
      <AStatCard label="Active Protocols" value="3" unit="" icon="🔐" />
      <AStatCard label="Total Peers" value="14" unit="" icon="🔗" />
    </div>

    <h3 style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12, textTransform: 'uppercase' }}>Protocols</h3>
    <AProtocolCard name="WireGuard" port="51820" status="enabled" peers="8" traffic="125 Mbps" />

    <ACard pad={14} style={{ marginTop: 12, marginBottom: 12 }}>
      <AQrGenerator text="wireguard://config-key-12345" />
    </ACard>

    <AProtocolCard name="L2TP/IPsec" port="1701" status="enabled" peers="4" traffic="45 Mbps" />
    <AProtocolCard name="OpenVPN" port="1194" status="enabled" peers="2" traffic="28 Mbps" />

    <h3 style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12, marginTop: 16, textTransform: 'uppercase' }}>Peers</h3>
    {[
      { name: 'Remote-Office-1', ip: '203.0.113.10', status: 'connected', traffic: '2.4 MB/s' },
      { name: 'Remote-Office-2', ip: '198.51.100.20', status: 'connected', traffic: '1.8 MB/s' },
      { name: 'VPN-Client-3', ip: '192.0.2.15', status: 'reconnecting', traffic: '0.2 MB/s' },
    ].map(p => (
      <ACard key={p.name} pad={12} style={{ marginBottom: 8 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{p.name}</div>
            <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>{p.ip}</div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <APill tone={p.status === 'connected' ? 'good' : 'warn'}>{p.status}</APill>
            <div style={{ fontSize: 11, color: A.accent, fontWeight: 600, marginTop: 4 }}>{p.traffic}</div>
          </div>
        </div>
      </ACard>
    ))}
  </div>
);

const PlaceholderScreen = ({ name }) => (
  <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
    <ACard pad={32} style={{ textAlign: 'center' }}>
      <div style={{ fontSize: 13, color: A.textFaint }}>{name}</div>
      <div style={{ fontSize: 12, color: A.textFaint, marginTop: 8 }}>Part 6+</div>
    </ACard>
  </div>
);

const App = () => {
  const [page, setPage] = React.useState('Clients');

  const render = () => {
    switch(page) {
      case 'Clients': return <ClientsScreen />;
      case 'Hotspot': return <HotspotScreen />;
      case 'Wireless': return <WirelessScreen />;
      case 'VPN': return <VpnScreen />;
      default: return <PlaceholderScreen name={page} />;
    }
  };

  return (
    <div style={{ width: '100%', height: '100%', background: A.bg, color: A.text, display: 'flex', fontFamily: A.ui, fontSize: 13 }}>
      <div style={{ width: 180, borderRight: `1px solid ${A.border}`, padding: 8, overflow: 'auto' }}>
        {['Clients', 'Hotspot', 'Wireless', 'VPN'].map(p => (
          <button key={p} onClick={() => setPage(p)} style={{
            width: '100%', padding: 10, marginBottom: 4, border: 'none', background: page === p ? A.accent : 'transparent',
            color: page === p ? '#fff' : A.textDim, cursor: 'pointer', borderRadius: 6, fontFamily: A.ui, fontSize: 12,
            transition: 'all 0.2s', fontWeight: page === p ? 500 : 400
          }}>
            {p}
          </button>
        ))}
      </div>
      {render()}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
