<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NetForge — MikroTik Manager · Print</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0B1220;
    font-family: Inter, "Segoe UI", system-ui, sans-serif; color: #E6EAF2;
    -webkit-font-smoothing: antialiased; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { width: 1280px; height: 800px; position: relative; overflow: hidden;
    margin: 0 auto 24px; background: #0B1220; }
  .page-label { font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; color: rgba(230,234,242,0.5); text-align: center; padding: 14px 0 4px;
    letter-spacing: 0.06em; text-transform: uppercase; }
  .winshell { width: 100%; height: 100%; border-radius: 8px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
    position: relative; }
  *::-webkit-scrollbar { width: 0; height: 0; }

  @page { size: 1280px 860px; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .page-label { color: #888; }
    .page { margin: 0; break-after: page; page-break-after: always; }
    .page:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="direction-a-core.jsx"></script>
<script type="text/babel" src="direction-a-screens.jsx"></script>
<script type="text/babel" src="direction-a-network.jsx"></script>
<script type="text/babel" src="direction-a-clients.jsx"></script>
<script type="text/babel" src="direction-a-system.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const screens = [
  { id: '01', label: '01 · Connect',                        Comp: ALogin },
  { id: '02', label: '02 · Dashboard',                      Comp: ADashboard },
  { id: '03', label: '03 · Interfaces',                     Comp: AInterfaces },
  { id: '04', label: '04 · WAN & Load Balance',             Comp: AWanLB },
  { id: '05', label: '05 · Firewall · Block sites',         Comp: AFirewall },
  { id: '06', label: '06 · Bandwidth · Simple Queue',       Comp: ABandwidth },
  { id: '07', label: '07 · DHCP & Clients',                 Comp: AClients },
  { id: '08', label: '08 · Hotspot / PPPoE',                Comp: AHotspot },
  { id: '09', label: '09 · Wireless · CAPsMAN',             Comp: AWireless },
  { id: '10', label: '10 · VPN',                            Comp: AVpn },
  { id: '11', label: '11 · Logs',                           Comp: ALogs },
  { id: '12', label: '12 · Scripts & Scheduler',            Comp: AScripts },
  { id: '13', label: '13 · Backup & Restore',               Comp: ABackup },
  { id: '14', label: '14 · Settings',                       Comp: ASettings },
];

const Print = () => (
  <div>
    {screens.map(s => (
      <div key={s.id}>
        <div className="page-label">{s.label}</div>
        <div className="page"><div className="winshell"><s.Comp /></div></div>
      </div>
    ))}
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<Print />);

// Auto-print after fonts + JSX ready
(async () => {
  try { await document.fonts.ready; } catch (e) {}
  await new Promise(r => setTimeout(r, 800));
  window.print();
})();
</script>
</body>
</html>
