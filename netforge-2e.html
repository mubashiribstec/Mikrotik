<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NetForge — MikroTik Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #070c18; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
    #root { width: 100%; height: 100%; }
    *::-webkit-scrollbar { width: 0; height: 0; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  </style>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">

// ========== CONTEXT ==========
const NavCtx = React.createContext({ page: 'Login', setPage: () => {} });
const DataCtx = React.createContext({ data: {}, refreshData: () => {} });

// ========== COLOR TOKENS ==========
const A = {
  bg: '#0B1220',
  bgLayered: 'radial-gradient(120% 80% at 0% 0%, rgba(56,118,255,0.18), transparent 55%), radial-gradient(80% 60% at 100% 100%, rgba(99,102,241,0.10), transparent 60%), #0B1220',
  surface: 'rgba(255,255,255,0.035)',
  surfaceStrong: 'rgba(255,255,255,0.06)',
  border: 'rgba(255,255,255,0.07)',
  borderStrong: 'rgba(255,255,255,0.12)',
  text: '#E6EAF2',
  textDim: 'rgba(230,234,242,0.62)',
  textFaint: 'rgba(230,234,242,0.42)',
  accent: '#3B82F6',
  accentSoft: 'rgba(59,130,246,0.16)',
  good: '#22C55E',
  warn: '#F59E0B',
  bad: '#EF4444',
  mono: '"JetBrains Mono", ui-monospace, monospace',
  ui: 'Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif',
};

// ========== MOCK API SERVICE ==========
const MockAPI = {
  getLogs: () => {
    const topics = ['interface', 'system', 'firewall', 'dhcp', 'wireless', 'script', 'certificate'];
    const sources = ['ether1', 'ether2', 'system', 'DHCP', 'wireless', 'scheduler', 'ca'];
    const messages = ['went up', 'went down', 'configuration changed', 'lease assigned', 'connection established', 'executed successfully', 'error occurred', 'status update'];
    return Array.from({ length: 8 }, (_, i) => ({
      time: new Date(Date.now() - i * 30000).toLocaleTimeString(),
      topic: topics[Math.floor(Math.random() * topics.length)],
      source: sources[Math.floor(Math.random() * sources.length)],
      msg: messages[Math.floor(Math.random() * messages.length)],
    }));
  },

  getScripts: () => [
    { name: 'backup_daily', lastRun: new Date(Date.now() - 86400000).toLocaleString(), schedule: '0 2 * * *', status: 'success' },
    { name: 'health_check', lastRun: new Date(Date.now() - 300000).toLocaleString(), schedule: '*/5 * * * *', status: 'success' },
    { name: 'cleanup_logs', lastRun: new Date(Date.now() - 604800000).toLocaleString(), schedule: '0 3 * * 0', status: 'success' },
    { name: 'update_dns', lastRun: new Date(Date.now() - 3600000).toLocaleString(), schedule: '0 * * * *', status: 'success' },
  ],

  getBackups: () => {
    const today = new Date().toISOString().split('T')[0];
    const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
    const twoDaysAgo = new Date(Date.now() - 172800000).toISOString().split('T')[0];
    return [
      { filename: `backup-${today}-full.backup`, size: (Math.random() * 3 + 10).toFixed(1) + ' MB', timestamp: new Date().toLocaleString(), trigger: 'Scheduled' },
      { filename: `backup-${yesterday}-full.backup`, size: (Math.random() * 2 + 11).toFixed(1) + ' MB', timestamp: new Date(Date.now() - 86400000).toLocaleString(), trigger: 'Scheduled' },
      { filename: `backup-${twoDaysAgo}-manual.backup`, size: (Math.random() * 2.5 + 10).toFixed(1) + ' MB', timestamp: new Date(Date.now() - 172800000).toLocaleString(), trigger: 'Manual' },
    ];
  },
};

// ========== ICON COMPONENT ==========
const Icon = ({ d, size = 16, sw = 1.6, fill = 'none' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
    {typeof d === 'string' ? <path d={d} /> : d}
  </svg>
);

const Icons = {
  list: <Icon d={<><path d="M4 6h16M4 12h16M4 18h10"/></>} />,
  terminal: <Icon d={<><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h5"/></>} />,
  save: <Icon d={<><path d="M5 3h11l4 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></>} />,
  cog: <Icon d={<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .4 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.4 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .4-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.4-1.9l-.1-.1A2 2 0 1 1 6.9 4.2l.1.1a1.7 1.7 0 0 0 1.9.4H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.4 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></>} />,
  power: <Icon d={<><path d="M12 3v9"/><path d="M5.6 7a8 8 0 1 0 12.8 0"/></>} />,
};

// ========== BRAND MARK ==========
const NetForgeMark = ({ size = 22, color = 'currentColor' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
    <path d="M12 2.5 21 7.5v9L12 21.5 3 16.5v-9z" stroke={color} strokeWidth="1.6" strokeLinejoin="round" />
    <circle cx="12" cy="12" r="2.6" fill={color} />
    <path d="M12 9.4V4M12 14.6V20M9.6 10.7 5 8.2M14.4 13.3 19 15.8M9.6 13.3 5 15.8M14.4 10.7 19 8.2" stroke={color} strokeWidth="1.4" strokeLinecap="round" opacity="0.65" />
  </svg>
);

// ========== WIN CHROME ==========
const WinChrome = () => {
  const fg = 'rgba(255,255,255,.78)';
  const hover = 'rgba(255,255,255,.08)';
  return (
    <div style={{ display: 'flex', height: '100%' }}>
      {[
        <path key="m" d="M3 8h10" stroke={fg} strokeWidth="1" />,
        <g key="x"><rect x="3" y="3" width="10" height="10" stroke={fg} strokeWidth="1" fill="none" /></g>,
        <path key="c" d="M3 3l10 10M13 3 3 13" stroke={fg} strokeWidth="1" />,
      ].map((g, i) => (
        <div key={i} style={{ width: 46, display: 'grid', placeItems: 'center' }}
            onMouseEnter={e => e.currentTarget.style.background = i === 2 ? '#e81123' : hover}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <svg width="16" height="16" viewBox="0 0 16 16">{g}</svg>
        </div>
      ))}
    </div>
  );
};

// ========== ATOM COMPONENTS ==========

const ABase = ({ children }) => (
  <div style={{ width: '100%', height: '100%', background: A.bgLayered, color: A.text,
    fontFamily: A.ui, fontSize: 13, lineHeight: 1.45, letterSpacing: '-0.005em',
    display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
    {children}
  </div>
);

const ATitleBar = ({ title }) => (
  <div style={{ height: 32, display: 'flex', alignItems: 'center', flex: '0 0 auto',
    borderBottom: `1px solid ${A.border}`, background: 'rgba(7,11,20,0.5)' }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 12px', color: A.textDim, fontSize: 12 }}>
      <NetForgeMark size={14} color={A.accent} />
      <span style={{ fontWeight: 500, color: A.text }}>NetForge</span>
      <span style={{ color: A.textFaint }}>·</span>
      <span>{title}</span>
    </div>
    <div style={{ flex: 1 }} />
    <WinChrome />
  </div>
);

const APill = ({ children, tone = 'dim' }) => {
  const tones = {
    dim: { bg: 'rgba(255,255,255,0.05)', fg: A.textDim, dot: A.textFaint },
    good: { bg: 'rgba(34,197,94,0.12)', fg: '#86EFAC', dot: A.good },
  }[tone];
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '3px 9px 3px 8px', borderRadius: 999, background: tones.bg,
      fontFamily: A.ui, fontSize: 11, color: tones.fg, fontWeight: 500 }}>
      <span style={{ width: 6, height: 6, borderRadius: 999, background: tones.dot }} />
      {children}
    </span>
  );
};

const ACard = ({ children, pad = 16, style, animated = true }) => (
  <div style={{ background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12,
    padding: pad, backdropFilter: 'blur(8px)', animation: animated ? 'slideIn 0.4s ease-out' : 'none', ...style }}>
    {children}
  </div>
);

// ========== SCREENS ==========

const LogsScreen = () => {
  const { data } = React.useContext(DataCtx);
  const logs = data.logs || [];

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'auto', padding: 16 }}>
      <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: A.text }}>System Logs (Live)</h3>
      {logs.map((log, i) => (
        <ACard key={i} animated={true} style={{ marginBottom: 8, padding: 12 }}>
          <div style={{ marginBottom: 8 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6, alignItems: 'center' }}>
              <div style={{ fontSize: 12, fontFamily: A.mono, color: A.textDim }}>{log.time}</div>
              <APill tone="good">{log.topic}</APill>
            </div>
            <div style={{ fontSize: 13, color: A.text, marginBottom: 4 }}>{log.msg}</div>
            <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>Source: {log.source}</div>
          </div>
        </ACard>
      ))}
    </div>
  );
};

const ScriptsScreen = () => {
  const { data } = React.useContext(DataCtx);
  const scripts = data.scripts || [];

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'auto', padding: 16 }}>
      <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: A.text }}>Scheduled Scripts (Live)</h3>
      {scripts.map((s, i) => (
        <ACard key={i} animated={true} style={{ marginBottom: 12, padding: 12 }}>
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 500 }}>{s.name}</div>
                <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>{s.schedule}</div>
              </div>
              <APill tone="good">{s.status}</APill>
            </div>
            <div style={{ fontSize: 11, color: A.textDim, paddingTop: 8, borderTop: `1px solid ${A.border}` }}>
              Last run: {s.lastRun}
            </div>
          </div>
        </ACard>
      ))}
    </div>
  );
};

const BackupScreen = () => {
  const { data } = React.useContext(DataCtx);
  const backups = data.backups || [];

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'auto', padding: 16 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
        <h3 style={{ fontSize: 14, fontWeight: 600, color: A.text }}>Backup Files (Live)</h3>
      </div>
      {backups.map((b, i) => (
        <ACard key={i} animated={true} style={{ marginBottom: 12, padding: 12 }}>
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 500, fontFamily: A.mono }}>{b.filename}</div>
              </div>
              <APill tone="good">{b.trigger}</APill>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: A.textDim, paddingTop: 8, borderTop: `1px solid ${A.border}` }}>
              <span>{b.size}</span>
              <span>{b.timestamp}</span>
            </div>
          </div>
        </ACard>
      ))}
    </div>
  );
};

const SettingsScreen = () => {
  const [mode, setMode] = React.useState('Simple');

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'auto', padding: 16 }}>
      <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 16, color: A.text }}>Settings</h3>

      <ACard animated={true} style={{ marginBottom: 16, padding: 12 }}>
        <h4 style={{ fontSize: 12, fontWeight: 600, marginBottom: 12, color: A.text }}>Default Mode</h4>
        {['Simple', 'Advanced', 'Remember'].map((m) => (
          <label key={m} style={{ display: 'flex', alignItems: 'center', marginBottom: 10, cursor: 'pointer' }}>
            <input type="radio" checked={mode === m} onChange={() => setMode(m)} style={{ marginRight: 8, cursor: 'pointer' }} />
            <span style={{ fontSize: 12, color: A.text }}>{m === 'Remember' ? 'Remember Last Used' : m + ' Mode (Default)'}</span>
          </label>
        ))}
      </ACard>

      <ACard animated={true} style={{ marginBottom: 16, padding: 12 }}>
        <h4 style={{ fontSize: 12, fontWeight: 600, marginBottom: 12, color: A.text }}>Notifications</h4>
        {['Log errors', 'Warn on high CPU', 'Alert on disconnect'].map((opt) => (
          <label key={opt} style={{ display: 'flex', alignItems: 'center', marginBottom: 10, cursor: 'pointer' }}>
            <input type="checkbox" defaultChecked={true} style={{ marginRight: 8, cursor: 'pointer' }} />
            <span style={{ fontSize: 12, color: A.text }}>{opt}</span>
          </label>
        ))}
      </ACard>

      <ACard animated={true} style={{ padding: 12 }}>
        <h4 style={{ fontSize: 12, fontWeight: 600, marginBottom: 8, color: A.text }}>System</h4>
        <div style={{ fontSize: 11, color: A.textFaint }}>NetForge v1.0.0</div>
        <div style={{ fontSize: 11, color: A.textFaint, marginTop: 4 }}>API: Mock Data Service</div>
        <div style={{ fontSize: 11, color: A.textFaint, marginTop: 4 }}>Connected: Yes</div>
      </ACard>
    </div>
  );
};

const LoginScreen = () => {
  const { setPage } = React.useContext(NavCtx);

  return (
    <ABase>
      <ATitleBar title="Login" />
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 32 }}>
        <div style={{ width: 400 }}>
          <div style={{ marginBottom: 32, textAlign: 'center' }}>
            <NetForgeMark size={48} color={A.accent} />
            <h1 style={{ fontSize: 24, fontWeight: 700, marginTop: 12, color: A.text }}>NetForge</h1>
          </div>

          <button onClick={() => setPage('Dashboard')} style={{
            width: '100%', padding: '8px 16px', backgroundColor: A.accent, color: '#fff',
            border: 'none', borderRadius: 8, fontSize: 13, fontWeight: 500, cursor: 'pointer'
          }}>
            Connect
          </button>
        </div>
      </div>
    </ABase>
  );
};

// ========== MAIN APP ==========
const App = () => {
  const [page, setPage] = React.useState('Login');
  const [data, setData] = React.useState({});

  const refreshData = () => {
    setData({
      logs: MockAPI.getLogs(),
      scripts: MockAPI.getScripts(),
      backups: MockAPI.getBackups(),
    });
  };

  React.useEffect(() => {
    if (page !== 'Login') {
      refreshData();
      const interval = setInterval(refreshData, 2000);
      return () => clearInterval(interval);
    }
  }, [page]);

  const renderScreen = () => {
    switch(page) {
      case 'Logs': return <LogsScreen />;
      case 'Scripts': return <ScriptsScreen />;
      case 'Backup': return <BackupScreen />;
      case 'Settings': return <SettingsScreen />;
      default: return <LoginScreen />;
    }
  };

  if (page === 'Login') {
    return (
      <NavCtx.Provider value={{ page, setPage }}>
        <DataCtx.Provider value={{ data, refreshData }}>
          <LoginScreen />
        </DataCtx.Provider>
      </NavCtx.Provider>
    );
  }

  const navItems = [
    { name: 'Logs', icon: Icons.list },
    { name: 'Scripts', icon: Icons.terminal },
    { name: 'Backup', icon: Icons.save },
    { name: 'Settings', icon: Icons.cog },
  ];

  return (
    <NavCtx.Provider value={{ page, setPage }}>
      <DataCtx.Provider value={{ data, refreshData }}>
        <ABase>
          <ATitleBar title={page} />
          <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
            <div style={{ width: 180, borderRight: `1px solid ${A.border}`, overflow: 'auto', display: 'flex', flexDirection: 'column' }}>
              {navItems.map((item) => (
                <button key={item.name} onClick={() => setPage(item.name)} style={{
                  flex: '0 0 auto', padding: '10px 12px', border: 'none', background: page === item.name ? A.accentSoft : 'transparent',
                  color: page === item.name ? A.accent : A.textDim, cursor: 'pointer',
                  fontFamily: A.ui, fontSize: 12, fontWeight: page === item.name ? 500 : 400,
                  display: 'flex', alignItems: 'center', gap: 8, borderLeft: page === item.name ? `2px solid ${A.accent}` : '2px solid transparent',
                  transition: 'all 0.2s ease-out',
                }}>
                  <div>{item.icon}</div>
                  <span>{item.name}</span>
                </button>
              ))}
              <div style={{ flex: 1 }} />
              <button onClick={() => setPage('Login')} style={{
                flex: '0 0 auto', padding: '10px 12px', border: 'none', background: 'transparent',
                color: A.textDim, cursor: 'pointer', fontFamily: A.ui, fontSize: 12,
                display: 'flex', alignItems: 'center', gap: 8, borderTop: `1px solid ${A.border}`,
              }}>
                {Icons.power}
                <span>Logout</span>
              </button>
            </div>
            {renderScreen()}
          </div>
        </ABase>
      </DataCtx.Provider>
    </NavCtx.Provider>
  );
};

// ========== RENDER ==========
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
</body>
</html>
