// ============ REUSABLE COMPONENTS ============
const ABase = ({ children, style = {}, ...props }) => (
  <div style={{ backgroundColor: A.bgCard, border: `1px solid ${A.bgSecondary}`, borderRadius: 8, padding: A.sp16, ...style }} {...props}>{children}</div>
);

const ATitleBar = ({ title, children }) => (
  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: A.sp20 }}>
    <h1 style={{ fontSize: A.fontXL, fontWeight: A.fontBold, color: A.textPrimary }}>{title}</h1>
    {children}
  </div>
);

const ABtn = ({ label, onClick, variant = 'primary', icon, disabled = false }) => {
  const bgColor = variant === 'primary' ? A.accentBlue : variant === 'secondary' ? A.bgSecondary : A.accentRed;
  return (
    <button onClick={onClick} disabled={disabled} style={{
      backgroundColor: disabled ? A.bgSecondary : bgColor, color: A.textPrimary, border: 'none', borderRadius: 6, padding: `${A.sp8}px ${A.sp16}px`, cursor: disabled ? 'not-allowed' : 'pointer', fontSize: A.fontBase, display: 'flex', alignItems: 'center', gap: A.sp8, opacity: disabled ? 0.5 : 1,
    }}>
      {icon && <Icon name={icon} size={16} />}
      {label}
    </button>
  );
};

const APill = ({ label, active = false, onClick }) => (
  <button onClick={onClick} style={{
    backgroundColor: active ? A.accentBlue : A.bgSecondary, color: A.textPrimary, border: 'none', borderRadius: 20, padding: `${A.sp8}px ${A.sp12}px`, cursor: 'pointer', fontSize: A.fontSmall, fontWeight: active ? A.fontSemiBold : A.fontNormal,
  }}>
    {label}
  </button>
);

  <ABase style={{ marginBottom: A.sp16 }}>
    {title && <h2 style={{ fontSize: A.fontMedium, fontWeight: A.fontSemiBold, marginBottom: A.sp12, color: A.textPrimary }}>{title}</h2>}
    {children}
    {footer && <div style={{ marginTop: A.sp12, paddingTop: A.sp12, borderTop: `1px solid ${A.bgSecondary}`, fontSize: A.fontSmall, color: A.textSecondary }}>{footer}</div>}
  </ABase>
);

const ALabeledField = ({ label, children, help }) => (

  </div>
);

const AToggleRow = ({ label, value, onChange, help }) => (
  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: A.sp12, backgroundColor: A.bgSecondary, borderRadius: 6, marginBottom: A.sp8 }}>
    <div>
      <div style={{ fontSize: A.fontBase, color: A.textPrimary, fontWeight: A.fontSemiBold }}>{label}</div>
      {help && <div style={{ fontSize: A.fontSmall, color: A.textSecondary }}>{help}</div>}
    </div>
    <button onClick={() => onChange(!value)} style={{ width: 44, height: 24, backgroundColor: value ? A.accentBlue : A.bgDark, borderRadius: 12, border: 'none', cursor: 'pointer', position: 'relative' }}>
      <div style={{ width: 20, height: 20, backgroundColor: A.textPrimary, borderRadius: 10, position: 'absolute', top: 2, left: value ? 22 : 2, transition: 'left 0.2s' }} />
    </button>
  </div>
);

const LineChart = ({ data, height = 100, color = A.accentBlue }) => {
  if (!data || data.length < 2) return null;
  const max = Math.max(...data);
  const points = data.map((v, i) => `${(i / (data.length - 1)) * 200},${100 - (v / max) * 80}`).join(' ');
  return (
    <svg viewBox="0 0 200 100" style={{ height, width: '100%' }}>
      <polyline points={points} fill="none" stroke={color} strokeWidth="2" vectorEffect="non-scaling-stroke"/>
    </svg>
  );
};

  ];
  return (
    <div style={{ height: '100vh', display: 'flex', backgroundColor: A.bgDark }}>
      <div style={{ flex: 1, padding: A.sp48, display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
        <div style={{ marginBottom: A.sp48 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: A.sp16, marginBottom: A.sp16 }}>
            <NetForgeMark />
            <h1 style={{ fontSize: '32px', fontWeight: A.fontBold, color: A.accentBlue }}>NetForge</h1>
          </div>
          <p style={{ color: A.textSecondary, fontSize: A.fontLarge }}>MikroTik Router Manager (Mock API)</p>
        </div>
        <ALabeledField label="Host / IP Address">
          <input type="text" value={host} onChange={(e) => setHost(e.target.value)} style={{ width: '100%', padding: A.sp12, backgroundColor: A.bgCard, border: `1px solid ${A.bgSecondary}`, borderRadius: 6, color: A.textPrimary, fontSize: A.fontBase }} />
        </ALabeledField>
        <ALabeledField label="Username">
          <input type="text" value={user} onChange={(e) => setUser(e.target.value)} style={{ width: '100%', padding: A.sp12, backgroundColor: A.bgCard, border: `1px solid ${A.bgSecondary}`, borderRadius: 6, color: A.textPrimary, fontSize: A.fontBase }} />
        </ALabeledField>
        <ALabeledField label="Password">
          <input type="password" value={pass} onChange={(e) => setPass(e.target.value)} style={{ width: '100%', padding: A.sp12, backgroundColor: A.bgCard, border: `1px solid ${A.bgSecondary}`, borderRadius: 6, color: A.textPrimary, fontSize: A.fontBase }} />
        </ALabeledField>
        <button onClick={() => setPage('Dashboard')} style={{ width: '100%', padding: A.sp12, backgroundColor: A.accentBlue, color: A.bgDark, border: 'none', borderRadius: 6, fontSize: A.fontBase, fontWeight: A.fontSemiBold, cursor: 'pointer', marginTop: A.sp24 }}>
          Connect
        </button>
      </div>
      <div style={{ width: '400px', padding: A.sp32, backgroundColor: A.bgCard, borderLeft: `1px solid ${A.bgSecondary}` }}>
        <h2 style={{ fontSize: A.fontLarge, fontWeight: A.fontSemiBold, marginBottom: A.sp16, color: A.textPrimary }}>Recent Connections</h2>
        {recentConnections.map((conn, i) => (
          <button key={i} onClick={() => setPage('Dashboard')} style={{ width: '100%', padding: A.sp12, marginBottom: A.sp12, backgroundColor: A.bgSecondary, color: A.textPrimary, border: 'none', borderRadius: 6, cursor: 'pointer', textAlign: 'left' }}>
            <div style={{ fontSize: A.fontBase, fontWeight: A.fontSemiBold }}>{conn.label}</div>
            <div style={{ fontSize: A.fontSmall, color: A.textSecondary }}>{conn.host}</div>
          </button>
        ))}
      </div>
    </div>
  );
};

// ============ KPI CARD ============
const AKpi = ({ label, value, unit, trend }) => (
  <ABase style={{ marginBottom: A.sp12 }}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: A.sp12 }}>
      <div>
        <div style={{ fontSize: A.fontSmall, color: A.textSecondary, marginBottom: A.sp4 }}>{label}</div>
        <div style={{ fontSize: '24px', fontWeight: A.fontBold, color: A.accentBlue }}>{value}{unit}</div>
      </div>
      <div style={{ width: 60, height: 40 }}>
        <LineChart data={trend} color={A.accentGreen} />
      </div>
    </div>
  </ABase>
);

// ============ ACTION BUTTON ============
const AAction = ({ label, active = false, onClick }) => (
  <button onClick={onClick} style={{
    padding: `${A.sp12}px ${A.sp16}px`, backgroundColor: active ? A.accentBlue : A.bgCard, color: A.textPrimary, border: `1px solid ${active ? A.accentBlue : A.bgSecondary}`, borderRadius: 6, cursor: 'pointer', fontSize: A.fontSmall, fontWeight: A.fontSemiBold, marginRight: A.sp8, marginBottom: A.sp8,
  }}>
    {label}
  </button>
);

// ============ DASHBOARD (with live data) ============
const ADashboard = () => {
  const { data } = useContext(DataCtx);
  const systemStats = data.systemStats || { cpu: 0, memory: 0, storage: 0, activeClients: 0 };
  const traffic = data.traffic || { rx: [], tx: [] };
  const wanStatus = data.wanStatus || [];
  const topTalkers = data.topTalkers || [];

  return (
    <div style={{ overflowY: 'auto', height: `calc(100vh - ${A.topBarH}px)`, padding: A.sp20 }}>
      <ATitleBar title="Dashboard" />
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: A.sp16, marginBottom: A.sp24 }}>
        <AKpi label="CPU Usage" value={systemStats.cpu} unit="%" trend={[systemStats.cpu - 5, systemStats.cpu - 2, systemStats.cpu, systemStats.cpu + 2, systemStats.cpu - 1]} />
        <AKpi label="Memory" value={systemStats.memory} unit="%" trend={[systemStats.memory - 3, systemStats.memory - 1, systemStats.memory, systemStats.memory + 1, systemStats.memory]} />
        <AKpi label="Storage" value={systemStats.storage} unit="%" trend={[systemStats.storage, systemStats.storage + 1, systemStats.storage, systemStats.storage]} />
        <AKpi label="Active Clients" value={systemStats.activeClients} unit="" trend={[systemStats.activeClients - 2, systemStats.activeClients, systemStats.activeClients + 1, systemStats.activeClients - 1, systemStats.activeClients]} />
      </div>
      <ACard title="Quick Actions">
        <div>
          <AAction label="Block YouTube" active={true} onClick={() => {}} />
          <AAction label="Block Facebook" onClick={() => {}} />
          <AAction label="Block TikTok" onClick={() => {}} />
          <AAction label="Limit speed" onClick={() => {}} />
          <AAction label="Add load balance" onClick={() => {}} />
        </div>
      </ACard>
      <ACard title="Traffic Overview (Live)">
        <svg viewBox="0 0 480 140" style={{ width: '100%', height: '140px', marginBottom: A.sp12 }}>
          <defs><pattern id="grid" width="40" height="20" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 20" fill="none" stroke="#1a2640" strokeWidth="0.5"/></pattern></defs>
          <rect width="480" height="140" fill="url(#grid)" />
          {traffic.rx && traffic.rx.length > 0 && (
            <>
              <polyline points={traffic.rx.map((v, i) => `${(i / (traffic.rx.length - 1)) * 480},${140 - (v / 200) * 100}`).join(' ')} fill="none" stroke={A.accentBlue} strokeWidth="2"/>
              <polyline points={traffic.tx.map((v, i) => `${(i / (traffic.tx.length - 1)) * 480},${140 - (v / 200) * 100}`).join(' ')} fill="none" stroke={A.accentCyan} strokeWidth="2"/>
            </>
          )}
        </svg>
        <div style={{ display: 'flex', gap: A.sp16, fontSize: A.fontSmall }}>
          <div><span style={{ color: A.accentBlue }}>●</span> RX: {traffic.rxBps} Mbps</div>
          <div><span style={{ color: A.accentCyan }}>●</span> TX: {traffic.txBps} Mbps</div>
        </div>
      </ACard>
      <ACard title="WAN Status (Live)">
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead><tr style={{ borderBottom: `1px solid ${A.bgSecondary}` }}>
            <th style={{ textAlign: 'left', padding: A.sp8, color: A.textSecondary, fontSize: A.fontSmall }}>Interface</th>
            <th style={{ textAlign: 'left', padding: A.sp8, color: A.textSecondary, fontSize: A.fontSmall }}>Status</th>
            <th style={{ textAlign: 'left', padding: A.sp8, color: A.textSecondary, fontSize: A.fontSmall }}>IP</th>
            <th style={{ textAlign: 'left', padding: A.sp8, color: A.textSecondary, fontSize: A.fontSmall }}>Utilization</th>
          </tr></thead>
          <tbody>
            {wanStatus.map((wan, i) => (
              <tr key={i} style={{ borderBottom: `1px solid ${A.bgSecondary}` }}>
                <td style={{ padding: A.sp8 }}>{wan.name}</td>
                <td style={{ padding: A.sp8 }}><span style={{ color: wan.status === 'up' ? A.accentGreen : A.accentRed }}>● {wan.status}</span></td>
                <td style={{ padding: A.sp8 }}>{wan.ip}</td>
                <td style={{ padding: A.sp8 }}><div style={{ width: 100, height: 20, backgroundColor: A.bgSecondary, borderRadius: 4, overflow: 'hidden' }}><div style={{ width: `${wan.util}%`, height: '100%', backgroundColor: A.accentBlue }} /></div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </ACard>
      <ACard title="Top Talkers (Live)">
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead><tr style={{ borderBottom: `1px solid ${A.bgSecondary}` }}>
            <th style={{ textAlign: 'left', padding: A.sp8, color: A.textSecondary, fontSize: A.fontSmall }}>Host</th>
            <th style={{ textAlign: 'right', padding: A.sp8, color: A.textSecondary, fontSize: A.fontSmall }}>→ TX</th>
            <th style={{ textAlign: 'right', padding: A.sp8, color: A.textSecondary, fontSize: A.fontSmall }}>← RX</th>
          </tr></thead>
          <tbody>
            {topTalkers.map((row, i) => (
              <tr key={i} style={{ borderBottom: `1px solid ${A.bgSecondary}` }}>
                <td style={{ padding: A.sp8 }}>{row.host}</td>
                <td style={{ padding: A.sp8, textAlign: 'right', color: A.accentBlue }}>{row.tx} MB</td>
                <td style={{ padding: A.sp8, textAlign: 'right', color: A.accentCyan }}>{row.rx} MB</td>
              </tr>
            ))}
          </tbody>
        </table>
      </ACard>
    </div>
  );
};

// ============ INTERFACES (with live data) ============
const AInterfaces = () => {
  const { data } = useContext(DataCtx);
  const interfaces = data.interfaces || [];

  return (
    <div style={{ overflowY: 'auto', height: `calc(100vh - ${A.topBarH}px)`, padding: A.sp20 }}>
      <ATitleBar title="Interfaces (Live)" />
      <ACard title="Port Status">
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead><tr style={{ borderBottom: `1px solid ${A.bgSecondary}` }}>
            <th style={{ textAlign: 'left', padding: A.sp8, color: A.textSecondary, fontSize: A.fontSmall }}>Interface</th>
            <th style={{ textAlign: 'left', padding: A.sp8, color: A.textSecondary, fontSize: A.fontSmall }}>Status</th>
            <th style={{ textAlign: 'left', padding: A.sp8, color: A.textSecondary, fontSize: A.fontSmall }}>Speed</th>
            <th style={{ textAlign: 'left', padding: A.sp8, color: A.textSecondary, fontSize: A.fontSmall }}>RX/TX (MB)</th>
          </tr></thead>
          <tbody>
            {interfaces.map((iface, i) => (
              <tr key={i} style={{ borderBottom: `1px solid ${A.bgSecondary}` }}>
                <td style={{ padding: A.sp8 }}>{iface.name}</td>
                <td style={{ padding: A.sp8 }}><span style={{ color: iface.status === 'up' ? A.accentGreen : A.accentRed }}>● {iface.status}</span></td>
                <td style={{ padding: A.sp8 }}>{iface.speed}</td>
                <td style={{ padding: A.sp8 }}>{iface.rx} / {iface.tx}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </ACard>
    </div>
  );
};

// ============ PLACEHOLDER SCREENS ============
const AScreen = ({ title }) => (
  <div style={{ overflowY: 'auto', height: `calc(100vh - ${A.topBarH}px)`, padding: A.sp20 }}>
    <ATitleBar title={title} />
    <ACard title="Coming Soon">
      <div style={{ padding: A.sp32, textAlign: 'center', color: A.textSecondary }}>
        {title} screen with live API data
      </div>
    </ACard>
  </div>
);

// ============ MAIN APP ============
const App = () => {
  const [page, setPage] = useState('Login');
  const [data, setData] = useState({});

  const refreshData = () => {
    setData({
      systemStats: MockAPI.getSystemStats(),
      traffic: MockAPI.getTrafficData(),
      wanStatus: MockAPI.getWANStatus(),
      interfaces: MockAPI.getInterfaces(),
      firewall: MockAPI.getFirewallRules(),
      queues: MockAPI.getBandwidthQueues(),
      clients: MockAPI.getClients(),
      hotspotUsers: MockAPI.getHotspotUsers(),
      wireless: MockAPI.getWirelessSSIDs(),
      vpn: MockAPI.getVPNStatus(),
      logs: MockAPI.getLogs(),
      scripts: MockAPI.getScripts(),
      backups: MockAPI.getBackups(),
      topTalkers: MockAPI.getTopTalkers(),
    });
  };

  useEffect(() => {
    if (page !== 'Login') {
      refreshData();
      const interval = setInterval(refreshData, 2000);
      return () => clearInterval(interval);
    }
  }, [page]);

  const renderPage = () => {
    switch(page) {
      case 'Dashboard': return <ADashboard />;
      case 'Interfaces': return <AInterfaces />;
      case 'WanLB': return <AScreen title="WAN / Load Balance" />;
      case 'Firewall': return <AScreen title="Firewall" />;
      case 'Bandwidth': return <AScreen title="Bandwidth" />;
      case 'Clients': return <AScreen title="DHCP & Clients" />;
      case 'Hotspot': return <AScreen title="Hotspot / PPPoE" />;
      case 'Wireless': return <AScreen title="Wireless" />;
      case 'Vpn': return <AScreen title="VPN" />;
      case 'Logs': return <AScreen title="Logs" />;
      case 'Scripts': return <AScreen title="Scripts" />;
      case 'Backup': return <AScreen title="Backup" />;
      case 'Settings': return <AScreen title="Settings" />;
      case 'Login': return <ALogin />;
      default: return <ALogin />;
    }
  };

  return (
    <NavCtx.Provider value={{ page, setPage }}>
      <DataCtx.Provider value={{ data, refreshData }}>
        {page === 'Login' ? (
          <ALogin />
        ) : (
          <div style={{ display: 'flex', height: '100vh' }}>
            <ASidebar />
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
              <ATopBar onRefresh={refreshData} />
              {renderPage()}
            </div>
          </div>
        )}
      </DataCtx.Provider>
    </NavCtx.Provider>
  );
};

ReactDOM.render(<App />, document.getElementById('app'));
  </script>
</body>
</html>
