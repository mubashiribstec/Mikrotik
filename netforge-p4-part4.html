<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NetForge — MikroTik Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #070c18; overflow: hidden; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const A = { bg: '#0B1220', surface: 'rgba(255,255,255,0.035)', border: 'rgba(255,255,255,0.07)', text: '#E6EAF2', textDim: 'rgba(230,234,242,0.62)', textFaint: 'rgba(230,234,242,0.42)', accent: '#3B82F6', good: '#22C55E', warn: '#F59E0B', bad: '#EF4444', mono: '"JetBrains Mono"', ui: 'Inter, sans-serif' };

const ACard = ({ children, pad = 12 }) => <div style={{ background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12, padding: pad, backdropFilter: 'blur(8px)', animation: 'slideIn 0.4s ease-out' }}>{children}</div>;

const ATopBar = ({ left, right }) => (
  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16, padding: 12, background: A.surface, borderRadius: 8 }}>
    <div>{left}</div>
    <div style={{ display: 'flex', gap: 8 }}>{right}</div>
  </div>
);

const ACliPreview = ({ code }) => (
  <pre style={{ background: 'rgba(0,0,0,0.3)', padding: 12, borderRadius: 8, fontFamily: A.mono, fontSize: 11, color: A.textDim, overflow: 'auto', maxHeight: 200, marginTop: 8 }}>{code}</pre>
);

const InterfacesScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>Network Interfaces</h2>
    <ATopBar left={<span style={{ fontSize: 12, color: A.textDim }}>8 Ports</span>} right={<button style={{ padding: 6, cursor: 'pointer' }}>Add</button>} />
    {[1,2,3,4,5,6,7,8].map(i => (
      <ACard key={i} pad={12}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div style={{ fontSize: 12 }}>
            <div style={{ color: A.text, fontWeight: 600 }}>ether{i}</div>
            <div style={{ color: A.textFaint, fontSize: 11 }}>Status: {i <= 7 ? 'up' : 'down'}</div>
          </div>
          <div style={{ fontSize: 12, color: A.accent, fontWeight: 600 }}>{Math.floor(Math.random() * 80) + 10}%</div>
        </div>
      </ACard>
    ))}
  </div>
);

const WANScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>WAN & Load Balance</h2>
    <ACard pad={16}>
      <div style={{ marginBottom: 16 }}>
        <label style={{ fontSize: 11, color: A.textFaint }}>Load Balancing Method:</label>
        <select style={{ width: '100%', padding: 8, marginTop: 6, background: A.surface, color: A.text, border: `1px solid ${A.border}` }}>
          <option>PCC (Per-Connection)</option>
          <option>NTH (Round-Robin)</option>
          <option>Failover</option>
        </select>
      </div>
    </ACard>
    <ACard pad={16} style={{ marginTop: 12 }}>
      <div style={{ fontSize: 11, color: A.textFaint, marginBottom: 8 }}>Distribution</div>
      <div style={{ display: 'flex', gap: 6 }}>
        <div style={{ flex: 1, height: 40, background: 'rgba(34,197,94,0.3)', borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 600 }}>WAN1: 45%</div>
        <div style={{ flex: 1, height: 40, background: 'rgba(59,130,246,0.3)', borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 600 }}>WAN2: 55%</div>
      </div>
    </ACard>
  </div>
);

const FirewallScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>Firewall Rules</h2>
    <ATopBar left={<span style={{ fontSize: 12, color: A.textDim }}>3 Blocked Sites</span>} right={<button style={{ padding: 6, cursor: 'pointer' }}>+ Rule</button>} />
    {['YouTube.com', 'Facebook.com', 'TikTok.com'].map(site => (
      <ACard key={site} pad={12}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div style={{ fontSize: 12, color: A.text }}>{site}</div>
          <button style={{ padding: 4, fontSize: 10, cursor: 'pointer' }}>×</button>
        </div>
      </ACard>
    ))}
    <ACliPreview code={`/ip firewall filter
add action=reject chain=forward dst-address-list=blocked-sites
add action=accept chain=forward`} />
  </div>
);

const BandwidthScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>Bandwidth Queues</h2>
    <ATopBar left={<span style={{ fontSize: 12, color: A.textDim }}>4 Queues</span>} right={<button style={{ padding: 6, cursor: 'pointer' }}>+ Queue</button>} />
    {[
      { name: 'download_limit', limit: '10M', usage: 65 },
      { name: 'vod_stream', limit: '30M', usage: 42 },
      { name: 'voice', limit: 'unlimited', usage: 8 },
      { name: 'gaming', limit: '100M', usage: 28 },
    ].map(q => (
      <ACard key={q.name} pad={12}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
          <div><div style={{ color: A.text, fontWeight: 600, fontSize: 12 }}>{q.name}</div><div style={{ fontSize: 11, color: A.textFaint }}>{q.limit}</div></div>
          <div style={{ color: A.accent, fontWeight: 600, fontSize: 12 }}>{q.usage}%</div>
        </div>
        <div style={{ height: 6, background: A.border, borderRadius: 3, overflow: 'hidden' }}><div style={{ width: `${q.usage}%`, height: '100%', background: A.accent, transition: 'width 0.3s' }} /></div>
      </ACard>
    ))}
  </div>
);

const PlaceholderScreen = ({ name }) => (
  <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
    <ACard pad={32} style={{ textAlign: 'center' }}>
      <div style={{ fontSize: 13, color: A.textFaint }}>{name}</div>
      <div style={{ fontSize: 12, color: A.textFaint, marginTop: 8 }}>Part 5+</div>
    </ACard>
  </div>
);

const App = () => {
  const [page, setPage] = React.useState('Interfaces');

  const render = () => {
    switch(page) {
      case 'Interfaces': return <InterfacesScreen />;
      case 'WAN': return <WANScreen />;
      case 'Firewall': return <FirewallScreen />;
      case 'Bandwidth': return <BandwidthScreen />;
      default: return <PlaceholderScreen name={page} />;
    }
  };

  return (
    <div style={{ width: '100%', height: '100%', background: A.bg, color: A.text, display: 'flex', fontFamily: A.ui }}>
      <div style={{ width: 180, borderRight: `1px solid ${A.border}`, padding: 8, overflow: 'auto' }}>
        {['Interfaces', 'WAN', 'Firewall', 'Bandwidth'].map(p => (
          <button key={p} onClick={() => setPage(p)} style={{
            width: '100%', padding: 10, marginBottom: 4, border: 'none', background: page === p ? A.accent : 'transparent',
            color: page === p ? '#fff' : A.textDim, cursor: 'pointer', borderRadius: 6, fontFamily: A.ui, fontSize: 12,
            transition: 'all 0.2s'
          }}>
            {p}
          </button>
        ))}
      </div>
      {render()}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
