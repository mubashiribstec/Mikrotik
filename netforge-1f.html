<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetForge - MikroTik Router Manager</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0B1220; color: #E8EAED; overflow: hidden; }
    html, body, #app { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/babel">
const { useState, useContext, createContext, useMemo } = React;

// ============ DESIGN TOKENS ============
const A = {
  // Colors - Direction A
  bgDark: '#0B1220',
  bgDarker: '#050814',
  bgCard: '#0F1629',
  bgSecondary: '#1A2640',
  textPrimary: '#E8EAED',
  textSecondary: '#9CA3AF',
  accentBlue: '#3B82F6',
  accentBlueDark: '#2563EB',
  accentCyan: '#06B6D4',
  accentGreen: '#10B981',
  accentRed: '#EF4444',
  accentOrange: '#F97316',
  accentAmber: '#F59E0B',

  sp4: 4, sp8: 8, sp12: 12, sp16: 16, sp20: 20, sp24: 24, sp32: 32, sp48: 48,

  // Layout
  sidebarW: 232,

// ============ ICONS ============

  Interface: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8 9h8M8 13h8M12 3v18M4 3h16a1 1 0 011 1v16a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1z"/></svg>,
  Lan: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M8 8v4M16 8v4M12 10v8"/></svg>,
  Firewall: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 1l9 5v7c0 5.55-3.84 10.74-9 12-5.16-1.26-9-6.45-9-12V6l9-5z"/></svg>,
  Speed: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="1"/><path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/></svg>,
  Users: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>,
  Wifi: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.94 0"/></svg>,
  Lock: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>,
  List: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9h18M3 15h18"/></svg>,
  Save: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
  Settings: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m4.24-4.24l4.24-4.24"/></svg>,
  Bell: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
  ChevronDown: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9"/></svg>,
  ChevronRight: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>,
  Plus: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  Search: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>,
  Minimize: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  Square: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18"/></svg>,
  X: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
  Play: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
  LogOut: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>,
};

const Icon = ({ name, size = 20, color = 'currentColor' }) => {
  const Component = Icons[name];
  return Component ? <div style={{ display: 'inline-flex', width: size, height: size, color }}><Component /></div> : null;
};

// ============ CONTEXT ============
const NavCtx = createContext({ page: 'Login', setPage: () => {} });

// ============ LOGO COMPONENT ============
const NetForgeMark = () => (
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke={A.accentBlue} strokeWidth="1.5">
    <circle cx="12" cy="12" r="8"/>
    <circle cx="12" cy="4" r="2" fill={A.accentBlue}/>
    <circle cx="18.63" cy="18.63" r="2" fill={A.accentBlue}/>
    <circle cx="5.37" cy="18.63" r="2" fill={A.accentBlue}/>
    <line x1="12" y1="12" x2="12" y2="4"/>
    <line x1="12" y1="12" x2="18.63" y2="18.63"/>
    <line x1="12" y1="12" x2="5.37" y2="18.63"/>
  </svg>
);

// ============ REUSABLE COMPONENTS ============
const ABase = ({ children, style = {}, ...props }) => (
  <div style={{ backgroundColor: A.bgCard, border: `1px solid ${A.bgSecondary}`, borderRadius: 8, padding: A.sp16, ...style }} {...props}>{children}</div>
);

const ATitleBar = ({ title, children }) => (
  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: A.sp20 }}>
    <h1 style={{ fontSize: A.fontXL, fontWeight: A.fontBold, color: A.textPrimary }}>{title}</h1>
    {children}
  </div>
);

const ABtn = ({ label, onClick, variant = 'primary', icon, disabled = false }) => {
  const bgColor = variant === 'primary' ? A.accentBlue : variant === 'secondary' ? A.bgSecondary : A.accentRed;
  return (
    <button onClick={onClick} disabled={disabled} style={{
      backgroundColor: disabled ? A.bgSecondary : bgColor, color: A.textPrimary, border: 'none', borderRadius: 6, padding: `${A.sp8}px ${A.sp16}px`, cursor: disabled ? 'not-allowed' : 'pointer', fontSize: A.fontBase, display: 'flex', alignItems: 'center', gap: A.sp8, opacity: disabled ? 0.5 : 1,
    }}>
      {icon && <Icon name={icon} size={16} />}
      {label}
    </button>
  );
};

const APill = ({ label, active = false, onClick }) => (
  <button onClick={onClick} style={{
    backgroundColor: active ? A.accentBlue : A.bgSecondary, color: A.textPrimary, border: 'none', borderRadius: 20, padding: `${A.sp8}px ${A.sp12}px`, cursor: 'pointer', fontSize: A.fontSmall, fontWeight: active ? A.fontSemiBold : A.fontNormal,
  }}>
    {label}
  </button>
);

const ACard = ({ title, children, footer }) => (
  <ABase style={{ marginBottom: A.sp16 }}>
    {title && <h2 style={{ fontSize: A.fontMedium, fontWeight: A.fontSemiBold, marginBottom: A.sp12, color: A.textPrimary }}>{title}</h2>}
    {children}
    {footer && <div style={{ marginTop: A.sp12, paddingTop: A.sp12, borderTop: `1px solid ${A.bgSecondary}`, fontSize: A.fontSmall, color: A.textSecondary }}>{footer}</div>}
  </ABase>
);

const ALabeledField = ({ label, children, help }) => (
  <div style={{ marginBottom: A.sp16 }}>
    <label style={{ display: 'block', fontSize: A.fontSmall, fontWeight: A.fontSemiBold, marginBottom: A.sp8, color: A.textSecondary }}>{label}</label>
    {children}
    {help && <div style={{ fontSize: A.fontSmall, color: A.textSecondary, marginTop: A.sp4 }}>{help}</div>}
  </div>
);

const AToggleRow = ({ label, value, onChange, help }) => (
  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: A.sp12, backgroundColor: A.bgSecondary, borderRadius: 6, marginBottom: A.sp8 }}>
    <div>
      <div style={{ fontSize: A.fontBase, color: A.textPrimary, fontWeight: A.fontSemiBold }}>{label}</div>
      {help && <div style={{ fontSize: A.fontSmall, color: A.textSecondary }}>{help}</div>}
    </div>
    <button onClick={() => onChange(!value)} style={{ width: 44, height: 24, backgroundColor: value ? A.accentBlue : A.bgDark, borderRadius: 12, border: 'none', cursor: 'pointer', position: 'relative' }}>
      <div style={{ width: 20, height: 20, backgroundColor: A.textPrimary, borderRadius: 10, position: 'absolute', top: 2, left: value ? 22 : 2, transition: 'left 0.2s' }} />
    </button>
  </div>
);

const LineChart = ({ data, height = 100, color = A.accentBlue }) => {
  if (!data || data.length < 2) return null;
  const max = Math.max(...data);
  const points = data.map((v, i) => `${(i / (data.length - 1)) * 200},${100 - (v / max) * 80}`).join(' ');
  return (
    <svg viewBox="0 0 200 100" style={{ height, width: '100%' }}>
      <polyline points={points} fill="none" stroke={color} strokeWidth="2" vectorEffect="non-scaling-stroke"/>
    </svg>
  );
};

const BarChart = ({ data, height = 80, color = A.accentBlue }) => {
  if (!data || data.length === 0) return null;
  const max = Math.max(...data);
  const barWidth = 200 / data.length / 1.5;
  const spacing = 200 / data.length;
  return (
    <svg viewBox="0 0 200 100" style={{ height, width: '100%' }}>
      {data.map((v, i) => (
        <rect key={i} x={i * spacing + spacing / 4} y={100 - (v / max) * 80} width={barWidth} height={(v / max) * 80} fill={color} opacity="0.7"/>
      ))}
    </svg>
  );
};

// ============ SAMPLE DATA ============
const SAMPLE_CPU = [15, 18, 22, 20, 25, 28, 22, 19, 23, 25, 22];
const SAMPLE_MEM = [55, 60, 65, 62, 70, 74, 72, 68, 71, 74, 72];
const SAMPLE_STORAGE = [8, 10, 12, 11, 13, 14, 13, 12, 14, 14, 14];
const SAMPLE_TRAFFIC_RX = [120, 140, 150, 130, 160, 180, 170, 150, 175, 190, 180];
const SAMPLE_TRAFFIC_TX = [80, 95, 110, 100, 120, 140, 130, 110, 130, 150, 140];

// ============ TOP BAR ============
const ATopBar = () => {
  const [mode, setMode] = useState('Simple');
  return (
    <div style={{ height: A.topBarH, backgroundColor: A.bgDarker, borderBottom: `1px solid ${A.bgSecondary}`, display: 'flex', alignItems: 'center', paddingLeft: A.sp20, paddingRight: A.sp20, gap: A.sp16 }}>
      <div style={{ flex: 1 }} />
      <div style={{ display: 'flex', gap: A.sp8 }}>
        <APill label="Simple" active={mode === 'Simple'} onClick={() => setMode('Simple')} />
        <APill label="Advanced" active={mode === 'Advanced'} onClick={() => setMode('Advanced')} />
      </div>
      <ABtn icon="Bell" variant="secondary" onClick={() => {}} />
      <ABtn icon="Settings" variant="secondary" onClick={() => {}} />
    </div>
  );
};

// ============ SIDEBAR ============
const ASidebar = () => {
  const { page, setPage } = useContext(NavCtx);
  const items = [
    { label: 'Dashboard', icon: 'Dashboard', page: 'Dashboard' },
    { label: 'Interfaces', icon: 'Interface', page: 'Interfaces' },
    { label: 'WAN / Load Balance', icon: 'Lan', page: 'WanLB' },
    { label: 'Firewall', icon: 'Firewall', page: 'Firewall' },
    { label: 'Bandwidth', icon: 'Speed', page: 'Bandwidth' },
    { label: 'DHCP & Clients', icon: 'Users', page: 'Clients' },
    { label: 'Hotspot / PPPoE', icon: 'Lock', page: 'Hotspot' },
    { label: 'Wireless', icon: 'Wifi', page: 'Wireless' },
    { label: 'VPN', icon: 'Lock', page: 'Vpn' },
    { label: 'Logs', icon: 'List', page: 'Logs' },
    { label: 'Scripts', icon: 'Play', page: 'Scripts' },
    { label: 'Backup', icon: 'Save', page: 'Backup' },
    { label: 'Settings', icon: 'Settings', page: 'Settings' },
  ];
  return (
    <div style={{ width: A.sidebarW, height: '100vh', backgroundColor: A.bgDark, borderRight: `1px solid ${A.bgSecondary}`, display: 'flex', flexDirection: 'column', padding: A.sp16 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: A.sp8, marginBottom: A.sp32, paddingBottom: A.sp16, borderBottom: `1px solid ${A.bgSecondary}` }}>
        <NetForgeMark />
        <span style={{ fontSize: A.fontMedium, fontWeight: A.fontBold, color: A.accentBlue }}>NetForge</span>
      </div>
      <div style={{ flex: 1, overflowY: 'auto' }}>
        {items.map((item) => (
          <button key={item.page} onClick={() => setPage(item.page)} style={{
            width: '100%', padding: `${A.sp12}px ${A.sp8}px`, marginBottom: A.sp8, backgroundColor: page === item.page ? A.accentBlue : 'transparent', color: page === item.page ? A.bgDark : A.textPrimary, border: 'none', borderRadius: 6, cursor: 'pointer', fontSize: A.fontBase, fontWeight: page === item.page ? A.fontSemiBold : A.fontNormal, display: 'flex', alignItems: 'center', gap: A.sp8,
          }}>
            <Icon name={item.icon} size={18} />
            {item.label}
          </button>
        ))}
      </div>
      <button onClick={() => setPage('Login')} style={{ width: '100%', padding: `${A.sp12}px ${A.sp8}px`, backgroundColor: A.bgSecondary, color: A.textPrimary, border: 'none', borderRadius: 6, cursor: 'pointer', fontSize: A.fontBase, display: 'flex', alignItems: 'center', gap: A.sp8 }}>

// ============ LOGIN SCREEN ============
const ALogin = ({ onConnect }) => {

          <div style={{ display: 'flex', alignItems: 'center', gap: A.sp16, marginBottom: A.sp16 }}>

            <h1 style={{ fontSize: '32px', fontWeight: A.fontBold, color: A.accentBlue }}>NetForge</h1>

        <button onClick={() => setPage('Dashboard')} style={{ width: '100%', padding: A.sp12, backgroundColor: A.accentBlue, color: A.bgDark, border: 'none', borderRadius: 6, fontSize: A.fontBase, fontWeight: A.fontSemiBold, cursor: 'pointer', marginTop: A.sp24 }}>

            <div style={{ fontSize: A.fontSmall, color: A.textSecondary }}>{conn.host}</div>
          </button>
        ))}
      </div>
    </div>
  );
};

// ============ DASHBOARD ============
const AKpi = ({ label, value, unit, trend }) => (

      <div style={{ width: 60, height: 40 }}>

);

          <thead><tr style={{ borderBottom: `1px solid ${A.bgSecondary}` }}>
            <th style={{ textAlign: 'left', padding: A.sp8, color: A.textSecondary, fontSize: A.fontSmall }}>Time</th>
            <th style={{ textAlign: 'left', padding: A.sp8, color: A.textSecondary, fontSize: A.fontSmall }}>Topic</th>

          </tr></thead>
          <tbody>
            {logs.map((log, i) => (
              <tr key={i} style={{ borderBottom: `1px solid ${A.bgSecondary}` }}>
                <td style={{ padding: A.sp8, fontSize: A.fontSmall }}>{log.timestamp}</td>
                <td style={{ padding: A.sp8, fontSize: A.fontSmall }}><span style={{ color: A.accentOrange }}>{log.topic}</span></td>

            ))}

        </table>
      </ACard>
    </div>
  );
};

// ============ MAIN APP ============
const App = () => {
  const [page, setPage] = useState('Login');

  const renderPage = () => {
    switch(page) {
      case 'Dashboard': return <ADashboard />;
      case 'Interfaces': return <AInterfaces />;
      case 'WanLB': return <AWanLB />;
      case 'Firewall': return <AFirewall />;
      case 'Bandwidth': return <ABandwidth />;
      case 'Clients': return <AClients />;
      case 'Hotspot': return <AHotspot />;
      case 'Wireless': return <AWireless />;
      case 'Vpn': return <AVpn />;
      case 'Logs': return <ALogs />;
      case 'Scripts': return <AScripts />;
      case 'Backup': return <ABackup />;
      case 'Settings': return <ASettings />;
      case 'Login': return <ALogin />;
      default: return <ALogin />;
    }
  };

  return (
    <NavCtx.Provider value={{ page, setPage }}>
      {page === 'Login' ? (
        <ALogin />
      ) : (
        <div style={{ display: 'flex', height: '100vh' }}>
          <ASidebar />
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
            <ATopBar />
            {renderPage()}
          </div>
        </div>
      )}
    </NavCtx.Provider>
  );
};

ReactDOM.render(<App />, document.getElementById('app'));
  </script>
