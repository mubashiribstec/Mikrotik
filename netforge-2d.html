<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NetForge — MikroTik Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #070c18; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
    #root { width: 100%; height: 100%; }
    *::-webkit-scrollbar { width: 0; height: 0; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  </style>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">

// ========== CONTEXT ==========
const NavCtx = React.createContext({ page: 'Login', setPage: () => {} });
const DataCtx = React.createContext({ data: {}, refreshData: () => {} });

// ========== COLOR TOKENS ==========
const A = {
  bg: '#0B1220',
  bgLayered: 'radial-gradient(120% 80% at 0% 0%, rgba(56,118,255,0.18), transparent 55%), radial-gradient(80% 60% at 100% 100%, rgba(99,102,241,0.10), transparent 60%), #0B1220',
  surface: 'rgba(255,255,255,0.035)',
  surfaceStrong: 'rgba(255,255,255,0.06)',
  border: 'rgba(255,255,255,0.07)',
  borderStrong: 'rgba(255,255,255,0.12)',
  text: '#E6EAF2',
  textDim: 'rgba(230,234,242,0.62)',
  textFaint: 'rgba(230,234,242,0.42)',
  accent: '#3B82F6',
  accentSoft: 'rgba(59,130,246,0.16)',
  good: '#22C55E',
  warn: '#F59E0B',
  bad: '#EF4444',
  mono: '"JetBrains Mono", ui-monospace, monospace',
  ui: 'Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif',
};

// ========== MOCK API SERVICE ==========
const MockAPI = {
  getClients: () => [
    { vendor: 'Apple', ip: '192.168.1.100', mac: '00:1A:2B:3C:4D:5E', iface: 'ether1', lease: Math.floor(Math.random() * 20) + 'h', tx: Math.floor(Math.random() * 1000) + 500, rx: Math.floor(Math.random() * 600) + 200 },
    { vendor: 'Samsung', ip: '192.168.1.105', mac: '00:2A:3B:4C:5D:6E', iface: 'ether2', lease: Math.floor(Math.random() * 18) + 'h', tx: Math.floor(Math.random() * 800) + 300, rx: Math.floor(Math.random() * 900) + 400 },
    { vendor: 'Linux', ip: '192.168.1.110', mac: '00:3A:4B:5C:6D:7E', iface: 'ether1', lease: Math.floor(Math.random() * 15) + 'h', tx: Math.floor(Math.random() * 400) + 150, rx: Math.floor(Math.random() * 500) + 250 },
    { vendor: 'Windows', ip: '192.168.1.115', mac: '00:4A:5B:6C:7D:8E', iface: 'wifi', lease: Math.floor(Math.random() * 12) + 'h', tx: Math.floor(Math.random() * 300) + 100, rx: Math.floor(Math.random() * 400) + 180 },
  ],

  getHotspotUsers: () => [
    { name: 'user1@example.com', plan: 'Premium 10M', online: Math.random() > 0.3, ip: '10.0.0.2', uptime: Math.floor(Math.random() * 20) + 'h', dataUsed: (Math.random() * 3 + 1).toFixed(1) + ' GB' },
    { name: 'user2@example.com', plan: 'Basic 5M', online: Math.random() > 0.2, ip: '10.0.0.3', uptime: Math.floor(Math.random() * 24) + 'h', dataUsed: (Math.random() * 5 + 2).toFixed(1) + ' GB' },
    { name: 'user3@example.com', plan: 'Premium 10M', online: false, ip: '10.0.0.4', uptime: '0m', dataUsed: (Math.random() * 2 + 0.5).toFixed(1) + ' GB' },
  ],

  getWirelessSSIDs: () => [
    { name: 'NetForge-Main', freq: '2.4 GHz', clients: Math.floor(Math.random() * 15) + 5, signal: Math.floor(Math.random() * 20) + 85 },
    { name: 'NetForge-Guest', freq: '2.4 GHz', clients: Math.floor(Math.random() * 8) + 1, signal: Math.floor(Math.random() * 20) + 75 },
    { name: 'NetForge-5G', freq: '5 GHz', clients: Math.floor(Math.random() * 12) + 3, signal: Math.floor(Math.random() * 15) + 90 },
  ],

  getVPNStatus: () => [
    { name: 'WireGuard', port: 51820, peers: Math.floor(Math.random() * 8) + 2, enabled: true, traffic: Math.floor(Math.random() * 500) + 100 },
    { name: 'L2TP/IPsec', port: 1701, peers: Math.floor(Math.random() * 4) + 1, enabled: true, traffic: Math.floor(Math.random() * 300) + 50 },
    { name: 'OpenVPN', port: 1194, peers: Math.floor(Math.random() * 5) + 1, enabled: Math.random() > 0.5, traffic: Math.floor(Math.random() * 400) + 80 },
  ],
};

// ========== ICON COMPONENT ==========
const Icon = ({ d, size = 16, sw = 1.6, fill = 'none' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
    {typeof d === 'string' ? <path d={d} /> : d}
  </svg>
);

const Icons = {
  users: <Icon d={<><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.4 2.7-6 6-6s6 2.6 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M21 19c0-2.7-1.7-5-4-5"/></>} />,
  wifi: <Icon d={<><path d="M2 9c5.5-5 14.5-5 20 0"/><path d="M5 13c4-3.5 10-3.5 14 0"/><path d="M8.5 17c2-1.7 5-1.7 7 0"/><circle cx="12" cy="20" r="0.8" fill="currentColor"/></>} />,
  vpn: <Icon d={<><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></>} />,
  lock: <Icon d={<><rect x="5" y="11" width="14" height="10" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></>} />,
  power: <Icon d={<><path d="M12 3v9"/><path d="M5.6 7a8 8 0 1 0 12.8 0"/></>} />,
};

// ========== BRAND MARK ==========
const NetForgeMark = ({ size = 22, color = 'currentColor' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
    <path d="M12 2.5 21 7.5v9L12 21.5 3 16.5v-9z" stroke={color} strokeWidth="1.6" strokeLinejoin="round" />
    <circle cx="12" cy="12" r="2.6" fill={color} />
    <path d="M12 9.4V4M12 14.6V20M9.6 10.7 5 8.2M14.4 13.3 19 15.8M9.6 13.3 5 15.8M14.4 10.7 19 8.2" stroke={color} strokeWidth="1.4" strokeLinecap="round" opacity="0.65" />
  </svg>
);

// ========== WIN CHROME ==========
const WinChrome = () => {
  const fg = 'rgba(255,255,255,.78)';
  const hover = 'rgba(255,255,255,.08)';
  return (
    <div style={{ display: 'flex', height: '100%' }}>
      {[
        <path key="m" d="M3 8h10" stroke={fg} strokeWidth="1" />,
        <g key="x"><rect x="3" y="3" width="10" height="10" stroke={fg} strokeWidth="1" fill="none" /></g>,
        <path key="c" d="M3 3l10 10M13 3 3 13" stroke={fg} strokeWidth="1" />,
      ].map((g, i) => (
        <div key={i} style={{ width: 46, display: 'grid', placeItems: 'center' }}
            onMouseEnter={e => e.currentTarget.style.background = i === 2 ? '#e81123' : hover}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <svg width="16" height="16" viewBox="0 0 16 16">{g}</svg>
        </div>
      ))}
    </div>
  );
};

// ========== ATOM COMPONENTS ==========

const ABase = ({ children }) => (
  <div style={{ width: '100%', height: '100%', background: A.bgLayered, color: A.text,
    fontFamily: A.ui, fontSize: 13, lineHeight: 1.45, letterSpacing: '-0.005em',
    display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
    {children}
  </div>
);

const ATitleBar = ({ title }) => (
  <div style={{ height: 32, display: 'flex', alignItems: 'center', flex: '0 0 auto',
    borderBottom: `1px solid ${A.border}`, background: 'rgba(7,11,20,0.5)' }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 12px', color: A.textDim, fontSize: 12 }}>
      <NetForgeMark size={14} color={A.accent} />
      <span style={{ fontWeight: 500, color: A.text }}>NetForge</span>
      <span style={{ color: A.textFaint }}>·</span>
      <span>{title}</span>
    </div>
    <div style={{ flex: 1 }} />
    <WinChrome />
  </div>
);

const APill = ({ children, tone = 'dim' }) => {
  const tones = {
    dim: { bg: 'rgba(255,255,255,0.05)', fg: A.textDim, dot: A.textFaint },
    good: { bg: 'rgba(34,197,94,0.12)', fg: '#86EFAC', dot: A.good },
    bad: { bg: 'rgba(239,68,68,0.12)', fg: '#FCA5A5', dot: A.bad },
  }[tone];
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '3px 9px 3px 8px', borderRadius: 999, background: tones.bg,
      fontFamily: A.ui, fontSize: 11, color: tones.fg, fontWeight: 500 }}>
      <span style={{ width: 6, height: 6, borderRadius: 999, background: tones.dot }} />
      {children}
    </span>
  );
};

const ACard = ({ children, pad = 16, style, animated = true }) => (
  <div style={{ background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12,
    padding: pad, backdropFilter: 'blur(8px)', animation: animated ? 'slideIn 0.4s ease-out' : 'none', ...style }}>
    {children}
  </div>
);

// ========== SCREENS ==========

const ClientsScreen = () => {
  const { data } = React.useContext(DataCtx);
  const clients = data.clients || [];
  const activeLease = Math.floor(Math.random() * 10) + 38;
  const poolUsage = Math.floor(Math.random() * 30) + 5;

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'auto', padding: 16 }}>
      <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: A.text }}>DHCP Stats (Live)</h3>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, marginBottom: 16 }}>
        <ACard animated={true} style={{ padding: 12 }}>
          <div style={{ fontSize: 11, color: A.textFaint, marginBottom: 6 }}>Active Leases</div>
          <div style={{ fontSize: 24, fontWeight: 700, color: A.accent, animation: 'pulse 2s ease-in-out infinite' }}>{activeLease}</div>
        </ACard>
        <ACard animated={true} style={{ padding: 12 }}>
          <div style={{ fontSize: 11, color: A.textFaint, marginBottom: 6 }}>Pool Usage</div>
          <div style={{ fontSize: 24, fontWeight: 700, color: A.accent }}>{poolUsage}%</div>
        </ACard>
        <ACard animated={true} style={{ padding: 12 }}>
          <div style={{ fontSize: 11, color: A.textFaint, marginBottom: 6 }}>Reserved</div>
          <div style={{ fontSize: 24, fontWeight: 700, color: A.warn }}>12</div>
        </ACard>
        <ACard animated={true} style={{ padding: 12 }}>
          <div style={{ fontSize: 11, color: A.textFaint, marginBottom: 6 }}>Unknown</div>
          <div style={{ fontSize: 24, fontWeight: 700, color: A.bad }}>3</div>
        </ACard>
      </div>

      <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: A.text }}>Connected Devices (Live)</h3>
      {clients.map((c, i) => (
        <ACard key={i} animated={true} style={{ marginBottom: 8, padding: 12 }}>
          <div style={{ marginBottom: 8 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 500 }}>{c.vendor}</div>
                <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>{c.ip}</div>
              </div>
              <APill tone="good">{c.iface}</APill>
            </div>
            <div style={{ fontSize: 10, color: A.textFaint, fontFamily: A.mono, marginBottom: 6 }}>{c.mac}</div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: A.textDim }}>
              <span>Lease: {c.lease}</span>
              <span>↓{c.rx}MB / ↑{c.tx}MB</span>
            </div>
          </div>
        </ACard>
      ))}
    </div>
  );
};

const HotspotScreen = () => {
  const { data } = React.useContext(DataCtx);
  const users = data.hotspotUsers || [];

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'auto', padding: 16 }}>
      <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: A.text }}>Hotspot Users (Live)</h3>
      {users.map((u, i) => (
        <ACard key={i} animated={true} style={{ marginBottom: 12, padding: 12 }}>
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 500 }}>{u.name}</div>
                <div style={{ fontSize: 11, color: A.textFaint }}>{u.plan}</div>
              </div>
              <APill tone={u.online ? 'good' : 'bad'}>{u.online ? 'Online' : 'Offline'}</APill>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: A.textDim, paddingTop: 8, borderTop: `1px solid ${A.border}` }}>
              <span>{u.ip} • {u.uptime}</span>
              <span style={{ color: A.accent, fontWeight: 600 }}>{u.dataUsed}</span>
            </div>
          </div>
        </ACard>
      ))}
    </div>
  );
};

const WirelessScreen = () => {
  const { data } = React.useContext(DataCtx);
  const ssids = data.wireless || [];

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'auto', padding: 16 }}>
      <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: A.text }}>SSIDs (Live)</h3>
      {ssids.map((s, i) => (
        <ACard key={i} animated={true} style={{ marginBottom: 12, padding: 12 }}>
          <div style={{ marginBottom: 8 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 500 }}>{s.name}</div>
                <div style={{ fontSize: 11, color: A.textFaint }}>{s.freq}</div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: A.accent }}>{s.signal}%</div>
                <div style={{ fontSize: 11, color: A.textDim }}>{s.clients} clients</div>
              </div>
            </div>
            <div style={{ height: 6, backgroundColor: A.border, borderRadius: 3, overflow: 'hidden' }}>
              <div style={{ width: `${s.signal}%`, height: '100%', backgroundColor: A.accent, transition: 'width 0.3s ease-out' }} />
            </div>
          </div>
        </ACard>
      ))}
    </div>
  );
};

const VPNScreen = () => {
  const { data } = React.useContext(DataCtx);
  const vpns = data.vpn || [];

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'auto', padding: 16 }}>
      <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: A.text }}>VPN Protocols (Live)</h3>
      {vpns.map((v, i) => (
        <ACard key={i} animated={true} style={{ marginBottom: 12, padding: 12 }}>
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 500 }}>{v.name}</div>
                <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>Port {v.port}</div>
              </div>
              <APill tone={v.enabled ? 'good' : 'dim'}>{v.enabled ? 'Enabled' : 'Disabled'}</APill>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: A.textDim, paddingTop: 8, borderTop: `1px solid ${A.border}` }}>
              <span>{v.peers} peers active</span>
              <span style={{ color: A.accent, fontWeight: 600, animation: 'pulse 2s ease-in-out infinite' }}>{v.traffic} Mbps</span>
            </div>
          </div>
        </ACard>
      ))}
    </div>
  );
};

const LoginScreen = () => {
  const { setPage } = React.useContext(NavCtx);

  return (
    <ABase>
      <ATitleBar title="Login" />
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 32 }}>
        <div style={{ width: 400 }}>
          <div style={{ marginBottom: 32, textAlign: 'center' }}>
            <NetForgeMark size={48} color={A.accent} />
            <h1 style={{ fontSize: 24, fontWeight: 700, marginTop: 12, color: A.text }}>NetForge</h1>
          </div>

          <button onClick={() => setPage('Dashboard')} style={{
            width: '100%', padding: '8px 16px', backgroundColor: A.accent, color: '#fff',
            border: 'none', borderRadius: 8, fontSize: 13, fontWeight: 500, cursor: 'pointer'
          }}>
            Connect
          </button>
        </div>
      </div>
    </ABase>
  );
};

const PlaceholderScreen = ({ name }) => (
  <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
    <ACard animated={true} style={{ textAlign: 'center', padding: 32 }}>
      <div style={{ fontSize: 13, color: A.textFaint }}>{name}</div>
      <div style={{ fontSize: 12, color: A.textFaint, marginTop: 8 }}>Coming soon</div>
    </ACard>
  </div>
);

// ========== MAIN APP ==========
const App = () => {
  const [page, setPage] = React.useState('Login');
  const [data, setData] = React.useState({});

  const refreshData = () => {
    setData({
      clients: MockAPI.getClients(),
      hotspotUsers: MockAPI.getHotspotUsers(),
      wireless: MockAPI.getWirelessSSIDs(),
      vpn: MockAPI.getVPNStatus(),
    });
  };

  React.useEffect(() => {
    if (page !== 'Login') {
      refreshData();
      const interval = setInterval(refreshData, 2000);
      return () => clearInterval(interval);
    }
  }, [page]);

  const renderScreen = () => {
    switch(page) {
      case 'Clients': return <ClientsScreen />;
      case 'Hotspot': return <HotspotScreen />;
      case 'Wireless': return <WirelessScreen />;
      case 'VPN': return <VPNScreen />;
      default: return <LoginScreen />;
    }
  };

  if (page === 'Login') {
    return (
      <NavCtx.Provider value={{ page, setPage }}>
        <DataCtx.Provider value={{ data, refreshData }}>
          <LoginScreen />
        </DataCtx.Provider>
      </NavCtx.Provider>
    );
  }

  const navItems = [
    { name: 'Clients', icon: Icons.users },
    { name: 'Hotspot', icon: Icons.lock },
    { name: 'Wireless', icon: Icons.wifi },
    { name: 'VPN', icon: Icons.vpn },
  ];

  return (
    <NavCtx.Provider value={{ page, setPage }}>
      <DataCtx.Provider value={{ data, refreshData }}>
        <ABase>
          <ATitleBar title={page} />
          <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
            <div style={{ width: 180, borderRight: `1px solid ${A.border}`, overflow: 'auto', display: 'flex', flexDirection: 'column' }}>
              {navItems.map((item) => (
                <button key={item.name} onClick={() => setPage(item.name)} style={{
                  flex: '0 0 auto', padding: '10px 12px', border: 'none', background: page === item.name ? A.accentSoft : 'transparent',
                  color: page === item.name ? A.accent : A.textDim, cursor: 'pointer',
                  fontFamily: A.ui, fontSize: 12, fontWeight: page === item.name ? 500 : 400,
                  display: 'flex', alignItems: 'center', gap: 8, borderLeft: page === item.name ? `2px solid ${A.accent}` : '2px solid transparent',
                  transition: 'all 0.2s ease-out',
                }}>
                  <div>{item.icon}</div>
                  <span>{item.name}</span>
                </button>
              ))}
              <div style={{ flex: 1 }} />
              <button onClick={() => setPage('Login')} style={{
                flex: '0 0 auto', padding: '10px 12px', border: 'none', background: 'transparent',
                color: A.textDim, cursor: 'pointer', fontFamily: A.ui, fontSize: 12,
                display: 'flex', alignItems: 'center', gap: 8, borderTop: `1px solid ${A.border}`,
              }}>
                {Icons.power}
                <span>Logout</span>
              </button>
            </div>
            {renderScreen()}
          </div>
        </ABase>
      </DataCtx.Provider>
    </NavCtx.Provider>
  );
};

// ========== RENDER ==========
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
</body>
</html>
