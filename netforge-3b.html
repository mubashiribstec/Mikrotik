const API_BASE = process.env.NODE_ENV === 'production' ? '' : 'http://localhost:3001';

// ========== CONTEXT ==========
const NavCtx = React.createContext({ page: 'Login', setPage: () => {}, mode: 'Simple', setMode: () => {} });
const DataCtx = React.createContext({ data: {}, refreshData: () => {}, loading: false, error: null, sessionId: null });
const AuthCtx = React.createContext({ sessionId: null, setSessionId: () => {}, router: null, logout: () => {} });

// ========== COLOR TOKENS ==========

  bg: '#0B1220',
  bgLayered: 'radial-gradient(120% 80% at 0% 0%, rgba(56,118,255,0.18), transparent 55%), radial-gradient(80% 60% at 100% 100%, rgba(99,102,241,0.10), transparent 60%), #0B1220',

// ========== API CLIENT ==========
const ApiClient = {
  async login(host, port, username, password) {
    try {
      const res = await fetch(`${API_BASE}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host, port: parseInt(port), username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      return data;
    } catch (err) {
      throw new Error(err.message);
    }
  },

  async logout(sessionId) {
    try {
      await fetch(`${API_BASE}/api/logout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId }),
      });
    } catch (err) {
      console.error('Logout error:', err);
    }
  },

  async fetch(endpoint, sessionId) {
    try {
      const res = await fetch(`${API_BASE}${endpoint}`, {
        headers: { 'x-session-id': sessionId },
      });
      if (res.status === 401) throw new Error('Session expired - please login again');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch (err) {
      console.error(`API Error (${endpoint}):`, err.message);
      return null;
    }
  },

  async getSystemStats(sessionId) {
    return await this.fetch('/api/system-stats', sessionId) || { cpu: 0, memory: 0, storage: 0, uptime: 'N/A' };
  },

  async getTrafficData(sessionId) {
    return await this.fetch('/api/traffic', sessionId) || { rx: [], tx: [] };
  },

  async getWANStatus(sessionId) {
    return await this.fetch('/api/wan-status', sessionId) || [];
  },

  async getInterfaces(sessionId) {
    return await this.fetch('/api/interfaces', sessionId) || [];
  },

  async getTopTalkers(sessionId) {
    return await this.fetch('/api/top-talkers', sessionId) || [];
  },

  async getFirewallRules(sessionId) {
    return await this.fetch('/api/firewall', sessionId) || { blocked: [], activeConnections: 0, droppedPackets: 0 };
  },

  async getBandwidthQueues(sessionId) {
    return await this.fetch('/api/bandwidth', sessionId) || [];
  },

  async getClients(sessionId) {
    return await this.fetch('/api/dhcp-clients', sessionId) || [];
  },

  async getHotspotUsers() {
    return [
      { name: 'user1@example.com', plan: 'Premium 10M', online: Math.random() > 0.3, ip: '10.0.0.2', uptime: Math.floor(Math.random() * 20) + 'h', dataUsed: (Math.random() * 3 + 1).toFixed(1) + ' GB' },
      { name: 'user2@example.com', plan: 'Basic 5M', online: Math.random() > 0.2, ip: '10.0.0.3', uptime: Math.floor(Math.random() * 24) + 'h', dataUsed: (Math.random() * 5 + 2).toFixed(1) + ' GB' },
    ];
  },

  async getWirelessSSIDs(sessionId) {
    return await this.fetch('/api/wireless', sessionId) || [];
  },

  async getVPNStatus(sessionId) {
    return await this.fetch('/api/vpn', sessionId) || [];
  },

  async getLogs(sessionId) {
    return await this.fetch('/api/logs', sessionId) || [];
  },

  async getScripts(sessionId) {
    return await this.fetch('/api/scripts', sessionId) || [];
  },

  async getBackups(sessionId) {
    return await this.fetch('/api/backups', sessionId) || [];
  },
};

  refresh: <Icon d={<><path d="M21 12a9 9 0 0 1-15.5 6.4L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.4L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/></>} />,
  power: <Icon d={<><path d="M12 3v9"/><path d="M5.6 7a8 8 0 1 0 12.8 0"/></>} />,

// ========== BRAND MARK ==========
const NetForgeMark = ({ size = 22, color = 'currentColor' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
    <path d="M12 2.5 21 7.5v9L12 21.5 3 16.5v-9z" stroke={color} strokeWidth="1.6" strokeLinejoin="round" />
    <circle cx="12" cy="12" r="2.6" fill={color} />
    <path d="M12 9.4V4M12 14.6V20M9.6 10.7 5 8.2M14.4 13.3 19 15.8M9.6 13.3 5 15.8M14.4 10.7 19 8.2" stroke={color} strokeWidth="1.4" strokeLinecap="round" opacity="0.65" />
  </svg>
);

// ========== WIN CHROME ==========
const WinChrome = ({ accent = '#3b82f6', tone = 'dark' }) => {
  const fg = tone === 'dark' ? 'rgba(255,255,255,.78)' : 'rgba(0,0,0,.78)';
  const hover = tone === 'dark' ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';
  return (
    <div style={{ display: 'flex', height: '100%', WebkitAppRegion: 'no-drag' }}>
      {[
        <path key="m" d="M3 8h10" stroke={fg} strokeWidth="1" />,
        <g key="x"><rect x="3" y="3" width="10" height="10" stroke={fg} strokeWidth="1" fill="none" /></g>,
        <path key="c" d="M3 3l10 10M13 3 3 13" stroke={fg} strokeWidth="1" />,
      ].map((g, i) => (
        <div key={i} style={{ width: 46, display: 'grid', placeItems: 'center', cursor: 'default', background: i === 2 ? undefined : 'transparent' }}
            onMouseEnter={e => e.currentTarget.style.background = i === 2 ? '#e81123' : hover}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
          <svg width="16" height="16" viewBox="0 0 16 16">{g}</svg>
        </div>
      ))}
    </div>
  );
};

// ========== CHARTS ==========
const LineChart = ({ values, w = 280, h = 60, stroke = '#3b82f6', fill = 'rgba(59,130,246,0.15)' }) => {
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = max - min || 1;
  const stepX = w / (values.length - 1);
  const pts = values.map((v, i) => `${(i * stepX).toFixed(1)},${(h - ((v - min) / range) * (h - 4) - 2).toFixed(1)}`);
  const linePath = 'M' + pts.join(' L');
  const fillPath = `${linePath} L${w},${h} L0,${h} Z`;
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: 'block' }}>
      <path d={fillPath} fill={fill} />
      <path d={linePath} fill="none" stroke={stroke} strokeWidth="1.6" strokeLinecap="round" style={{ animation: 'fadeIn 0.6s ease-out' }} />
    </svg>
  );
};

// ========== ATOM COMPONENTS ==========

const ABase = ({ children }) => (
  <div style={{ width: '100%', height: '100%', background: A.bgLayered, color: A.text,
    fontFamily: A.ui, fontSize: 13, lineHeight: 1.45, letterSpacing: '-0.005em',
    display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
    {children}
  </div>
);

const ATitleBar = ({ title, sessionId, router, onLogout }) => (
  <div style={{ height: 32, display: 'flex', alignItems: 'center', flex: '0 0 auto',
    borderBottom: `1px solid ${A.border}`, background: 'rgba(7,11,20,0.5)' }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 12px', color: A.textDim, fontSize: 12 }}>
      <NetForgeMark size={14} color={A.accent} />
      <span style={{ fontWeight: 500, color: A.text }}>NetForge</span>
      <span style={{ color: A.textFaint }}>·</span>
      <span>{title}</span>
      {router && <span style={{ color: A.textFaint, marginLeft: 8 }}>@ {router}</span>}
    </div>
    <div style={{ flex: 1 }} />
    <WinChrome accent={A.accent} />
  </div>
);

const APill = ({ children, tone = 'dim' }) => {
  const tones = {
    dim: { bg: 'rgba(255,255,255,0.05)', fg: A.textDim, dot: A.textFaint },
    good: { bg: 'rgba(34,197,94,0.12)', fg: '#86EFAC', dot: A.good },
    warn: { bg: 'rgba(245,158,11,0.12)', fg: '#FCD34D', dot: A.warn },
    bad: { bg: 'rgba(239,68,68,0.12)', fg: '#FCA5A5', dot: A.bad },
    accent: { bg: A.accentSoft, fg: '#BFDBFE', dot: A.accent },
  }[tone];
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '3px 9px 3px 8px', borderRadius: 999, background: tones.bg,
      fontFamily: A.ui, fontSize: 11, color: tones.fg, fontWeight: 500 }}>
      <span style={{ width: 6, height: 6, borderRadius: 999, background: tones.dot }} />
      {children}
    </span>
  );
};

const ABtn = ({ children, kind = 'ghost', onClick, full = false, disabled = false }) => {
  const styles = {
    primary: { bg: A.accent, fg: '#fff', border: 'transparent', shadow: '0 1px 0 rgba(255,255,255,0.15) inset, 0 4px 14px rgba(59,130,246,0.35)' },
    secondary: { bg: A.surfaceStrong, fg: A.text, border: A.borderStrong, shadow: 'none' },
    ghost: { bg: 'transparent', fg: A.textDim, border: 'transparent', shadow: 'none' },
  }[kind];
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display: 'inline-flex', alignItems: 'center', gap: 8, padding: '7px 12px',
      borderRadius: 8, border: `1px solid ${styles.border}`, background: styles.bg, color: styles.fg,
      fontFamily: A.ui, fontSize: 13, fontWeight: 500, cursor: disabled ? 'not-allowed' : 'pointer',
      boxShadow: styles.shadow, width: full ? '100%' : undefined, justifyContent: 'center',
      opacity: disabled ? 0.5 : 1,
    }}>
      {children}
    </button>
  );
};

const ACard = ({ children, pad = 16, style, animated = true }) => (
  <div style={{ background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12,
    padding: pad, backdropFilter: 'blur(8px)', animation: animated ? 'slideIn 0.4s ease-out' : 'none', ...style }}>
    {children}
  </div>
);

const AInput = ({ label, value, onChange, type = 'text', placeholder }) => (
  <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
    <span style={{ fontSize: 12, fontWeight: 500 }}>{label}</span>
    <input
      type={type}
      value={value}
      onChange={e => onChange(e.target.value)}
      placeholder={placeholder}
      style={{
        padding: '9px 11px', background: A.surface, border: `1px solid ${A.borderStrong}`,
        borderRadius: 9, color: A.text, fontFamily: A.ui, fontSize: 13,
      }}
    />
  </label>
);

const KPICard = ({ label, value, unit, trend }) => (
  <ACard animated={true} style={{ position: 'relative', overflow: 'hidden' }}>
    <div style={{ fontSize: 11, color: A.textFaint, marginBottom: 6 }}>{label}</div>
    <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between' }}>
      <div>
        <div style={{ fontSize: 28, fontWeight: 700, color: A.accent, animation: 'fadeIn 0.4s ease-out' }}>
          {value}{unit}
        </div>
      </div>
      <div style={{ width: 80, height: 40, opacity: 0.6 }}>
        <LineChart values={trend} w={80} h={40} stroke={A.good} fill="rgba(34,197,94,0.1)" />
      </div>
    </div>
  </ACard>
);

// ========== ALERT MESSAGE ==========
const AlertBox = ({ type = 'error', children }) => {
  const colors = {
    error: { bg: 'rgba(239,68,68,0.12)', border: 'rgba(239,68,68,0.3)', fg: '#FCA5A5', icon: Icons.alert },
    success: { bg: 'rgba(34,197,94,0.12)', border: 'rgba(34,197,94,0.3)', fg: '#86EFAC', icon: Icons.check },
  };
  const c = colors[type] || colors.error;
  return (
    <div style={{
      background: c.bg, border: `1px solid ${c.border}`, borderRadius: 8, padding: 12,
      display: 'flex', gap: 8, alignItems: 'flex-start', color: c.fg, fontSize: 12,
      marginBottom: 12,
    }}>
      <div style={{ flex: '0 0 auto', marginTop: 2 }}>{c.icon}</div>
      <div>{children}</div>
    </div>
  );
};

// ========== SCREENS (same as before) ==========

const DashboardScreen = () => {
  const { data } = React.useContext(DataCtx);
  const stats = data.systemStats || { cpu: 0, memory: 0 };
  const traffic = data.traffic || { rx: [], tx: [] };
  const wans = data.wanStatus || [];
  const talkers = data.topTalkers || [];

  const cpuTrend = React.useMemo(() => [
    stats.cpu - 5, stats.cpu - 2, stats.cpu, stats.cpu + 2, stats.cpu - 1, stats.cpu, stats.cpu + 3
  ], [stats.cpu]);

  const memTrend = React.useMemo(() => [
    stats.memory - 2, stats.memory - 1, stats.memory, stats.memory + 1, stats.memory, stats.memory - 1, stats.memory
  ], [stats.memory]);

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'auto', padding: 16 }}>
      <div style={{ marginBottom: 16 }}>
        <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: A.text }}>System (Live)</h3>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          <KPICard label="CPU" value={stats.cpu} unit="%" trend={cpuTrend} />
          <KPICard label="Memory" value={stats.memory} unit="%" trend={memTrend} />
        </div>
      </div>

      <div style={{ marginBottom: 16 }}>
        <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: A.text }}>Traffic (Live)</h3>
        <ACard animated={true} style={{ padding: 12 }}>
          <LineChart values={traffic.rx} w={450} h={60} stroke={A.accent} fill="rgba(59,130,246,0.1)" />
        </ACard>

      <div style={{ marginBottom: 16 }}>
        <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: A.text }}>WAN Status (Live)</h3>
        {wans.map((w, i) => (
          <ACard key={i} animated={true} style={{ marginBottom: 8, padding: 12 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

                <div style={{ fontSize: 13, fontWeight: 500 }}>{w.name}</div>
                <APill tone={w.status === 'up' ? 'good' : 'bad'}>{w.status}</APill>
              </div>
              <div style={{ textAlign: 'right', fontSize: 12 }}>
                <div style={{ color: A.textFaint }}>{w.ip}</div>
                <div style={{ color: A.accent, fontWeight: 600, animation: 'pulse 2s ease-in-out infinite' }}>{w.util}%</div>
              </div>
            </div>
          </ACard>
        ))}
      </div>

      <div>
        <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: A.text }}>Top Talkers (Live)</h3>
        {talkers.map((t, i) => (
          <ACard key={i} animated={true} style={{ marginBottom: 8, padding: 12 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12 }}>
              <div style={{ fontFamily: A.mono, color: A.textDim }}>{t.ip}</div>
              <div style={{ display: 'flex', gap: 16 }}>
                <div>↓ {t.rx}MB</div>
                <div>↑ {t.tx}MB</div>
              </div>
            </div>
          </ACard>
        ))}
      </div>
    </div>
  );
};

// ========== LOGIN SCREEN ==========
const LoginScreen = () => {
  const { setSessionId } = React.useContext(AuthCtx);
  const [host, setHost] = React.useState('192.168.1.1');
  const [port, setPort] = React.useState('22');
  const [username, setUsername] = React.useState('admin');
  const [password, setPassword] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState(null);

  const handleLogin = async () => {
    if (!password) {
      setError('Password is required');
      return;
    }

    setLoading(true);
    setError(null);

    try {
      const result = await ApiClient.login(host, port, username, password);
      setSessionId(result.sessionId, { host, port: parseInt(port), username });
      // Navigation will happen via context update
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <ABase>
      <ATitleBar title="Login" />
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 32 }}>
        <div style={{ width: 400 }}>
          <div style={{ marginBottom: 32, textAlign: 'center' }}>
            <NetForgeMark size={48} color={A.accent} />
            <h1 style={{ fontSize: 24, fontWeight: 700, marginTop: 12, color: A.text }}>NetForge</h1>
            <p style={{ fontSize: 13, color: A.textDim, marginTop: 6 }}>MikroTik Router Manager</p>
          </div>

          {error && <AlertBox type="error">{error}</AlertBox>}

          <div style={{ marginBottom: 12 }}>
            <AInput label="Router IP" value={host} onChange={setHost} placeholder="192.168.1.1" />
          </div>

          <div style={{ marginBottom: 12 }}>
            <AInput label="SSH Port" value={port} onChange={setPort} type="number" placeholder="22" />
          </div>

          <div style={{ marginBottom: 12 }}>
            <AInput label="Username" value={username} onChange={setUsername} placeholder="admin" />
          </div>

          <div style={{ marginBottom: 20 }}>
            <AInput label="Password" value={password} onChange={setPassword} type="password" placeholder="••••••••" />
          </div>

          <ABtn kind="primary" full onClick={handleLogin} disabled={loading}>
            {loading ? (
              <>
                <div style={{ display: 'inline-block' }}>{Icons.loader}</div>
                Connecting...
              </>
            ) : (
              'Connect'
            )}
          </ABtn>

          <div style={{ marginTop: 16, fontSize: 11, color: A.textFaint, textAlign: 'center' }}>
            Uses SSH to connect to your MikroTik router
          </div>
        </div>
      </div>
    </ABase>
  );
};

// ========== MAIN APP ==========
const App = () => {
  const [page, setPage] = React.useState('Login');
  const [data, setData] = React.useState({});
  const [loading, setLoading] = React.useState(false);
  const [sessionId, setSessionIdState] = React.useState(null);
  const [router, setRouter] = React.useState(null);

  const setSessionId = (id, routerInfo) => {
    setSessionIdState(id);
    setRouter(routerInfo);
    setPage('Dashboard');
  };

  const logout = async () => {
    if (sessionId) {
      await ApiClient.logout(sessionId);
    }
    setSessionIdState(null);
    setRouter(null);
    setData({});
    setPage('Login');
  };

  const refreshData = React.useCallback(async () => {
    if (!sessionId) return;
    setLoading(true);

    const newData = {
      systemStats: await ApiClient.getSystemStats(sessionId),
      traffic: await ApiClient.getTrafficData(sessionId),
      wanStatus: await ApiClient.getWANStatus(sessionId),
      interfaces: await ApiClient.getInterfaces(sessionId),
      firewall: await ApiClient.getFirewallRules(sessionId),
      bandwidth: await ApiClient.getBandwidthQueues(sessionId),
      clients: await ApiClient.getClients(sessionId),
      hotspotUsers: await ApiClient.getHotspotUsers(),
      wireless: await ApiClient.getWirelessSSIDs(sessionId),
      vpn: await ApiClient.getVPNStatus(sessionId),
      topTalkers: await ApiClient.getTopTalkers(sessionId),
      logs: await ApiClient.getLogs(sessionId),
      scripts: await ApiClient.getScripts(sessionId),
      backups: await ApiClient.getBackups(sessionId),
    };
    setData(newData);
    setLoading(false);
  }, [sessionId]);

  React.useEffect(() => {
    if (page !== 'Login' && sessionId) {
      refreshData();
      const interval = setInterval(refreshData, 2000);
      return () => clearInterval(interval);
    }
  }, [page, sessionId, refreshData]);

  const renderScreen = () => {
    switch(page) {
      case 'Dashboard': return <DashboardScreen />;
      case 'Interfaces': return <InterfacesScreen />;
      case 'WAN': return <WANScreen />;
      case 'Firewall': return <FirewallScreen />;
      case 'Bandwidth': return <BandwidthScreen />;
      case 'Clients': return <ClientsScreen />;
      case 'Hotspot': return <HotspotScreen />;
      case 'Wireless': return <WirelessScreen />;
      case 'VPN': return <VPNScreen />;
      case 'Logs': return <LogsScreen />;
      case 'Scripts': return <ScriptsScreen />;
      case 'Backup': return <BackupScreen />;
      case 'Settings': return <SettingsScreen />;
      default: return <LoginScreen />;
    }
  };

  if (!sessionId) {
    return (
      <AuthCtx.Provider value={{ sessionId, setSessionId, router, logout }}>
        <NavCtx.Provider value={{ page, setPage }}>
          <DataCtx.Provider value={{ data, refreshData, loading }}>
            <LoginScreen />
          </DataCtx.Provider>
        </NavCtx.Provider>
      </AuthCtx.Provider>
    );
  }

  const navItems = [
    { name: 'Dashboard', icon: Icons.dashboard },
    { name: 'Interfaces', icon: Icons.iface },
    { name: 'WAN', icon: Icons.wan },
    { name: 'Firewall', icon: Icons.shield },
    { name: 'Bandwidth', icon: Icons.gauge },
    { name: 'Clients', icon: Icons.users },
    { name: 'Hotspot', icon: Icons.wifi },
    { name: 'Wireless', icon: Icons.wifi },
    { name: 'VPN', icon: Icons.vpn },
    { name: 'Logs', icon: Icons.list },
    { name: 'Scripts', icon: Icons.terminal },
    { name: 'Backup', icon: Icons.save },
    { name: 'Settings', icon: Icons.cog },
  ];

  const routerDisplay = router ? `${router.host}:${router.port}` : '';

  return (
    <AuthCtx.Provider value={{ sessionId, setSessionId, router, logout }}>
      <NavCtx.Provider value={{ page, setPage }}>
        <DataCtx.Provider value={{ data, refreshData, loading, sessionId }}>
          <ABase>
            <ATitleBar title={page} sessionId={sessionId} router={routerDisplay} onLogout={logout} />
            <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
              <div style={{ width: 180, borderRight: `1px solid ${A.border}`, overflow: 'auto', display: 'flex', flexDirection: 'column' }}>
                {navItems.map((item) => (
                  <button key={item.name} onClick={() => setPage(item.name)} style={{
                    flex: '0 0 auto', padding: '10px 12px', border: 'none', background: page === item.name ? A.accentSoft : 'transparent',
                    color: page === item.name ? A.accent : A.textDim, cursor: 'pointer',
                    fontFamily: A.ui, fontSize: 12, fontWeight: page === item.name ? 500 : 400,
                    display: 'flex', alignItems: 'center', gap: 8, borderLeft: page === item.name ? `2px solid ${A.accent}` : '2px solid transparent',
                    transition: 'all 0.2s ease-out',
                  }}>
                    <div style={{ color: 'currentColor' }}>{item.icon}</div>
                    <span>{item.name}</span>
                  </button>
                ))}
                <div style={{ flex: 1 }} />
                <button onClick={logout} style={{
                  flex: '0 0 auto', padding: '10px 12px', border: 'none', background: 'transparent',
                  color: A.textDim, cursor: 'pointer', fontFamily: A.ui, fontSize: 12,
                  display: 'flex', alignItems: 'center', gap: 8, borderTop: `1px solid ${A.border}`,
                }}>
                  {Icons.power}
                  <span>Logout</span>
                </button>
              </div>
              {renderScreen()}
            </div>
          </ABase>
        </DataCtx.Provider>
      </NavCtx.Provider>
    </AuthCtx.Provider>
  );
};

// ========== RENDER ==========
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
</body>
</html>
