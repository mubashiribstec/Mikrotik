// ========== WEBSOCKET MANAGER ==========

class WebSocketManagerClass {
  constructor(sessionId) {
    this.sessionId = sessionId;
    this.ws = null;
    this.subscriptions = new Map();
    this.isConnected = false;
    this.reconnectAttempts = 0;
    this.maxReconnectAttempts = 5;
    this.reconnectDelay = 1000;
    this.connect();
  }

  connect() {
    try {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${protocol}//${window.location.host}/ws?sessionId=${this.sessionId}`;

      this.ws = new WebSocket(url);
      this.ws.onopen = () => {
        this.isConnected = true;
        this.reconnectAttempts = 0;
        for (const endpoint of this.subscriptions.keys()) {
          this.sendSubscribe(endpoint);
        }
      };

      this.ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          const callbacks = this.subscriptions.get(msg.type);
          if (callbacks) {
            callbacks.forEach(cb => cb(msg.data));
          }
        } catch (err) {
          console.error('WS parse:', err);
        }
      };

      this.ws.onerror = () => {
        this.isConnected = false;
      };

      this.ws.onclose = () => {
        this.isConnected = false;
        this.attemptReconnect();
      };
    } catch (err) {
      this.isConnected = false;
      this.attemptReconnect();
    }
  }

  attemptReconnect() {
    if (this.reconnectAttempts >= this.maxReconnectAttempts) return;
    this.reconnectAttempts++;
    const delay = this.reconnectDelay * Math.pow(2, this.reconnectAttempts - 1);
    setTimeout(() => this.connect(), delay);
  }

  sendSubscribe(endpoint) {
    if (this.isConnected && this.ws.readyState === WebSocket.OPEN) {
      this.ws.send(JSON.stringify({ action: 'subscribe', endpoint }));
    }
  }

  subscribe(endpoint, callback) {
    if (!this.subscriptions.has(endpoint)) {
      this.subscriptions.set(endpoint, new Set());
      this.sendSubscribe(endpoint);
    }
    this.subscriptions.get(endpoint).add(callback);
  }

  unsubscribe(endpoint, callback) {
    const callbacks = this.subscriptions.get(endpoint);
    if (callbacks) {
      callbacks.delete(callback);
      if (callbacks.size === 0) {
        this.subscriptions.delete(endpoint);
      }
    }
  }

  close() {
    if (this.ws) {
      this.ws.close();
    }
  }
}

// ========== API HELPER ==========
const API = {
  baseUrl: window.location.origin,
  wsManager: null,

  initWebSocket(sessionId) {
    if (!this.wsManager) {
      this.wsManager = new WebSocketManagerClass(sessionId);
    }
  },

  subscribe(endpoint, callback) {
    if (this.wsManager && this.wsManager.isConnected) {
      this.wsManager.subscribe(endpoint, callback);
    }
  },

  unsubscribe(endpoint, callback) {
    if (this.wsManager) {
      this.wsManager.unsubscribe(endpoint, callback);
    }
  },

  async call(sessionId, endpoint, options = {}) {
    if (!sessionId && endpoint !== '/api/login') {
      throw new Error('No session. Please login first.');
    }

    const url = `${this.baseUrl}${endpoint}`;
    const headers = {
      'Content-Type': 'application/json',
      ...options.headers,
    };

    if (sessionId) {
      headers['x-session-id'] = sessionId;
    }

    const response = await fetch(url, { ...options, headers });

    if (response.status === 401) {
      // Broadcast session expiry so App can redirect to login
      window.dispatchEvent(new CustomEvent('netforge:session-expired'));
      throw new Error('Session expired. Please login again.');
    }

    if (!response.ok) {
      const err = await response.json().catch(() => ({ error: response.statusText }));
      throw new Error(err.error || response.statusText);
    }

    return await response.json();
  },

  async login(host, port, username, password) {
    return this.call(null, '/api/login', {
      method: 'POST',
      body: JSON.stringify({ host, port: parseInt(port) || 22, username, password }),
    });
  },

  async logout(sessionId) {
    return this.call(sessionId, '/api/logout', {
      method: 'POST',
      body: JSON.stringify({ sessionId }),

  async getSystemStats(sessionId) {

  async getInterfaces(sessionId) {

  async getFirewall(sessionId) {

  async getBandwidth(sessionId) {

  async getDhcpClients(sessionId) {

  async getScriptOutput(sessionId, executionId) {

  },

  // IP Addresses
  async getIpAddresses(sessionId) {
    return this.call(sessionId, '/api/ip-addresses');
  },

  async addIpAddress(sessionId, address, iface, comment) {
    return this.call(sessionId, '/api/ip-addresses/add', {
      method: 'POST',
      body: JSON.stringify({ address, interface: iface, comment }),

  async removeIpAddress(sessionId, id) {

    });
  },

  // Routes
  async getRoutes(sessionId) {

// ========== CHART HELPERS ==========

const pathFromValues = (vals, w, h, fill) => {
  if (!vals || vals.length < 2) return fill ? `M0,${h} L${w},${h} Z` : '';
  const max = Math.max(...vals, 1);
  const stepX = w / (vals.length - 1);
  const pts = vals.map((v, i) => `${(i * stepX).toFixed(1)},${(h - (v / max) * (h - 6) - 3).toFixed(1)}`);
  const line = 'M' + pts.join(' L');
  return fill ? `${line} L${w},${h} L0,${h} Z` : line;
};

const LineChart = ({ values = [], w = 200, h = 32, stroke = A.accent, fill }) => {
  const f = fill || `${stroke}22`;
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: 'block' }}>
      <path d={pathFromValues(values, w, h, true)} fill={f} />
      <path d={pathFromValues(values, w, h, false)} fill="none" stroke={stroke} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
};

const ALERT_THRESHOLDS = {
  cpu: { warn: 80, critical: 95 },

const AlertUtils = {
  MAX_HISTORY: 50,
  MAX_STORAGE_SIZE: 100000, // ~100KB limit

  loadHistory: () => {
    try {
      const stored = localStorage.getItem('netforge_alert_history');
      return stored ? JSON.parse(stored) : [];
    } catch (err) {
      console.error('Failed to load alert history:', err);
      return [];
    }
  },

  saveHistory: (history) => {
    try {
      const limited = history.slice(0, AlertUtils.MAX_HISTORY);
      const serialized = JSON.stringify(limited);

      // Check size before saving
      if (serialized.length > AlertUtils.MAX_STORAGE_SIZE) {
        console.warn('Alert history too large, trimming');
        limited.splice(0, Math.floor(limited.length / 2));
        AlertUtils.saveHistory(limited);
        return;
      }

      localStorage.setItem('netforge_alert_history', serialized);
    } catch (err) {
      console.error('Failed to save alert history:', err);
      // If storage is full, clear and try again
      if (err.name === 'QuotaExceededError') {
        localStorage.removeItem('netforge_alert_history');
        console.warn('Alert history cleared due to storage limit');
      }
    }
  },

  shouldAlert: (alertCache, metric, severity) => {
    const key = `${metric}-${severity}`;
    const lastAlert = alertCache.current?.get(key) || 0;
    const now = Date.now();
    if (now - lastAlert > 30000) {
      alertCache.current?.set(key, now);
      return true;
    }
    return false;
  }
};

  const [username, setUsername] = React.useState('admin');
  const [password, setPassword] = React.useState('');
  const [error, setError] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [testing, setTesting] = React.useState(false);
  const [useTls, setUseTls] = React.useState(false);
  const [saveCredentials, setSaveCredentials] = React.useState(true);
  const [recents, setRecents] = React.useState([]);
  const [activeIdx, setActiveIdx] = React.useState(null);

  // Load recent connections on mount
  React.useEffect(() => {
    try {
      const stored = JSON.parse(localStorage.getItem('netforge_recents') || '[]');
      setRecents(stored);
      if (stored.length > 0) {
        setHost(stored[0].host);
        setPort(String(stored[0].port || '22'));
        setUsername(stored[0].username || 'admin');
        setActiveIdx(0);
      }
    } catch {}
  }, []);

  const saveRecent = (conn) => {
    try {
      const existing = JSON.parse(localStorage.getItem('netforge_recents') || '[]');
      const filtered = existing.filter(r => !(r.host === conn.host && r.username === conn.username));
      const updated = [conn, ...filtered].slice(0, 4);
      localStorage.setItem('netforge_recents', JSON.stringify(updated));
    } catch {}
  };

  const selectRecent = (r, i) => {
    setActiveIdx(i);
    setHost(r.host);
    setPort(String(r.port || '22'));
    setUsername(r.username || 'admin');
    setError(null);
  };

  const recentTone = (r) => {
    if (!r.timestamp) return 'dim';
    const sec = (Date.now() - r.timestamp) / 1000;
    if (sec < 86400) return 'good';
    if (sec < 604800) return 'dim';
    return 'warn';
  };

  const recentTime = (r) => {
    if (!r.timestamp) return '—';
    const sec = (Date.now() - r.timestamp) / 1000;
    if (sec < 60) return 'just now';
    if (sec < 3600) return `${Math.floor(sec / 60)} min ago`;
    if (sec < 86400) return `${Math.floor(sec / 3600)}h ago`;
    const days = Math.floor(sec / 86400);
    if (days === 1) return 'yesterday';
    if (days < 7) return `${days} days`;
    return `${Math.floor(days / 7)} weeks`;
  };

  const deviceLabel = React.useMemo(() => {
    if (activeIdx !== null && recents[activeIdx]) return recents[activeIdx].name;
    return `Router · ${host}`;
  }, [host, activeIdx, recents]);

    setError(null);
    setLoading(true);
    try {
      const result = await API.login(host, port, username, password);
      const sid = result.sessionId;
      // Persist session so page refresh doesn't require re-login
      try { localStorage.setItem('netforge_session', JSON.stringify({ sessionId: sid, host, port: parseInt(port) || 22, username, ts: Date.now() })); } catch {}
      if (saveCredentials) {

      setSessionId(sid);
      setRouter({ host, port: parseInt(port), username });
      setPage('Dashboard');

      setError(err.message || 'Connection failed');

      setLoading(false);
    }

          </div>
        </div>

        {/* ── Right: connection form ── */}
        <div style={{ padding: '32px 36px 24px 28px', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

          <div style={{ fontSize: 11, color: A.textFaint, textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 600 }}>Connect to</div>
          <div style={{ fontSize: 22, fontWeight: 600, marginTop: 4, marginBottom: 24, letterSpacing: '-0.02em', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{deviceLabel}</div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <ALabeledField label="Host" sub="ip address or hostname" value={host} onChange={e => { setHost(e.target.value); setActiveIdx(null); }} mono />
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 110px', gap: 10 }}>
              <ALabeledField label="Username" sub="ssh user" value={username} onChange={e => setUsername(e.target.value)} />
              <ALabeledField label="Port" sub="ssh port" value={port} onChange={e => setPort(e.target.value)} mono type="number" />
            </div>
            <ALabeledField label="Password" sub="router password" value={password} onChange={e => setPassword(e.target.value)} type="password" mono />
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              <AToggleRow label="Use TLS (api-ssl)" sub="api-ssl port 8729" on={useTls} onChange={setUseTls} />
              <AToggleRow label="Save credentials" sub="stored locally" on={saveCredentials} onChange={setSaveCredentials} />
            </div>
          </div>

          {error && (
            <div style={{ marginTop: 14, padding: '10px 12px', borderRadius: 8, fontSize: 12, fontWeight: 500, background: isOk ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.08)', color: isOk ? '#86EFAC' : '#FCA5A5', border: `1px solid ${isOk ? 'rgba(34,197,94,0.25)' : 'rgba(239,68,68,0.25)'}` }}>
              {error}
            </div>
          )}

          <div style={{ flex: 1 }} />

          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 16, paddingTop: 16, borderTop: `1px solid ${A.border}`, flexShrink: 0 }}>
            <APill tone="good" mono>ready</APill>
            <span style={{ flex: 1 }} />
            <ABtn kind="secondary" onClick={handleTest} disabled={testing || loading}>{testing ? 'Testing…' : 'Test'}</ABtn>
            <ABtn kind="primary" onClick={handleLogin} disabled={loading || !host || !username}>{loading ? 'Connecting…' : 'Connect'}</ABtn>
          </div>
        </div>

      </div>
    </div>
  );
};

const DashboardScreen = ({ sessionId, router }) => {
  const [stats,       setStats]       = React.useState(null);
  const [traffic,     setTraffic]     = React.useState({ rx: Array(28).fill(0), tx: Array(28).fill(0) });
  const [wans,        setWans]        = React.useState([]);
  const [clientCount, setClientCount] = React.useState(0);
  const [talkers,     setTalkers]     = React.useState([]);
  const [loading,     setLoading]     = React.useState(true);
  const [refreshing,  setRefreshing]  = React.useState(false);
  const alertCtx = React.useContext(AlertCtx);
  const alertStateCache = React.useRef(new Map());

  const checkThresholds = (data) => {
    if (!data) return;
    const check = (metric, value, thresholds) => {
      const key = `${metric}-state`;
      const prev = alertStateCache.current.get(key) || 'ok';
      const cur = value > thresholds.critical ? 'critical' : value > thresholds.warn ? 'warn' : 'ok';
      if (cur !== prev && cur !== 'ok') alertCtx.addAlert(metric, value, cur === 'critical' ? thresholds.critical : thresholds.warn, cur);
      alertStateCache.current.set(key, cur);
    };
    check('cpu',     data.cpu,     ALERT_THRESHOLDS.cpu);
    check('memory',  data.memory,  ALERT_THRESHOLDS.memory);
    check('storage', data.storage, ALERT_THRESHOLDS.storage);
  };

  const fetchAll = React.useCallback(async (isManual = false) => {
    if (isManual) setRefreshing(true);
    try {
      const [sRes, tRes, wRes, dRes, kRes] = await Promise.allSettled([
        API.getSystemStats(sessionId),
        API.call(sessionId, '/api/traffic'),
        API.getWanStatus(sessionId),
        API.getDhcpClients(sessionId),
        API.call(sessionId, '/api/top-talkers'),
      ]);
      if (sRes.status === 'fulfilled') { setStats(sRes.value); checkThresholds(sRes.value); }
      if (tRes.status === 'fulfilled') setTraffic(tRes.value);
      if (wRes.status === 'fulfilled') setWans(wRes.value);
      if (dRes.status === 'fulfilled') setClientCount(Array.isArray(dRes.value) ? dRes.value.length : 0);
      if (kRes.status === 'fulfilled') setTalkers(Array.isArray(kRes.value) ? kRes.value : []);
      setLoading(false);
    } catch {}
    if (isManual) setRefreshing(false);
  }, [sessionId]);

  React.useEffect(() => {
    if (!sessionId) return;
    fetchAll();
    const iv = setInterval(fetchAll, 5000);
    return () => clearInterval(iv);
  }, [sessionId, fetchAll]);

  // Kbps → human-readable
  const fmtKbps = (kbps) => {
    if (kbps >= 1024 * 1024) return `${(kbps / 1024 / 1024).toFixed(1)} Gbps`;
    if (kbps >= 1024)        return `${(kbps / 1024).toFixed(1)} Mbps`;
    return `${kbps} Kbps`;
  };

  const rxNow = traffic.rx[traffic.rx.length - 1] || 0;
  const txNow = traffic.tx[traffic.tx.length - 1] || 0;

  const kpiTone = (val, warn, bad) => val >= bad ? 'bad' : val >= warn ? 'warn' : 'good';
  const cpuTone   = kpiTone(stats?.cpu    || 0, 70, 90);
  const memTone   = kpiTone(stats?.memory || 0, 80, 95);
  const diskTone  = kpiTone(stats?.storage|| 0, 80, 95);

  if (loading) return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <ATopBar title="Dashboard" sub="loading…" />
      <div style={{ flex: 1, padding: 18, display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 14 }}>
        {[1,2,3,4].map(i => <ASkeleton key={i} />)}
      </div>
    </div>
  );

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

      {/* ── Top bar ── */}
      <div style={{ height: 56, padding: '0 22px', display: 'flex', alignItems: 'center', gap: 12, borderBottom: `1px solid ${A.border}`, flex: '0 0 auto' }}>
        <div>
          <div style={{ fontSize: 15, fontWeight: 600, letterSpacing: '-0.015em' }}>
            {router?.model || `Router · ${router?.host || '—'}`}
          </div>
          <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono, marginTop: 2 }}>
            connected · uptime {stats?.uptime || '—'} · cpu {stats?.cpu || 0}%
          </div>
        </div>
        <span style={{ flex: 1 }} />
        <ABtn kind="secondary" onClick={() => fetchAll(true)} disabled={refreshing}>
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" style={{ marginRight: 4 }}><path d="M13.5 2.5A6.5 6.5 0 1 1 8 1.5M13.5 2.5V6M13.5 2.5H10"/></svg>
          {refreshing ? 'Refreshing…' : 'Refresh'}
        </ABtn>
      </div>

      {/* ── Grid ── */}
      <div style={{ flex: 1, overflowY: 'auto', padding: 18 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 14, minWidth: 900 }}>

          {/* ── KPI cards ── */}
          {[
            { label: 'CPU load',      plain: 'processor',   val: stats?.cpu    || 0,  unit: '%',  trend: traffic.rx, tone: cpuTone,  detail: null },
            { label: 'Memory',        plain: 'ram in use',  val: stats?.memory || 0,  unit: '%',  trend: null,       tone: memTone,  detail: stats?.memoryDetail || null },
            { label: 'Storage',       plain: 'flash',       val: stats?.storage|| 0,  unit: '%',  trend: null,       tone: diskTone, detail: stats?.storageDetail || null },
            { label: 'Active clients',plain: 'dhcp + arp',  val: clientCount,         unit: '',   trend: null,       tone: 'accent', detail: null },
          ].map(({ label, plain, val, unit, trend, tone, detail }) => {
            const toneColor = { good: A.good, warn: A.warn, bad: A.bad, accent: A.accent, dim: A.textDim }[tone] || A.accent;
            return (
              <ACard key={label} pad={14} style={{ display: 'flex', flexDirection: 'column', gap: 6, minHeight: 110 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 12, fontWeight: 500 }}>{label}</span>
                  <span style={{ flex: 1 }} />
                  <span style={{ fontSize: 10.5, color: A.textFaint, fontFamily: A.mono }}>{plain}</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
                  <span style={{ fontSize: 28, fontWeight: 600, letterSpacing: '-0.02em', fontFamily: A.mono, color: toneColor }}>{val}</span>
                  <span style={{ fontSize: 13, color: A.textDim }}>{unit}</span>
                </div>
                <div style={{ marginTop: 'auto' }}>
                  {trend
                    ? <LineChart values={trend} w={200} h={32} stroke={toneColor} />
                    : <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>{detail || ' '}</div>}
                </div>
              </ACard>
            );
          })}

          {/* ── Traffic chart (span 2) ── */}
          <ACard pad={0} style={{ gridColumn: 'span 2', display: 'flex', flexDirection: 'column' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '14px 16px 8px' }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 600 }}>Traffic · all interfaces</div>
                <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>last 28 samples · realtime</div>
              </div>
              <span style={{ flex: 1 }} />
              <span style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11, color: A.textDim }}>
                <span style={{ width: 8, height: 2, background: A.accent, display: 'inline-block', borderRadius: 2 }} />
                RX <span style={{ fontFamily: A.mono, color: A.text, marginLeft: 4 }}>{fmtKbps(rxNow)}</span>
              </span>
              <span style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11, color: A.textDim }}>
                <span style={{ width: 8, height: 2, background: '#A78BFA', display: 'inline-block', borderRadius: 2 }} />
                TX <span style={{ fontFamily: A.mono, color: A.text, marginLeft: 4 }}>{fmtKbps(txNow)}</span>
              </span>
            </div>
            <div style={{ flex: 1, padding: '4px 12px 12px', minHeight: 120 }}>
              <svg width="100%" height="120" viewBox="0 0 480 120" preserveAspectRatio="none" style={{ display: 'block' }}>
                {[0,1,2,3].map(i => <line key={i} x1="0" x2="480" y1={i*30+5} y2={i*30+5} stroke="rgba(255,255,255,0.04)" strokeWidth="1" />)}
                <path d={pathFromValues(traffic.rx, 480, 120, true)}  fill="rgba(59,130,246,0.18)" />
                <path d={pathFromValues(traffic.rx, 480, 120, false)} fill="none" stroke={A.accent} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
                <path d={pathFromValues(traffic.tx, 480, 120, true)}  fill="rgba(167,139,250,0.10)" />
                <path d={pathFromValues(traffic.tx, 480, 120, false)} fill="none" stroke="#A78BFA" strokeWidth="1.4" strokeDasharray="4 3" strokeLinecap="round" />
              </svg>
            </div>
          </ACard>

          {/* ── WAN status (span 2) ── */}
          <ACard pad={0} style={{ gridColumn: 'span 2' }}>
            <div style={{ display: 'flex', alignItems: 'center', padding: '14px 16px 10px' }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 600 }}>WAN & load balance</div>
                <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>
                  {wans.filter(w => w.status === 'up').length} of {wans.length || '—'} links active
                </div>
              </div>
              <span style={{ flex: 1 }} />
            </div>
            <div style={{ padding: '0 16px 14px', display: 'flex', flexDirection: 'column', gap: 8 }}>

                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c-2 3-2 7 0 12M8 2c2 3 2 7 0 12"/></svg>
                  </div>

            </div>
          </ACard>

        </div>
      </div>
    </div>

const InterfacesScreen = ({ sessionId }) => {
  const [interfaces, setInterfaces] = React.useState([]);
  const [loading, setLoading]       = React.useState(true);
  const [selected, setSelected]     = React.useState(null);

  React.useEffect(() => {
    if (!sessionId) return;
    const fetch = async () => {
      setLoading(true);
      try { const d = await API.getInterfaces(sessionId); setInterfaces(d); } catch {}
      setLoading(false);
    };
    fetch();
    const iv = setInterval(fetch, 5000);
    return () => clearInterval(iv);
  }, [sessionId]);

  const sel = selected !== null ? interfaces[selected] : null;

  const fmtBytes = (b) => {
    if (!b) return '—';
    if (b >= 1e9) return (b/1e9).toFixed(2) + ' GB';
    if (b >= 1e6) return (b/1e6).toFixed(1) + ' MB';
    return (b/1e3).toFixed(0) + ' KB';
  };

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Interfaces</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>{interfaces.length} interfaces · {interfaces.filter(i => i.status === 'up' || i.running).length} running</div>
        </div>
        <APill tone="dim" mono>auto-refresh 5s</APill>
      </div>

      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', gap: 0, padding: '0 20px 20px' }}>
        {/* table */}
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '24px 140px 90px 110px 80px 140px 90px 90px', padding: '9px 16px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', flexShrink: 0 }}>
            <span></span><span>Name</span><span>Status</span><span>Role / Comment</span><span>Speed</span><span>MAC</span><span>RX</span><span>TX</span>
          </div>
          <div style={{ flex: 1, overflow: 'auto' }}>
            {interfaces.length === 0 ? (
              <div style={{ padding: 32, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No interfaces found</div>
            ) : interfaces.map((iface, i) => {
              const up = iface.status === 'up' || iface.running;
              const isActive = selected === i;
              return (
                <div key={i} onClick={() => setSelected(isActive ? null : i)} style={{
                  display: 'grid', gridTemplateColumns: '24px 140px 90px 110px 80px 140px 90px 90px',
                  padding: '10px 16px', borderBottom: i < interfaces.length - 1 ? `1px solid ${A.border}` : 'none',
                  background: isActive ? 'rgba(59,130,246,0.08)' : i % 2 === 1 ? 'rgba(255,255,255,0.015)' : 'transparent',
                  cursor: 'pointer', alignItems: 'center', transition: 'background 0.1s',
                }}>
                  <div style={{ width: 8, height: 8, borderRadius: 999, background: up ? A.good : 'rgba(255,255,255,0.15)', boxShadow: up ? `0 0 6px ${A.good}` : 'none' }} />
                  <span style={{ fontSize: 12, fontWeight: 500, color: A.text, fontFamily: A.mono }}>{iface.name}</span>
                  <APill tone={up ? 'good' : 'dim'}>{up ? 'running' : 'down'}</APill>
                  <span style={{ fontSize: 11, color: A.textDim, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{iface.comment || iface.type || '—'}</span>
                  <span style={{ fontSize: 11, color: A.textDim, fontFamily: A.mono }}>{iface.speed || iface.actualMtu ? `${iface.actualMtu || '—'}` : '—'}</span>
                  <span style={{ fontSize: 10, color: A.textFaint, fontFamily: A.mono }}>{iface.macAddress || iface.mac || '—'}</span>
                  <span style={{ fontSize: 11, color: A.good, fontFamily: A.mono }}>{fmtBytes(iface.rxBytes || iface['rx-byte'])}</span>
                  <span style={{ fontSize: 11, color: A.accent, fontFamily: A.mono }}>{fmtBytes(iface.txBytes || iface['tx-byte'])}</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* detail panel */}
        {sel && (
          <div style={{ width: 268, flexShrink: 0, marginLeft: 12, display: 'flex', flexDirection: 'column', gap: 12, overflow: 'auto' }}>
            <ACard pad={16}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
                <div style={{ width: 10, height: 10, borderRadius: 999, background: (sel.status === 'up' || sel.running) ? A.good : 'rgba(255,255,255,0.2)' }} />
                <span style={{ fontSize: 13, fontWeight: 600, color: A.text, fontFamily: A.mono }}>{sel.name}</span>
              </div>
              {[
                { label: 'IP Address', val: sel.address || sel.ip || '—', mono: true },
                { label: 'Gateway',    val: sel.gateway || '—', mono: true },
                { label: 'MAC',        val: sel.macAddress || sel.mac || '—', mono: true },
                { label: 'MTU',        val: sel.mtu || sel.actualMtu || '—' },
                { label: 'Type',       val: sel.type || '—' },
                { label: 'RX total',   val: fmtBytes(sel.rxBytes || sel['rx-byte']), mono: true },
                { label: 'TX total',   val: fmtBytes(sel.txBytes || sel['tx-byte']), mono: true },
              ].map(row => (
                <div key={row.label} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '7px 0', borderBottom: `1px solid ${A.border}` }}>
                  <span style={{ fontSize: 11, color: A.textFaint }}>{row.label}</span>
                  <span style={{ fontSize: 11, color: A.text, fontFamily: row.mono ? A.mono : A.ui }}>{row.val}</span>
                </div>
              ))}
              <div style={{ display: 'flex', gap: 6, marginTop: 14 }}>
                <ABtn kind="secondary">Disable</ABtn>
                <ABtn kind="ghost">Monitor</ABtn>
                <ABtn kind="ghost">Edit</ABtn>
              </div>
            </ACard>
          </div>
        )}
      </div>
    </div>
  );
};

const LB_METHODS = [
  { id: 'pcc',      label: 'PCC',       sub: 'Per-connection',  desc: 'Same client → same WAN. Best for HTTPS, banking.' },
  { id: 'nth',      label: 'NTH',       sub: 'Round-robin',     desc: 'Splits packet-by-packet. Highest aggregate speed.' },
  { id: 'failover', label: 'Failover',  sub: 'Primary + standby',desc: 'Use WAN1; switch to WAN2 if it dies.' },
];

const WANScreen = ({ sessionId }) => {
  const [wans, setWans]           = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [lbMethod, setLbMethod]   = React.useState('pcc');
  const [pinBanking, setPinBanking]   = React.useState(true);
  const [healthCheck, setHealthCheck] = React.useState(true);
  const [connMark, setConnMark]       = React.useState(true);
  const [removeOnUninstall, setRemoveOnUninstall] = React.useState(true);
  const [applying, setApplying]   = React.useState(false);
  const [applyMsg, setApplyMsg]   = React.useState('');
  const alertCtx = React.useContext(AlertCtx);
  const wanAlertState = React.useRef(new Map());

  const checkWanStatus = (data) => {
    if (!data) return;
    data.forEach(wan => {
      const key = `wan-${wan.name}`;
      const prev = wanAlertState.current.get(key) || 'up';
      if (wan.status === 'down' && prev === 'up') alertCtx.addAlert('wan', 0, 0, 'critical');
      wanAlertState.current.set(key, wan.status);
    });
  };

  React.useEffect(() => {
    if (!sessionId) return;
    const handleData = (data) => { setWans(data); setLoading(false); checkWanStatus(data); };
    let unsubscribe, interval;
    if (API.wsManager?.isConnected) {
      API.subscribe('/api/wan-status', handleData);
      unsubscribe = () => API.unsubscribe('/api/wan-status', handleData);
    } else {
      const fetch = async () => {
        setLoading(true);
        try { const d = await API.getWanStatus(sessionId); handleData(d); } catch { setLoading(false); }
      };
      fetch();
      interval = setInterval(fetch, 5000);
    }
    return () => { if (unsubscribe) unsubscribe(); if (interval) clearInterval(interval); };
  }, [sessionId]);

  const activeWans = wans.filter(w => w.status === 'up');
  const totalUtil  = activeWans.reduce((s, w) => s + (w.util || 0), 0);

  const routerOsPreview = () => {
    const wList = activeWans.slice(0, 3);
    if (wList.length < 2) return '# add at least 2 active WAN interfaces';
    if (lbMethod === 'pcc') {
      return wList.map((w, i) =>
        `/ip firewall mangle add chain=prerouting in-interface=bridge1 \\\n  connection-state=new per-connection-classifier=both-addresses:${wList.length}/${i} \\\n  action=mark-connection new-connection-mark=${w.name}-conn`
      ).join('\n') + '\n' + wList.map(w => `/ip route add gateway=${w.gateway || w.ip || '0.0.0.0'} routing-mark=${w.name}`).join('\n');
    }
    if (lbMethod === 'nth') {
      return wList.map((w, i) =>
        `/ip firewall mangle add chain=prerouting nth=${wList.length},${i+1} \\\n  action=mark-connection new-connection-mark=${w.name}-conn`
      ).join('\n');
    }
    return `/ip route add dst-address=0.0.0.0/0 gateway=${wList[0]?.gateway || wList[0]?.ip} distance=1\n/ip route add dst-address=0.0.0.0/0 gateway=${wList[1]?.gateway || wList[1]?.ip} distance=2`;
  };

  const handleApply = async () => {
    setApplying(true); setApplyMsg('Applying rules…');
    await new Promise(r => setTimeout(r, 1200));
    setApplyMsg('✓ Load balance rules applied');
    setApplying(false);
    setTimeout(() => setApplyMsg(''), 4000);
  };

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>WAN · Load Balance</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>combine multiple ISPs · pcc · nth · failover</div>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          {applyMsg && <span style={{ fontSize: 11, color: applyMsg.includes('✓') ? A.good : A.textDim, fontFamily: A.mono }}>{applyMsg}</span>}
          <ABtn kind="primary" onClick={handleApply} disabled={applying || activeWans.length < 2}>{applying ? 'Applying…' : 'Apply'}</ABtn>
        </div>
      </div>

      <div style={{ flex: 1, overflow: 'auto', padding: '0 20px 20px', display: 'flex', gap: 16 }}>
        {/* left column: WAN list + method + advanced */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 14 }}>

          {/* Step 1: WAN interfaces */}
          <ACard pad={0}>
            <div style={{ padding: '11px 16px 9px', borderBottom: `1px solid ${A.border}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div>
                <span style={{ fontSize: 12, fontWeight: 600, color: A.text }}>1 · WAN Interfaces</span>
                <span style={{ fontSize: 10, color: A.textFaint, marginLeft: 10 }}>pick 2 or more · drag to set order</span>
              </div>
              <APill tone="dim" mono>{activeWans.length} active</APill>
            </div>
            {wans.length === 0 ? (
              <div style={{ padding: 24, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No WAN interfaces detected</div>
            ) : wans.map((wan, i) => {
              const up = wan.status === 'up';
              return (
                <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', borderBottom: i < wans.length - 1 ? `1px solid ${A.border}` : 'none', background: up ? 'transparent' : 'rgba(239,68,68,0.03)' }}>
                  <div style={{ width: 9, height: 9, borderRadius: 999, background: up ? A.good : 'rgba(255,255,255,0.15)', boxShadow: up ? `0 0 6px ${A.good}` : 'none', flexShrink: 0 }} />
                  <div style={{ flex: 1 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <span style={{ fontSize: 12, fontWeight: 600, color: A.text, fontFamily: A.mono }}>{wan.name}</span>
                      {wan.comment && <span style={{ fontSize: 11, color: A.textDim }}>· {wan.comment}</span>}
                      <APill tone={up ? 'good' : 'bad'}>{wan.status || 'down'}</APill>
                    </div>
                    <div style={{ fontSize: 10, color: A.textFaint, marginTop: 3, fontFamily: A.mono }}>
                      {wan.ip || '—'} · {wan.util || 0}% used{wan.latency ? ` · ${wan.latency}ms` : ''}
                    </div>
                  </div>
                  {/* weight chips */}
                  <div style={{ display: 'flex', gap: 4 }}>
                    {[1,2,3].map(w => (
                      <button key={w} style={{ width: 26, height: 22, borderRadius: 5, border: `1px solid ${(wan.weight||1) === w ? A.accent : A.border}`, background: (wan.weight||1) === w ? A.accentSoft : 'transparent', color: (wan.weight||1) === w ? '#BFDBFE' : A.textFaint, fontSize: 11, cursor: 'pointer' }}>{w}</button>
                    ))}
                  </div>
                  {/* usage mini bar */}
                  <div style={{ width: 60 }}>
                    <div style={{ height: 4, background: 'rgba(255,255,255,0.08)', borderRadius: 2, overflow: 'hidden' }}>
                      <div style={{ width: `${wan.util || 0}%`, height: '100%', background: up ? A.accent : 'rgba(255,255,255,0.1)' }} />
                    </div>
                    <div style={{ fontSize: 9, color: A.textFaint, marginTop: 3, textAlign: 'right', fontFamily: A.mono }}>{wan.util || 0}%</div>
                  </div>
                </div>
              );
            })}
          </ACard>

          {/* Step 2: Distribution method */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>2 · Distribution method</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {LB_METHODS.map(m => (
                <div key={m.id} onClick={() => setLbMethod(m.id)} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, padding: '10px 12px', borderRadius: 9, border: `1px solid ${lbMethod === m.id ? A.accent : A.border}`, background: lbMethod === m.id ? A.accentSoft : A.surface, cursor: 'pointer', transition: 'all 0.15s' }}>
                  <div style={{ width: 15, height: 15, borderRadius: 999, border: `2px solid ${lbMethod === m.id ? A.accent : 'rgba(255,255,255,0.25)'}`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: 1 }}>
                    {lbMethod === m.id && <div style={{ width: 7, height: 7, borderRadius: 999, background: A.accent }} />}
                  </div>
                  <div>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                      <span style={{ fontSize: 12, fontWeight: 600, color: A.text }}>{m.label}</span>
                      <APill tone="dim">{m.sub}</APill>
                    </div>
                    <div style={{ fontSize: 10, color: A.textFaint, marginTop: 3 }}>{m.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </ACard>

          {/* Step 3: Advanced options */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>3 · Advanced options <span style={{ fontSize: 10, color: A.textFaint, fontWeight: 400 }}>safe defaults · tune if needed</span></div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <AToggleRow label="Pin banking & UPI to WAN1" sub="address-list: sticky-domains" on={pinBanking} onChange={setPinBanking} />
              <AToggleRow label="Health-check via netwatch" sub="ping 1.1.1.1 every 5s" on={healthCheck} onChange={setHealthCheck} />
              <AToggleRow label="Mark connection (mangle)" sub="conn-mark wan1-conn / wan2-conn" on={connMark} onChange={setConnMark} />
              <AToggleRow label="Remove rules on uninstall" sub="adds comment=netforge-lb" on={removeOnUninstall} onChange={setRemoveOnUninstall} />
            </div>
          </ACard>
        </div>

        {/* right column: live distribution + command preview */}
        <div style={{ width: 320, flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 14 }}>
          {/* live distribution */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>Live distribution</div>
            {activeWans.length === 0 ? (
              <div style={{ fontSize: 11, color: A.textFaint }}>No active WAN links</div>
            ) : activeWans.map((wan, i) => {
              const pct = totalUtil > 0 ? Math.round(((wan.util || 0) / totalUtil) * 100) : Math.round(100 / activeWans.length);
              const colors = [A.accent, A.good, A.warn];
              const col = colors[i % colors.length];
              return (
                <div key={wan.name} style={{ marginBottom: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 5 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
                      <div style={{ width: 8, height: 8, borderRadius: 2, background: col }} />
                      <span style={{ fontSize: 11, fontFamily: A.mono, color: A.text }}>{wan.name}</span>
                      {wan.comment && <span style={{ fontSize: 10, color: A.textFaint }}>· {wan.comment}</span>}
                    </div>
                    <span style={{ fontSize: 11, fontFamily: A.mono, color: A.textDim }}>{pct}%</span>
                  </div>
                  <div style={{ height: 6, background: 'rgba(255,255,255,0.07)', borderRadius: 3, overflow: 'hidden' }}>
                    <div style={{ width: `${pct}%`, height: '100%', background: col, transition: 'width 0.5s' }} />
                  </div>
                </div>
              );
            })}
            <div style={{ marginTop: 4, paddingTop: 10, borderTop: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint }}>
              Will run on Apply: Mangle + Routing · {lbMethod} · {activeWans.length} wans
            </div>
          </ACard>

          {/* RouterOS preview */}
          <ACard pad={0} style={{ flex: 1 }}>
            <div style={{ padding: '10px 14px', borderBottom: `1px solid ${A.border}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontSize: 11, fontWeight: 600, color: A.text }}>RouterOS preview</span>
              <button onClick={() => navigator.clipboard?.writeText(routerOsPreview())} style={{ fontSize: 10, color: A.textDim, background: 'transparent', border: 'none', cursor: 'pointer', fontFamily: A.ui }}>Copy</button>
            </div>
            <div style={{ padding: 14, fontFamily: A.mono, fontSize: 10, color: '#86EFAC', lineHeight: 1.7, whiteSpace: 'pre-wrap', background: 'rgba(0,0,0,0.2)', borderRadius: '0 0 12px 12px', minHeight: 160 }}>
              {routerOsPreview()}
            </div>
          </ACard>

          {/* safe-mode note */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <APill tone="warn">safe-mode 60s</APill>
            <span style={{ fontSize: 10, color: A.textFaint }}>changes auto-revert if connection drops</span>
          </div>
        </div>
      </div>
    </div>
  );
};

  { id: 'adult',    label: 'Adult Content', category: 'Explicit',    domains: ['+ adult filter list (500+ domains)'],       hits: 0 },
  { id: 'torrents', label: 'Torrents',      category: 'P2P',         domains: ['thepiratebay.org','1337x.to','rarbg.to'],   hits: 0 },

const APPLY_OPTS = [
  { id: 'all',    label: 'All LAN clients',    sub: 'Applies to all DHCP leases' },
  { id: 'group',  label: 'Specific group',     sub: 'Select address list' },
  { id: 'time',   label: 'By time schedule',   sub: 'Active hours only' },
];

const FirewallScreen = ({ sessionId }) => {
  const [firewall, setFirewall] = React.useState(null);
  const [blocked, setBlocked] = React.useState(() => {
    const s = {};
    BLOCK_SERVICES.forEach(svc => s[svc.id] = false);
    return s;
  });
  const [applyTo, setApplyTo]   = React.useState('all');
  const [customDomain, setCustomDomain] = React.useState('');
  const [ruleType, setRuleType] = React.useState('DNS');
  const [testResult, setTestResult] = React.useState(null);
  const [addMsg, setAddMsg]   = React.useState('');
  const [loading, setLoading] = React.useState(true);

  React.useEffect(() => {
    if (!sessionId) return;
    const fetch = async () => {
      setLoading(true);
      try { const d = await API.getFirewall(sessionId); setFirewall(d); } catch {}
      setLoading(false);
    };
    fetch();
    const iv = setInterval(fetch, 5000);
    return () => clearInterval(iv);
  }, [sessionId]);

  const toggleService = (id) => setBlocked(prev => ({ ...prev, [id]: !prev[id] }));

  const routerOsPreview = () => {
    if (!customDomain.trim()) return '# enter a domain above';
    const d = customDomain.trim().toLowerCase();
    if (ruleType === 'DNS')  return `/ip dns static add name="${d}" address=0.0.0.0`;
    if (ruleType === 'L7')   return `/ip firewall layer7-protocol add name="block-${d}" regexp=".*${d}.*"\n/ip firewall filter add chain=forward layer7-protocol="block-${d}" action=drop`;
    return `/ip firewall address-list add list="blocklist" address=${d}\n/ip firewall filter add chain=forward dst-address-list="blocklist" action=drop`;
  };

  const handleTest = () => setTestResult({ domain: customDomain, reachable: Math.random() > 0.4 });
  const handleAdd  = async () => {
    if (!customDomain.trim()) return;
    setAddMsg('Adding rule…');
    await new Promise(r => setTimeout(r, 600));
    setAddMsg('✓ Rule added');
    setCustomDomain('');
    setTimeout(() => setAddMsg(''), 2000);
  };

  const activeCount  = firewall?.activeConnections ?? '—';
  const droppedCount = firewall?.droppedPackets    ?? '—';
  const blockedCount = Object.values(blocked).filter(Boolean).length;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Firewall · Block Sites</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>Content filtering via DNS / L7 / IP lists</div>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <APill tone="good" mono>{activeCount} active</APill>
          <APill tone={droppedCount > 0 ? 'warn' : 'dim'} mono>{droppedCount} dropped</APill>
          {blockedCount > 0 && <APill tone="bad">{blockedCount} services blocked</APill>}
        </div>
      </div>

      {/* body */}
      <div style={{ flex: 1, overflow: 'auto', display: 'grid', gridTemplateColumns: '1fr 340px', gap: 16, padding: 20, alignContent: 'start' }}>

        {/* left — service toggles + apply-to */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          {/* service list */}
          <ACard pad={0}>
            <div style={{ padding: '12px 16px 10px', borderBottom: `1px solid ${A.border}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span style={{ fontSize: 12, fontWeight: 600, color: A.text }}>Service Filters</span>
              <span style={{ fontSize: 11, color: A.textFaint }}>Toggle to block across all clients</span>
            </div>
            {BLOCK_SERVICES.map((svc, idx) => (
              <div key={svc.id} onClick={() => toggleService(svc.id)} style={{
                display: 'flex', alignItems: 'center', gap: 12, padding: '11px 16px',
                borderBottom: idx < BLOCK_SERVICES.length - 1 ? `1px solid ${A.border}` : 'none',
                cursor: 'pointer', background: blocked[svc.id] ? 'rgba(239,68,68,0.04)' : 'transparent',
                transition: 'background 0.15s',
              }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 2 }}>
                    <span style={{ fontSize: 13, fontWeight: 500, color: A.text }}>{svc.label}</span>
                    <APill tone="dim">{svc.category}</APill>
                    {blocked[svc.id] && <APill tone="bad">Blocked</APill>}
                  </div>
                  <div style={{ fontSize: 10, color: A.textFaint, fontFamily: A.mono, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                    {svc.domains.slice(0, 2).join(' · ')}{svc.domains.length > 2 ? ` + ${svc.domains.length - 2} more` : ''}
                  </div>
                </div>
                <div style={{ fontSize: 10, color: A.textFaint, minWidth: 48, textAlign: 'right', fontFamily: A.mono }}>{svc.hits} hits</div>
                <div style={{ width: 36, height: 20, borderRadius: 999, background: blocked[svc.id] ? A.bad : 'rgba(255,255,255,0.1)', position: 'relative', flexShrink: 0, transition: 'background 0.2s' }}>
                  <div style={{ width: 16, height: 16, borderRadius: 999, background: '#fff', position: 'absolute', top: 2, left: blocked[svc.id] ? 18 : 2, transition: 'left 0.2s' }} />
                </div>
              </div>
            ))}
          </ACard>

          {/* apply-to section */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>Apply rules to</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {APPLY_OPTS.map(opt => (
                <div key={opt.id} onClick={() => setApplyTo(opt.id)} style={{
                  display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px',
                  background: applyTo === opt.id ? A.accentSoft : A.surface,
                  border: `1px solid ${applyTo === opt.id ? A.accent : A.border}`,
                  borderRadius: 8, cursor: 'pointer', transition: 'all 0.15s',
                }}>
                  <div style={{ width: 14, height: 14, borderRadius: 999, border: `2px solid ${applyTo === opt.id ? A.accent : 'rgba(255,255,255,0.25)'}`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                    {applyTo === opt.id && <div style={{ width: 6, height: 6, borderRadius: 999, background: A.accent }} />}
                  </div>
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{opt.label}</div>
                    <div style={{ fontSize: 10, color: A.textFaint }}>{opt.sub}</div>
                  </div>
                </div>
              ))}
            </div>
          </ACard>
        </div>

        {/* right — custom rule panel */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 14 }}>Custom Block Rule</div>

            <ALabeledField label="Domain / IP" sub="e.g. example.com" value={customDomain} onChange={e => { setCustomDomain(e.target.value); setTestResult(null); }} mono />

            <div style={{ marginTop: 12, marginBottom: 4 }}>
              <div style={{ fontSize: 11, fontWeight: 500, color: A.text, marginBottom: 8 }}>Method</div>
              <div style={{ display: 'flex', gap: 6 }}>
                {['DNS','L7','IP-list'].map(t => (
                  <button key={t} onClick={() => setRuleType(t)} style={{
                    flex: 1, padding: '6px 0', borderRadius: 7, border: `1px solid ${ruleType === t ? A.accent : A.border}`,
                    background: ruleType === t ? A.accentSoft : 'transparent', color: ruleType === t ? '#BFDBFE' : A.textDim,
                    fontFamily: A.mono, fontSize: 11, cursor: 'pointer', transition: 'all 0.15s',
                  }}>{t}</button>
                ))}
              </div>
            </div>

            <div style={{ marginTop: 14, marginBottom: 14 }}>
              <div style={{ fontSize: 10, color: A.textFaint, marginBottom: 6 }}>RouterOS preview</div>
              <div style={{ background: 'rgba(0,0,0,0.25)', borderRadius: 8, padding: '10px 12px', fontFamily: A.mono, fontSize: 10, color: '#86EFAC', whiteSpace: 'pre-wrap', lineHeight: 1.6, border: `1px solid ${A.border}` }}>
                {routerOsPreview()}
              </div>
            </div>

            {testResult && (
              <div style={{ marginBottom: 12, padding: '8px 12px', borderRadius: 8, background: testResult.reachable ? 'rgba(239,68,68,0.1)' : 'rgba(34,197,94,0.1)', border: `1px solid ${testResult.reachable ? A.bad : A.good}`, fontSize: 11, color: testResult.reachable ? '#FCA5A5' : '#86EFAC', fontFamily: A.mono }}>
                {testResult.domain}: {testResult.reachable ? '⚠ Still reachable — rule not yet applied' : '✓ Domain blocked successfully'}
              </div>
            )}

            {addMsg && <div style={{ marginBottom: 10, fontSize: 11, color: addMsg.includes('✓') ? A.good : A.textDim }}>{addMsg}</div>}

            <div style={{ display: 'flex', gap: 8 }}>
              <ABtn kind="secondary" onClick={handleTest} disabled={!customDomain.trim()}>Test</ABtn>
              <ABtn kind="primary" onClick={handleAdd} disabled={!customDomain.trim()} full>+ Add block</ABtn>
            </div>
          </ACard>

          {/* stats mini */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>Live Stats</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {[
                { label: 'Active connections', val: activeCount, tone: 'accent' },
                { label: 'Dropped packets',    val: droppedCount, tone: droppedCount > 100 ? 'warn' : 'dim' },
                { label: 'Services blocked',   val: blockedCount, tone: blockedCount > 0 ? 'bad' : 'dim' },
              ].map(row => (
                <div key={row.label} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span style={{ fontSize: 11, color: A.textDim }}>{row.label}</span>
                  <APill tone={row.tone} mono>{row.val}</APill>
                </div>
              ))}
            </div>
          </ACard>
        </div>
      </div>
    </div>
  );
};

const ClientsScreen = ({ sessionId }) => {
  const [clients, setClients]   = React.useState([]);
  const [loading, setLoading]   = React.useState(true);
  const [search, setSearch]     = React.useState('');
  const [reserveRow, setReserveRow] = React.useState(null);

  const load = React.useCallback(async () => {
    setLoading(true);
    try { const d = await API.getDhcpClients(sessionId); setClients(Array.isArray(d) ? d : []); } catch {}
    setLoading(false);
  }, [sessionId]);

  React.useEffect(() => {
    if (!sessionId) return;
    load();
    const iv = setInterval(load, 5000);
    return () => clearInterval(iv);
  }, [sessionId, load]);

  const fmtBytes = (b) => {
    if (!b) return '—';
    if (b >= 1e9) return (b/1e9).toFixed(1)+'G';
    if (b >= 1e6) return (b/1e6).toFixed(0)+'M';
    if (b >= 1e3) return (b/1e3).toFixed(0)+'K';
    return b+'B';
  };

  const filtered = clients.filter(c => {
    if (!search) return true;
    const q = search.toLowerCase();
    return (c.hostname||c.vendor||'').toLowerCase().includes(q) || (c.ip||'').includes(q) || (c.mac||'').toLowerCase().includes(q);
  });

  const staticCount  = clients.filter(c => c.lease === 'static' || c['address-lists']).length;
  const activeCount  = clients.filter(c => c.status !== 'waiting').length;

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>DHCP · Connected Clients</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>{clients.length} leases · /ip dhcp-server lease</div>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <APill tone="good" mono>{activeCount} active</APill>
          <APill tone="accent" mono>{staticCount} reserved</APill>
          <ABtn kind="secondary" onClick={load}>Re-scan ARP</ABtn>
        </div>
      </div>

      {/* summary row */}
      <div style={{ display: 'flex', gap: 8, padding: '10px 20px 0', flexShrink: 0 }}>
        {[
          { label: `${clients.length} active leases`, tone: 'good' },
          { label: `${staticCount} static`, tone: 'accent' },
          { label: `${clients.filter(c=>!c.lease||c.lease==='dynamic').length} dynamic`, tone: 'dim' },
        ].map(p => <APill key={p.label} tone={p.tone}>{p.label}</APill>)}
      </div>

      {/* search bar */}
      <div style={{ padding: '10px 20px 0', flexShrink: 0 }}>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search by host, IP or MAC…" style={{ width: '100%', padding: '8px 12px', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 9, fontFamily: A.mono, fontSize: 12, color: A.text, outline: 'none', boxSizing: 'border-box' }} />
      </div>

      {/* table */}
      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', margin: '12px 20px 20px', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '160px 130px 150px 70px 70px 70px 70px', padding: '9px 16px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', flexShrink: 0 }}>
          <span>Host · Vendor</span><span>IP Address</span><span>MAC</span><span>Interface</span><span>Lease</span><span>RX</span><span>TX</span>
        </div>
        <div style={{ flex: 1, overflow: 'auto' }}>
          {filtered.length === 0 ? (
            <div style={{ padding: 32, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No clients found</div>
          ) : filtered.map((c, i) => (
            <div key={i} onMouseEnter={e => e.currentTarget.querySelector('.reserve-btn') && (e.currentTarget.querySelector('.reserve-btn').style.opacity = '1')}
              onMouseLeave={e => e.currentTarget.querySelector('.reserve-btn') && (e.currentTarget.querySelector('.reserve-btn').style.opacity = '0')}
              style={{
                display: 'grid', gridTemplateColumns: '160px 130px 150px 70px 70px 70px 70px',
                padding: '10px 16px', borderBottom: i < filtered.length - 1 ? `1px solid ${A.border}` : 'none',
                background: i % 2 === 1 ? 'rgba(255,255,255,0.015)' : 'transparent', alignItems: 'center', position: 'relative',
              }}>
              <div>
                <div style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{c.hostname || c.host || 'unknown'}</div>
                <div style={{ fontSize: 10, color: A.textFaint }}>{c.vendor || '—'}</div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ fontSize: 11, fontFamily: A.mono, color: A.text }}>{c.ip || c.address || '—'}</span>
                {(c.lease === 'static' || c['address-lists']) && <APill tone="accent">static</APill>}
              </div>
              <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textDim }}>{c.mac || c['mac-address'] || '—'}</span>
              <span style={{ fontSize: 11, color: A.textDim }}>{c.interface || c.iface || '—'}</span>
              <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint }}>{c.lease || c['expires-after'] || '—'}</span>
              <span style={{ fontSize: 11, fontFamily: A.mono, color: A.good }}>{fmtBytes(c.rx || c.rxBytes)}</span>
              <span style={{ fontSize: 11, fontFamily: A.mono, color: A.accent }}>{fmtBytes(c.tx || c.txBytes)}</span>
              <button className="reserve-btn" onClick={() => setReserveRow(c)} style={{ position: 'absolute', right: 12, background: A.accentSoft, border: `1px solid ${A.accent}`, borderRadius: 6, color: '#BFDBFE', fontSize: 10, padding: '3px 8px', cursor: 'pointer', opacity: 0, transition: 'opacity 0.15s' }}>Reserve IP</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

    if (!b) return '—';

    if (b >= 1e6) return (b/1e6).toFixed(0)+'M';

  };

  const getProtoData = (id) => vpn.find(v => v.name?.toLowerCase().includes(id) || v.type?.toLowerCase().includes(id)) || {};

  const wgPeers = vpn.filter ? vpn.filter(v => v.peers || v.type === 'wireguard' || v.name === 'wireguard') : [];
  const peers   = (getProtoData('wireguard').peerList) || [];

  const handleCreate = async () => {
    if (!peerName.trim()) { setAddMsg('Peer name required'); return; }

    setAddMsg('✓ Peer created — download .conf to activate');

const LOG_SEVERITIES = ['info','warning','error','debug'];
const LOG_SEV_TONE   = { info: 'good', warning: 'warn', error: 'bad', debug: 'dim' };

const LogsScreen = ({ sessionId }) => {
  const [logs, setLogs]           = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [search, setSearch]       = React.useState('');
  const [activeTopic, setActiveTopic] = React.useState(null);
  const [activeSevs, setActiveSevs]   = React.useState(new Set(LOG_SEVERITIES));

  React.useEffect(() => {
    if (!sessionId) return;
    const fetch = async () => {
      setLoading(true);
      try { const d = await API.getLogs(sessionId); setLogs(Array.isArray(d) ? d : []); } catch {}
      setLoading(false);
    };
    fetch();
    const iv = setInterval(fetch, 5000);
    return () => clearInterval(iv);
  }, [sessionId]);

  const topicCounts = React.useMemo(() => {
    const m = {};
    logs.forEach(l => { const t = l.topic || 'system'; m[t] = (m[t] || 0) + 1; });
    return m;
  }, [logs]);

  const topics = Object.keys(topicCounts).sort();

  const toggleSev = (s) => setActiveSevs(prev => {
    const n = new Set(prev);
    if (n.has(s)) n.delete(s); else n.add(s);
    return n;
  });

  const inferSev = (log) => {
    const t = (log.topic || '').toLowerCase();
    const m = (log.msg  || '').toLowerCase();
    if (t === 'error' || m.includes('error') || m.includes('fail'))  return 'error';
    if (t === 'warning' || m.includes('warn'))                        return 'warning';
    if (t === 'debug')                                                 return 'debug';
    return 'info';
  };

  const filtered = React.useMemo(() => logs.filter(l => {
    const sev = inferSev(l);
    if (!activeSevs.has(sev)) return false;
    if (activeTopic && (l.topic || 'system') !== activeTopic) return false;
    if (search) {
      const q = search.toLowerCase();
      return (l.msg||'').toLowerCase().includes(q) || (l.topic||'').toLowerCase().includes(q) || (l.source||'').toLowerCase().includes(q);
    }
    return true;
  }), [logs, activeSevs, activeTopic, search]);

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

              {topics.map(t => (

                  <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint }}>{topicCounts[t]}</span>

                    {activeSevs.has(s) && <div style={{ width: 6, height: 6, borderRadius: 1, background: A.accent }} />}
                  </div>
                  <APill tone={LOG_SEV_TONE[s]}>{s}</APill>
                </div>
              ))}
            </div>
          </ACard>
        </div>

        {/* right log table */}
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12 }}>

          <div style={{ padding: '10px 14px', borderBottom: `1px solid ${A.border}`, flexShrink: 0 }}>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search logs…" style={{ width: '100%', padding: '7px 12px', background: 'rgba(0,0,0,0.2)', border: `1px solid ${A.border}`, borderRadius: 8, fontFamily: A.mono, fontSize: 12, color: A.text, outline: 'none', boxSizing: 'border-box' }} />

          <div style={{ display: 'grid', gridTemplateColumns: '140px 100px 110px 1fr', padding: '8px 14px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', flexShrink: 0 }}>
            <span>Time</span><span>Topic</span><span>Source</span><span>Message</span>
          </div>
          {/* rows */}
          <div style={{ flex: 1, overflow: 'auto' }}>
            {filtered.length === 0 ? (
              <div style={{ padding: 32, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No logs match filter</div>
            ) : filtered.map((log, i) => {
              const sev = inferSev(log);
              return (
                <div key={i} style={{
                  display: 'grid', gridTemplateColumns: '140px 100px 110px 1fr',
                  padding: '8px 14px', borderBottom: i < filtered.length - 1 ? `1px solid rgba(255,255,255,0.04)` : 'none',
                  background: i % 2 === 1 ? 'rgba(255,255,255,0.01)' : 'transparent', alignItems: 'baseline',
                }}>
                  <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint }}>{log.time || '—'}</span>
                  <APill tone={LOG_SEV_TONE[sev]}>{log.topic || 'system'}</APill>
                  <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{log.source || '—'}</span>
                  <span style={{ fontSize: 12, color: sev === 'error' ? '#FCA5A5' : sev === 'warning' ? '#FCD34D' : A.text }}>{log.msg || ''}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
};

const ScriptsScreen = ({ sessionId }) => {
  const [scripts, setScripts]     = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [selected, setSelected]   = React.useState(null);
  const [schedule, setSchedule]   = React.useState('manual');
  const [executing, setExecuting] = React.useState(null);
  const [execOutput, setExecOutput] = React.useState(null);
  const [execStatus, setExecStatus] = React.useState('idle');
  const [execElapsed, setExecElapsed] = React.useState(0);

  const allScripts = React.useMemo(() => {
    const templates = Object.values(SCRIPT_TEMPLATES).map(t => ({
      name: t.name, schedule: t.schedule, lastRun: 'Never',
      status: 'template', label: t.label, description: t.description, source: t.source || '',
    }));
    return [...templates, ...scripts];
  }, [scripts]);

  React.useEffect(() => {
    if (!sessionId) return;
    const fetch = async () => {
      setLoading(true);
      try { const d = await API.getScripts(sessionId); setScripts(d); } catch {}
      setLoading(false);
    };
    fetch();
  }, [sessionId]);

  React.useEffect(() => {
    if (!executing || execStatus === 'done' || execStatus === 'error') return;
    const poll = async () => {
      try {
        const r = await API.getScriptOutput(sessionId, executing);
        setExecOutput(r.output); setExecStatus(r.status); setExecElapsed(r.elapsed);
        if (r.status !== 'running') setTimeout(() => { setExecuting(null); setExecStatus('idle'); }, 5000);
      } catch {}
    };
    const iv = setInterval(poll, 500);
    return () => clearInterval(iv);
  }, [executing, execStatus]);

  const handleRun = async (scriptName) => {
    setExecOutput('Starting…\n'); setExecStatus('running'); setExecElapsed(0);
    try {
      const r = await API.executeScript(sessionId, scriptName);
      setExecuting(r.executionId);
    } catch (e) { setExecOutput(`Error: ${e.message}`); setExecStatus('error'); setExecuting(null); }
  };

  const sel = selected !== null ? allScripts[selected] : null;

  const statusTone = (s) => s === 'ok' || s === 'success' ? 'good' : s === 'failed' ? 'bad' : s === 'running' ? 'accent' : 'dim';

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Scripts · Scheduler</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>{allScripts.length} scripts · /system script · /system scheduler</div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <ABtn kind="secondary">Run snippet</ABtn>
          <ABtn kind="primary">+ New script</ABtn>
        </div>
      </div>

      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', padding: '0 20px 20px', gap: 12 }}>
        {/* left: script list */}
        <div style={{ width: 280, flexShrink: 0, display: 'flex', flexDirection: 'column', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12, overflow: 'hidden' }}>
          <div style={{ flex: 1, overflow: 'auto' }}>
            {allScripts.map((script, i) => (
              <div key={script.name} onClick={() => setSelected(i)} style={{
                padding: '12px 16px', borderBottom: i < allScripts.length - 1 ? `1px solid ${A.border}` : 'none',
                cursor: 'pointer', background: selected === i ? 'rgba(59,130,246,0.08)' : 'transparent', transition: 'background 0.1s',
              }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                  <span style={{ fontSize: 12, fontWeight: 600, color: A.text, fontFamily: A.mono }}>{script.label || script.name}</span>
                  <APill tone={statusTone(script.status)}>{script.status || 'template'}</APill>
                </div>
                <div style={{ fontSize: 10, color: A.textFaint, marginBottom: 6 }}>{script.description || '—'}</div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint }}>{script.lastRun || 'never'} · {script.schedule || 'manual'}</span>
                  <button onClick={e => { e.stopPropagation(); handleRun(script.name); }} disabled={executing !== null} style={{ padding: '3px 10px', background: executing === script.name ? A.accentSoft : 'rgba(255,255,255,0.06)', border: `1px solid ${A.border}`, borderRadius: 6, color: executing === script.name ? '#BFDBFE' : A.textDim, fontSize: 10, cursor: 'pointer' }}>
                    {executing === script.name ? '▌ …' : '▶ Run'}
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* right: code + output */}
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', gap: 12 }}>
          {sel ? (<>
            {/* code panel */}
            <ACard pad={0} style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
              <div style={{ padding: '10px 16px', borderBottom: `1px solid ${A.border}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <span style={{ fontSize: 12, fontWeight: 600, color: A.text, fontFamily: A.mono }}>{sel.label || sel.name}</span>
                <div style={{ display: 'flex', gap: 6 }}>
                  <ABtn kind="secondary" onClick={() => handleRun(sel.name)} disabled={executing !== null}>Test</ABtn>
                  <ABtn kind="primary" onClick={() => handleRun(sel.name)} disabled={executing !== null}>▶ Run now</ABtn>
                  <ABtn kind="ghost">Save</ABtn>
                </div>
              </div>
              <div style={{ flex: 1, overflow: 'auto', padding: 16, background: 'rgba(0,0,0,0.25)', fontFamily: A.mono, fontSize: 11, color: '#86EFAC', lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>
                {sel.source || `# RouterOS script: ${sel.name}\n# description: ${sel.description || 'No description'}\n\n/log info "${sel.name} executed by NetForge"`}
              </div>
            </ACard>

            {/* schedule + output */}
            <div style={{ display: 'flex', gap: 12, flexShrink: 0 }}>
              <ACard pad={14} style={{ flex: 1 }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: A.text, marginBottom: 10 }}>Schedule</div>
                <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
                  {SCHED_OPTS.map(opt => (
                    <button key={opt.id} onClick={() => setSchedule(opt.id)} style={{ padding: '5px 10px', borderRadius: 7, border: `1px solid ${schedule === opt.id ? A.accent : A.border}`, background: schedule === opt.id ? A.accentSoft : 'transparent', color: schedule === opt.id ? '#BFDBFE' : A.textDim, fontSize: 11, fontFamily: A.ui, cursor: 'pointer' }}>{opt.label}</button>
                  ))}
                </div>
              </ACard>
              {(execOutput) && (
                <ACard pad={0} style={{ flex: 2, overflow: 'hidden' }}>
                  <TerminalOutput output={execOutput} status={execStatus} exitCode={execStatus === 'done' ? 0 : execStatus === 'error' ? 1 : null} elapsed={execElapsed} isLoading={execStatus === 'running'} />
                </ACard>
              )}
            </div>
          </>) : (
            <ACard pad={32}>
              <div style={{ textAlign: 'center', color: A.textFaint, fontSize: 12 }}>Select a script to view and edit</div>
            </ACard>
          )}
        </div>
      </div>
    </div>
  );
};

    if (!host || !username || !password) { setConnMsg('All fields required'); return; }
    setConnMsg('Connecting…');
    try {
      const result = await API.login(host, parseInt(port), username, password);
      if (result.sessionId) {
        try { localStorage.setItem('netforge_session', JSON.stringify({ sessionId: result.sessionId, host, port: parseInt(port) || 22, username, ts: Date.now() })); } catch {}
        setConnMsg('✓ Connected — reloading…');
        setTimeout(() => window.location.reload(), 1200);
      } else { setConnMsg('✗ Connection failed'); }
    } catch (e) { setConnMsg('✗ ' + e.message); }
  };

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 12px', flexShrink: 0 }}>

      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', padding: '0 20px 20px', gap: 12 }}>
        {/* left nav */}
        <div style={{ width: 196, flexShrink: 0 }}>
          <ACard pad={6}>
            {SETTINGS_NAV.map(item => (
              <div key={item.id} onClick={() => setActiveSection(item.id)} style={{
                display: 'flex', alignItems: 'center', gap: 10, padding: '9px 10px', borderRadius: 8,
                cursor: 'pointer', background: activeSection === item.id ? A.accentSoft : 'transparent',
                marginBottom: 2, transition: 'background 0.15s',
              }}>
                <svg width={14} height={14} viewBox="0 0 16 16" fill="none" stroke={activeSection === item.id ? A.accent : A.textFaint} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
                  <path d={item.icon} />
                </svg>
                <div>
                  <div style={{ fontSize: 12, fontWeight: 500, color: activeSection === item.id ? '#BFDBFE' : A.text }}>{item.label}</div>
                  <div style={{ fontSize: 10, color: A.textFaint }}>{item.sub}</div>

        {/* right content */}
        <div style={{ flex: 1, overflow: 'auto', display: 'flex', flexDirection: 'column', gap: 16 }}>
          {activeSection === 'general' && <>
            <ACard pad={16}>
              <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 14 }}>Default start screen</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                {[{id:'dashboard',label:'Dashboard'},{id:'interfaces',label:'Interfaces'},{id:'logs',label:'Logs'}].map(opt => (
                  <div key={opt.id} onClick={() => setDefaultMode(opt.id)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px', borderRadius: 8, border: `1px solid ${defaultMode === opt.id ? A.accent : A.border}`, background: defaultMode === opt.id ? A.accentSoft : A.surface, cursor: 'pointer', transition: 'all 0.15s' }}>
                    <div style={{ width: 14, height: 14, borderRadius: 999, border: `2px solid ${defaultMode === opt.id ? A.accent : 'rgba(255,255,255,0.25)'}`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                      {defaultMode === opt.id && <div style={{ width: 6, height: 6, borderRadius: 999, background: A.accent }} />}
                    </div>
                    <span style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{opt.label}</span>

            <ACard pad={16}>

            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

              <div style={{ display: 'flex', gap: 8 }}>

const RoutesScreen = ({ sessionId }) => {
  const [routes, setRoutes] = React.useState([]);
