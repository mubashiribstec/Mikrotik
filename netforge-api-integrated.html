<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NetForge — MikroTik Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #070c18; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
    #root { width: 100%; height: 100%; }
    *::-webkit-scrollbar { width: 0; height: 0; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    @keyframes shimmer { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
  </style>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">

// ========== CONTEXT ==========
const NavCtx = React.createContext({ page: 'Login', setPage: () => {} });
const AuthCtx = React.createContext({
  sessionId: null,
  setSessionId: () => {},
  router: null,
  setRouter: () => {},
  logout: () => {},
  apiBaseUrl: 'http://localhost:3001'
});
const AlertCtx = React.createContext({
  alerts: [],
  history: [],
  addAlert: () => {},
  dismissAlert: () => {},
  clearHistory: () => {},
  showHistory: false,
  toggleHistory: () => {}
});

// ========== DESIGN TOKENS ==========
const A = {
  bg: '#0B1220',
  bgLayered: 'radial-gradient(120% 80% at 0% 0%, rgba(56,118,255,0.18), transparent 55%), radial-gradient(80% 60% at 100% 100%, rgba(99,102,241,0.10), transparent 60%), #0B1220',
  surface: 'rgba(255,255,255,0.035)',
  surfaceStrong: 'rgba(255,255,255,0.06)',
  border: 'rgba(255,255,255,0.07)',
  borderStrong: 'rgba(255,255,255,0.12)',
  text: '#E6EAF2',
  textDim: 'rgba(230,234,242,0.62)',
  textFaint: 'rgba(230,234,242,0.42)',
  accent: '#3B82F6',
  accentSoft: 'rgba(59,130,246,0.16)',
  good: '#22C55E',
  warn: '#F59E0B',
  bad: '#EF4444',
  mono: '"JetBrains Mono", ui-monospace, monospace',
  ui: 'Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif',
};

// ========== API HELPER ==========
const API = {
  baseUrl: 'http://localhost:3001',

  async call(sessionId, endpoint, options = {}) {
    if (!sessionId && endpoint !== '/api/login') {
      throw new Error('No session. Please login first.');
    }

    const url = `${this.baseUrl}${endpoint}`;
    const headers = {
      'Content-Type': 'application/json',
      ...options.headers,
    };

    if (sessionId) {
      headers['x-session-id'] = sessionId;
    }

    try {
      const response = await fetch(url, {
        ...options,
        headers,
      });

      if (response.status === 401) {
        throw new Error('Session expired. Please login again.');
      }

      if (!response.ok) {
        const error = await response.json().catch(() => ({ error: response.statusText }));
        throw new Error(error.error || response.statusText);
      }

      return await response.json();
    } catch (err) {
      throw err;
    }
  },

  async login(host, port, username, password) {
    return this.call(null, '/api/login', {
      method: 'POST',
      body: JSON.stringify({ host, port: parseInt(port) || 22, username, password }),
    });
  },

  async logout(sessionId) {
    return this.call(sessionId, '/api/logout', {
      method: 'POST',
      body: JSON.stringify({ sessionId }),
    });
  },

  async getSystemStats(sessionId) {
    return this.call(sessionId, '/api/system-stats');
  },

  async getInterfaces(sessionId) {
    return this.call(sessionId, '/api/interfaces');
  },

  async getWanStatus(sessionId) {
    return this.call(sessionId, '/api/wan-status');
  },

  async getFirewall(sessionId) {
    return this.call(sessionId, '/api/firewall');
  },

  async getBandwidth(sessionId) {
    return this.call(sessionId, '/api/bandwidth');
  },

  async getDhcpClients(sessionId) {
    return this.call(sessionId, '/api/dhcp-clients');
  },

  async getWireless(sessionId) {
    return this.call(sessionId, '/api/wireless');
  },

  async getVpn(sessionId) {
    return this.call(sessionId, '/api/vpn');
  },

  async getLogs(sessionId) {
    return this.call(sessionId, '/api/logs');
  },

  async getScripts(sessionId) {
    return this.call(sessionId, '/api/scripts');
  },

  async getBackups(sessionId) {
    return this.call(sessionId, '/api/backups');
  },

  async executeScript(sessionId, scriptName) {
    return this.call(sessionId, '/api/scripts/execute', {
      method: 'POST',
      body: JSON.stringify({ scriptName }),
    });
  },

  async getScriptOutput(executionId) {
    const url = `${this.baseUrl}/api/scripts/${executionId}/output`;
    try {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(response.statusText);
      }
      return await response.json();
    } catch (err) {
      throw err;
    }
  },
};

// ========== ATOMS ==========

const ABase = ({ children }) => (
  <div style={{ width: '100%', height: '100%', background: A.bg, color: A.text, fontFamily: A.ui }}>
    {children}
  </div>
);

const APill = ({ children, tone = 'dim' }) => {
  const tones = {
    dim: { bg: 'rgba(255,255,255,0.05)', fg: A.textDim },
    good: { bg: 'rgba(34,197,94,0.12)', fg: '#86EFAC' },
    warn: { bg: 'rgba(245,158,11,0.12)', fg: '#FCD34D' },
    bad: { bg: 'rgba(239,68,68,0.12)', fg: '#FCA5A5' },
  }[tone];
  return <span style={{ display: 'inline-flex', gap: 6, padding: '3px 8px', borderRadius: 999, background: tones.bg, fontSize: 11, color: tones.fg, fontWeight: 500 }}>{children}</span>;
};

const ACard = ({ children, pad = 12 }) => (
  <div style={{ background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12, padding: pad, animation: 'slideIn 0.4s ease-out' }}>
    {children}
  </div>
);

const ABtn = ({ children, variant = 'primary', onClick, disabled = false }) => {
  const styles = {
    primary: { bg: A.accent, fg: '#fff', border: 'none' },
    secondary: { bg: A.surface, fg: A.text, border: `1px solid ${A.border}` },
    ghost: { bg: 'transparent', fg: A.textDim, border: 'none' },
  }[variant];
  return (
    <button onClick={onClick} disabled={disabled} style={{
      padding: '8px 14px', borderRadius: 8, fontFamily: A.ui, fontSize: 12, fontWeight: 500,
      background: styles.bg, color: styles.fg, border: styles.border, cursor: disabled ? 'not-allowed' : 'pointer',
      opacity: disabled ? 0.5 : 1, transition: 'all 0.2s'
    }} onMouseEnter={e => !disabled && (e.target.style.opacity = '0.85')} onMouseLeave={e => !disabled && (e.target.style.opacity = '1')}>
      {children}
    </button>
  );
};

const AInput = ({ label, type = 'text', placeholder, value, onChange, disabled = false }) => (
  <div style={{ marginBottom: 12 }}>
    {label && <label style={{ display: 'block', fontSize: 12, fontWeight: 500, marginBottom: 6, color: A.text }}>{label}</label>}
    <input type={type} placeholder={placeholder} value={value} onChange={onChange} disabled={disabled}
      style={{
        width: '100%', padding: '8px 12px', background: A.surface, color: A.text, border: `1px solid ${A.border}`,
        borderRadius: 6, fontFamily: A.ui, fontSize: 12, transition: 'border 0.2s',
        outlineColor: A.accent
      }} onFocus={e => e.target.style.borderColor = A.accent} onBlur={e => e.target.style.borderColor = A.border} />
  </div>
);

const AAlert = ({ children, tone = 'error' }) => {
  const tones = {
    error: { bg: 'rgba(239,68,68,0.1)', fg: '#FCA5A5', border: 'rgba(239,68,68,0.3)' },
    success: { bg: 'rgba(34,197,94,0.1)', fg: '#86EFAC', border: 'rgba(34,197,94,0.3)' },
  }[tone];
  return (
    <div style={{
      background: tones.bg, border: `1px solid ${tones.border}`, borderRadius: 8, padding: 12,
      color: tones.fg, fontSize: 12, marginBottom: 12, animation: 'slideIn 0.3s ease-out'
    }}>
      {children}
    </div>
  );
};

const ASkeleton = () => (
  <div style={{ background: A.surface, borderRadius: 12, padding: 12, height: 80, animation: 'shimmer 2s infinite' }} />
);

// ========== ALERT SYSTEM ==========

const ALERT_THRESHOLDS = {
  cpu: { warn: 80, critical: 95 },
  memory: { warn: 90, critical: 98 },
  storage: { warn: 95, critical: 99 },
  wan: { critical: 'down' }
};

const AlertUtils = {
  loadHistory: () => {
    try {
      const stored = localStorage.getItem('netforge_alert_history');
      return stored ? JSON.parse(stored) : [];
    } catch {
      return [];
    }
  },

  saveHistory: (history) => {
    try {
      const limited = history.slice(0, 100);
      localStorage.setItem('netforge_alert_history', JSON.stringify(limited));
    } catch (err) {
      console.error('Failed to save alert history:', err);
    }
  },

  shouldAlert: (alertCache, metric, severity) => {
    const key = `${metric}-${severity}`;
    const lastAlert = alertCache.current?.get(key) || 0;
    const now = Date.now();
    if (now - lastAlert > 30000) {
      alertCache.current?.set(key, now);
      return true;
    }
    return false;
  }
};

const Toast = ({ alert, onDismiss }) => {
  React.useEffect(() => {
    const timer = setTimeout(onDismiss, 4000);
    return () => clearTimeout(timer);
  }, [onDismiss]);

  const iconMap = { cpu: '⚡', memory: '💾', storage: '📦', wan: '🌐' };
  const toneColors = { warn: A.warn, critical: A.bad };

  return (
    <div style={{
      background: 'rgba(11,18,32,0.95)',
      border: `1px solid ${toneColors[alert.severity]}`,
      borderRadius: 8,
      padding: 12,
      color: toneColors[alert.severity],
      fontSize: 12,
      fontWeight: 500,
      display: 'flex',
      alignItems: 'center',
      gap: 12,
      maxWidth: 300,
      animation: 'slideIn 0.3s ease-out'
    }}>
      <span style={{ fontSize: 16 }}>{iconMap[alert.metric]}</span>
      <div style={{ flex: 1 }}>
        <div>{alert.metric.toUpperCase()}</div>
        <div style={{ fontSize: 11, opacity: 0.8 }}>{alert.value}% (>{alert.threshold}%)</div>
      </div>
      <button onClick={onDismiss} style={{
        background: 'none', border: 'none', color: toneColors[alert.severity],
        cursor: 'pointer', fontSize: 16, padding: 0
      }}>×</button>
    </div>
  );
};

const ToastContainer = ({ alerts, onDismiss }) => (
  <div style={{
    position: 'fixed', top: 16, right: 16, display: 'flex', flexDirection: 'column',
    gap: 8, zIndex: 9999, pointerEvents: 'auto'
  }}>
    {alerts.map(alert => (
      <Toast key={alert.id} alert={alert} onDismiss={() => onDismiss(alert.id)} />
    ))}
  </div>
);

const AlertHistoryPanel = ({ history, onClose, onClear }) => (
  <div style={{
    position: 'fixed', top: 0, right: 0, bottom: 0, width: 300,
    background: A.bg, borderLeft: `1px solid ${A.border}`,
    display: 'flex', flexDirection: 'column', zIndex: 9998,
    animation: 'slideIn 0.3s ease-out'
  }}>
    <div style={{
      padding: 12, borderBottom: `1px solid ${A.border}`,
      display: 'flex', justifyContent: 'space-between', alignItems: 'center'
    }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: A.text }}>Alert History ({history.length})</div>
      <button onClick={onClose} style={{
        background: 'none', border: 'none', color: A.textDim, cursor: 'pointer', fontSize: 16
      }}>×</button>
    </div>

    <div style={{ flex: 1, overflow: 'auto', padding: 8 }}>
      {history.length === 0 ? (
        <div style={{ color: A.textFaint, fontSize: 12, textAlign: 'center', paddingTop: 32 }}>
          No alerts yet
        </div>
      ) : (
        history.map(alert => (
          <div key={alert.id} style={{
            background: A.surface, borderRadius: 6, padding: 8, marginBottom: 6,
            borderLeft: `2px solid ${alert.severity === 'critical' ? A.bad : A.warn}`
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, marginBottom: 4 }}>
              <div style={{ fontWeight: 600, color: A.text }}>{alert.metric.toUpperCase()}</div>
              <div style={{ color: alert.severity === 'critical' ? A.bad : A.warn, fontWeight: 500 }}>
                {alert.severity}
              </div>
            </div>
            <div style={{ fontSize: 10, color: A.textDim, marginBottom: 4 }}>
              {alert.value}% (>{alert.threshold}%)
            </div>
            <div style={{ fontSize: 9, color: A.textFaint }}>
              {new Date(alert.timestamp).toLocaleTimeString()}
            </div>
          </div>
        ))
      )}
    </div>

    {history.length > 0 && (
      <div style={{
        padding: 12, borderTop: `1px solid ${A.border}`,
        display: 'flex', gap: 8
      }}>
        <button onClick={onClear} style={{
          flex: 1, padding: '6px 12px', background: A.surface, color: A.textDim,
          border: `1px solid ${A.border}`, borderRadius: 6, cursor: 'pointer',
          fontSize: 11, fontFamily: A.ui, transition: 'all 0.2s'
        }} onMouseEnter={e => {
          e.target.style.background = A.bad;
          e.target.style.color = '#fff';
        }} onMouseLeave={e => {
          e.target.style.background = A.surface;
          e.target.style.color = A.textDim;
        }}>
          Clear
        </button>
      </div>
    )}
  </div>
);

// ========== SCRIPT EXECUTION UI ==========

  system_info: {

    label: 'System Information',
    description: 'Display detailed system information',
    schedule: 'manual',
    icon: '📊'
  },
  daily_backup: {
    name: 'daily_backup',
    label: 'Daily Backup',
    description: 'Create backup at 2 AM daily',
    schedule: '0 2 * * *',
    icon: '💾'
  },
  health_check: {
    name: 'health_check',
    label: 'Health Check',
    description: 'Monitor CPU, memory, disk usage',
    schedule: '*/5 * * * *',
    icon: '❤️'
  },
  cleanup_logs: {

    label: 'Cleanup Logs',
    description: 'Remove logs older than 30 days',

const TerminalOutput = ({ output, status, exitCode, elapsed, isLoading }) => (
  <div style={{
    background: '#000000',
    border: `1px solid ${A.border}`,
    borderRadius: 8,
    padding: 16,
    fontFamily: A.mono,
    fontSize: 11,
    color: '#00FF00',
    height: 300,
    overflow: 'auto',
    marginBottom: 12,
    animation: 'fadeIn 0.3s ease-out',
    lineHeight: 1.5,
    whiteSpace: 'pre-wrap',
    wordBreak: 'break-word'
  }}>
    {output && output.split('\n').map((line, i) => (

// ========== SCREENS ==========

const LoginScreen = ({ setPage, setSessionId, setRouter }) => {
  const [host, setHost] = React.useState('192.168.1.1');
  const [port, setPort] = React.useState('22');
  const [username, setUsername] = React.useState('admin');
  const [password, setPassword] = React.useState('');
  const [error, setError] = React.useState(null);
  const [loading, setLoading] = React.useState(false);

  const handleLogin = async () => {
    setError(null);
    setLoading(true);
    try {
      const result = await API.login(host, port, username, password);
      setSessionId(result.sessionId);
      setRouter({ host, port: parseInt(port), username });
      setPage('Dashboard');
    } catch (err) {
      setError(err.message || 'Login failed');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{
      width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: A.bgLayered, padding: 20
    }}>
      <ACard pad={32} style={{ width: '100%', maxWidth: 380 }}>
        <div style={{ fontSize: 24, fontWeight: 700, marginBottom: 8, color: A.text }}>NetForge</div>
        <div style={{ fontSize: 12, color: A.textDim, marginBottom: 20 }}>Connect to your MikroTik router</div>

        {error && <AAlert tone="error">{error}</AAlert>}

        <AInput label="Host" placeholder="192.168.1.1" value={host} onChange={e => setHost(e.target.value)} disabled={loading} />
        <AInput label="Port" type="number" placeholder="22" value={port} onChange={e => setPort(e.target.value)} disabled={loading} />
        <AInput label="Username" placeholder="admin" value={username} onChange={e => setUsername(e.target.value)} disabled={loading} />
        <AInput label="Password" type="password" placeholder="password" value={password} onChange={e => setPassword(e.target.value)} disabled={loading} />

        <div style={{ display: 'flex', gap: 8 }}>
          <ABtn variant="primary" onClick={handleLogin} disabled={loading} style={{ flex: 1 }}>
            {loading ? 'Connecting...' : 'Connect'}
          </ABtn>
        </div>

        <div style={{ fontSize: 10, color: A.textFaint, marginTop: 16, textAlign: 'center' }}>
          Default credentials often admin / password
        </div>
      </ACard>
    </div>
  );
};

const DashboardScreen = ({ sessionId }) => {
  const [stats, setStats] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const alertCtx = React.useContext(AlertCtx);
  const alertCache = React.useRef(new Map());

  const checkThresholds = (data) => {
    if (!data) return;

    // Check CPU
    if (data.cpu > ALERT_THRESHOLDS.cpu.critical) {
      if (AlertUtils.shouldAlert(alertCache, 'cpu', 'critical')) {
        alertCtx.addAlert('cpu', data.cpu, ALERT_THRESHOLDS.cpu.critical, 'critical');
      }
    } else if (data.cpu > ALERT_THRESHOLDS.cpu.warn) {
      if (AlertUtils.shouldAlert(alertCache, 'cpu', 'warn')) {
        alertCtx.addAlert('cpu', data.cpu, ALERT_THRESHOLDS.cpu.warn, 'warn');
      }
    }

    // Check Memory
    if (data.memory > ALERT_THRESHOLDS.memory.critical) {
      if (AlertUtils.shouldAlert(alertCache, 'memory', 'critical')) {
        alertCtx.addAlert('memory', data.memory, ALERT_THRESHOLDS.memory.critical, 'critical');
      }
    } else if (data.memory > ALERT_THRESHOLDS.memory.warn) {
      if (AlertUtils.shouldAlert(alertCache, 'memory', 'warn')) {
        alertCtx.addAlert('memory', data.memory, ALERT_THRESHOLDS.memory.warn, 'warn');
      }
    }

    // Check Storage
    if (data.storage > ALERT_THRESHOLDS.storage.critical) {
      if (AlertUtils.shouldAlert(alertCache, 'storage', 'critical')) {
        alertCtx.addAlert('storage', data.storage, ALERT_THRESHOLDS.storage.critical, 'critical');
      }
    } else if (data.storage > ALERT_THRESHOLDS.storage.warn) {
      if (AlertUtils.shouldAlert(alertCache, 'storage', 'warn')) {
        alertCtx.addAlert('storage', data.storage, ALERT_THRESHOLDS.storage.warn, 'warn');
      }
    }
  };

  React.useEffect(() => {
    if (!sessionId) return;
    const fetchStats = async () => {
      setLoading(true);
      setError(null);
      try {
        const data = await API.getSystemStats(sessionId);
        setStats(data);
        checkThresholds(data);
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    };
    fetchStats();
    const interval = setInterval(fetchStats, 5000);
    return () => clearInterval(interval);
  }, [sessionId]);

  if (loading) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><ASkeleton /></div>;
  if (error) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><AAlert>{error}</AAlert></div>;

  const items = [
    { label: 'CPU', value: stats?.cpu || 0, unit: '%' },
    { label: 'Memory', value: stats?.memory || 0, unit: '%' },
    { label: 'Storage', value: stats?.storage || 0, unit: '%' },
    { label: 'Uptime', value: stats?.uptime || 'N/A', unit: '' },
  ];

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
      <h2 style={{ color: A.text, marginBottom: 16 }}>Dashboard</h2>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 12, marginBottom: 24 }}>
        {items.map(item => (
          <ACard key={item.label} pad={16}>
            <div style={{ fontSize: 11, color: A.textDim, marginBottom: 8 }}>{item.label}</div>
            <div style={{ fontSize: 24, fontWeight: 600, color: A.accent }}>{item.value}{item.unit}</div>
          </ACard>
        ))}
      </div>
    </div>
  );
};

const InterfacesScreen = ({ sessionId }) => {
  const [interfaces, setInterfaces] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);

  React.useEffect(() => {
    if (!sessionId) return;
    const fetchInterfaces = async () => {
      setLoading(true);
      setError(null);
      try {
        const data = await API.getInterfaces(sessionId);
        setInterfaces(data);
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    };
    fetchInterfaces();
    const interval = setInterval(fetchInterfaces, 5000);
    return () => clearInterval(interval);
  }, [sessionId]);

  if (loading) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><ASkeleton /></div>;
  if (error) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><AAlert>{error}</AAlert></div>;

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
      <h2 style={{ color: A.text, marginBottom: 16 }}>Interfaces</h2>

const ScriptsScreen = ({ sessionId }) => {
  const [scripts, setScripts] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [executing, setExecuting] = React.useState(null);
  const [execOutput, setExecOutput] = React.useState(null);
  const [execStatus, setExecStatus] = React.useState('idle');
  const [execElapsed, setExecElapsed] = React.useState(0);

  // Combine API scripts with templates
  const allScripts = React.useMemo(() => {
    const templates = Object.values(SCRIPT_TEMPLATES).map(t => ({
      name: t.name,
      schedule: t.schedule,
      lastRun: 'Never',
      status: 'template',
      label: t.label,
      description: t.description,
      icon: t.icon
    }));
    return [...templates, ...scripts];
  }, [scripts]);

  React.useEffect(() => {
    if (!sessionId) return;
    const fetchScripts = async () => {
      setLoading(true);
      setError(null);
      try {
        const data = await API.getScripts(sessionId);
        setScripts(data);
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    };
    fetchScripts();
  }, [sessionId]);

  // Poll execution output
  React.useEffect(() => {
    if (!executing || execStatus === 'done' || execStatus === 'error') return;

    const poll = async () => {
      try {
        const result = await API.getScriptOutput(executing);
        setExecOutput(result.output);
        setExecStatus(result.status);
        setExecElapsed(result.elapsed);

        if (result.status !== 'running') {
          // Execution complete
          setTimeout(() => {
            // Keep showing for 5 seconds
            setTimeout(() => {
              setExecuting(null);
              setExecStatus('idle');
            }, 5000);
          }, 0);
        }
      } catch (err) {
        console.error('Poll error:', err);
      }
    };

    const interval = setInterval(poll, 500);
    return () => clearInterval(interval);
  }, [executing, execStatus]);

  const handleExecute = async (scriptName) => {
    try {
      setExecuting(null);
      setExecOutput('Starting...\n');
      setExecStatus('running');
      setExecElapsed(0);

      const result = await API.executeScript(sessionId, scriptName);
      setExecuting(result.executionId);
    } catch (err) {
      setExecOutput(`Error: ${err.message}`);
      setExecStatus('error');
    }
  };

  if (loading) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><ASkeleton /></div>;
  if (error) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><AAlert>{error}</AAlert></div>;

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
      <h2 style={{ color: A.text, marginBottom: 16 }}>Scripts & Tasks</h2>

      {executing && (
        <div style={{ marginBottom: 16 }}>
          <h3 style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 8 }}>Execution Output</h3>
          <TerminalOutput
            output={execOutput}
            status={execStatus}
            exitCode={execStatus === 'done' ? 0 : execStatus === 'error' ? 1 : null}
            elapsed={execElapsed}
            isLoading={execStatus === 'running'}
          />
          {execStatus !== 'running' && (
            <div style={{ fontSize: 10, color: A.textDim, marginBottom: 16 }}>
              Completed in {(execElapsed / 1000).toFixed(2)}s
            </div>
          )}
        </div>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 12 }}>
        {allScripts.map(script => (
          <ACard key={script.name} pad={12}>
            <div style={{ marginBottom: 12 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                {script.icon && <span style={{ fontSize: 16 }}>{script.icon}</span>}
                <div style={{ fontSize: 12, fontWeight: 600, color: A.text, flex: 1 }}>
                  {script.label || script.name}
                </div>
                {script.status === 'template' && <APill tone="dim">Template</APill>}
                {script.status === 'success' && <APill tone="good">Success</APill>}
              </div>
              {script.description && (
                <div style={{ fontSize: 10, color: A.textFaint, marginBottom: 8 }}>
                  {script.description}
                </div>
              )}
            </div>

            <div style={{ fontSize: 9, color: A.textDim, marginBottom: 10, paddingBottom: 10, borderBottom: `1px solid ${A.border}` }}>
              <div>Schedule: {script.schedule}</div>
              <div>Last: {script.lastRun}</div>
            </div>

            <ABtn
              variant="secondary"
              onClick={() => handleExecute(script.name)}
              disabled={executing !== null}
              style={{ width: '100%' }}
            >
              {executing === script.name ? '▌ Running...' : '▶ Run'}
            </ABtn>
          </ACard>
        ))}
      </div>
    </div>
  );
};

const App = () => {
  const [page, setPage] = React.useState('Login');
  const [sessionId, setSessionId] = React.useState(null);
  const [router, setRouter] = React.useState(null);
  const [alerts, setAlerts] = React.useState([]);
  const [history, setHistory] = React.useState(() => AlertUtils.loadHistory());
  const [showHistory, setShowHistory] = React.useState(false);

  const addAlert = React.useCallback((metric, value, threshold, severity) => {
    const id = Math.random().toString(36).substring(7);
    const alert = { id, metric, value, threshold, severity, timestamp: Date.now() };

    // Add to active alerts (max 5)
    setAlerts(prev => {
      const updated = [alert, ...prev];
      return updated.slice(0, 5);
    });

    // Add to history
    setHistory(prev => {
      const updated = [alert, ...prev];
      AlertUtils.saveHistory(updated);
      return updated;
    });
  }, []);

  const dismissAlert = React.useCallback((id) => {
    setAlerts(prev => prev.filter(a => a.id !== id));
  }, []);

  const clearHistory = React.useCallback(() => {
    setHistory([]);
    AlertUtils.saveHistory([]);
  }, []);

  const alertCtxValue = {
    alerts,
    history,
    addAlert,
    dismissAlert,
    clearHistory,
    showHistory,
    toggleHistory: () => setShowHistory(s => !s)
  };

  const navItems = [
    { name: 'Dashboard', icon: '📊' },
    { name: 'Interfaces', icon: '🔗' },
    { name: 'WAN', icon: '🌐' },
    { name: 'Firewall', icon: '🛡️' },
    { name: 'Bandwidth', icon: '📈' },
    { name: 'Clients', icon: '👥' },
    { name: 'Hotspot', icon: '📡' },
    { name: 'Wireless', icon: '📶' },
    { name: 'VPN', icon: '🔐' },
    { name: 'Logs', icon: '📋' },
    { name: 'Scripts', icon: '⚙️' },
    { name: 'Backup', icon: '💾' },
    { name: 'Settings', icon: '⚡' },
  ];

  const handleLogout = async () => {
    try {
      if (sessionId) {
        await API.logout(sessionId);
      }
    } catch (err) {
      console.error('Logout error:', err);
    }
    setSessionId(null);
    setRouter(null);
    setPage('Login');
  };

  const renderScreen = () => {
    if (!sessionId && page !== 'Login') {
      setPage('Login');
      return null;
    }

    switch (page) {
      case 'Login': return <LoginScreen setPage={setPage} setSessionId={setSessionId} setRouter={setRouter} />;
      case 'Dashboard': return <DashboardScreen sessionId={sessionId} />;
      case 'Interfaces': return <InterfacesScreen sessionId={sessionId} />;
      case 'WAN': return <WANScreen sessionId={sessionId} />;
      case 'Firewall': return <FirewallScreen sessionId={sessionId} />;
      case 'Bandwidth': return <BandwidthScreen sessionId={sessionId} />;
      case 'Clients': return <ClientsScreen sessionId={sessionId} />;
      case 'Hotspot': return <HotspotScreen sessionId={sessionId} />;
      case 'Wireless': return <WirelessScreen sessionId={sessionId} />;
      case 'VPN': return <VpnScreen sessionId={sessionId} />;
      case 'Logs': return <LogsScreen sessionId={sessionId} />;
      case 'Scripts': return <ScriptsScreen sessionId={sessionId} />;
      case 'Backup': return <BackupScreen sessionId={sessionId} />;
      case 'Settings': return <SettingsScreen sessionId={sessionId} router={router} />;
      default: return null;
    }
  };

  if (page === 'Login') {
    return renderScreen();
  }

  return (
    <AlertCtx.Provider value={alertCtxValue}>
      <div style={{ width: '100%', height: '100%', background: A.bg, color: A.text, display: 'flex', flexDirection: 'column', fontFamily: A.ui, fontSize: 13 }}>
        {/* Title Bar */}
        <div style={{ height: 32, display: 'flex', alignItems: 'center', borderBottom: `1px solid ${A.border}`, padding: '0 12px', background: 'rgba(7,11,20,0.5)' }}>
          <div style={{ fontSize: 12, color: A.textDim }}>NetForge · {page}</div>
          <div style={{ flex: 1 }} />
          <button
            onClick={() => setShowHistory(!showHistory)}
            style={{
              background: history.length > 0 ? A.accent : 'transparent',
              color: history.length > 0 ? '#fff' : A.textDim,
              border: 'none',
              borderRadius: 6,
              padding: '4px 10px',
              cursor: 'pointer',
              fontSize: 11,
              fontWeight: 500,
              marginRight: 12,
              transition: 'all 0.2s'
            }}
          >
            🔔 {history.length > 0 ? history.length : ''}
          </button>
          {router && <span style={{ fontSize: 11, color: A.textFaint }}>@ {router.host}:{router.port}</span>}
        </div>

        {/* Main Layout */}
        <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
          {/* Sidebar */}
          <div style={{ width: 180, borderRight: `1px solid ${A.border}`, padding: 8, overflow: 'auto', display: 'flex', flexDirection: 'column' }}>
            {navItems.map(item => (
              <button key={item.name} onClick={() => setPage(item.name)} style={{
                flex: '0 0 auto', padding: 10, marginBottom: 4, border: 'none', background: page === item.name ? A.accent : 'transparent',
                color: page === item.name ? '#fff' : A.textDim, cursor: 'pointer', borderRadius: 6, fontFamily: A.ui, fontSize: 12,
                transition: 'all 0.2s', fontWeight: page === item.name ? 500 : 400
              }}>
                <span style={{ marginRight: 6 }}>{item.icon}</span>
                {item.name}
              </button>
            ))}
            <div style={{ flex: 1 }} />
            <button onClick={handleLogout} style={{
              width: '100%', padding: 10, border: 'none', background: 'transparent', color: A.textDim,
              cursor: 'pointer', borderRadius: 6, fontFamily: A.ui, fontSize: 12, borderTop: `1px solid ${A.border}`,
              transition: 'color 0.2s'
            }} onMouseEnter={e => e.target.style.color = A.text} onMouseLeave={e => e.target.style.color = A.textDim}>
              🚪 Logout
            </button>
          </div>

          {/* Content */}
          <div style={{ flex: 1, display: 'flex', overflow: 'hidden', position: 'relative' }}>
            {renderScreen()}
          </div>
        </div>

        {/* Toast Container */}
        <ToastContainer alerts={alerts} onDismiss={dismissAlert} />

        {/* Alert History Panel */}
        {showHistory && (
          <AlertHistoryPanel
            history={history}
            onClose={() => setShowHistory(false)}
            onClear={clearHistory}
          />
        )}
      </div>
    </AlertCtx.Provider>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
