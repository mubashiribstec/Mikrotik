  const [error, setError] = React.useState(null);
  const [showForm, setShowForm] = React.useState(false);
  const [dest, setDest] = React.useState('');
  const [gw, setGw] = React.useState('');
  const [dist, setDist] = React.useState('0');
  const [comment, setComment] = React.useState('');
  const [page, setPage] = React.useState(0);
  const PAGE_SIZE = 12;

  React.useEffect(() => {
    if (!sessionId) return;
    const fetch = async () => {
      setLoading(true);
      try {
        const data = await API.getRoutes(sessionId);
        setRoutes(data);
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    };
    fetch();
  }, [sessionId]);

  const handleAdd = async () => {
    if (!dest || !gw) {
      setError('Destination and gateway required');
      return;
    }
    try {
      await API.addRoute(sessionId, dest, gw, dist, comment);
      setDest('');
      setGw('');
      setDist('0');
      setComment('');
      setShowForm(false);
      const data = await API.getRoutes(sessionId);
      setRoutes(data);
    } catch (err) {
      setError(err.message);
    }
  };

  const handleDelete = async (id) => {
    if (!window.confirm('Delete this route?')) return;
    try {
      await API.removeRoute(sessionId, id);
      const data = await API.getRoutes(sessionId);
      setRoutes(data);
    } catch (err) {
      setError(err.message);
    }
  };

  if (loading) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
        <h2 style={{ color: A.text }}>Routes</h2>
        <ABtn variant="primary" onClick={() => setShowForm(!showForm)}>+ Add Route</ABtn>
      </div>

      {error && <AAlert>{error}</AAlert>}

      {showForm && (
        <ACard pad={16} style={{ marginBottom: 16 }}>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Destination</label>
            <input type="text" placeholder="0.0.0.0/0" value={dest} onChange={e => setDest(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }} />
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Gateway</label>
            <input type="text" placeholder="192.168.1.1" value={gw} onChange={e => setGw(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }} />
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Distance (metric)</label>
            <input type="number" value={dist} onChange={e => setDist(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }} />
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Comment</label>
            <input type="text" placeholder="Optional comment" value={comment} onChange={e => setComment(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui }} />
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <ABtn variant="primary" onClick={handleAdd} style={{ flex: 1 }}>Add</ABtn>
            <ABtn variant="secondary" onClick={() => setShowForm(false)} style={{ flex: 1 }}>Cancel</ABtn>
          </div>
        </ACard>
      )}

      {(() => {
        const startIdx = page * PAGE_SIZE;
        const endIdx = startIdx + PAGE_SIZE;
        const paginatedRoutes = routes.slice(startIdx, endIdx);
        const totalPages = Math.ceil(routes.length / PAGE_SIZE);

        return (
          <div style={{ display: 'flex', flexDirection: 'column', flex: 1 }}>
            <div style={{ flex: 1, overflow: 'auto', marginBottom: totalPages > 1 ? 16 : 0 }}>
              {paginatedRoutes.map(route => (
                <ACard key={route.id} pad={12} style={{ marginBottom: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8, alignItems: 'flex-start' }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 12, fontWeight: 600, color: A.text, fontFamily: A.mono }}>{route.destination}</div>
                      <div style={{ fontSize: 10, color: A.textDim }}>via {route.gateway}</div>
                    </div>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                      <APill tone={route.disabled ? 'dim' : 'good'}>{route.distance}</APill>
                      <button onClick={() => handleDelete(route.id)} style={{
                        background: 'rgba(239,68,68,0.2)', color: '#FCA5A5', border: 'none', borderRadius: 4, padding: '4px 8px', cursor: 'pointer', fontSize: 11, fontWeight: 500, minWidth: 60
                      }}>Delete</button>
                    </div>
                  </div>
                  {route.comment && <div style={{ fontSize: 10, color: A.textFaint }}>• {route.comment}</div>}
                </ACard>
              ))}
            </div>
            {totalPages > 1 && (
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', justifyContent: 'center', borderTop: `1px solid ${A.border}`, paddingTop: 16 }}>
                <button onClick={() => setPage(Math.max(0, page - 1))} disabled={page === 0} style={{
                  padding: '6px 12px', background: page === 0 ? A.surface : A.accentLine, color: A.text, border: 'none',
                  borderRadius: 4, cursor: page === 0 ? 'not-allowed' : 'pointer', fontSize: 12, opacity: page === 0 ? 0.5 : 1
                }}>← Prev</button>
                <span style={{ color: A.textDim, fontSize: 12 }}>Page {page + 1} of {totalPages}</span>
                <button onClick={() => setPage(Math.min(totalPages - 1, page + 1))} disabled={page === totalPages - 1} style={{
                  padding: '6px 12px', background: page === totalPages - 1 ? A.surface : A.accentLine, color: A.text, border: 'none',
                  borderRadius: 4, cursor: page === totalPages - 1 ? 'not-allowed' : 'pointer', fontSize: 12, opacity: page === totalPages - 1 ? 0.5 : 1
                }}>Next →</button>
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
};

const DnsScreen = ({ sessionId }) => {
  const [dns, setDns] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [servers, setServers] = React.useState([]);
  const [newServer, setNewServer] = React.useState('');
  const [allowRemote, setAllowRemote] = React.useState(false);

  React.useEffect(() => {
    if (!sessionId) return;
    const fetch = async () => {
      setLoading(true);
      try {
        const data = await API.getDns(sessionId);
        setDns(data);
        setServers(data.servers || []);
        setAllowRemote(data.allowRemoteRequests || false);
      } catch (err) {
        console.error(err);
      } finally {
        setLoading(false);
      }
    };
    fetch();
  }, [sessionId]);

  const handleAddServer = () => {
    if (newServer && /^\d+\.\d+\.\d+\.\d+$/.test(newServer)) {
      setServers([...servers, newServer]);
      setNewServer('');
    }
  };

  const handleRemoveServer = (ip) => {
    setServers(servers.filter(s => s !== ip));
  };

  const handleSave = async () => {
    try {
      await API.updateDns(sessionId, servers, allowRemote);
      alert('DNS settings updated');
    } catch (err) {
      alert('Error: ' + err.message);
    }
  };

  if (loading) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 16, maxWidth: 600 }}>
      <h2 style={{ color: A.text, marginBottom: 16 }}>DNS Settings</h2>

      <ACard pad={16} style={{ marginBottom: 16 }}>
        <h3 style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>Servers</h3>

        <div style={{ marginBottom: 12, display: 'flex', gap: 8 }}>
          <input type="text" placeholder="DNS server IP" value={newServer} onChange={e => setNewServer(e.target.value)}
            style={{ flex: 1, padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui }} />
          <ABtn variant="primary" onClick={handleAddServer}>Add</ABtn>
        </div>

        {servers.map(ip => (
          <div key={ip} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: 8, background: A.surface, borderRadius: 6, marginBottom: 6 }}>
            <span style={{ color: A.text, fontFamily: A.mono }}>{ip}</span>
            <button onClick={() => handleRemoveServer(ip)} style={{ background: 'none', border: 'none', color: A.bad, cursor: 'pointer', fontSize: 14 }}>×</button>
          </div>
        ))}
      </ACard>

      <ACard pad={16} style={{ marginBottom: 16 }}>
        <label style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }}>
          <input type="checkbox" checked={allowRemote} onChange={e => setAllowRemote(e.target.checked)} style={{ cursor: 'pointer' }} />
          <span style={{ color: A.text, fontSize: 12 }}>Allow remote requests</span>
        </label>
      </ACard>

      <ABtn variant="primary" onClick={handleSave} style={{ width: '100%' }}>Save DNS Settings</ABtn>
    </div>
  );
};

        <ACard pad={16} style={{ marginBottom: 16 }}>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Chain</label>
            <select value={chain} onChange={e => setChain(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }}>
              <option>srcnat</option>
              <option>dstnat</option>
            </select>
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Source Address</label>
            <input type="text" placeholder="192.168.1.0/24" value={srcAddr} onChange={e => setSrcAddr(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }} />
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Action</label>
            <select value={action} onChange={e => setAction(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }}>
              <option>masquerade</option>
              <option>redirect</option>
              <option>dst-nat</option>
            </select>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <ABtn variant="primary" onClick={handleAdd} style={{ flex: 1 }}>Add</ABtn>
            <ABtn variant="secondary" onClick={() => setShowForm(false)} style={{ flex: 1 }}>Cancel</ABtn>
          </div>
        </ACard>
      )}

      {(() => {
        const startIdx = page * PAGE_SIZE;
        const endIdx = startIdx + PAGE_SIZE;
        const paginatedRules = rules.slice(startIdx, endIdx);
        const totalPages = Math.ceil(rules.length / PAGE_SIZE);

        return (
          <div style={{ display: 'flex', flexDirection: 'column', flex: 1 }}>
            <div style={{ flex: 1, overflow: 'auto', marginBottom: totalPages > 1 ? 16 : 0 }}>
              {paginatedRules.map(rule => (
                <ACard key={rule.id} pad={12} style={{ marginBottom: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 12, fontWeight: 600, color: A.text }}>{rule.action}</div>
                      <div style={{ fontSize: 10, color: A.textDim }}>{rule.chain}</div>
                    </div>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                      <APill tone={rule.disabled ? 'dim' : 'good'}>{rule.srcAddress || 'all'}</APill>
                      <button onClick={() => handleDelete(rule.id)} style={{
                        background: 'rgba(239,68,68,0.2)', color: '#FCA5A5', border: 'none', borderRadius: 4, padding: '4px 8px', cursor: 'pointer', fontSize: 11, fontWeight: 500, minWidth: 60
                      }}>Delete</button>
                    </div>
                  </div>
                </ACard>
              ))}
            </div>
            {totalPages > 1 && (
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', justifyContent: 'center', borderTop: `1px solid ${A.border}`, paddingTop: 16 }}>
                <button onClick={() => setPage(Math.max(0, page - 1))} disabled={page === 0} style={{
                  padding: '6px 12px', background: page === 0 ? A.surface : A.accentLine, color: A.text, border: 'none',
                  borderRadius: 4, cursor: page === 0 ? 'not-allowed' : 'pointer', fontSize: 12, opacity: page === 0 ? 0.5 : 1
                }}>← Prev</button>
                <span style={{ color: A.textDim, fontSize: 12 }}>Page {page + 1} of {totalPages}</span>
                <button onClick={() => setPage(Math.min(totalPages - 1, page + 1))} disabled={page === totalPages - 1} style={{
                  padding: '6px 12px', background: page === totalPages - 1 ? A.surface : A.accentLine, color: A.text, border: 'none',
                  borderRadius: 4, cursor: page === totalPages - 1 ? 'not-allowed' : 'pointer', fontSize: 12, opacity: page === totalPages - 1 ? 0.5 : 1
                }}>Next →</button>
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
};

// ========== MAIN APP ==========

const App = () => {
  // Restore session from localStorage so page refresh doesn't force re-login
  const [sessionId, setSessionId] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('netforge_session') || 'null');
      // Treat sessions older than 6 hours as stale
      if (saved && saved.sessionId && Date.now() - saved.ts < 6 * 3600 * 1000) return saved.sessionId;
    } catch {}
    return null;
  });
  const [router, setRouter] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('netforge_session') || 'null');
      if (saved && saved.sessionId && Date.now() - saved.ts < 6 * 3600 * 1000) {
        return { host: saved.host, port: saved.port, username: saved.username };
      }
    } catch {}
    return null;
  });
  const [page, setPage] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('netforge_session') || 'null');
      if (saved && saved.sessionId && Date.now() - saved.ts < 6 * 3600 * 1000) return 'Dashboard';
    } catch {}
    return 'Login';
  });
  const [alerts, setAlerts] = React.useState([]);
  const [history, setHistory] = React.useState(() => AlertUtils.loadHistory());
  const [showHistory, setShowHistory] = React.useState(false);

  const addAlert = React.useCallback((metric, value, threshold, severity) => {
    const id = Math.random().toString(36).substring(7);
    const alert = { id, metric, value, threshold, severity, timestamp: Date.now() };

    // Add to active alerts (max 5)
    setAlerts(prev => {
      const updated = [alert, ...prev];
      return updated.slice(0, 5);
    });

    // Add to history
    setHistory(prev => {
      const updated = [alert, ...prev];
      AlertUtils.saveHistory(updated);
      return updated;
    });
  }, []);

  const dismissAlert = React.useCallback((id) => {
    setAlerts(prev => prev.filter(a => a.id !== id));
  }, []);

  const clearHistory = React.useCallback(() => {
    setHistory([]);
    AlertUtils.saveHistory([]);
  }, []);

  const alertCtxValue = {
    alerts,
    history,
    addAlert,
    dismissAlert,
    clearHistory,
    showHistory,
    toggleHistory: () => setShowHistory(s => !s)
  };

  // Listen for 401 session-expired events from API.call
  React.useEffect(() => {
    const onExpired = () => {
      try { localStorage.removeItem('netforge_session'); } catch {}
      if (API.wsManager) { try { API.wsManager.close(); } catch {}; API.wsManager = null; }
      setSessionId(null);
      setRouter(null);
      setPage('Login');
    };
    window.addEventListener('netforge:session-expired', onExpired);
    return () => window.removeEventListener('netforge:session-expired', onExpired);
  }, []);

  // Redirect to Login if sessionId disappears while on a protected page
  React.useEffect(() => {
    if (!sessionId && page !== 'Login') setPage('Login');
  }, [sessionId, page]);

  const handleLogout = async () => {
    if (API.wsManager) { try { API.wsManager.close(); } catch {}; API.wsManager = null; }
    try { if (sessionId) await API.logout(sessionId); } catch {}
    try { localStorage.removeItem('netforge_session'); } catch {}
    setSessionId(null);
    setRouter(null);
    setPage('Login');
  };

  const renderScreen = () => {
    switch (page) {
      case 'Login':       return <LoginScreen setPage={setPage} setSessionId={setSessionId} setRouter={setRouter} />;
      case 'Dashboard':   return <DashboardScreen sessionId={sessionId} router={router} />;
      case 'Interfaces':  return <InterfacesScreen sessionId={sessionId} />;
      case 'IP Addresses':return <IpAddressesScreen sessionId={sessionId} />;
      case 'Routes':      return <RoutesScreen sessionId={sessionId} />;
      case 'DNS':         return <DnsScreen sessionId={sessionId} />;
      case 'NAT':         return <NatScreen sessionId={sessionId} />;
      case 'WAN':         return <WANScreen sessionId={sessionId} />;
      case 'Firewall':    return <FirewallScreen sessionId={sessionId} />;
      case 'Bandwidth':   return <BandwidthScreen sessionId={sessionId} />;
      case 'Clients':     return <ClientsScreen sessionId={sessionId} />;
      case 'Hotspot':     return <HotspotScreen sessionId={sessionId} />;
      case 'Wireless':    return <WirelessScreen sessionId={sessionId} />;
      case 'VPN':         return <VpnScreen sessionId={sessionId} />;
      case 'Logs':        return <LogsScreen sessionId={sessionId} />;
      case 'Scripts':     return <ScriptsScreen sessionId={sessionId} />;
      case 'Backup':      return <BackupScreen sessionId={sessionId} />;
      case 'Settings':    return <SettingsScreen sessionId={sessionId} router={router} />;
      default:            return null;
    }
  };

  if (page === 'Login') return renderScreen();

  const pageLabelMap = Object.fromEntries(NAV_ITEMS.map(i => [i.page, i.label]));
  const pageLabel = pageLabelMap[page] || page;

  return (
    <AlertCtx.Provider value={alertCtxValue}>
      <div style={{ width: '100%', height: '100%', background: A.bgLayered, color: A.text, display: 'flex', flexDirection: 'column', fontFamily: A.ui, fontSize: 13, letterSpacing: '-0.005em', overflow: 'hidden' }}>

        {/* ── Title bar ── */}
        <div style={{ height: 32, display: 'flex', alignItems: 'center', flex: '0 0 auto', borderBottom: `1px solid ${A.border}`, background: 'rgba(7,11,20,0.5)', padding: '0 12px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: A.textDim, fontSize: 12 }}>
            <NetForgeMark size={14} color={A.accent} />
            <span style={{ fontWeight: 500, color: A.text }}>NetForge</span>
            <span style={{ color: A.textFaint }}>·</span>
            <span>{pageLabel}</span>
          </div>
          <div style={{ flex: 1 }} />
          <button onClick={() => setShowHistory(!showHistory)} style={{ background: 'none', border: 'none', color: alerts.length > 0 ? A.warn : A.textFaint, cursor: 'pointer', fontSize: 11, padding: '2px 8px', borderRadius: 6, fontFamily: A.ui, position: 'relative' }}>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"><path d="M8 1a5 5 0 0 1 5 5v2l1 2H2l1-2V6a5 5 0 0 1 5-5zM6 13a2 2 0 0 0 4 0"/></svg>
            {alerts.length > 0 && <span style={{ position: 'absolute', top: 0, right: 4, width: 7, height: 7, borderRadius: 999, background: A.warn, border: `2px solid rgba(7,11,20,0.9)` }} />}
          </button>
        </div>

        {/* ── Main layout ── */}
        <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
          <ASidebar
            active={page}
            router={router}
            onNavigate={setPage}
            onLogout={handleLogout}
            alertCount={alerts.length}
          />
          <main style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
            {renderScreen()}
          </main>
        </div>

        {/* Toast Container */}
        <ToastContainer alerts={alerts} onDismiss={dismissAlert} />

        {/* Alert History Panel */}
        {showHistory && (
          <AlertHistoryPanel
            history={history}
            onClose={() => setShowHistory(false)}
            onClear={clearHistory}
          />
        )}
      </div>
    </AlertCtx.Provider>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
