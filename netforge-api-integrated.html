// ========== WEBSOCKET MANAGER ==========

class WebSocketManagerClass {
  constructor(sessionId) {
    this.sessionId = sessionId;
    this.ws = null;
    this.subscriptions = new Map();
    this.isConnected = false;
    this.reconnectAttempts = 0;
    this.maxReconnectAttempts = 5;
    this.reconnectDelay = 1000;
    this.connect();
  }

  connect() {
    try {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${protocol}//${window.location.host}/ws?sessionId=${this.sessionId}`;

      this.ws = new WebSocket(url);
      this.ws.onopen = () => {
        this.isConnected = true;
        this.reconnectAttempts = 0;
        for (const endpoint of this.subscriptions.keys()) {
          this.sendSubscribe(endpoint);
        }
      };

      this.ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          const callbacks = this.subscriptions.get(msg.type);
          if (callbacks) {
            callbacks.forEach(cb => cb(msg.data));
          }
        } catch (err) {
          console.error('WS parse:', err);
        }
      };

      this.ws.onerror = () => {
        this.isConnected = false;
      };

      this.ws.onclose = () => {
        this.isConnected = false;
        this.attemptReconnect();
      };
    } catch (err) {
      this.isConnected = false;
      this.attemptReconnect();
    }
  }

  attemptReconnect() {
    if (this.reconnectAttempts >= this.maxReconnectAttempts) return;
    this.reconnectAttempts++;
    const delay = this.reconnectDelay * Math.pow(2, this.reconnectAttempts - 1);
    setTimeout(() => this.connect(), delay);
  }

  sendSubscribe(endpoint) {
    if (this.isConnected && this.ws.readyState === WebSocket.OPEN) {
      this.ws.send(JSON.stringify({ action: 'subscribe', endpoint }));
    }
  }

  subscribe(endpoint, callback) {
    if (!this.subscriptions.has(endpoint)) {
      this.subscriptions.set(endpoint, new Set());
      this.sendSubscribe(endpoint);
    }
    this.subscriptions.get(endpoint).add(callback);
  }

  unsubscribe(endpoint, callback) {
    const callbacks = this.subscriptions.get(endpoint);
    if (callbacks) {
      callbacks.delete(callback);
      if (callbacks.size === 0) {
        this.subscriptions.delete(endpoint);
      }
    }
  }

  close() {
    if (this.ws) {
      this.ws.close();
    }
  }
}

  subscribe(endpoint, callback) {
    if (this.wsManager && this.wsManager.isConnected) {
      this.wsManager.subscribe(endpoint, callback);

  unsubscribe(endpoint, callback) {

  async call(sessionId, endpoint, options = {}) {
    if (!sessionId && endpoint !== '/api/login') {
      throw new Error('No session. Please login first.');
    }

    const url = `${this.baseUrl}${endpoint}`;
    const headers = {
      'Content-Type': 'application/json',
      ...options.headers,
    };

    if (sessionId) {
      headers['x-session-id'] = sessionId;
    }

    const response = await fetch(url, { ...options, headers });

    if (response.status === 401) {
      window.dispatchEvent(new CustomEvent('netforge:session-expired'));
      throw new Error('Session expired. Please login again.');
    }

    if (!response.ok) {
      const err = await response.json().catch(() => ({ error: response.statusText }));
      throw new Error(err.error || response.statusText);
    }

    return await response.json();
  },

const APill = ({ children, tone = 'dim', mono = false }) => {
  const tones = {
    dim:    { bg: 'rgba(255,255,255,0.05)',  fg: A.textDim,  dot: A.textFaint },
    good:   { bg: 'rgba(34,197,94,0.12)',    fg: '#86EFAC',  dot: A.good },
    warn:   { bg: 'rgba(245,158,11,0.12)',   fg: '#FCD34D',  dot: A.warn },
    bad:    { bg: 'rgba(239,68,68,0.12)',    fg: '#FCA5A5',  dot: A.bad },
    accent: { bg: 'rgba(59,130,246,0.16)',   fg: '#BFDBFE',  dot: A.accent },
  }[tone] || { bg: 'rgba(255,255,255,0.05)', fg: A.textDim, dot: A.textFaint };
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '3px 9px 3px 8px', borderRadius: 999, background: tones.bg, fontFamily: mono ? A.mono : A.ui, fontSize: 11, color: tones.fg, fontWeight: 500, flexShrink: 0 }}>

// ========== CHART HELPERS ==========

const pathFromValues = (vals, w, h, fill) => {
  if (!vals || vals.length < 2) return fill ? `M0,${h} L${w},${h} Z` : '';
  const max = Math.max(...vals, 1);
  const stepX = w / (vals.length - 1);
  const pts = vals.map((v, i) => `${(i * stepX).toFixed(1)},${(h - (v / max) * (h - 6) - 3).toFixed(1)}`);
  const line = 'M' + pts.join(' L');
  return fill ? `${line} L${w},${h} L0,${h} Z` : line;
};

const LineChart = ({ values = [], w = 200, h = 32, stroke = A.accent, fill }) => {
  const f = fill || `${stroke}22`;
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: 'block' }}>
      <path d={pathFromValues(values, w, h, true)} fill={f} />
      <path d={pathFromValues(values, w, h, false)} fill="none" stroke={stroke} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
};

const ALERT_THRESHOLDS = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem('netforge_thresholds') || 'null');
    if (saved) return saved;
  } catch {}
  return { cpu: { warn: 80, critical: 95 }, memory: { warn: 90, critical: 98 }, storage: { warn: 95, critical: 99 } };
})();

const AlertUtils = {
  MAX_HISTORY: 50,
  MAX_STORAGE_SIZE: 100000, // ~100KB limit

  loadHistory: () => {
    try {
      const stored = localStorage.getItem('netforge_alert_history');
      return stored ? JSON.parse(stored) : [];
    } catch (err) {
      console.error('Failed to load alert history:', err);
      return [];
    }
  },

  saveHistory: (history) => {
    try {
      const limited = history.slice(0, AlertUtils.MAX_HISTORY);
      const serialized = JSON.stringify(limited);

      // Check size before saving
      if (serialized.length > AlertUtils.MAX_STORAGE_SIZE) {
        console.warn('Alert history too large, trimming');
        limited.splice(0, Math.floor(limited.length / 2));
        AlertUtils.saveHistory(limited);
        return;
      }

      localStorage.setItem('netforge_alert_history', serialized);
    } catch (err) {
      console.error('Failed to save alert history:', err);
      // If storage is full, clear and try again
      if (err.name === 'QuotaExceededError') {
        localStorage.removeItem('netforge_alert_history');
        console.warn('Alert history cleared due to storage limit');
      }
    }
  },

  shouldAlert: (alertCache, metric, severity) => {
    const key = `${metric}-${severity}`;
    const lastAlert = alertCache.current?.get(key) || 0;
    const now = Date.now();
    if (now - lastAlert > 30000) {
      alertCache.current?.set(key, now);
      return true;
    }
    return false;
  }
};

const LoginScreen = ({ setPage, setSessionId, setRouter }) => {
  const [host, setHost] = React.useState('192.168.88.1');
  const [port, setPort] = React.useState('22');
  const [username, setUsername] = React.useState('admin');
  const [password, setPassword] = React.useState('');
  const [error, setError] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [testing, setTesting] = React.useState(false);
  const [useTls, setUseTls] = React.useState(false);
  const [saveCredentials, setSaveCredentials] = React.useState(true);
  const [recents, setRecents] = React.useState([]);
  const [activeIdx, setActiveIdx] = React.useState(null);
  const [connType, setConnType] = React.useState('ssh'); // 'ssh' | 'api'
  const [apiPort, setApiPort] = React.useState('8728');

  // Load recent connections on mount
  React.useEffect(() => {
    try {
      const stored = JSON.parse(localStorage.getItem('netforge_recents') || '[]');
      setRecents(stored);
      if (stored.length > 0) {
        setHost(stored[0].host);
        setPort(String(stored[0].port || '22'));
        setUsername(stored[0].username || 'admin');
        setActiveIdx(0);
      }
    } catch {}
  }, []);

  const saveRecent = (conn) => {
    try {
      const existing = JSON.parse(localStorage.getItem('netforge_recents') || '[]');
      const filtered = existing.filter(r => !(r.host === conn.host && r.username === conn.username));
      const updated = [conn, ...filtered].slice(0, 4);
      localStorage.setItem('netforge_recents', JSON.stringify(updated));
    } catch {}
  };

  const selectRecent = (r, i) => {
    setActiveIdx(i);
    setHost(r.host);
    setPort(String(r.port || '22'));
    setUsername(r.username || 'admin');
    setError(null);
  };

  const recentTone = (r) => {
    if (!r.timestamp) return 'dim';
    const sec = (Date.now() - r.timestamp) / 1000;
    if (sec < 86400) return 'good';
    if (sec < 604800) return 'dim';
    return 'warn';
  };

  const recentTime = (r) => {
    if (!r.timestamp) return '—';
    const sec = (Date.now() - r.timestamp) / 1000;
    if (sec < 60) return 'just now';
    if (sec < 3600) return `${Math.floor(sec / 60)} min ago`;
    if (sec < 86400) return `${Math.floor(sec / 3600)}h ago`;
    const days = Math.floor(sec / 86400);
    if (days === 1) return 'yesterday';
    if (days < 7) return `${days} days`;
    return `${Math.floor(days / 7)} weeks`;
  };

  const deviceLabel = React.useMemo(() => {
    if (activeIdx !== null && recents[activeIdx]) return recents[activeIdx].name;
    return `Router · ${host}`;
  }, [host, activeIdx, recents]);

  const handleLogin = async () => {
    setError(null);
    setLoading(true);
    try {
      const result = await API.login(host, port, username, password, connType, apiPort);
      const sid = result.sessionId;
      const connPort = connType === 'api' ? parseInt(apiPort) || 8728 : parseInt(port) || 22;
      try {
        localStorage.setItem('netforge_session', JSON.stringify({
          sessionId: sid, host, port: connPort, username, ts: Date.now(),
        }));
      } catch {}
      API.initWebSocket(sid); // background — no blocking
      if (saveCredentials) {
        saveRecent({ name: deviceLabel, host, port: connPort, username, timestamp: Date.now() });
      }
      setSessionId(sid);
      setRouter({ host, port: connPort, username, connectionType: connType });
      setPage('Dashboard');
    } catch (err) {
      setError(err.message || 'Connection failed');
    } finally {
      setLoading(false);
    }
  };

  const handleTest = async () => {
    setError(null);
    setTesting(true);
    try {
      const r = await API.login(host, port, username, password, connType, apiPort);
      if (r.sessionId) {
        try { await API.logout(r.sessionId); } catch {}
        setError(`✓ Connection successful via ${r.connectionType === 'api' ? 'RouterOS API' : 'SSH'}`);
      }
    } catch (err) {
      setError(err.message || 'Connection failed');
    } finally {
      setTesting(false);
    }
  };

  const isOk = error && error.startsWith('✓');

  return (
    <div style={{ width: '100%', height: '100%', background: A.bgLayered, color: A.text, fontFamily: A.ui, fontSize: 13, lineHeight: 1.45, letterSpacing: '-0.005em', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

      {/* Title bar */}
      <div style={{ height: 32, display: 'flex', alignItems: 'center', flex: '0 0 auto', borderBottom: `1px solid ${A.border}`, background: 'rgba(7,11,20,0.5)', padding: '0 12px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: A.textDim, fontSize: 12 }}>
          <NetForgeMark size={14} color={A.accent} />
          <span style={{ fontWeight: 500, color: A.text }}>NetForge</span>
          <span style={{ color: A.textFaint }}>·</span>
          <span>Connect</span>
        </div>
      </div>

      {/* Two-column body */}
      <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '1fr 1fr', overflow: 'hidden' }}>

        {/* ── Left: recent connections ── */}
        <div style={{ padding: '32px 28px 24px 36px', borderRight: `1px solid ${A.border}`, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

          {/* Logo */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 28 }}>
            <div style={{ width: 36, height: 36, borderRadius: 10, background: 'linear-gradient(135deg,#3B82F6,#6366F1)', display: 'grid', placeItems: 'center', boxShadow: '0 8px 24px rgba(59,130,246,0.4)', flexShrink: 0 }}>
              <NetForgeMark size={20} color="#fff" />
            </div>
            <div>
              <div style={{ fontSize: 18, fontWeight: 600, letterSpacing: '-0.02em' }}>NetForge</div>
              <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>mikrotik manager · v0.4.0</div>
            </div>
          </div>

          <div style={{ fontSize: 11, color: A.textFaint, textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 600, marginBottom: 10 }}>Recent connections</div>

          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 6, overflowY: 'auto', minHeight: 0 }}>
            {recents.length === 0 ? (
              <div style={{ color: A.textFaint, fontSize: 12, padding: '24px 0', textAlign: 'center' }}>
                No saved connections yet.<br />
                <span style={{ fontSize: 11, opacity: 0.7 }}>Connect once to save here.</span>
              </div>
            ) : recents.map((r, i) => (
              <div key={i} onClick={() => selectRecent(r, i)} style={{
                display: 'flex', alignItems: 'center', gap: 12, padding: '11px 12px', borderRadius: 10, cursor: 'pointer',
                background: activeIdx === i ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.035)',
                border: `1px solid ${activeIdx === i ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.07)'}`,
              }}>
                <div style={{ width: 30, height: 30, borderRadius: 7, background: 'rgba(59,130,246,0.10)', border: `1px solid rgba(255,255,255,0.07)`, display: 'grid', placeItems: 'center', color: A.accent, flexShrink: 0 }}>
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="3" width="14" height="10" rx="2"/><path d="M5 13v-2M8 13v-2M11 13v-2"/></svg>
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 500, lineHeight: 1.2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{r.name}</div>
                  <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>{r.host}{r.port && r.port !== 22 ? `:${r.port}` : ''}</div>

                <APill tone={recentTone(r)} mono>{recentTime(r)}</APill>

          <div style={{ marginTop: 14, display: 'flex', gap: 8, flexShrink: 0 }}>

        </div>

        {/* ── Right: connection form ── */}
        <div style={{ padding: '32px 36px 24px 28px', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

          <div style={{ fontSize: 11, color: A.textFaint, textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 600 }}>Connect to</div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <ALabeledField label="Host" sub="ip address or hostname" value={host} onChange={e => { setHost(e.target.value); setActiveIdx(null); }} mono />

const OneClickActions = ({ sessionId }) => {
  const [busy, setBusy]     = React.useState({});
  const [msgs, setMsgs]     = React.useState({});
  const [active, setActive] = React.useState({});

  const setMsg = (id, msg, ok) => {
    setMsgs(p => ({ ...p, [id]: { msg, ok } }));
    setTimeout(() => setMsgs(p => { const n={...p}; delete n[id]; return n; }), 3500);
  };

  const handleAction = async (a) => {
    setBusy(p => ({ ...p, [a.id]: true }));
    try {
      if (a.action === 'block-service') {
        const isBlocking = !active[a.id];
        await API.toggleFirewallService(sessionId, a.svc, isBlocking, a.method);
        setActive(p => ({ ...p, [a.id]: isBlocking }));
        setMsg(a.id, isBlocking ? '✓ Blocked' : '✓ Unblocked', true);
      } else if (a.action === 'safe-search') {
        await API.addDnsStatic(sessionId, 'www.google.com', '216.239.38.120', 'A', false, 'netforge-safesearch');
        setMsg(a.id, '✓ Safe-search set', true);
      } else if (a.action === 'flush-dns') {
        await API.call(sessionId, '/api/dns/update', { method: 'POST', body: JSON.stringify({ servers: [], allowRemoteRequests: undefined, flush: true }) });
        setMsg(a.id, '✓ Cache flushed', true);
      }
    } catch (e) { setMsg(a.id, '✗ ' + e.message, false); }
    setBusy(p => ({ ...p, [a.id]: false }));
  };

  return (
    <ACard style={{ gridColumn: 'span 2' }}>
      <div style={{ marginBottom: 12 }}>
        <div style={{ fontSize: 13, fontWeight: 600 }}>One-click actions</div>
        <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>preset rules · idempotent · click again to undo</div>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
        {ONE_CLICK_ACTIONS.map(a => {
          const isActive = active[a.id];
          const isBusy = busy[a.id];
          const m = msgs[a.id];
          return (
            <div key={a.id} onClick={() => !isBusy && handleAction(a)} style={{
              display: 'flex', alignItems: 'center', gap: 10, padding: '10px 11px',
              background: isActive ? 'rgba(59,130,246,0.10)' : A.surface,
              border: `1px solid ${isActive ? A.accent : A.border}`,
              borderRadius: 9, cursor: isBusy ? 'wait' : 'pointer', opacity: isBusy ? 0.7 : 1, transition: 'all 0.15s',
            }}>
              <div style={{ width: 28, height: 28, borderRadius: 7, display: 'grid', placeItems: 'center', background: isActive ? A.accentSoft : 'rgba(255,255,255,0.04)', color: isActive ? '#BFDBFE' : A.accent, flexShrink: 0 }}>
                {isBusy
                  ? <div style={{ width: 12, height: 12, borderRadius: 999, border: `2px solid ${A.accent}`, borderTopColor: 'transparent', animation: 'spin 0.7s linear infinite' }} />
                  : <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d={a.icon}/></svg>
                }
              </div>
              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{ fontSize: 12.5, fontWeight: 500, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', color: isActive ? '#BFDBFE' : A.text }}>{a.title}</div>
                <div style={{ fontSize: 10.5, color: m ? (m.ok ? A.good : A.bad) : A.textFaint, fontFamily: A.mono }}>{m ? m.msg : (isActive ? 'active — click to disable' : a.sub)}</div>
              </div>
            </div>
          );
        })}
      </div>
    </ACard>
  );
};

const DashboardScreen = ({ sessionId, router }) => {
  const [stats,       setStats]       = React.useState(null);
  const [traffic,     setTraffic]     = React.useState({ rx: Array(60).fill(0), tx: Array(60).fill(0) });
  const [wans,        setWans]        = React.useState([]);
  const [clientCount, setClientCount] = React.useState(0);
  const [talkers,     setTalkers]     = React.useState([]);
  const [loading,     setLoading]     = React.useState(true);
  const [refreshing,  setRefreshing]  = React.useState(false);
  const [timeRange,   setTimeRange]   = React.useState('5m');
  const alertCtx = React.useContext(AlertCtx);
  const alertStateCache = React.useRef(new Map());

  const checkThresholds = (data) => {
    if (!data) return;
    const check = (metric, value, thresholds) => {
      const key = `${metric}-state`;
      const prev = alertStateCache.current.get(key) || 'ok';
      const cur = value > thresholds.critical ? 'critical' : value > thresholds.warn ? 'warn' : 'ok';
      if (cur !== prev && cur !== 'ok') alertCtx.addAlert(metric, value, cur === 'critical' ? thresholds.critical : thresholds.warn, cur);
      alertStateCache.current.set(key, cur);
    };
    check('cpu',     data.cpu,     ALERT_THRESHOLDS.cpu);
    check('memory',  data.memory,  ALERT_THRESHOLDS.memory);
    check('storage', data.storage, ALERT_THRESHOLDS.storage);
  };

  const fetchAll = React.useCallback(async (isManual = false) => {
    if (isManual) setRefreshing(true);
    try {
      const [sRes, tRes, wRes, dRes, kRes] = await Promise.allSettled([
        API.getSystemStats(sessionId),
        API.getTraffic(sessionId, timeRange),
        API.getWanStatus(sessionId),
        API.getDhcpClients(sessionId),
        API.call(sessionId, '/api/top-talkers'),
      ]);
      if (sRes.status === 'fulfilled') { setStats(sRes.value); checkThresholds(sRes.value); }
      if (tRes.status === 'fulfilled') setTraffic(tRes.value);
      if (wRes.status === 'fulfilled') setWans(wRes.value);
      if (dRes.status === 'fulfilled') setClientCount(Array.isArray(dRes.value) ? dRes.value.length : 0);
      if (kRes.status === 'fulfilled') setTalkers(Array.isArray(kRes.value) ? kRes.value : []);
      setLoading(false);
    } catch {}
    if (isManual) setRefreshing(false);
  }, [sessionId, timeRange]);

  React.useEffect(() => {
    if (!sessionId) return;
    fetchAll();
    const iv = setInterval(fetchAll, 5000);
    return () => clearInterval(iv);
  }, [sessionId, fetchAll, timeRange]);

  // Kbps → human-readable
  const fmtKbps = (kbps) => {
    if (kbps >= 1024 * 1024) return `${(kbps / 1024 / 1024).toFixed(1)} Gbps`;
    if (kbps >= 1024)        return `${(kbps / 1024).toFixed(1)} Mbps`;
    return `${kbps} Kbps`;
  };

  const rxNow = traffic.rx[traffic.rx.length - 1] || 0;
  const txNow = traffic.tx[traffic.tx.length - 1] || 0;

  const kpiTone = (val, warn, bad) => val >= bad ? 'bad' : val >= warn ? 'warn' : 'good';
  const cpuTone   = kpiTone(stats?.cpu    || 0, 70, 90);
  const memTone   = kpiTone(stats?.memory || 0, 80, 95);
  const diskTone  = kpiTone(stats?.storage|| 0, 80, 95);

  if (loading) return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <ATopBar title="Dashboard" sub="loading…" />
      <div style={{ flex: 1, padding: 18, display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 14 }}>
        {[1,2,3,4].map(i => <ASkeleton key={i} />)}
      </div>
    </div>
  );

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

      {/* ── Top bar ── */}
      <div style={{ height: 56, padding: '0 22px', display: 'flex', alignItems: 'center', gap: 12, borderBottom: `1px solid ${A.border}`, flex: '0 0 auto' }}>
        <div>
          <div style={{ fontSize: 15, fontWeight: 600, letterSpacing: '-0.015em' }}>
            {router?.model || `Router · ${router?.host || '—'}`}
          </div>
          <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono, marginTop: 2 }}>
            connected · uptime {stats?.uptime || '—'} · cpu {stats?.cpu || 0}%
          </div>
        </div>
        <span style={{ flex: 1 }} />
        <ABtn kind="secondary" onClick={() => fetchAll(true)} disabled={refreshing}>
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" style={{ marginRight: 4 }}><path d="M13.5 2.5A6.5 6.5 0 1 1 8 1.5M13.5 2.5V6M13.5 2.5H10"/></svg>
          {refreshing ? 'Refreshing…' : 'Refresh'}
        </ABtn>
      </div>

      {/* ── Grid ── */}
      <div style={{ flex: 1, overflowY: 'auto', padding: 18 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 14, minWidth: 900 }}>

          {/* ── KPI cards ── */}
          {[
            { label: 'CPU load',      plain: 'processor',   val: stats?.cpu    || 0,  unit: '%',  trend: stats?.cpuHistory    || traffic.rx, tone: cpuTone,  detail: null },
            { label: 'Memory',        plain: 'ram in use',  val: stats?.memory || 0,  unit: '%',  trend: stats?.memoryHistory || null,        tone: memTone,  detail: stats?.memoryDetail || null },
            { label: 'Storage',       plain: 'flash',       val: stats?.storage|| 0,  unit: '%',  trend: null,       tone: diskTone, detail: stats?.storageDetail || null },
            { label: 'Active clients',plain: 'dhcp + arp',  val: clientCount,         unit: '',   trend: null,       tone: 'accent', detail: null },
          ].map(({ label, plain, val, unit, trend, tone, detail }) => {
            const toneColor = { good: A.good, warn: A.warn, bad: A.bad, accent: A.accent, dim: A.textDim }[tone] || A.accent;
            return (
              <ACard key={label} pad={14} style={{ display: 'flex', flexDirection: 'column', gap: 6, minHeight: 110 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 12, fontWeight: 500 }}>{label}</span>
                  <span style={{ flex: 1 }} />
                  <span style={{ fontSize: 10.5, color: A.textFaint, fontFamily: A.mono }}>{plain}</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
                  <span style={{ fontSize: 28, fontWeight: 600, letterSpacing: '-0.02em', fontFamily: A.mono, color: toneColor }}>{val}</span>

                <div style={{ marginTop: 'auto' }}>
                  {trend

                </div>

          })}

          {/* ── Traffic chart (span 2) ── */}
          <ACard pad={0} style={{ gridColumn: 'span 2', display: 'flex', flexDirection: 'column' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '14px 16px 8px' }}>
              <div>

              <span style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11, color: A.textDim }}>

            <div style={{ flex: 1, padding: '4px 12px 12px', minHeight: 120 }}>

                <path d={pathFromValues(traffic.rx, 480, 120, true)}  fill="rgba(59,130,246,0.18)" />

const InterfacesScreen = ({ sessionId }) => {
  const [interfaces, setInterfaces] = React.useState([]);
  const [loading, setLoading]       = React.useState(true);
  const [selected, setSelected]     = React.useState(null);
  const [toggleMsg, setToggleMsg]   = React.useState('');
  const [renameVal, setRenameVal]   = React.useState('');
  const [renameMsg, setRenameMsg]   = React.useState('');
  const [macMsg, setMacMsg]         = React.useState('');

  const reload = React.useCallback(async () => {
    try { const d = await API.getInterfaces(sessionId); setInterfaces(d); } catch {}
  }, [sessionId]);

  React.useEffect(() => {
    if (!sessionId) return;
    const fetch = async () => {
      setLoading(true);
      await reload();
      setLoading(false);
    };
    fetch();
    const iv = setInterval(reload, 5000);
    return () => clearInterval(iv);
  }, [sessionId, reload]);

  const sel = selected !== null ? interfaces[selected] : null;

  const handleToggle = async () => {
    if (!sel) return;
    const disable = sel.status === 'up' && !sel.disabled;
    setToggleMsg(disable ? 'Disabling…' : 'Enabling…');
    try {
      const r = await API.toggleInterface(sessionId, sel.name, disable);
      setToggleMsg('✓ ' + r.message);
      await reload();
    } catch (e) { setToggleMsg('✗ ' + e.message); }
    setTimeout(() => setToggleMsg(''), 3000);
  };

  const fmtBytes = (b) => {
    if (!b) return '—';
    if (b >= 1e9) return (b/1e9).toFixed(2) + ' GB';
    if (b >= 1e6) return (b/1e6).toFixed(1) + ' MB';
    return (b/1e3).toFixed(0) + ' KB';
  };

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Interfaces</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>{interfaces.length} interfaces · {interfaces.filter(i => i.status === 'up' || i.running).length} running</div>
        </div>
        <APill tone="dim" mono>auto-refresh 5s</APill>
      </div>

      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', gap: 0, padding: '0 20px 20px' }}>
        {/* table */}
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '24px 140px 90px 110px 80px 140px 90px 90px', padding: '9px 16px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', flexShrink: 0 }}>
            <span></span><span>Name</span><span>Status</span><span>Role / Comment</span><span>Speed</span><span>MAC</span><span>RX</span><span>TX</span>
          </div>
          <div style={{ flex: 1, overflow: 'auto' }}>
            {interfaces.length === 0 ? (
              <div style={{ padding: 32, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No interfaces found</div>
            ) : interfaces.map((iface, i) => {
              const up = iface.status === 'up' || iface.running;
              const isActive = selected === i;
              return (
                <div key={i} onClick={() => setSelected(isActive ? null : i)} style={{
                  display: 'grid', gridTemplateColumns: '24px 140px 90px 110px 80px 140px 90px 90px',
                  padding: '10px 16px', borderBottom: i < interfaces.length - 1 ? `1px solid ${A.border}` : 'none',
                  background: isActive ? 'rgba(59,130,246,0.08)' : i % 2 === 1 ? 'rgba(255,255,255,0.015)' : 'transparent',
                  cursor: 'pointer', alignItems: 'center', transition: 'background 0.1s',
                }}>
                  <div style={{ width: 8, height: 8, borderRadius: 999, background: up ? A.good : 'rgba(255,255,255,0.15)', boxShadow: up ? `0 0 6px ${A.good}` : 'none' }} />
                  <span style={{ fontSize: 12, fontWeight: 500, color: A.text, fontFamily: A.mono }}>{iface.name}</span>
                  <APill tone={up ? 'good' : 'dim'}>{up ? 'running' : 'down'}</APill>
                  <span style={{ fontSize: 11, color: A.textDim, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{iface.comment || iface.type || '—'}</span>
                  <span style={{ fontSize: 11, color: A.textDim, fontFamily: A.mono }}>{iface.speed || iface.actualMtu ? `${iface.actualMtu || '—'}` : '—'}</span>
                  <span style={{ fontSize: 10, color: A.textFaint, fontFamily: A.mono }}>{iface.macAddress || iface.mac || '—'}</span>
                  <span style={{ fontSize: 11, color: A.good, fontFamily: A.mono }}>{fmtBytes(iface.rxBytes || iface['rx-byte'])}</span>
                  <span style={{ fontSize: 11, color: A.accent, fontFamily: A.mono }}>{fmtBytes(iface.txBytes || iface['tx-byte'])}</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* detail panel */}
        {sel && (
          <div style={{ width: 268, flexShrink: 0, marginLeft: 12, display: 'flex', flexDirection: 'column', gap: 12, overflow: 'auto' }}>
            <ACard pad={16}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
                <div style={{ width: 10, height: 10, borderRadius: 999, background: (sel.status === 'up' || sel.running) ? A.good : 'rgba(255,255,255,0.2)' }} />
                <span style={{ fontSize: 13, fontWeight: 600, color: A.text, fontFamily: A.mono }}>{sel.name}</span>
              </div>
              {[
                { label: 'IP Address', val: sel.address || sel.ip || '—', mono: true },
                { label: 'Gateway',    val: sel.gateway || '—', mono: true },
                { label: 'MAC',        val: sel.macAddress || sel.mac || '—', mono: true },
                { label: 'MTU',        val: sel.mtu || sel.actualMtu || '—' },
                { label: 'Type',       val: sel.type || '—' },
                { label: 'RX total',   val: fmtBytes(sel.rxBytes || sel['rx-byte']), mono: true },
                { label: 'TX total',   val: fmtBytes(sel.txBytes || sel['tx-byte']), mono: true },
              ].map(row => (
                <div key={row.label} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '7px 0', borderBottom: `1px solid ${A.border}` }}>
                  <span style={{ fontSize: 11, color: A.textFaint }}>{row.label}</span>
                  <span style={{ fontSize: 11, color: A.text, fontFamily: row.mono ? A.mono : A.ui }}>{row.val}</span>
                </div>
              ))}
              {toggleMsg && <div style={{ fontSize: 11, color: toggleMsg.includes('✓') ? A.good : toggleMsg.includes('✗') ? A.bad : A.textDim, marginTop: 10 }}>{toggleMsg}</div>}
              <div style={{ display: 'flex', gap: 6, marginTop: 10 }}>
                <ABtn kind="secondary" onClick={handleToggle}>{sel && (sel.status === 'up' && !sel.disabled) ? 'Disable' : 'Enable'}</ABtn>
              </div>
            </ACard>

            {/* Rename panel */}
            <ACard pad={14}>
              <div style={{ fontSize: 11, fontWeight: 600, color: A.text, marginBottom: 10 }}>Rename interface</div>
              <div style={{ display: 'flex', gap: 6 }}>
                <input value={renameVal} onChange={e => setRenameVal(e.target.value)}
                  placeholder={sel?.name || 'new-name'}
                  style={{ flex: 1, padding: '6px 10px', background: 'rgba(0,0,0,0.2)', border: `1px solid ${A.border}`, borderRadius: 7, color: A.text, fontFamily: A.mono, fontSize: 12, outline: 'none' }} />
                <ABtn kind="primary" onClick={async () => {
                  if (!renameVal.trim()) return;
                  setRenameMsg('Renaming…');
                  try {
                    const r = await API.renameInterface(sessionId, sel.name, renameVal.trim());
                    setRenameMsg('✓ ' + r.message);
                    setRenameVal('');
                    await reload();
                    setSelected(null);
                  } catch (e) { setRenameMsg('✗ ' + e.message); }
                  setTimeout(() => setRenameMsg(''), 3000);
                }}>Rename</ABtn>
              </div>
              {renameMsg && <div style={{ fontSize: 11, marginTop: 6, color: renameMsg.includes('✓') ? A.good : A.bad }}>{renameMsg}</div>}
            </ACard>

            {/* Reset MAC panel */}
            {sel && (sel.type === 'ether' || (sel.macAddress && sel.macAddress !== '')) && (
              <ACard pad={14}>
                <div style={{ fontSize: 11, fontWeight: 600, color: A.text, marginBottom: 6 }}>MAC address</div>
                <div style={{ fontSize: 10, color: A.textFaint, fontFamily: A.mono, marginBottom: 10 }}>{sel.macAddress || '—'}</div>
                {macMsg && <div style={{ fontSize: 11, marginBottom: 6, color: macMsg.includes('✓') ? A.good : A.bad }}>{macMsg}</div>}
                <ABtn kind="secondary" onClick={async () => {
                  setMacMsg('Resetting…');
                  try {
                    const r = await API.resetInterfaceMac(sessionId, sel.name);
                    setMacMsg('✓ ' + r.message);
                    await reload();
                  } catch (e) { setMacMsg('✗ ' + e.message); }
                  setTimeout(() => setMacMsg(''), 4000);
                }}>Reset to factory MAC</ABtn>
              </ACard>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

const WANScreen = ({ sessionId }) => {
  const [wans, setWans]           = React.useState([]);
  const [wanConfig, setWanConfig] = React.useState({});
  const [loading, setLoading]     = React.useState(true);
  const [lbMethod, setLbMethod]   = React.useState('pcc');
  const [pinBanking, setPinBanking]   = React.useState(true);
  const [healthCheck, setHealthCheck] = React.useState(true);
  const [connMark, setConnMark]       = React.useState(true);
  const [removeOnUninstall, setRemoveOnUninstall] = React.useState(true);
  const [applying, setApplying]   = React.useState(false);
  const [applyMsg, setApplyMsg]   = React.useState('');
  const alertCtx = React.useContext(AlertCtx);
  const wanAlertState = React.useRef(new Map());

  const checkWanStatus = (data) => {
    if (!data) return;
    data.forEach(wan => {
      const key = `wan-${wan.name}`;
      const prev = wanAlertState.current.get(key) || 'up';
      if (wan.status === 'down' && prev === 'up') alertCtx.addAlert('wan', 0, 0, 'critical');
      wanAlertState.current.set(key, wan.status);
    });
  };

  React.useEffect(() => {
    if (!sessionId) return;
    const handleData = (data) => {
      setWans(data);
      setLoading(false);
      checkWanStatus(data);
      // Only update wanConfig when new interfaces appear — avoids re-render every poll tick
      setWanConfig(prev => {
        const hasNew = data.some(wan => !prev[wan.name]);
        if (!hasNew) return prev;
        const next = { ...prev };
        data.forEach(wan => {
          if (!next[wan.name]) {
            next[wan.name] = { selected: wan.status === 'up', weight: wan.weight || 1 };
          }
        });
        return next;
      });
    };
    let unsubscribe, interval;
    // Always do an immediate HTTP fetch on mount for fast first paint
    const poll = async () => {
      try { const d = await API.getWanStatus(sessionId); handleData(d); } catch { setLoading(false); }
    };
    poll();
    // Also subscribe to WebSocket pushes for live updates
    API.subscribe('/api/wan-status', handleData);
    unsubscribe = () => API.unsubscribe('/api/wan-status', handleData);
    interval = setInterval(poll, 8000);
    return () => { if (unsubscribe) unsubscribe(); if (interval) clearInterval(interval); };
  }, [sessionId]);

  const selectedWans = wans.filter(w => wanConfig[w.name]?.selected);
  const activeWans   = wans.filter(w => w.status === 'up');

  const routerOsPreview = () => {
    const wList = selectedWans.length >= 2 ? selectedWans : activeWans.slice(0, 3);
    if (wList.length < 2) return '# add at least 2 active WAN interfaces';

    // gateway is what the server detected (default route, DHCP, or PPPoE).
    // Show a clear placeholder if missing so the user knows apply will fail.
    const gwOf = w => w.gateway || '<no-gateway>';

    if (lbMethod === 'pcc' || lbMethod === 'nth') {
      const S = wList.reduce((s, w) => s + (wanConfig[w.name]?.weight || 1), 0);
      let lines = [
        '# Remove previous netforge-lb rules',
        '/ip firewall mangle remove [find comment="netforge-lb"]',
        '/ip route remove [find comment="netforge-lb"]',
      ];
      let bucket = 0;
      wList.forEach(wan => {
        const w = wanConfig[wan.name]?.weight || 1;
        for (let k = 0; k < w; k++) {
          if (lbMethod === 'nth') {
            lines.push(`/ip firewall mangle add chain=prerouting connection-state=new nth=${S},${bucket + 1} action=mark-connection new-connection-mark=${wan.name}-conn comment="netforge-lb"`);
          } else {
            lines.push(`/ip firewall mangle add chain=prerouting connection-state=new per-connection-classifier=both-addresses:${S}/${bucket} action=mark-connection new-connection-mark=${wan.name}-conn comment="netforge-lb"`);
          }
          bucket++;
        }
        lines.push(`/ip firewall mangle add chain=prerouting connection-mark=${wan.name}-conn action=mark-routing new-routing-mark=to-${wan.name} comment="netforge-lb"`);
        lines.push(`/ip route add gateway=${gwOf(wan)} routing-mark=to-${wan.name} comment="netforge-lb"`);
      });
      return lines.join('\n');
    }

    // failover
    let lines = ['/ip route remove [find comment="netforge-lb"]'];
    wList.forEach((wan, idx) => {
      lines.push(`/ip route add dst-address=0.0.0.0/0 gateway=${gwOf(wan)} distance=${idx+1} check-gateway=ping comment="netforge-lb"`);
    });
    if (healthCheck) {
      lines.push('/tool/netwatch add host=1.1.1.1 interval=5s comment="netforge-lb"');
    }
    return lines.join('\n');
  };

  const handleApply = async () => {
    setApplying(true); setApplyMsg('Applying rules…');
    try {
      const wansWithWeights = selectedWans.map(w => ({ ...w, weight: wanConfig[w.name]?.weight || 1 }));
      const result = await API.applyLoadBalance(sessionId, wansWithWeights, lbMethod, healthCheck, pinBanking, connMark, removeOnUninstall);
      setApplyMsg('✓ ' + result.message);
    } catch (e) { setApplyMsg('✗ ' + e.message); }
    setApplying(false);
    setTimeout(() => setApplyMsg(''), 5000);
  };

  const toggleWanSelected = (name) => {
    setWanConfig(prev => ({ ...prev, [name]: { ...prev[name], selected: !prev[name]?.selected } }));
  };

  const setWanWeight = (name, weight) => {
    setWanConfig(prev => ({ ...prev, [name]: { ...prev[name], weight } }));
  };

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  // stacked bar segments for selected wans
  const barColors = [A.accent, A.good, A.warn];
  const totalWeight = selectedWans.reduce((s, w) => s + (wanConfig[w.name]?.weight || 1), 0);
  const barSegments = selectedWans.map((wan, i) => {
    const weight = wanConfig[wan.name]?.weight || 1;
    const util   = wan.util || 0;
    const score  = weight * util;
    return { wan, score, color: barColors[i % barColors.length] };
  });
  const totalScore = barSegments.reduce((s, seg) => s + seg.score, 0) || 1;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>WAN · Load Balance</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>combine multiple ISPs · pcc · nth · failover</div>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          {selectedWans.length < 2 && <span style={{ fontSize: 11, color: A.warn, fontFamily: A.mono }}>Pick ≥ 2 WANs</span>}
          {applyMsg && <span style={{ fontSize: 11, color: applyMsg.includes('✓') ? A.good : A.textDim, fontFamily: A.mono }}>{applyMsg}</span>}
          <ABtn kind="primary" onClick={handleApply} disabled={applying || selectedWans.length < 2}>{applying ? 'Applying…' : 'Apply'}</ABtn>
        </div>
      </div>

      <div style={{ flex: 1, overflow: 'auto', padding: '0 20px 20px', display: 'flex', gap: 16 }}>
        {/* left column: WAN list + method + advanced */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 14 }}>

          {/* Step 1: WAN interfaces */}
          <ACard pad={0}>
            <div style={{ padding: '11px 16px 9px', borderBottom: `1px solid ${A.border}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div>
                <span style={{ fontSize: 12, fontWeight: 600, color: A.text }}>1 · WAN Interfaces</span>
                <span style={{ fontSize: 10, color: A.textFaint, marginLeft: 10 }}>pick 2 or more · drag to set order</span>
              </div>
              <APill tone="dim" mono>{activeWans.length} active</APill>
            </div>
            {wans.length === 0 ? (
              <div style={{ padding: 24, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No WAN interfaces detected</div>
            ) : wans.map((wan, i) => {
              const up       = wan.status === 'up';
              const cfg      = wanConfig[wan.name] || { selected: false, weight: 1 };
              const selected = cfg.selected;
              return (
                <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 16px', borderBottom: i < wans.length - 1 ? `1px solid ${A.border}` : 'none', background: selected ? 'rgba(59,130,246,0.04)' : up ? 'transparent' : 'rgba(239,68,68,0.03)', cursor: 'pointer' }}
                  onClick={() => toggleWanSelected(wan.name)}>
                  {/* drag handle */}
                  <span style={{ fontSize: 14, color: A.textFaint, flexShrink: 0, cursor: 'grab', userSelect: 'none' }}>≡</span>
                  {/* checkbox */}
                  <div style={{ width: 16, height: 16, borderRadius: 3, border: `2px solid ${selected ? A.accent : 'rgba(255,255,255,0.25)'}`, background: selected ? A.accent : 'transparent', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.15s' }}>
                    {selected && <div style={{ width: 8, height: 8, borderRadius: 1, background: '#fff' }} />}
                  </div>
                  {/* status dot */}
                  <div style={{ width: 9, height: 9, borderRadius: 999, background: up ? A.good : 'rgba(255,255,255,0.15)', boxShadow: up ? `0 0 6px ${A.good}` : 'none', flexShrink: 0 }} />
                  <div style={{ flex: 1 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <span style={{ fontSize: 12, fontWeight: 600, color: A.text, fontFamily: A.mono }}>{wan.name}</span>
                      {wan.comment && <span style={{ fontSize: 11, color: A.textDim }}>· {wan.comment}</span>}
                      <APill tone={up ? 'good' : 'bad'}>{wan.status || 'down'}</APill>
                    </div>
                    <div style={{ fontSize: 10, color: A.textFaint, marginTop: 3, fontFamily: A.mono }}>
                      ip {wan.ip || '—'} · gw {wan.gateway || <span style={{ color: A.warn }}>none</span>}{wan.util ? ` · ${wan.util}% used` : ''}{wan.latency ? ` · ${wan.latency}ms` : ''}
                    </div>
                  </div>
                  {/* weight chips — only shown when not failover */}
                  {lbMethod !== 'failover' && (
                    <div style={{ display: 'flex', gap: 4 }} onClick={e => e.stopPropagation()}>
                      {[1,2,3].map(w => (
                        <button key={w} onClick={() => setWanWeight(wan.name, w)} style={{ width: 26, height: 22, borderRadius: 5, border: `1px solid ${cfg.weight === w ? A.accent : A.border}`, background: cfg.weight === w ? A.accentSoft : 'transparent', color: cfg.weight === w ? '#BFDBFE' : A.textFaint, fontSize: 11, cursor: 'pointer', fontFamily: A.mono }}>{w}x</button>
                      ))}
                    </div>
                  )}
                  {/* usage mini bar */}
                  <div style={{ width: 60 }}>
                    <div style={{ height: 4, background: 'rgba(255,255,255,0.08)', borderRadius: 2, overflow: 'hidden' }}>
                      <div style={{ width: `${wan.util || 0}%`, height: '100%', background: up ? A.accent : 'rgba(255,255,255,0.1)' }} />
                    </div>
                    <div style={{ fontSize: 9, color: A.textFaint, marginTop: 3, textAlign: 'right', fontFamily: A.mono }}>{wan.util || 0}%</div>
                  </div>
                </div>
              );
            })}
          </ACard>

          {/* Step 2: Distribution method — horizontal 3-column cards */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>2 · Distribution method</div>
            <div style={{ display: 'flex', gap: 8 }}>
              {LB_METHODS.map(m => (
                <div key={m.id} onClick={() => setLbMethod(m.id)} style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 6, padding: '10px 12px', borderRadius: 9, border: `1px solid ${lbMethod === m.id ? A.accent : A.border}`, background: lbMethod === m.id ? A.accentSoft : A.surface, cursor: 'pointer', transition: 'all 0.15s' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <div style={{ width: 15, height: 15, borderRadius: 999, border: `2px solid ${lbMethod === m.id ? A.accent : 'rgba(255,255,255,0.25)'}`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                      {lbMethod === m.id && <div style={{ width: 7, height: 7, borderRadius: 999, background: A.accent }} />}
                    </div>
                    <span style={{ fontSize: 12, fontWeight: 600, color: A.text }}>{m.label}</span>
                  </div>
                  <APill tone="dim">{m.sub}</APill>
                  <div style={{ fontSize: 10, color: A.textFaint, lineHeight: 1.4 }}>{m.desc}</div>
                </div>
              ))}
            </div>
          </ACard>

          {/* Step 3: Advanced options */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>3 · Advanced options <span style={{ fontSize: 10, color: A.textFaint, fontWeight: 400 }}>safe defaults · tune if needed</span></div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <AToggleRow label="Pin banking & UPI to WAN1" sub="address-list: sticky-domains" on={pinBanking} onChange={setPinBanking} />
              <AToggleRow label="Health-check via netwatch" sub="ping 1.1.1.1 every 5s" on={healthCheck} onChange={setHealthCheck} />
              <AToggleRow label="Mark connection (mangle)" sub="conn-mark wan1-conn / wan2-conn" on={connMark} onChange={setConnMark} />
              <AToggleRow label="Remove rules on uninstall" sub="adds comment=netforge-lb" on={removeOnUninstall} onChange={setRemoveOnUninstall} />
            </div>
          </ACard>
        </div>

        {/* right column: live distribution + command preview */}
        <div style={{ width: 320, flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 14 }}>
          {/* live distribution */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>Live distribution</div>
            {selectedWans.length === 0 ? (
              <div style={{ fontSize: 11, color: A.textFaint }}>No WANs selected</div>
            ) : (
              <>
                {/* stacked bar */}
                <div style={{ height: 10, borderRadius: 5, overflow: 'hidden', display: 'flex', marginBottom: 12 }}>
                  {barSegments.map((seg, i) => (
                    <div key={seg.wan.name} style={{ flex: seg.score / totalScore, background: seg.color, transition: 'flex 0.5s' }} title={`${seg.wan.name}: w${wanConfig[seg.wan.name]?.weight || 1} × ${seg.wan.util || 0}%`} />
                  ))}
                </div>
                {/* legend */}
                {selectedWans.map((wan, i) => {
                  const pct = totalWeight > 0 ? Math.round(((wanConfig[wan.name]?.weight || 1) / totalWeight) * 100) : Math.round(100 / selectedWans.length);
                  const col = barColors[i % barColors.length];
                  return (
                    <div key={wan.name} style={{ marginBottom: 8 }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
                          <div style={{ width: 8, height: 8, borderRadius: 2, background: col }} />
                          <span style={{ fontSize: 11, fontFamily: A.mono, color: A.text }}>{wan.name}</span>
                          {wan.comment && <span style={{ fontSize: 10, color: A.textFaint }}>· {wan.comment}</span>}
                        </div>
                        <span style={{ fontSize: 11, fontFamily: A.mono, color: A.textDim }}>{pct}%</span>
                      </div>
                    </div>
                  );
                })}
              </>
            )}
            <div style={{ marginTop: 4, paddingTop: 10, borderTop: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint }}>
              Will run on Apply: Mangle + Routing · {lbMethod} · {selectedWans.length} wans
            </div>
          </ACard>

          {/* RouterOS preview */}
          <ACard pad={0} style={{ flex: 1 }}>
            <div style={{ padding: '10px 14px', borderBottom: `1px solid ${A.border}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontSize: 11, fontWeight: 600, color: A.text }}>RouterOS preview</span>
              <button onClick={() => navigator.clipboard?.writeText(routerOsPreview())} style={{ fontSize: 10, color: A.textDim, background: 'transparent', border: 'none', cursor: 'pointer', fontFamily: A.ui }}>Copy</button>
            </div>
            <div style={{ padding: 14, fontFamily: A.mono, fontSize: 10, color: '#86EFAC', lineHeight: 1.7, whiteSpace: 'pre-wrap', background: 'rgba(0,0,0,0.2)', borderRadius: '0 0 12px 12px', minHeight: 160 }}>
              {routerOsPreview()}
            </div>
          </ACard>

          {/* safe-mode note */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <APill tone="warn">safe-mode 60s</APill>
            <span style={{ fontSize: 10, color: A.textFaint }}>changes auto-revert if connection drops</span>
          </div>
        </div>
      </div>
    </div>
  );
};
