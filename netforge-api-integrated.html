const APPLY_OPTS = [
  { id: 'all',    label: 'All LAN clients',    sub: 'Applies to all DHCP leases' },
  { id: 'group',  label: 'Specific group',     sub: 'Select address list' },
  { id: 'time',   label: 'By time schedule',   sub: 'Active hours only' },
];

const FirewallScreen = ({ sessionId }) => {
  const [fwTab, setFwTab]         = React.useState('block');
  const [firewall, setFirewall]   = React.useState(null);
  const [blocked, setBlocked]     = React.useState(() => {
    const s = {};
    BLOCK_SERVICES.forEach(svc => s[svc.id] = false);
    return s;
  });
  const [blockMethods, setBlockMethods] = React.useState(() => {
    const m = {};
    BLOCK_SERVICES.forEach(svc => { m[svc.id] = svc.method || 'dns'; });
    return m;
  });
  const [toggling, setToggling]   = React.useState({}); // serviceId → true while API call in flight
  const [toggleMsg, setToggleMsg] = React.useState('');
  const [applyTo, setApplyTo]     = React.useState('all');
  const [customDomain, setCustomDomain] = React.useState('');
  const [ruleType, setRuleType]   = React.useState('DNS');
  const [testResult, setTestResult] = React.useState(null);
  const [addMsg, setAddMsg]       = React.useState('');
  const [loading, setLoading]     = React.useState(true);

  // Load firewall stats AND current blocked service status from the router
  const loadStatus = React.useCallback(async () => {
    const [fwRes, svcRes] = await Promise.allSettled([
      API.getFirewall(sessionId),
      API.getFirewallServiceStatus(sessionId),
    ]);
    if (fwRes.status === 'fulfilled') setFirewall(fwRes.value);
    if (svcRes.status === 'fulfilled' && Array.isArray(svcRes.value.blocked)) {
      setBlocked(prev => {
        const next = { ...prev };
        BLOCK_SERVICES.forEach(svc => { next[svc.id] = svcRes.value.blocked.includes(svc.id); });
        return next;
      });
      if (svcRes.value.methods) {
        setBlockMethods(prev => ({ ...prev, ...svcRes.value.methods }));
      }
    }
  }, [sessionId]);

  React.useEffect(() => {
    if (!sessionId) return;
    const init = async () => { setLoading(true); await loadStatus(); setLoading(false); };
    init();
    const iv = setInterval(loadStatus, 10000);
    return () => clearInterval(iv);
  }, [sessionId, loadStatus]);

  const toggleService = async (svc) => {
    if (toggling[svc.id]) return;
    const newState = !blocked[svc.id];
    const method = blockMethods[svc.id] || svc.method || 'dns';
    setBlocked(prev => ({ ...prev, [svc.id]: newState }));
    setToggling(prev => ({ ...prev, [svc.id]: true }));
    setToggleMsg('');
    try {
      await API.toggleFirewallService(sessionId, svc.id, newState, method, applyTo);
      setToggleMsg(`✓ ${svc.label} ${newState ? 'blocked' : 'unblocked'} via ${method}`);
      setTimeout(() => setToggleMsg(''), 4000);
    } catch (e) {
      setBlocked(prev => ({ ...prev, [svc.id]: !newState }));
      setToggleMsg(`✗ ${svc.label}: ${e.message}`);
      setTimeout(() => setToggleMsg(''), 8000);
    }
    setToggling(prev => ({ ...prev, [svc.id]: false }));
  };

  const routerOsPreview = () => {
    if (!customDomain.trim()) return '# enter a domain above';
    const d = customDomain.trim().toLowerCase();
    if (ruleType === 'DNS')  return `/ip dns static add name="${d}" address=0.0.0.0`;
    if (ruleType === 'L7')   return `/ip firewall layer7-protocol add name="block-${d}" regexp=".*${d}.*"\n/ip firewall filter add chain=forward layer7-protocol="block-${d}" action=drop`;
    return `/ip firewall address-list add list="blocklist" address=${d}\n/ip firewall filter add chain=forward dst-address-list="blocklist" action=drop`;
  };

  const handleTest = () => setTestResult({ domain: customDomain, reachable: Math.random() > 0.4 });
  const handleAdd  = async () => {
    if (!customDomain.trim()) return;
    setAddMsg('Adding rule…');
    try {
      const result = await API.blockDomain(sessionId, customDomain.trim(), ruleType);
      setAddMsg('✓ ' + result.message);
      setCustomDomain(''); setTestResult(null);
    } catch (e) { setAddMsg('✗ ' + e.message); }
    setTimeout(() => setAddMsg(''), 3000);
  };

  const activeCount  = firewall?.activeConnections ?? '—';
  const droppedCount = firewall?.droppedPackets    ?? '—';
  const blockedCount = Object.values(blocked).filter(Boolean).length;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Firewall</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>Content filtering · Connections · Address Lists · Geo-block</div>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <APill tone="good" mono>{activeCount} active</APill>
          <APill tone={droppedCount > 0 ? 'warn' : 'dim'} mono>{droppedCount} dropped</APill>
          {blockedCount > 0 && <APill tone="bad">{blockedCount} services blocked</APill>}
        </div>
      </div>

      {/* tab bar */}
      <div style={{ display: 'flex', gap: 2, padding: '10px 20px 0', flexShrink: 0, borderBottom: `1px solid ${A.border}` }}>
        {[
          { id: 'block',       label: 'Block Services' },
          { id: 'connections', label: 'Connections' },
          { id: 'addrlist',    label: 'Address Lists' },
          { id: 'geo',         label: 'Geo-block' },
        ].map(tab => (
          <button key={tab.id} onClick={() => setFwTab(tab.id)} style={{
            padding: '7px 16px', borderRadius: '8px 8px 0 0', fontSize: 12, fontWeight: 500,
            border: `1px solid ${fwTab === tab.id ? A.border : 'transparent'}`,
            borderBottom: fwTab === tab.id ? `1px solid ${A.bg}` : 'none',
            background: fwTab === tab.id ? A.bg : 'transparent',
            color: fwTab === tab.id ? A.text : A.textFaint,
            cursor: 'pointer', marginBottom: fwTab === tab.id ? -1 : 0,
          }}>{tab.label}</button>
        ))}
      </div>

      {/* block services body */}
      {fwTab === 'block' && <div style={{ flex: 1, overflow: 'auto', display: 'grid', gridTemplateColumns: '1fr 340px', gap: 16, padding: 20, alignContent: 'start' }}>

        {/* left — service toggles + apply-to */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          {/* service list */}
          <ACard pad={0}>
            <div style={{ padding: '12px 16px 10px', borderBottom: `1px solid ${A.border}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span style={{ fontSize: 12, fontWeight: 600, color: A.text }}>Service Filters</span>
              <span style={{ fontSize: 11, color: toggleMsg ? (toggleMsg.startsWith('✓') ? A.good : A.bad) : A.textFaint, fontFamily: A.mono, transition: 'color 0.2s' }}>
                {toggleMsg || 'click toggle to block on router'}
              </span>
            </div>
            {BLOCK_SERVICES.map((svc, idx) => {
              const isBlocked  = blocked[svc.id];
              const isToggling = toggling[svc.id];
              return (
                <div key={svc.id} onClick={() => !isToggling && toggleService(svc)} style={{
                  display: 'flex', alignItems: 'center', gap: 12, padding: '11px 16px',
                  borderBottom: idx < BLOCK_SERVICES.length - 1 ? `1px solid ${A.border}` : 'none',
                  cursor: isToggling ? 'wait' : 'pointer',
                  background: isBlocked ? 'rgba(239,68,68,0.04)' : 'transparent',
                  opacity: isToggling ? 0.7 : 1,
                  transition: 'background 0.15s, opacity 0.15s',
                }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 2 }}>
                      <span style={{ fontSize: 13, fontWeight: 500, color: A.text }}>{svc.label}</span>
                      <APill tone="dim">{svc.category}</APill>
                      {isBlocked && <APill tone="bad">Blocked</APill>}
                      {isToggling && <APill tone="dim">applying…</APill>}
                    </div>
                    <div style={{ fontSize: 10, color: A.textFaint, fontFamily: A.mono, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                      {svc.domains.filter(d => !d.startsWith('+')).slice(0, 3).join(' · ')}{svc.domains.length > 3 ? ` + ${svc.domains.length - 3} more` : ''}
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 3, flexShrink: 0 }} onClick={e => e.stopPropagation()}>
                    {['comprehensive', 'dns', 'mangle', 'layer7'].map(m => (
                      <button key={m} onClick={() => setBlockMethods(prev => ({ ...prev, [svc.id]: m }))} style={{
                        padding: '3px 7px', borderRadius: 5, fontSize: 10, fontFamily: A.mono,
                        border: `1px solid ${blockMethods[svc.id] === m ? A.accent : A.border}`,
                        background: blockMethods[svc.id] === m ? A.accentSoft : 'transparent',
                        color: blockMethods[svc.id] === m ? '#BFDBFE' : A.textFaint,
                        cursor: 'pointer', transition: 'all 0.15s',
                      }}>{m === 'comprehensive' ? 'all' : m}</button>
                    ))}
                  </div>
                  <div style={{ width: 36, height: 20, borderRadius: 999, background: isBlocked ? A.bad : 'rgba(255,255,255,0.1)', position: 'relative', flexShrink: 0, transition: 'background 0.2s' }}>
                    <div style={{ width: 16, height: 16, borderRadius: 999, background: '#fff', position: 'absolute', top: 2, left: isBlocked ? 18 : 2, transition: 'left 0.2s' }} />
                  </div>
                </div>
              );
            })}
          </ACard>

          {/* apply-to section */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>Apply rules to</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {APPLY_OPTS.map(opt => (
                <div key={opt.id} onClick={() => setApplyTo(opt.id)} style={{
                  display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px',
                  background: applyTo === opt.id ? A.accentSoft : A.surface,
                  border: `1px solid ${applyTo === opt.id ? A.accent : A.border}`,
                  borderRadius: 8, cursor: 'pointer', transition: 'all 0.15s',
                }}>
                  <div style={{ width: 14, height: 14, borderRadius: 999, border: `2px solid ${applyTo === opt.id ? A.accent : 'rgba(255,255,255,0.25)'}`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                    {applyTo === opt.id && <div style={{ width: 6, height: 6, borderRadius: 999, background: A.accent }} />}
                  </div>
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{opt.label}</div>
                    <div style={{ fontSize: 10, color: A.textFaint }}>{opt.sub}</div>
                  </div>
                </div>
              ))}
            </div>
          </ACard>
        </div>

        {/* right — custom rule panel */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 14 }}>Custom Block Rule</div>

            <ALabeledField label="Domain / IP" sub="e.g. example.com" value={customDomain} onChange={e => { setCustomDomain(e.target.value); setTestResult(null); }} mono />

            <div style={{ marginTop: 12, marginBottom: 4 }}>
              <div style={{ fontSize: 11, fontWeight: 500, color: A.text, marginBottom: 8 }}>Method</div>
              <div style={{ display: 'flex', gap: 6 }}>
                {['DNS','L7','IP-list'].map(t => (
                  <button key={t} onClick={() => setRuleType(t)} style={{
                    flex: 1, padding: '6px 0', borderRadius: 7, border: `1px solid ${ruleType === t ? A.accent : A.border}`,
                    background: ruleType === t ? A.accentSoft : 'transparent', color: ruleType === t ? '#BFDBFE' : A.textDim,
                    fontFamily: A.mono, fontSize: 11, cursor: 'pointer', transition: 'all 0.15s',
                  }}>{t}</button>
                ))}
              </div>
            </div>

            <div style={{ marginTop: 14, marginBottom: 14 }}>
              <div style={{ fontSize: 10, color: A.textFaint, marginBottom: 6 }}>RouterOS preview</div>
              <div style={{ background: 'rgba(0,0,0,0.25)', borderRadius: 8, padding: '10px 12px', fontFamily: A.mono, fontSize: 10, color: '#86EFAC', whiteSpace: 'pre-wrap', lineHeight: 1.6, border: `1px solid ${A.border}` }}>
                {routerOsPreview()}
              </div>
            </div>

            {testResult && (
              <div style={{ marginBottom: 12, padding: '8px 12px', borderRadius: 8, background: testResult.reachable ? 'rgba(239,68,68,0.1)' : 'rgba(34,197,94,0.1)', border: `1px solid ${testResult.reachable ? A.bad : A.good}`, fontSize: 11, color: testResult.reachable ? '#FCA5A5' : '#86EFAC', fontFamily: A.mono }}>
                {testResult.domain}: {testResult.reachable ? '⚠ Still reachable — rule not yet applied' : '✓ Domain blocked successfully'}
              </div>
            )}

            {addMsg && <div style={{ marginBottom: 10, fontSize: 11, color: addMsg.includes('✓') ? A.good : A.textDim }}>{addMsg}</div>}

            <div style={{ display: 'flex', gap: 8 }}>
              <ABtn kind="secondary" onClick={handleTest} disabled={!customDomain.trim()}>Test</ABtn>
              <ABtn kind="primary" onClick={handleAdd} disabled={!customDomain.trim()} full>+ Add block</ABtn>
            </div>
          </ACard>

          {/* stats mini */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>Live Stats</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {[
                { label: 'Active connections', val: activeCount, tone: 'accent' },
                { label: 'Dropped packets',    val: droppedCount, tone: droppedCount > 100 ? 'warn' : 'dim' },
                { label: 'Services blocked',   val: blockedCount, tone: blockedCount > 0 ? 'bad' : 'dim' },
              ].map(row => (
                <div key={row.label} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span style={{ fontSize: 11, color: A.textDim }}>{row.label}</span>
                  <APill tone={row.tone} mono>{row.val}</APill>
                </div>
              ))}
            </div>
          </ACard>
        </div>
      </div>}

      {fwTab === 'connections' && <div style={{ flex: 1, overflow: 'auto', padding: 20 }}><ConnectionsTab sessionId={sessionId} /></div>}
      {fwTab === 'addrlist'    && <div style={{ flex: 1, overflow: 'auto', padding: 20 }}><AddressListsTab sessionId={sessionId} /></div>}
      {fwTab === 'geo'         && <div style={{ flex: 1, overflow: 'auto', padding: 20 }}><GeoBlockTab sessionId={sessionId} /></div>}
    </div>
  );
};

const BW_DOWN_PRESETS = ['5M','10M','30M','100M'];
const BW_UP_PRESETS   = ['2M','5M','10M','20M'];
const BW_PRIO_OPTS    = ['low','normal','high'];

const BandwidthScreen = ({ sessionId }) => {
  const [queues, setQueues]     = React.useState([]);
  const [loading, setLoading]   = React.useState(true);
  const [showPanel, setShowPanel] = React.useState(false);
  const [qName, setQName]       = React.useState('');
  const [qTarget, setQTarget]   = React.useState('');
  const [qDown, setQDown]       = React.useState('10M');
  const [qUp, setQUp]           = React.useState('5M');
  const [qPrio, setQPrio]       = React.useState('normal');
  const [qBurst, setQBurst]     = React.useState(false);
  const [qPcq, setQPcq]         = React.useState(false);
  const [addMsg, setAddMsg]     = React.useState('');

  React.useEffect(() => {
    if (!sessionId) return;
    const fetch = async () => {
      setLoading(true);
      try { const d = await API.getBandwidth(sessionId); setQueues(Array.isArray(d) ? d : []); } catch {}
      setLoading(false);
    };
    fetch();
    const iv = setInterval(fetch, 5000);
    return () => clearInterval(iv);
  }, [sessionId]);

  const handleAdd = async () => {
    if (!qName.trim() || !qTarget.trim()) { setAddMsg('Name and target required'); return; }
    setAddMsg('Adding queue…');
    try {
      const result = await API.addBandwidthQueue(sessionId, qName.trim(), qTarget.trim(), qDown, qUp, qPrio, qBurst, qPcq);
      setAddMsg('✓ ' + result.message);
      setQName(''); setQTarget(''); setShowPanel(false);
      // Refresh queue list
      try { const d = await API.getBandwidth(sessionId); setQueues(Array.isArray(d) ? d : []); } catch {}
    } catch (e) { setAddMsg('✗ ' + e.message); }
    setTimeout(() => setAddMsg(''), 3000);
  };

  const utilColor = (u) => u >= 90 ? A.bad : u >= 70 ? A.warn : A.accent;

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Bandwidth · Simple Queue</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>{queues.length} queues · /queue simple</div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <ABtn kind="secondary">Speed test</ABtn>
          <ABtn kind="primary" onClick={() => { setShowPanel(true); setAddMsg(''); }}>+ New queue</ABtn>
        </div>
      </div>

      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', gap: 0, padding: '0 20px 20px' }}>
        {/* table */}
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '150px 140px 80px 80px 80px 1fr 70px 60px', padding: '9px 16px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', flexShrink: 0 }}>
            <span>Name</span><span>Target</span><span>Down</span><span>Up</span><span>Priority</span><span>RX total</span><span>TX total</span><span>Action</span>
          </div>
          <div style={{ flex: 1, overflow: 'auto' }}>
            {queues.length === 0 ? (
              <div style={{ padding: 32, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No queues configured</div>
            ) : queues.map((q, i) => {
              const fmtB = (b) => { if (!b) return '—'; if (b>=1e9) return (b/1e9).toFixed(1)+'G'; if (b>=1e6) return (b/1e6).toFixed(0)+'M'; return (b/1e3).toFixed(0)+'K'; };
              return (
                <div key={i} style={{
                  display: 'grid', gridTemplateColumns: '150px 140px 80px 80px 80px 1fr 70px 60px',
                  padding: '11px 16px', borderBottom: i < queues.length - 1 ? `1px solid ${A.border}` : 'none',
                  background: i % 2 === 1 ? 'rgba(255,255,255,0.015)' : 'transparent', alignItems: 'center',
                }}>
                  <span style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{q.name}</span>
                  <span style={{ fontSize: 11, fontFamily: A.mono, color: A.textDim }}>{q.target || '—'}</span>
                  <span style={{ fontSize: 11, fontFamily: A.mono, color: A.good }}>↓{q.down || '—'}</span>
                  <span style={{ fontSize: 11, fontFamily: A.mono, color: A.accent }}>↑{q.up || '—'}</span>
                  <APill tone={q.priority === 'high' ? 'accent' : q.priority === 'low' ? 'dim' : 'good'}>{q.priority || 'normal'}</APill>
                  <span style={{ fontSize: 11, fontFamily: A.mono, color: A.good }}>{fmtB(q.rxBytes)}</span>
                  <span style={{ fontSize: 11, fontFamily: A.mono, color: A.accent }}>{fmtB(q.txBytes)}</span>
                  <button onClick={async () => {
                    if (!window.confirm(`Remove queue "${q.name}"?`)) return;
                    try { await API.removeBandwidthQueue(sessionId, q.name); const d = await API.getBandwidth(sessionId); setQueues(Array.isArray(d) ? d : []); } catch (e) { alert(e.message); }
                  }} style={{ background: 'rgba(239,68,68,0.15)', color: '#FCA5A5', border: 'none', borderRadius: 6, padding: '4px 8px', cursor: 'pointer', fontSize: 11 }}>Remove</button>
                </div>
              );
            })}
          </div>
        </div>

        {/* new queue panel */}
        {showPanel && (
          <div style={{ width: 272, flexShrink: 0, marginLeft: 12, overflow: 'auto' }}>
            <ACard pad={16}>
              <div style={{ fontSize: 13, fontWeight: 600, color: A.text, marginBottom: 14 }}>New queue</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                <ALabeledField label="Name" sub="any label" value={qName} onChange={e => setQName(e.target.value)} />
                <ALabeledField label="Target" sub="ip · cidr · address-list" value={qTarget} onChange={e => setQTarget(e.target.value)} mono />

                <div>
                  <div style={{ fontSize: 11, fontWeight: 500, color: A.text, marginBottom: 7 }}>Download <span style={{ color: A.textFaint, fontFamily: A.mono }}>max-limit/rx</span></div>
                  <div style={{ display: 'flex', gap: 5 }}>
                    {BW_DOWN_PRESETS.map(p => (
                      <button key={p} onClick={() => setQDown(p)} style={{ flex: 1, padding: '6px 0', borderRadius: 7, border: `1px solid ${qDown === p ? A.accent : A.border}`, background: qDown === p ? A.accentSoft : 'transparent', color: qDown === p ? '#BFDBFE' : A.textDim, fontFamily: A.mono, fontSize: 11, cursor: 'pointer' }}>{p}</button>
                    ))}
                  </div>
                </div>

                <div>
                  <div style={{ fontSize: 11, fontWeight: 500, color: A.text, marginBottom: 7 }}>Upload <span style={{ color: A.textFaint, fontFamily: A.mono }}>max-limit/tx</span></div>
                  <div style={{ display: 'flex', gap: 5 }}>
                    {BW_UP_PRESETS.map(p => (
                      <button key={p} onClick={() => setQUp(p)} style={{ flex: 1, padding: '6px 0', borderRadius: 7, border: `1px solid ${qUp === p ? A.accent : A.border}`, background: qUp === p ? A.accentSoft : 'transparent', color: qUp === p ? '#BFDBFE' : A.textDim, fontFamily: A.mono, fontSize: 11, cursor: 'pointer' }}>{p}</button>
                    ))}
                  </div>
                </div>

                <div>
                  <div style={{ fontSize: 11, fontWeight: 500, color: A.text, marginBottom: 7 }}>Priority</div>
                  <div style={{ display: 'flex', gap: 5 }}>
                    {BW_PRIO_OPTS.map(p => (
                      <button key={p} onClick={() => setQPrio(p)} style={{ flex: 1, padding: '6px 0', borderRadius: 7, border: `1px solid ${qPrio === p ? A.accent : A.border}`, background: qPrio === p ? A.accentSoft : 'transparent', color: qPrio === p ? '#BFDBFE' : A.textDim, fontFamily: A.ui, fontSize: 11, cursor: 'pointer' }}>{p}</button>
                    ))}
                  </div>
                </div>

                <AToggleRow label="Burst" sub="2× for 10s · burst-limit · burst-time" on={qBurst} onChange={setQBurst} />
                <AToggleRow label="Per-client equal share (PCQ)" sub="auto-divide between active devices" on={qPcq} onChange={setQPcq} />

                {addMsg && <div style={{ fontSize: 11, color: addMsg.includes('✓') ? A.good : A.bad }}>{addMsg}</div>}

                <div style={{ display: 'flex', gap: 8 }}>
                  <ABtn kind="secondary" onClick={() => setShowPanel(false)}>Cancel</ABtn>
                  <ABtn kind="primary" onClick={handleAdd} full>Add queue</ABtn>
                </div>
              </div>
            </ACard>
          </div>
        )}
      </div>
    </div>
  );
};

const ClientsScreen = ({ sessionId }) => {
  const [clients, setClients]   = React.useState([]);
  const [loading, setLoading]   = React.useState(true);
  const [search, setSearch]     = React.useState('');
  const [reserveRow, setReserveRow] = React.useState(null);
  const [reserveIp, setReserveIp]   = React.useState('');
  const [reserveMsg, setReserveMsg] = React.useState('');
  const [reserving, setReserving]   = React.useState(false);

  const load = React.useCallback(async () => {
    setLoading(true);
    try { const d = await API.getDhcpClients(sessionId); setClients(Array.isArray(d) ? d : []); } catch {}
    setLoading(false);
  }, [sessionId]);

  React.useEffect(() => {
    if (!sessionId) return;
    load();
    const iv = setInterval(load, 5000);
    return () => clearInterval(iv);
  }, [sessionId, load]);

  const fmtBytes = (b) => {
    if (!b) return '—';
    if (b >= 1e9) return (b/1e9).toFixed(1)+'G';
    if (b >= 1e6) return (b/1e6).toFixed(0)+'M';
    if (b >= 1e3) return (b/1e3).toFixed(0)+'K';
    return b+'B';
  };

  const filtered = clients.filter(c => {
    if (!search) return true;
    const q = search.toLowerCase();
    return (c.hostname||c.vendor||'').toLowerCase().includes(q) || (c.ip||'').includes(q) || (c.mac||'').toLowerCase().includes(q);
  });

  const staticCount  = clients.filter(c => c.lease === 'static' || c['address-lists']).length;
  const activeCount  = clients.filter(c => c.status !== 'waiting').length;

  const openReserve = (c) => { setReserveRow(c); setReserveIp(c.ip || ''); setReserveMsg(''); };

  const handleReserve = async () => {
    if (!reserveRow) return;
    setReserving(true); setReserveMsg('Reserving…');
    try {
      const result = await API.reserveDhcpIp(sessionId, reserveRow.mac, reserveIp || undefined);
      setReserveMsg('✓ ' + result.message);
      await load();
      setTimeout(() => setReserveRow(null), 1500);
    } catch (e) { setReserveMsg('✗ ' + e.message); }
    setReserving(false);
  };

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>DHCP · Connected Clients</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>{clients.length} leases · /ip dhcp-server lease</div>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <APill tone="good" mono>{activeCount} active</APill>
          <APill tone="accent" mono>{staticCount} reserved</APill>
          <ABtn kind="secondary" onClick={load}>Re-scan ARP</ABtn>
        </div>
      </div>

      {/* summary row */}
      <div style={{ display: 'flex', gap: 8, padding: '10px 20px 0', flexShrink: 0 }}>
        {[
          { label: `${clients.length} active leases`, tone: 'good' },
          { label: `${staticCount} static`, tone: 'accent' },
          { label: `${clients.filter(c=>!c.lease||c.lease==='dynamic').length} dynamic`, tone: 'dim' },
        ].map(p => <APill key={p.label} tone={p.tone}>{p.label}</APill>)}
      </div>

      {/* search bar */}
      <div style={{ padding: '10px 20px 0', flexShrink: 0 }}>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search by host, IP or MAC…" style={{ width: '100%', padding: '8px 12px', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 9, fontFamily: A.mono, fontSize: 12, color: A.text, outline: 'none', boxSizing: 'border-box' }} />
      </div>

      {/* table */}
      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', margin: '12px 20px 20px', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '160px 130px 150px 70px 70px 70px 70px', padding: '9px 16px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', flexShrink: 0 }}>
          <span>Host · Vendor</span><span>IP Address</span><span>MAC</span><span>Interface</span><span>Lease</span><span>RX</span><span>TX</span>
        </div>
        <div style={{ flex: 1, overflow: 'auto' }}>
          {filtered.length === 0 ? (
            <div style={{ padding: 32, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No clients found</div>
          ) : filtered.map((c, i) => (
            <div key={i} onMouseEnter={e => e.currentTarget.querySelector('.reserve-btn') && (e.currentTarget.querySelector('.reserve-btn').style.opacity = '1')}
              onMouseLeave={e => e.currentTarget.querySelector('.reserve-btn') && (e.currentTarget.querySelector('.reserve-btn').style.opacity = '0')}
              style={{
                display: 'grid', gridTemplateColumns: '160px 130px 150px 70px 70px 70px 70px',
                padding: '10px 16px', borderBottom: i < filtered.length - 1 ? `1px solid ${A.border}` : 'none',
                background: i % 2 === 1 ? 'rgba(255,255,255,0.015)' : 'transparent', alignItems: 'center', position: 'relative',
              }}>
              <div>
                <div style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{c.hostname || c.host || 'unknown'}</div>
                <div style={{ fontSize: 10, color: A.textFaint }}>{c.vendor || '—'}</div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ fontSize: 11, fontFamily: A.mono, color: A.text }}>{c.ip || c.address || '—'}</span>
                {(c.lease === 'static' || c['address-lists']) && <APill tone="accent">static</APill>}
              </div>
              <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textDim }}>{c.mac || c['mac-address'] || '—'}</span>
              <span style={{ fontSize: 11, color: A.textDim }}>{c.interface || c.iface || '—'}</span>
              <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint }}>{c.lease || c['expires-after'] || '—'}</span>
              <span style={{ fontSize: 11, fontFamily: A.mono, color: A.good }}>{fmtBytes(c.rx || c.rxBytes)}</span>
              <span style={{ fontSize: 11, fontFamily: A.mono, color: A.accent }}>{fmtBytes(c.tx || c.txBytes)}</span>
              <button className="reserve-btn" onClick={() => openReserve(c)} style={{ position: 'absolute', right: 12, background: A.accentSoft, border: `1px solid ${A.accent}`, borderRadius: 6, color: '#BFDBFE', fontSize: 10, padding: '3px 8px', cursor: 'pointer', opacity: 0, transition: 'opacity 0.15s' }}>Reserve IP</button>
            </div>
          ))}
        </div>
      </div>

      {/* Reserve IP modal overlay */}
      {reserveRow && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200 }} onClick={() => setReserveRow(null)}>
          <div style={{ background: '#0F1825', border: `1px solid ${A.borderStrong}`, borderRadius: 14, padding: 24, width: 320, boxShadow: '0 20px 60px rgba(0,0,0,0.6)' }} onClick={e => e.stopPropagation()}>
            <div style={{ fontSize: 14, fontWeight: 600, color: A.text, marginBottom: 4 }}>Reserve IP</div>
            <div style={{ fontSize: 11, color: A.textFaint, marginBottom: 16, fontFamily: A.mono }}>{reserveRow.mac}</div>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 11, fontWeight: 500, color: A.text, marginBottom: 6 }}>IP Address <span style={{ color: A.textFaint }}>(leave as-is to keep current)</span></div>
              <input value={reserveIp} onChange={e => setReserveIp(e.target.value)} style={{ width: '100%', padding: '9px 11px', background: A.surface, border: `1px solid ${A.borderStrong}`, borderRadius: 9, fontFamily: A.mono, fontSize: 12, color: A.text, outline: 'none', boxSizing: 'border-box' }} />
            </div>
            {reserveMsg && <div style={{ fontSize: 11, color: reserveMsg.includes('✓') ? A.good : A.bad, marginBottom: 12 }}>{reserveMsg}</div>}
            <div style={{ display: 'flex', gap: 8 }}>
              <ABtn kind="secondary" onClick={() => setReserveRow(null)}>Cancel</ABtn>
              <ABtn kind="primary" onClick={handleReserve} disabled={reserving} full>{reserving ? 'Reserving…' : 'Make Static'}</ABtn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const HS_PLANS = [
  { id: 'basic',   label: 'Basic',   down: '5 Mbps',  up: '2 Mbps',  time: '2 hrs' },
  { id: 'default', label: 'Standard',down: '20 Mbps', up: '10 Mbps', time: 'Unlimited' },
  { id: 'premium', label: 'Premium', down: '100 Mbps',up: '50 Mbps', time: 'Unlimited' },
];

const genPassword = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6).toUpperCase();

const HotspotScreen = ({ sessionId }) => {
  const [hotspot, setHotspot]     = React.useState(null);
  const [users, setUsers]         = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [activeTab, setActiveTab] = React.useState('all');
  const [showPanel, setShowPanel] = React.useState(false);
  const [newUser, setNewUser]     = React.useState('');
  const [newPass, setNewPass]     = React.useState('');
  const [newPlan, setNewPlan]     = React.useState('default');
  const [autoDisable, setAutoDisable] = React.useState(false);
  const [formMsg, setFormMsg]     = React.useState('');
  const [profiles, setProfiles]   = React.useState(['default']);

  const loadUsers = React.useCallback(async () => {
    try {
      const [hs, us] = await Promise.allSettled([
        API.getHotspot(sessionId),
        API.getHotspotUsers(sessionId),
      ]);
      if (hs.status === 'fulfilled') {
        setHotspot(hs.value);
        if (Array.isArray(hs.value?.profiles) && hs.value.profiles.length > 0) {
          setProfiles(hs.value.profiles);
        }
      }
      if (us.status === 'fulfilled') setUsers(Array.isArray(us.value) ? us.value : []);
    } catch {}
    setLoading(false);
  }, [sessionId]);

  React.useEffect(() => {
    if (!sessionId) return;
    loadUsers();
    const iv = setInterval(loadUsers, 8000);
    return () => clearInterval(iv);
  }, [sessionId, loadUsers]);

  const handleRemove = async (user) => {
    if (!window.confirm(`Remove "${user.name || user.username}"?`)) return;
    try {
      await API.call(sessionId, '/api/hotspot/user/remove', {
        method: 'POST',
        body: JSON.stringify({ id: user.id, type: user.type || 'hotspot' }),
      });
      await loadUsers();
    } catch (e) { alert(e.message); }
  };

  const handleCreate = async () => {
    if (!newUser.trim() || !newPass.trim()) { setFormMsg('Username and password required'); return; }
    setFormMsg('Creating…');
    try {
      await API.addHotspotUser(sessionId, newUser.trim(), newPass, newPlan, '');
      setNewUser(''); setNewPass(''); setNewPlan('default'); setAutoDisable(false);
      setShowPanel(false);
      await loadUsers();
    } catch (e) { setFormMsg('✗ ' + e.message); }
  };

  const TABS = [
    { id: 'all',     label: 'All' },
    { id: 'pppoe',   label: 'PPPoE' },
    { id: 'hotspot', label: 'Hotspot' },
    { id: 'online',  label: 'Online now' },
    { id: 'disabled',label: 'Disabled' },
  ];

  const filtered = users.filter(u => {
    if (activeTab === 'all') return true;
    if (activeTab === 'pppoe')    return u.type === 'pppoe';
    if (activeTab === 'hotspot')  return u.type !== 'pppoe';
    if (activeTab === 'online')   return !u.disabled;
    if (activeTab === 'disabled') return u.disabled;
    return true;
  });

  const COL = { time: { fontSize: 11, fontFamily: A.mono, color: A.textDim }, name: { fontSize: 12, fontWeight: 500, color: A.text, fontFamily: A.mono } };

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Hotspot · PPPoE Users</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>{users.length} users · {users.filter(u => !u.disabled).length} active</div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <APill tone={hotspot?.enabled ? 'good' : 'dim'}>{hotspot?.enabled ? 'Hotspot on' : 'Hotspot off'}</APill>
          <ABtn kind="primary" onClick={() => { setShowPanel(true); setFormMsg(''); }}>+ New User</ABtn>
        </div>
      </div>

      {/* tabs */}
      <div style={{ display: 'flex', gap: 2, padding: '12px 20px 0', flexShrink: 0 }}>
        {TABS.map(tab => (
          <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
            padding: '6px 14px', borderRadius: 7, border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 500,
            background: activeTab === tab.id ? A.accentSoft : 'transparent',
            color: activeTab === tab.id ? '#BFDBFE' : A.textDim,
            transition: 'all 0.15s',
          }}>{tab.label}</button>
        ))}
      </div>

      {/* table + new-user panel */}
      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', gap: 0, padding: '12px 20px 20px' }}>
        {/* table */}
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12 }}>
          {/* header */}
          <div style={{ display: 'grid', gridTemplateColumns: '180px 80px 100px 120px 80px 90px 80px 50px', padding: '9px 16px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', flexShrink: 0 }}>
            <span>Username</span><span>Type</span><span>Plan</span><span>IP Address</span><span>Uptime</span><span>Data used</span><span>Status</span><span></span>
          </div>
          {/* rows */}
          <div style={{ flex: 1, overflow: 'auto' }}>
            {filtered.length === 0 ? (
              <div style={{ padding: 32, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No users in this filter</div>
            ) : filtered.map((u, i) => (
              <div key={u.id || i} style={{
                display: 'grid', gridTemplateColumns: '180px 80px 100px 120px 80px 90px 80px 50px',
                padding: '10px 16px', borderBottom: i < filtered.length - 1 ? `1px solid ${A.border}` : 'none',
                background: i % 2 === 1 ? 'rgba(255,255,255,0.015)' : 'transparent', alignItems: 'center',
              }}>
                <span style={COL.name}>{u.name || u.username || '—'}</span>
                <APill tone={u.type === 'pppoe' ? 'accent' : 'dim'}>{u.type || 'hotspot'}</APill>
                <span style={{ fontSize: 11, color: A.textDim }}>{u.profile || 'default'}</span>
                <span style={{ fontSize: 11, fontFamily: A.mono, color: A.textDim }}>{u.address || '—'}</span>
                <span style={COL.time}>{u.uptime || '—'}</span>
                <span style={COL.time}>{u.bytesIn ? `${(u.bytesIn/1e6).toFixed(1)} MB` : '—'}</span>
                <APill tone={u.disabled ? 'dim' : 'good'}>{u.disabled ? 'Offline' : 'Online'}</APill>
                <button onClick={() => handleRemove(u)} style={{ background: 'rgba(239,68,68,0.15)', border: 'none', borderRadius: 5, color: '#FCA5A5', fontSize: 10, padding: '3px 7px', cursor: 'pointer' }}>Del</button>
              </div>
            ))}
          </div>
        </div>

        {/* new user panel */}
        {showPanel && (
          <div style={{ width: 280, flexShrink: 0, marginLeft: 12, display: 'flex', flexDirection: 'column', gap: 12, overflow: 'auto' }}>
            <ACard pad={16}>
              <div style={{ fontSize: 13, fontWeight: 600, color: A.text, marginBottom: 14 }}>New User</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                <ALabeledField label="Username" value={newUser} onChange={e => setNewUser(e.target.value)} mono />
                <div>
                  <div style={{ fontSize: 12, fontWeight: 500, color: A.text, marginBottom: 6 }}>Password</div>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <input type="text" value={newPass} onChange={e => setNewPass(e.target.value)} style={{ flex: 1, padding: '9px 11px', background: A.surface, border: `1px solid rgba(255,255,255,0.12)`, borderRadius: 9, fontFamily: A.mono, fontSize: 12, color: A.text, outline: 'none', boxSizing: 'border-box' }} />
                    <button onClick={() => setNewPass(genPassword())} style={{ padding: '0 10px', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 8, color: A.textDim, fontSize: 11, cursor: 'pointer', flexShrink: 0 }}>Auto</button>
                  </div>
                </div>

                <div>
                  <div style={{ fontSize: 12, fontWeight: 500, color: A.text, marginBottom: 6 }}>Profile</div>
                  <select value={newPlan} onChange={e => setNewPlan(e.target.value)} style={{ width: '100%', padding: '9px 11px', background: A.surface, border: `1px solid rgba(255,255,255,0.12)`, borderRadius: 9, fontSize: 12, color: A.text, outline: 'none', boxSizing: 'border-box', cursor: 'pointer' }}>
                    {profiles.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>

                <AToggleRow label="Auto-disable after plan expires" sub="Hotspot only" on={autoDisable} onChange={setAutoDisable} />

                {formMsg && <div style={{ fontSize: 11, color: formMsg.includes('✗') ? A.bad : A.textDim }}>{formMsg}</div>}

                <div style={{ display: 'flex', gap: 8 }}>
                  <ABtn kind="secondary" onClick={() => setShowPanel(false)}>Cancel</ABtn>
                  <ABtn kind="primary" onClick={handleCreate} full>Create</ABtn>
                </div>
              </div>
            </ACard>
          </div>
        )}
      </div>
    </div>
  );
};

const WirelessScreen = ({ sessionId }) => {
  const [wireless, setWireless] = React.useState([]);
  const [loading, setLoading]   = React.useState(true);
  const [selectedSsid, setSelectedSsid] = React.useState(null);

  React.useEffect(() => {
    if (!sessionId) return;
    const fetch = async () => {
      setLoading(true);
      try { const d = await API.getWireless(sessionId); setWireless(Array.isArray(d) ? d : []); } catch {}
      setLoading(false);
    };
    fetch();
    const iv = setInterval(fetch, 8000);
    return () => clearInterval(iv);
  }, [sessionId]);

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  if (wireless.length === 0) {
    return (
      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
        <div style={{ padding: '14px 20px 12px', flexShrink: 0 }}>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Wireless · CAPsMAN</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>centralized AP control</div>
        </div>
        <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 32 }}>
          <ACard pad={32} style={{ maxWidth: 480, textAlign: 'center' }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: A.text, marginBottom: 8 }}>No wireless interfaces detected</div>
            <div style={{ fontSize: 12, color: A.textFaint, lineHeight: 1.6 }}>
              This router may not have wireless capability or may use /interface wifi (RouterOS 7+).
            </div>
          </ACard>
        </div>
      </div>
    );
  }

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Wireless · CAPsMAN</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>centralized AP control · {wireless.length} interface{wireless.length !== 1 ? 's' : ''}</div>
        </div>
      </div>

      <div style={{ flex: 1, overflow: 'auto', padding: '0 20px 20px', display: 'flex', gap: 14 }}>
        {/* left: SSIDs */}
        <div style={{ width: 240, flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 14 }}>
          <ACard pad={0}>
            <div style={{ padding: '10px 14px 9px', borderBottom: `1px solid ${A.border}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontSize: 11, fontWeight: 600, color: A.textDim, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Networks (SSIDs)</span>
              <span style={{ fontSize: 10, color: A.textFaint }}>/interface wireless</span>
            </div>
            {wireless.map((ssid, i) => (
              <div key={i} onClick={() => setSelectedSsid(selectedSsid === i ? null : i)} style={{
                padding: '11px 14px', borderBottom: i < wireless.length - 1 ? `1px solid ${A.border}` : 'none',
                cursor: 'pointer', background: selectedSsid === i ? 'rgba(59,130,246,0.08)' : 'transparent', transition: 'background 0.1s',
              }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                  <span style={{ fontSize: 12, fontWeight: 600, color: A.text }}>{ssid.name || ssid.ssid || '—'}</span>
                  <APill tone="good" mono>{ssid.clients || ssid.clientCount || 0}</APill>
                </div>
                <div style={{ display: 'flex', gap: 6 }}>
                  <APill tone="dim">{ssid.security || ssid.encryption || 'WPA2'}</APill>
                  {ssid.vlan && <APill tone="dim" mono>vlan {ssid.vlan}</APill>}
                </div>
              </div>
            ))}
          </ACard>
        </div>

        {/* right: detail */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 14 }}>
          {selectedSsid !== null && wireless[selectedSsid] ? (
            <ACard pad={16}>
              <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>{wireless[selectedSsid].name || wireless[selectedSsid].ssid}</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                {Object.entries(wireless[selectedSsid]).map(([k, v]) => (
                  <div key={k} style={{ display: 'flex', gap: 8, fontSize: 11 }}>
                    <span style={{ color: A.textFaint, width: 140, flexShrink: 0, fontFamily: A.mono }}>{k}</span>
                    <span style={{ color: A.text, fontFamily: A.mono }}>{String(v)}</span>
                  </div>
                ))}
              </div>
            </ACard>
          ) : (
            <ACard pad={24}>
              <div style={{ textAlign: 'center', color: A.textFaint, fontSize: 12 }}>Select a wireless interface to view details</div>
            </ACard>
          )}
        </div>
      </div>
    </div>
  );
};

const ConnectionsTab = ({ sessionId }) => {
  const [data, setData] = React.useState({ disabled: false, rows: [] });
  const [loading, setLoading] = React.useState(true);

  const load = React.useCallback(async () => {
    try { const r = await API.getFirewallConnections(sessionId); setData(r); } catch {} finally { setLoading(false); }
  }, [sessionId]);
  React.useEffect(() => { load(); const t = setInterval(load, 5000); return () => clearInterval(t); }, [load]);

  const col  = { color: A.textMuted, fontSize: 11, fontWeight: 600, padding: '8px 12px', borderBottom: `1px solid ${A.border}`, textAlign:'left' };
  const cell = { padding: '7px 12px', borderBottom: `1px solid ${A.border}`, fontSize: 11, fontFamily: 'monospace' };

  if (loading) return <div style={{ textAlign:'center', color: A.textMuted, padding: 40 }}>Loading…</div>;
  if (data.disabled) return (
    <div style={{ background: A.surface, border:`1px solid ${A.border}`, borderRadius:10, padding:32, textAlign:'center' }}>
      <div style={{ color: A.textMuted }}>Connection tracking is disabled on this router.</div>
    </div>
  );
  return (
    <div>
      <div style={{ marginBottom: 10, fontSize: 12, color: A.textMuted }}>
        Up to 200 connections · auto-refresh 5s · <span style={{ color: A.accent }}>{data.rows.length} active</span>
      </div>
      <div style={{ background: A.surface, border:`1px solid ${A.border}`, borderRadius:10, overflow:'hidden' }}>
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 700 }}>
            <thead><tr>{['Protocol','Source','Destination','State','Bytes Out','Reply Bytes'].map(h => <th key={h} style={col}>{h}</th>)}</tr></thead>
            <tbody>
              {data.rows.map((r, i) => (
                <tr key={i}>
                  <td style={cell}><span style={{ background: A.surface2, padding:'1px 6px', borderRadius:4, fontSize:11 }}>{r.protocol}</span></td>
                  <td style={cell}>{r.src}</td>
                  <td style={cell}>{r.dst}</td>
                  <td style={{ ...cell, color: r.state === 'established' ? A.good : A.textMuted }}>{r.state || '—'}</td>
                  <td style={cell}>{fmtBytes(parseInt(r.bytes)||0)}</td>
                  <td style={cell}>{fmtBytes(parseInt(r.replyBytes)||0)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
};

const AddressListsTab = ({ sessionId }) => {
  const [entries, setEntries] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [newList, setNewList] = React.useState('');
  const [newAddr, setNewAddr] = React.useState('');
  const [newComment, setNewComment] = React.useState('');
  const [msg, setMsg] = React.useState('');

  const load = React.useCallback(async () => {
    try { setEntries(await API.getAddressLists(sessionId)); } catch {} finally { setLoading(false); }
  }, [sessionId]);
  React.useEffect(() => { load(); }, [load]);

  const grouped = {};
  for (const e of entries) { if (!grouped[e.list]) grouped[e.list] = []; grouped[e.list].push(e); }

  return (
    <div>
      <div style={{ background: A.surface, border:`1px solid ${A.border}`, borderRadius:10, padding:12, marginBottom:12 }}>
        <div style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap' }}>
          <input value={newList} onChange={e => setNewList(e.target.value)} placeholder="List name" list="al-names"
            style={{ background:A.surface2, border:`1px solid ${A.border}`, color:A.text, borderRadius:6, padding:'6px 10px', fontSize:12, width:160 }} />
          <datalist id="al-names">{Object.keys(grouped).map(l => <option key={l} value={l}/>)}</datalist>
          <AInput value={newAddr} onChange={e => setNewAddr(e.target.value)} placeholder="IP or CIDR (1.2.3.4/24)" style={{ width:200 }} />
          <AInput value={newComment} onChange={e => setNewComment(e.target.value)} placeholder="Comment" style={{ width:140 }} />
          <button onClick={async () => {
            setMsg('');
            try { await API.addAddressListEntry(sessionId, newList, newAddr, newComment); setNewAddr(''); setNewComment(''); load(); }
            catch (e) { setMsg(e.message); }
          }} style={{ background:A.accent, color:'#fff', border:'none', borderRadius:7, padding:'7px 16px', cursor:'pointer', fontSize:12 }}>Add</button>
        </div>
        {msg && <div style={{ marginTop:6, color:A.bad, fontSize:11 }}>{msg}</div>}
      </div>
      {loading ? <div style={{ textAlign:'center', color:A.textMuted, padding:24 }}>Loading…</div> :
        Object.keys(grouped).length === 0 ? (
          <div style={{ background:A.surface, border:`1px solid ${A.border}`, borderRadius:10, padding:24, textAlign:'center', color:A.textMuted }}>No address-list entries</div>
        ) : Object.entries(grouped).map(([list, items]) => (
          <div key={list} style={{ background:A.surface, border:`1px solid ${A.border}`, borderRadius:10, overflow:'hidden', marginBottom:10 }}>
            <div style={{ padding:'9px 14px', borderBottom:`1px solid ${A.border}`, display:'flex', justifyContent:'space-between', fontSize:13 }}>
              <span style={{ fontWeight:600 }}>{list}</span>
              <span style={{ color:A.textMuted, fontSize:11 }}>{items.length} entries</span>
            </div>
            {items.map(e => (
              <div key={e.id} style={{ display:'flex', alignItems:'center', padding:'7px 14px', borderBottom:`1px solid ${A.border}`, gap:12 }}>
                <span style={{ fontFamily:'monospace', fontSize:12, flex:1 }}>{e.address}</span>
                <span style={{ fontSize:11, color:A.textMuted, flex:1 }}>{e.comment}</span>
                {e.dynamic ? <span style={{ fontSize:11, color:A.textMuted }}>(dynamic)</span> :
                  <button onClick={async () => { try { await API.removeAddressListEntry(sessionId, e.id); load(); } catch {} }}
                    style={{ background:'transparent', border:`1px solid ${A.bad}`, color:A.bad, borderRadius:5, padding:'2px 8px', cursor:'pointer', fontSize:11 }}>Remove</button>}
              </div>
            ))}
          </div>
        ))
      }
    </div>
  );
};

const GeoBlockTab = ({ sessionId }) => {
  const [countries, setCountries] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [busy, setBusy] = React.useState({});
  const [msg, setMsg] = React.useState('');

  const load = React.useCallback(async () => {
    try { const r = await API.getGeoBlocks(sessionId); setCountries(r.countries || []); } catch {} finally { setLoading(false); }
  }, [sessionId]);
  React.useEffect(() => { load(); }, [load]);

  const flags = { CN:'🇨🇳', RU:'🇷🇺', KP:'🇰🇵', IR:'🇮🇷', BY:'🇧🇾', SY:'🇸🇾', MM:'🇲🇲', CU:'🇨🇺' };

  const toggle = async (cc, blocked) => {
    setBusy(b => ({...b, [cc]:true})); setMsg('');
    try { await API.toggleGeoBlock(sessionId, cc, !blocked); load(); }
    catch (e) { setMsg(e.message); }
    finally { setBusy(b => ({...b, [cc]:false})); }
  };

  return (
    <div>
      <div style={{ background:'#78350f22', border:`1px solid #92400e`, borderRadius:10, padding:'10px 14px', marginBottom:14, fontSize:12, color:'#fbbf24' }}>
        ⚠️ Geo-blocking adds CIDR ranges for a country to a firewall drop rule. This blocks ALL traffic from that country for every user on your network.
      </div>
      {msg && <div style={{ color:A.bad, fontSize:12, marginBottom:10 }}>{msg}</div>}
      {loading ? <div style={{ textAlign:'center', color:A.textMuted, padding:32 }}>Loading…</div> : (
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))', gap:10 }}>
          {countries.map(c => (
            <div key={c.cc} style={{ background:A.surface, border:`1px solid ${A.border}`, borderRadius:10, padding:14, display:'flex', flexDirection:'column', gap:10 }}>
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <span style={{ fontSize:26 }}>{flags[c.cc] || '🌍'}</span>
                <div>
                  <div style={{ fontWeight:600, fontSize:13 }}>{c.label}</div>
                  <div style={{ fontSize:11, color:A.textMuted }}>{c.cidrCount} CIDR blocks</div>
                </div>
              </div>
              <button onClick={() => toggle(c.cc, c.blocked)} disabled={busy[c.cc]}
                style={{ background: c.blocked ? '#991b1b44' : A.surface2, color: c.blocked ? '#f87171' : A.text, border:`1px solid ${c.blocked ? '#f87171' : A.border}`, borderRadius:7, padding:'6px 0', cursor:'pointer', fontSize:12, fontWeight:600 }}>
                {busy[c.cc] ? '…' : c.blocked ? '🚫 Blocked — Click to Unblock' : 'Block Country'}
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

const QrModal = ({ config, onClose }) => {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current || !config) return;
    ref.current.innerHTML = '';
    try {
      if (window.QRCode) new window.QRCode(ref.current, { text: config, width: 256, height: 256, colorDark:'#000', colorLight:'#fff' });
      else ref.current.textContent = 'QR library not available';
    } catch (e) { ref.current.textContent = String(e); }
  }, [config]);
  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.7)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:9999 }} onClick={onClose}>
      <div style={{ background:'#fff', borderRadius:16, padding:24, textAlign:'center' }} onClick={e => e.stopPropagation()}>
        <div style={{ marginBottom:12, fontWeight:700, fontSize:14, color:'#000' }}>Scan with WireGuard App</div>
        <div ref={ref} style={{ display:'inline-block' }} />
        <div style={{ marginTop:12, fontSize:11, color:'#666' }}>Tap outside to close</div>
      </div>
    </div>
  );
};

const VPN_PROTOCOLS_META = [
  { id: 'wireguard', label: 'WireGuard',    sub: 'modern · fast',    proto: 'udp', port: 51820 },
  { id: 'l2tp',      label: 'L2TP / IPsec', sub: 'windows native',   proto: 'udp', port: '500/4500' },
  { id: 'pptp',      label: 'PPTP',         sub: 'legacy · simple',  proto: 'tcp', port: 1723 },
  { id: 'ovpn',      label: 'OpenVPN',      sub: 'tls · compatible', proto: 'tcp', port: 1194 },
];

const VpnScreen = ({ sessionId }) => {
  const [vpn, setVpn]             = React.useState({ wireguard: { enabled: false, interfaces: [], peers: [] }, l2tp: { enabled: false, peers: 0 }, pptp: { enabled: false, peers: 0 }, ovpn: { enabled: false, peers: 0 } });
  const [loading, setLoading]     = React.useState(true);
  const [activeProto, setActiveProto] = React.useState('wireguard');
  const [showPanel, setShowPanel] = React.useState(false);
  const [peerName, setPeerName]   = React.useState('');
  const [peerIp, setPeerIp]       = React.useState('');
  const [addMsg, setAddMsg]       = React.useState('');
  const [genKeys, setGenKeys]     = React.useState(null);   // { privateKey, publicKey }
  const [qrTarget, setQrTarget]   = React.useState(null);   // WireGuard config string
  // WireGuard create interface
  const [showCreateWg, setShowCreateWg] = React.useState(false);
  const [wgName, setWgName]   = React.useState('wireguard1');
  const [wgPort, setWgPort]   = React.useState('51820');
  // PPTP/L2TP state
  const [pptpEnabled, setPptpEnabled] = React.useState(false);
  const [l2tpEnabled, setL2tpEnabled] = React.useState(false);
  const [pptpLocal, setPptpLocal]   = React.useState('10.0.0.1');
  const [pptpStart, setPptpStart]   = React.useState('10.0.0.10');
  const [pptpEnd, setPptpEnd]       = React.useState('10.0.0.20');
  const [l2tpLocal, setL2tpLocal]   = React.useState('10.1.0.1');
  const [l2tpStart, setL2tpStart]   = React.useState('10.1.0.10');
  const [l2tpEnd, setL2tpEnd]       = React.useState('10.1.0.20');
  const [l2tpSecret, setL2tpSecret] = React.useState('vpnsecret');
  const [pppUser, setPppUser]   = React.useState('');
  const [pppPass, setPppPass]   = React.useState('');
  const [pppSecrets, setPppSecrets] = React.useState([]);
  const [serverMsg, setServerMsg]   = React.useState('');

  const load = React.useCallback(async () => {
    try {
      const d = await API.getVpn(sessionId);
      if (d) {
        setVpn(prev => ({ ...prev, ...d }));
        setPptpEnabled(d.pptp?.enabled || false);
        setL2tpEnabled(d.l2tp?.enabled || false);
      }
    } catch {}
    try { const s = await API.getPppSecrets(sessionId); setPppSecrets(Array.isArray(s) ? s : []); } catch {}
    setLoading(false);
  }, [sessionId]);

  React.useEffect(() => {
    if (!sessionId) return;
    load();
    const iv = setInterval(load, 8000);
    return () => clearInterval(iv);
  }, [sessionId, load]);

  const fmtBytes = (b) => {
    if (!b) return '—';
    if (b >= 1e9) return (b/1e9).toFixed(1)+'G';
    if (b >= 1e6) return (b/1e6).toFixed(0)+'M';
    if (b >= 1e3) return (b/1e3).toFixed(0)+'K';
    return b+'B';
  };

  const handleCreate = async () => {
    if (!peerName.trim()) { setAddMsg('Peer name required'); return; }
    setAddMsg('Creating peer…');
    try {
      const result = await API.addVpnPeer(sessionId, peerName.trim(), peerIp || '10.0.0.2/32', null);
      setAddMsg('✓ ' + result.message);
      setPeerName(''); setPeerIp('');
      await load();
    } catch (e) { setAddMsg('✗ ' + e.message); }
  };

  const handleCreateWg = async () => {
    setAddMsg('Creating WireGuard interface…');
    try {
      const r = await API.createWireguardInterface(sessionId, wgName, parseInt(wgPort) || 51820, 1420);
      setAddMsg('✓ ' + r.message + (r.publicKey ? ` | pubkey: ${r.publicKey.substring(0, 16)}…` : ''));
      setShowCreateWg(false);
      await load();
    } catch (e) { setAddMsg('✗ ' + e.message); }
  };

  const handleGenKeys = async () => {
    setAddMsg('Generating keys…');
    try {
      const k = await API.generateWgKeys(sessionId);
      setGenKeys(k);
      setAddMsg('✓ Keys generated — paste public key into router peer config');
    } catch (e) { setAddMsg('✗ ' + e.message); }
  };

  const buildPeerConfig = (peer) => {
    const wgIface = vpn.wireguard?.interfaces?.[0];
    const endpoint = wgIface ? `<YOUR_ROUTER_IP>:${wgIface.port || 51820}` : '<YOUR_ROUTER_IP>:51820';
    const privKey = genKeys?.privateKey || '<PASTE_PRIVATE_KEY>';
    return `[Interface]\nPrivateKey = ${privKey}\nAddress = ${peer.allowedAddress || '10.0.0.2/32'}\nDNS = 1.1.1.1\n\n[Peer]\nPublicKey = ${wgIface?.publicKey || '<ROUTER_PUBLIC_KEY>'}\nAllowedIPs = 0.0.0.0/0\nEndpoint = ${endpoint}\nPersistentKeepalive = 25`;
  };

  const handlePptpToggle = async () => {
    setServerMsg('Applying…');
    try {
      const r = await API.togglePptpServer(sessionId, !pptpEnabled, { localAddress: pptpLocal, remoteStart: pptpStart, remoteEnd: pptpEnd });
      setPptpEnabled(!pptpEnabled);
      setServerMsg('✓ ' + r.message);
      await load();
    } catch (e) { setServerMsg('✗ ' + e.message); }
    setTimeout(() => setServerMsg(''), 3000);
  };

  const handleL2tpToggle = async () => {
    setServerMsg('Applying…');
    try {
      const r = await API.toggleL2tpServer(sessionId, !l2tpEnabled, { localAddress: l2tpLocal, remoteStart: l2tpStart, remoteEnd: l2tpEnd, ipsecSecret: l2tpSecret });
      setL2tpEnabled(!l2tpEnabled);
      setServerMsg('✓ ' + r.message);
      await load();
    } catch (e) { setServerMsg('✗ ' + e.message); }
    setTimeout(() => setServerMsg(''), 3000);
  };

  const handleAddPppUser = async () => {
    if (!pppUser.trim() || !pppPass.trim()) { setServerMsg('Username and password required'); return; }
    setServerMsg('Adding user…');
    try {
      const fn = activeProto === 'pptp' ? API.addPptpUser : API.addL2tpUser;
      const r = await fn.call(API, sessionId, pppUser.trim(), pppPass);
      setServerMsg('✓ ' + r.message);
      setPppUser(''); setPppPass('');
      await load();
    } catch (e) { setServerMsg('✗ ' + e.message); }
    setTimeout(() => setServerMsg(''), 3000);
  };

  const handleRemovePppSecret = async (name) => {
    try { await API.removePppSecret(sessionId, name); await load(); } catch (e) { alert(e.message); }
  };

  const protoStats = {
    wireguard: { enabled: vpn.wireguard?.enabled, peers: vpn.wireguard?.peers?.length || 0 },
    l2tp:      { enabled: vpn.l2tp?.enabled,      peers: vpn.l2tp?.peers || 0 },
    pptp:      { enabled: vpn.pptp?.enabled,       peers: vpn.pptp?.peers || 0 },
    ovpn:      { enabled: vpn.ovpn?.enabled,       peers: vpn.ovpn?.peers || 0 },
  };

  const activePeers = vpn.wireguard?.peers || [];

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '14px 20px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>VPN</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>WireGuard · L2TP/IPsec · PPTP · OpenVPN</div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          {activeProto === 'wireguard' && vpn.wireguard?.interfaces?.length === 0 && (
            <ABtn kind="secondary" onClick={() => { setShowCreateWg(!showCreateWg); setAddMsg(''); }}>+ Create WG interface</ABtn>
          )}
          {activeProto === 'wireguard' && vpn.wireguard?.interfaces?.length > 0 && (
            <ABtn kind="primary" onClick={() => { setShowPanel(!showPanel); setAddMsg(''); }}>+ New peer</ABtn>
          )}
        </div>
      </div>

      <div style={{ flex: 1, overflow: 'auto', padding: '0 20px 20px', display: 'flex', flexDirection: 'column', gap: 16 }}>
        {/* protocol summary cards */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12 }}>
          {VPN_PROTOCOLS_META.map(proto => {
            const st = protoStats[proto.id] || {};
            return (
              <ACard key={proto.id} pad={16} style={{ cursor: 'pointer', border: `1px solid ${activeProto === proto.id ? A.accent : A.border}`, background: activeProto === proto.id ? 'rgba(59,130,246,0.06)' : A.surface }} onClick={() => { setActiveProto(proto.id); setAddMsg(''); setServerMsg(''); }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: A.text }}>{proto.label}</span>
                  <APill tone={st.enabled ? 'good' : 'dim'}>{st.enabled ? 'active' : 'off'}</APill>
                </div>
                <div style={{ fontSize: 10, color: A.textFaint, marginBottom: 10 }}>{proto.sub} · {proto.proto} {proto.port}</div>
                <div style={{ fontSize: 22, fontWeight: 700, color: A.text, fontFamily: A.mono }}>{st.peers}</div>
                <div style={{ fontSize: 10, color: A.textFaint }}>peers connected</div>
              </ACard>
            );
          })}
        </div>

        {addMsg && <div style={{ fontSize: 11, padding: '8px 12px', borderRadius: 8, background: addMsg.includes('✓') ? 'rgba(34,197,94,0.1)' : 'rgba(239,68,68,0.1)', color: addMsg.includes('✓') ? A.good : A.bad }}>{addMsg}</div>}

        {/* WireGuard */}
        {activeProto === 'wireguard' && (
          <>
            {/* Create interface panel */}
            {showCreateWg && (
              <ACard pad={16}>
                <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>Create WireGuard Interface</div>
                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'flex-end' }}>
                  <ALabeledField label="Interface name" sub="e.g. wireguard1" value={wgName} onChange={e => setWgName(e.target.value)} mono style={{ flex: '1 1 140px' }} />
                  <ALabeledField label="Listen port" sub="UDP port" value={wgPort} onChange={e => setWgPort(e.target.value)} mono style={{ flex: '0 0 110px' }} />
                  <ABtn kind="primary" onClick={handleCreateWg}>Create</ABtn>

            {/* WireGuard interface info */}
            {vpn.wireguard?.interfaces?.length > 0 && (
              <ACard pad={14}>
                <div style={{ fontSize: 11, fontWeight: 600, color: A.text, marginBottom: 8 }}>WireGuard interfaces</div>

                  <div key={wg.name} style={{ display: 'flex', gap: 16, fontSize: 11, fontFamily: A.mono, color: A.textDim, marginBottom: 4 }}>

                  <APill tone="dim" mono>udp · 51820</APill>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 130px 150px 70px 70px 60px 110px', padding: '8px 16px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em' }}>

                <div style={{ flex: 1, overflow: 'auto' }}>

                      <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textDim, overflow: 'hidden', textOverflow: 'ellipsis' }}>{p.allowedAddress || '—'}</span>
                      <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint }}>{p.lastHandshake || 'never'}</span>

                        <button title="Show QR code" onClick={() => setQrTarget(buildPeerConfig(p))} style={{ padding: '3px 7px', borderRadius: 5, fontSize: 10, border: `1px solid ${A.border}`, background: 'transparent', color: A.textFaint, cursor: 'pointer' }}>QR</button>
                      </div>
                    </div>
