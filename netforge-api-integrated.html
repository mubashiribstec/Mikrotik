              <tbody>
                {(status.blockedIps || []).map(ip => (
                  <tr key={ip.id} style={{ borderBottom: `1px solid ${A.border}` }}>
                    <td style={{ padding: '7px 10px', fontFamily: A.mono, color: '#FCA5A5' }}>{ip.address}</td>
                    <td style={{ padding: '7px 10px', color: A.textFaint, fontFamily: A.mono, fontSize: 11 }}>{ip.list}</td>
                    <td style={{ padding: '7px 10px', color: A.textFaint }}>{ip.timeout || '—'}</td>
                    <td style={{ padding: '7px 10px' }}>
                      <button onClick={() => handleUnblock(ip.id)}
                        style={{ background: 'rgba(34,197,94,0.1)', color: '#86EFAC', border: '1px solid rgba(34,197,94,0.25)', borderRadius: 6, padding: '3px 10px', cursor: 'pointer', fontSize: 11 }}>
                        Unblock
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </ACard>

      {/* Reference script */}
      <ACard>
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>Generated RouterOS Script</div>
        <div style={{ fontSize: 11, color: A.textFaint, marginBottom: 10 }}>Equivalent commands that will be applied to the router</div>
        <pre style={{ background: 'rgba(0,0,0,0.3)', border: `1px solid ${A.border}`, borderRadius: 8, padding: 12, fontSize: 10.5, fontFamily: A.mono, color: '#93C5FD', overflowX: 'auto', lineHeight: 1.6 }}>{
`/ip firewall address-list
${(status?.allowedIps || []).map(ip => `add list=allowed_ips address=${ip.address}${ip.comment ? ` comment="${ip.comment}"` : ''}`).join('\n') || '# (add IPs above)'}

/ip firewall filter
${selPorts.map(port => {
  const p = ACCESS_PORT_LIST.find(x => x.port === port);
  return `add chain=input protocol=tcp dst-port=${port} src-address-list=allowed_ips action=accept comment="Allow ${p?.name} from Allowed IPs"\nadd chain=input protocol=tcp dst-port=${port} action=drop comment="Drop ${p?.name} from Other IPs"`;
}).join('\n')}
${bruteForce ? `
/ip firewall mangle
${selPorts.map(port => {
  const p = ACCESS_PORT_LIST.find(x => x.port === port);
  return `add chain=prerouting protocol=tcp dst-port=${port} action=add-src-to-address-list address-list=login_attempts address-list-timeout=1m comment="Track ${p?.name} Login Attempts"`;
}).join('\n')}

/ip firewall filter
add chain=input src-address-list=login_attempts action=add-src-to-address-list address-list=blocked_ips address-list-timeout=1d comment="Block IPs with Multiple Login Attempts"
add chain=input src-address-list=blocked_ips action=drop comment="Drop Traffic from Blocked IPs"` : ''}`}
        </pre>
      </ACard>
    </div>
  );
};

// ========== TERMINAL SCREEN ==========

const TerminalScreen = ({ sessionId }) => {
  const [history, setHistory] = React.useState([
    { type: 'system', text: 'NetForge Terminal — RouterOS command passthrough' },
    { type: 'system', text: 'Type a RouterOS command and press Enter. Example: /system resource print' },
  ]);
  const [input, setInput] = React.useState('');
  const [busy, setBusy]   = React.useState(false);
  const [cmdHist, setCmdHist] = React.useState([]);
  const [histIdx, setHistIdx] = React.useState(-1);
  const bottomRef = React.useRef(null);
  const inputRef  = React.useRef(null);

  React.useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [history]);

  const run = async (cmd) => {
    const trimmed = cmd.trim();
    if (!trimmed) return;
    setCmdHist(p => [trimmed, ...p.slice(0, 49)]);
    setHistIdx(-1);
    setHistory(p => [...p, { type: 'input', text: trimmed }]);
    setBusy(true);
    try {
      const r = await API.terminalExec(sessionId, trimmed);
      setHistory(p => [...p, { type: 'output', text: r.output || '(no output)' }]);
    } catch (e) {
      setHistory(p => [...p, { type: 'error', text: e.message }]);
    }
    setBusy(false);
    setInput('');
    inputRef.current?.focus();
  };

  const handleKey = (e) => {
    if (e.key === 'Enter') { run(input); return; }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      const idx = Math.min(histIdx + 1, cmdHist.length - 1);
      setHistIdx(idx);
      if (cmdHist[idx] !== undefined) setInput(cmdHist[idx]);
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      const idx = Math.max(histIdx - 1, -1);
      setHistIdx(idx);
      setInput(idx === -1 ? '' : (cmdHist[idx] || ''));
    }
    if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); setHistory([]); }
  };

  const colorFor = (type) => {
    if (type === 'input')  return '#60A5FA';
    if (type === 'error')  return '#FCA5A5';
    if (type === 'system') return '#6B7280';
    return '#D1FAE5';
  };

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '14px 20px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Terminal</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>RouterOS CLI · Ctrl+L to clear · ↑↓ history</div>
        </div>
        <ABtn kind="secondary" onClick={() => setHistory([])}>Clear</ABtn>
      </div>

      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', margin: '0 20px 20px', background: '#0A0F1A', border: `1px solid ${A.border}`, borderRadius: 12, fontFamily: A.mono }} onClick={() => inputRef.current?.focus()}>
        {/* output area */}
        <div style={{ flex: 1, overflow: 'auto', padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: 4 }}>
          {history.map((h, i) => (
            <div key={i} style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
              {h.type === 'input' && <span style={{ color: '#6B7280', fontSize: 11, flexShrink: 0, paddingTop: 1 }}>&gt;</span>}
              <pre style={{ margin: 0, whiteSpace: 'pre-wrap', wordBreak: 'break-all', fontSize: 11.5, lineHeight: 1.55, color: colorFor(h.type), flex: 1 }}>{h.text}</pre>
            </div>
          ))}
          {busy && <div style={{ fontSize: 11, color: '#6B7280' }}>running…</div>}
          <div ref={bottomRef} />
        </div>

        {/* input row */}

const UsersScreen = ({ sessionId }) => {
  const [users, setUsers]       = React.useState([]);
  const [loading, setLoading]   = React.useState(true);
  const [showAdd, setShowAdd]   = React.useState(false);
  const [uName, setUName]       = React.useState('');
  const [uPass, setUPass]       = React.useState('');
  const [uGroup, setUGroup]     = React.useState('read');
  const [uComment, setUComment] = React.useState('');
  const [addMsg, setAddMsg]     = React.useState('');

  const load = React.useCallback(async () => {
    setLoading(true);
    try { const d = await API.getUsers(sessionId); setUsers(Array.isArray(d) ? d : []); } catch {}
    setLoading(false);
  }, [sessionId]);

  React.useEffect(() => {
    if (!sessionId) return;
    load();
  }, [sessionId, load]);

  const handleAdd = async () => {
    if (!uName.trim() || !uPass.trim()) { setAddMsg('Username and password required'); return; }
    setAddMsg('Adding…');
    try {
      await API.addUser(sessionId, uName.trim(), uPass, uGroup, uComment);
      setAddMsg('✓ User added');
      setUName(''); setUPass(''); setUComment(''); setShowAdd(false);
      await load();
    } catch (e) { setAddMsg('✗ ' + e.message); }
    setTimeout(() => setAddMsg(''), 3000);
  };

  const handleRemove = async (name) => {
    if (!window.confirm(`Remove user "${name}"? This cannot be undone.`)) return;
    try { await API.removeUser(sessionId, name); await load(); } catch (e) { alert(e.message); }
  };

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '14px 20px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Users · Access</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>/ip user · {users.length} accounts</div>
        </div>
        <ABtn kind="primary" onClick={() => { setShowAdd(true); setAddMsg(''); }}>+ Add user</ABtn>
      </div>

      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', gap: 0, padding: '0 20px 20px' }}>
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '150px 100px 130px 1fr 80px', padding: '9px 16px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', flexShrink: 0 }}>
            <span>Username</span><span>Group</span><span>Last login</span><span>Comment</span><span>Action</span>
          </div>
          <div style={{ flex: 1, overflow: 'auto' }}>
            {users.length === 0 ? (
              <div style={{ padding: 32, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No users found</div>
            ) : users.map((u, i) => (
              <div key={u.name} style={{
                display: 'grid', gridTemplateColumns: '150px 100px 130px 1fr 80px',
                padding: '11px 16px', borderBottom: i < users.length - 1 ? `1px solid ${A.border}` : 'none',
                background: i % 2 === 1 ? 'rgba(255,255,255,0.015)' : 'transparent', alignItems: 'center',
              }}>
                <span style={{ fontSize: 12, fontWeight: 500, fontFamily: A.mono, color: u.disabled ? A.textFaint : A.text }}>{u.name}</span>
                <APill tone={u.group === 'full' ? 'bad' : u.group === 'write' ? 'warn' : 'dim'}>{u.group}</APill>
                <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint }}>{u.lastLogin || 'never'}</span>
                <span style={{ fontSize: 11, color: A.textDim }}>{u.comment || '—'}</span>
                <button onClick={() => handleRemove(u.name)} style={{ background: 'rgba(239,68,68,0.15)', color: '#FCA5A5', border: 'none', borderRadius: 6, padding: '4px 10px', cursor: 'pointer', fontSize: 11 }}>Remove</button>
              </div>
            ))}
          </div>
        </div>

        {showAdd && (
          <div style={{ width: 272, flexShrink: 0, marginLeft: 12 }}>
            <ACard pad={16}>
              <div style={{ fontSize: 13, fontWeight: 600, color: A.text, marginBottom: 14 }}>Add user</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                <ALabeledField label="Username" sub="alphanumeric + . - _" value={uName} onChange={e => setUName(e.target.value)} mono />
                <ALabeledField label="Password" sub="min 8 chars recommended" value={uPass} onChange={e => setUPass(e.target.value)} type="password" />
                <div>
                  <div style={{ fontSize: 11, fontWeight: 500, color: A.text, marginBottom: 6 }}>Access group</div>
                  <div style={{ display: 'flex', gap: 5 }}>
                    {['read','write','full'].map(g => (
                      <button key={g} onClick={() => setUGroup(g)} style={{ flex: 1, padding: '6px 0', borderRadius: 7, border: `1px solid ${uGroup === g ? A.accent : A.border}`, background: uGroup === g ? A.accentSoft : 'transparent', color: uGroup === g ? '#BFDBFE' : A.textDim, fontFamily: A.mono, fontSize: 11, cursor: 'pointer' }}>{g}</button>

                <ALabeledField label="Comment" sub="optional note" value={uComment} onChange={e => setUComment(e.target.value)} />

const VlanScreen = ({ sessionId }) => {
  const [vlans, setVlans] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [showForm, setShowForm] = React.useState(false);
  const [ifaces, setIfaces] = React.useState([]);
  const [form, setForm] = React.useState({ name:'vlan10', vlanId:'10', interface:'ether1', comment:'' });
  const [msg, setMsg] = React.useState('');
  const [busy, setBusy] = React.useState(false);

  const load = React.useCallback(async () => {
    setLoading(true);
    try {
      const [vRes, iRes] = await Promise.allSettled([
        API.getVlans(sessionId),
        API.getInterfaces(sessionId),
      ]);
      if (vRes.status === 'fulfilled') setVlans(Array.isArray(vRes.value) ? vRes.value : []);
      if (iRes.status === 'fulfilled') {
        const all = Array.isArray(iRes.value) ? iRes.value : [];
        setIfaces(all.filter(i => ['ether','bridge','bonding','lag'].includes(i.type)));
      }
    } finally { setLoading(false); }
  }, [sessionId]);

  React.useEffect(() => { load(); }, [load]);

  const handleAdd = async () => {
    setBusy(true); setMsg('');
    try {
      await API.addVlan(sessionId, form.name, parseInt(form.vlanId), form.interface, form.comment);
      setShowForm(false);
      setForm({ name:'vlan10', vlanId:'10', interface: ifaces[0]?.name || 'ether1', comment:'' });
      load();
    } catch (e) { setMsg(e.message); }
    finally { setBusy(false); }
  };

  const handleRemove = async (name) => {
    if (!confirm(`Remove VLAN "${name}"?`)) return;
    try { await API.removeVlan(sessionId, name); load(); }
    catch (e) { setMsg(e.message); }
  };

  const col  = { color: A.textMuted, fontSize: 11, fontWeight: 600, padding: '8px 14px', borderBottom: `1px solid ${A.border}`, textAlign:'left' };
  const cell = { padding: '10px 14px', borderBottom: `1px solid ${A.border}`, fontSize: 13 };

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
      <div style={{ padding: '16px 20px 12px', borderBottom: `1px solid ${A.border}`, display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
        <div>
          <div style={{ fontWeight:700, fontSize:16 }}>VLANs</div>
          <div style={{ fontSize:12, color:A.textMuted }}>{vlans.length} virtual interfaces · 802.1Q tagging</div>
        </div>
        <button onClick={() => setShowForm(s => !s)} style={{ background: A.accent, color:'#fff', border:'none', borderRadius:8, padding:'7px 16px', cursor:'pointer', fontSize:13, fontWeight:600 }}>
          + Add VLAN
        </button>
      </div>
      <div style={{ flex:1, overflow:'auto', padding:20 }}>
        {showForm && (
          <div style={{ background: A.surface, border:`1px solid ${A.border}`, borderRadius:10, padding:16, marginBottom:16 }}>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr auto', gap:10, alignItems:'end' }}>
              <div>
                <div style={{ fontSize:11, color:A.textMuted, marginBottom:4 }}>Name</div>
                <AInput value={form.name} onChange={e => setForm(f => ({...f, name:e.target.value}))} placeholder="vlan10" />
              </div>
              <div>
                <div style={{ fontSize:11, color:A.textMuted, marginBottom:4 }}>VLAN ID (1–4094)</div>
                <AInput type="number" min="1" max="4094" value={form.vlanId} onChange={e => setForm(f => ({...f, vlanId:e.target.value}))} placeholder="10" />
              </div>
              <div>
                <div style={{ fontSize:11, color:A.textMuted, marginBottom:4 }}>Interface</div>
                <ASelect value={form.interface} onChange={e => setForm(f => ({...f, interface:e.target.value}))}>
                  {ifaces.length > 0 ? ifaces.map(i => <option key={i.name} value={i.name}>{i.name}</option>) : <option value="ether1">ether1</option>}
                </ASelect>
              </div>
              <div>
                <div style={{ fontSize:11, color:A.textMuted, marginBottom:4 }}>Comment</div>
                <AInput value={form.comment} onChange={e => setForm(f => ({...f, comment:e.target.value}))} placeholder="optional" />
              </div>
              <button onClick={handleAdd} disabled={busy}
                style={{ background:A.accent, color:'#fff', border:'none', borderRadius:8, padding:'8px 18px', cursor:'pointer', fontSize:13, whiteSpace:'nowrap', height:34 }}>
                {busy ? '…' : 'Add'}
              </button>
            </div>
            {msg && <div style={{ marginTop:8, color:A.bad, fontSize:12 }}>{msg}</div>}
          </div>
        )}
        {loading ? (
          <div style={{ textAlign:'center', color:A.textMuted, padding:40 }}>Loading…</div>
        ) : vlans.length === 0 ? (
          <div style={{ background:A.surface, border:`1px solid ${A.border}`, borderRadius:10, padding:40, textAlign:'center' }}>
            <div style={{ fontSize:32, marginBottom:8 }}>🔀</div>
            <div style={{ color:A.textMuted }}>No VLANs configured</div>
            <div style={{ fontSize:12, color:A.textMuted, marginTop:4 }}>Click "+ Add VLAN" to create a 802.1Q virtual interface</div>
          </div>
        ) : (
          <div style={{ background:A.surface, border:`1px solid ${A.border}`, borderRadius:10, overflow:'hidden' }}>
            <table style={{ width:'100%', borderCollapse:'collapse' }}>
              <thead>
                <tr>{['Name','VLAN ID','Interface','Status','Comment',''].map(h => <th key={h} style={col}>{h}</th>)}</tr>
              </thead>
              <tbody>
                {vlans.map(v => (
                  <tr key={v.name}>
                    <td style={cell}><span style={{ fontWeight:600 }}>{v.name}</span></td>
                    <td style={cell}><span style={{ fontFamily:'monospace', background:A.surface2, padding:'2px 8px', borderRadius:4 }}>{v.vlanId}</span></td>
                    <td style={cell}>{v.interface}</td>
                    <td style={cell}>

                      </span>
                    </td>
                    <td style={{ ...cell, color:A.textMuted }}>{v.comment || '—'}</td>
                    <td style={cell}>
                      <button onClick={() => handleRemove(v.name)}
                        style={{ background:'transparent', border:`1px solid ${A.bad}`, color:A.bad, borderRadius:6, padding:'3px 10px', cursor:'pointer', fontSize:11 }}>

                    </td>
                  </tr>

              </tbody>
            </table>
          </div>
        )}
      </div>

};

const RoutesScreen = ({ sessionId }) => {
  const [routes, setRoutes] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [showForm, setShowForm] = React.useState(false);
  const [dest, setDest] = React.useState('');
  const [gw, setGw] = React.useState('');
  const [dist, setDist] = React.useState('0');
  const [comment, setComment] = React.useState('');
  const [page, setPage] = React.useState(0);
  const PAGE_SIZE = 12;

  React.useEffect(() => {
    if (!sessionId) return;
    const fetch = async () => {
      setLoading(true);
      try {
        const data = await API.getRoutes(sessionId);
        setRoutes(data);
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    };
    fetch();
  }, [sessionId]);

  const handleAdd = async () => {
    if (!dest || !gw) {
      setError('Destination and gateway required');
      return;
    }
    try {
      await API.addRoute(sessionId, dest, gw, dist, comment);
      setDest('');
      setGw('');
      setDist('0');
      setComment('');
      setShowForm(false);
      const data = await API.getRoutes(sessionId);
      setRoutes(data);
    } catch (err) {
      setError(err.message);
    }
  };

  const handleDelete = async (id) => {
    if (!window.confirm('Delete this route?')) return;
    try {
      await API.removeRoute(sessionId, id);
      const data = await API.getRoutes(sessionId);
      setRoutes(data);
    } catch (err) {
      setError(err.message);
    }
  };

  if (loading) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
        <h2 style={{ color: A.text }}>Routes</h2>
        <ABtn variant="primary" onClick={() => setShowForm(!showForm)}>+ Add Route</ABtn>
      </div>

      {error && <AAlert>{error}</AAlert>}

      {showForm && (
        <ACard pad={16} style={{ marginBottom: 16 }}>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Destination</label>
            <input type="text" placeholder="0.0.0.0/0" value={dest} onChange={e => setDest(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }} />
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Gateway</label>
            <input type="text" placeholder="192.168.1.1" value={gw} onChange={e => setGw(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }} />
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Distance (metric)</label>
            <input type="number" value={dist} onChange={e => setDist(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }} />
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Comment</label>
            <input type="text" placeholder="Optional comment" value={comment} onChange={e => setComment(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui }} />
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <ABtn variant="primary" onClick={handleAdd} style={{ flex: 1 }}>Add</ABtn>
            <ABtn variant="secondary" onClick={() => setShowForm(false)} style={{ flex: 1 }}>Cancel</ABtn>
          </div>
        </ACard>
      )}

      {(() => {
        const startIdx = page * PAGE_SIZE;
        const endIdx = startIdx + PAGE_SIZE;
        const paginatedRoutes = routes.slice(startIdx, endIdx);
        const totalPages = Math.ceil(routes.length / PAGE_SIZE);

        return (
          <div style={{ display: 'flex', flexDirection: 'column', flex: 1 }}>
            <div style={{ flex: 1, overflow: 'auto', marginBottom: totalPages > 1 ? 16 : 0 }}>
              {paginatedRoutes.map(route => (
                <ACard key={route.id} pad={12} style={{ marginBottom: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8, alignItems: 'flex-start' }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 12, fontWeight: 600, color: A.text, fontFamily: A.mono }}>{route.destination}</div>
                      <div style={{ fontSize: 10, color: A.textDim }}>via {route.gateway}</div>
                    </div>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                      <APill tone={route.disabled ? 'dim' : 'good'}>{route.distance}</APill>
                      <button onClick={() => handleDelete(route.id)} style={{
                        background: 'rgba(239,68,68,0.2)', color: '#FCA5A5', border: 'none', borderRadius: 4, padding: '4px 8px', cursor: 'pointer', fontSize: 11, fontWeight: 500, minWidth: 60
                      }}>Delete</button>
                    </div>
                  </div>
                  {route.comment && <div style={{ fontSize: 10, color: A.textFaint }}>• {route.comment}</div>}
                </ACard>
              ))}
            </div>
            {totalPages > 1 && (
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', justifyContent: 'center', borderTop: `1px solid ${A.border}`, paddingTop: 16 }}>
                <button onClick={() => setPage(Math.max(0, page - 1))} disabled={page === 0} style={{
                  padding: '6px 12px', background: page === 0 ? A.surface : A.accent, color: A.text, border: 'none',
                  borderRadius: 4, cursor: page === 0 ? 'not-allowed' : 'pointer', fontSize: 12, opacity: page === 0 ? 0.5 : 1
                }}>← Prev</button>
                <span style={{ color: A.textDim, fontSize: 12 }}>Page {page + 1} of {totalPages}</span>
                <button onClick={() => setPage(Math.min(totalPages - 1, page + 1))} disabled={page === totalPages - 1} style={{
                  padding: '6px 12px', background: page === totalPages - 1 ? A.surface : A.accent, color: A.text, border: 'none',
                  borderRadius: 4, cursor: page === totalPages - 1 ? 'not-allowed' : 'pointer', fontSize: 12, opacity: page === totalPages - 1 ? 0.5 : 1
                }}>Next →</button>
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
};

const DnsScreen = ({ sessionId }) => {
  const [dns, setDns]           = React.useState(null);
  const [statics, setStatics]   = React.useState([]);
  const [loading, setLoading]   = React.useState(true);
  const [servers, setServers]   = React.useState([]);
  const [newServer, setNewServer] = React.useState('');
  const [allowRemote, setAllowRemote] = React.useState(false);
  const [saveMsg, setSaveMsg]   = React.useState('');
  const [showAdd, setShowAdd]   = React.useState(false);
  const [newName, setNewName]   = React.useState('');
  const [newAddr, setNewAddr]   = React.useState('0.0.0.0');
  const [newSubdomain, setNewSubdomain] = React.useState(true);
  const [addMsg, setAddMsg]     = React.useState('');

  const load = React.useCallback(async () => {
    setLoading(true);
    try {
      const [dnsData, statData] = await Promise.allSettled([
        API.getDns(sessionId),
        API.getDnsStatic(sessionId),
      ]);
      if (dnsData.status === 'fulfilled') {
        setDns(dnsData.value);
        setServers(dnsData.value.servers || []);
        setAllowRemote(dnsData.value.allowRemoteRequests || false);
      }
      if (statData.status === 'fulfilled') setStatics(Array.isArray(statData.value) ? statData.value : []);
    } catch {}
    setLoading(false);
  }, [sessionId]);

  React.useEffect(() => {
    if (!sessionId) return;
    load();
    const iv = setInterval(load, 8000);
    return () => clearInterval(iv);
  }, [sessionId, load]);

  const handleSave = async () => {
    setSaveMsg('Saving…');
    try {
      await API.updateDns(sessionId, servers, allowRemote);
      setSaveMsg('✓ Saved');
    } catch (e) { setSaveMsg('✗ ' + e.message); }
    setTimeout(() => setSaveMsg(''), 3000);
  };

  const handleAddStatic = async () => {
    if (!newName.trim() || !newAddr.trim()) { setAddMsg('Name and address required'); return; }
    setAddMsg('Adding…');
    try {
      await API.addDnsStatic(sessionId, newName.trim(), newAddr.trim(), 'A', newSubdomain, '');
      setAddMsg('✓ Added');
      setNewName(''); setNewAddr('0.0.0.0'); setShowAdd(false);
      await load();
    } catch (e) { setAddMsg('✗ ' + e.message); }
    setTimeout(() => setAddMsg(''), 3000);
  };

  const handleRemoveStatic = async (id) => {
    try { await API.removeDnsStatic(sessionId, id); await load(); } catch (e) { alert(e.message); }
  };

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '14px 20px 12px', flexShrink: 0 }}>
        <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>DNS · Resolver</div>
        <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>/ip dns · /ip dns static · {statics.length} static entries</div>
      </div>

      <div style={{ flex: 1, overflow: 'auto', padding: '0 20px 20px', display: 'flex', gap: 16, alignItems: 'flex-start' }}>
        {/* Left: static entries */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 0, background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12, overflow: 'hidden', minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', padding: '10px 16px', borderBottom: `1px solid ${A.border}` }}>
            <span style={{ fontSize: 12, fontWeight: 600, color: A.text }}>Static DNS entries</span>
            <span style={{ flex: 1 }} />
            <ABtn kind="primary" onClick={() => { setShowAdd(true); setAddMsg(''); }}>+ Add entry</ABtn>
          </div>

          {showAdd && (
            <div style={{ padding: '12px 16px', borderBottom: `1px solid ${A.border}`, background: 'rgba(59,130,246,0.04)' }}>
              <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
                <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="hostname or domain (e.g. youtube.com)"
                  style={{ flex: 2, padding: '6px 10px', background: 'rgba(0,0,0,0.2)', border: `1px solid ${A.border}`, borderRadius: 7, color: A.text, fontFamily: A.mono, fontSize: 12, outline: 'none' }} />
                <input value={newAddr} onChange={e => setNewAddr(e.target.value)} placeholder="0.0.0.0 or IP"
                  style={{ flex: 1, padding: '6px 10px', background: 'rgba(0,0,0,0.2)', border: `1px solid ${A.border}`, borderRadius: 7, color: A.text, fontFamily: A.mono, fontSize: 12, outline: 'none' }} />
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                <label style={{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer', fontSize: 11, color: A.textDim }}>
                  <input type="checkbox" checked={newSubdomain} onChange={e => setNewSubdomain(e.target.checked)} />
                  match-subdomain=yes (blocks *.domain)
                </label>
              </div>
              <div style={{ display: 'flex', gap: 6 }}>
                <ABtn kind="secondary" onClick={() => setShowAdd(false)}>Cancel</ABtn>
                <ABtn kind="primary" onClick={handleAddStatic}>Add</ABtn>
              </div>
              {addMsg && <div style={{ fontSize: 11, marginTop: 6, color: addMsg.includes('✓') ? A.good : A.bad }}>{addMsg}</div>}
            </div>
          )}

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 130px 80px 90px', padding: '8px 16px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em' }}>
            <span>Name</span><span>Address</span><span>Subdomain</span><span>Action</span>
          </div>
          <div style={{ maxHeight: 420, overflow: 'auto' }}>
            {statics.length === 0 ? (
              <div style={{ padding: 32, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No static entries</div>
            ) : statics.map((s, i) => (
              <div key={s.id || i} style={{
                display: 'grid', gridTemplateColumns: '1fr 130px 80px 90px',
                padding: '10px 16px', borderBottom: i < statics.length - 1 ? `1px solid ${A.border}` : 'none',
                background: i % 2 === 1 ? 'rgba(255,255,255,0.015)' : 'transparent', alignItems: 'center',
              }}>
                <span style={{ fontSize: 12, fontFamily: A.mono, color: s.disabled ? A.textFaint : A.text }}>{s.name}</span>
                <span style={{ fontSize: 11, fontFamily: A.mono, color: s.address === '0.0.0.0' ? A.bad : A.good }}>{s.address || '—'}</span>
                <APill tone={s.matchSubdomain ? 'accent' : 'dim'}>{s.matchSubdomain ? 'yes' : 'no'}</APill>
                <button onClick={() => handleRemoveStatic(s.id)} style={{ background: 'rgba(239,68,68,0.15)', color: '#FCA5A5', border: 'none', borderRadius: 6, padding: '4px 10px', cursor: 'pointer', fontSize: 11 }}>Remove</button>
              </div>
            ))}
          </div>
        </div>

        {/* Right: DNS server settings */}
        <div style={{ width: 280, flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 12 }}>
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>DNS Servers</div>
            <div style={{ display: 'flex', gap: 6, marginBottom: 10 }}>
              <input value={newServer} onChange={e => setNewServer(e.target.value)} placeholder="8.8.8.8"
                style={{ flex: 1, padding: '6px 10px', background: 'rgba(0,0,0,0.2)', border: `1px solid ${A.border}`, borderRadius: 7, color: A.text, fontFamily: A.mono, fontSize: 12, outline: 'none' }} />
              <ABtn kind="secondary" onClick={() => {
                if (newServer && /^\d+\.\d+\.\d+\.\d+$/.test(newServer.trim())) {
                  setServers(p => [...p, newServer.trim()]);
                  setNewServer('');
                }
              }}>Add</ABtn>
            </div>
            {servers.map(ip => (
              <div key={ip} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 10px', background: 'rgba(0,0,0,0.15)', borderRadius: 6, marginBottom: 5 }}>
                <span style={{ fontSize: 11, fontFamily: A.mono, color: A.text }}>{ip}</span>
                <button onClick={() => setServers(p => p.filter(s => s !== ip))} style={{ background: 'none', border: 'none', color: A.bad, cursor: 'pointer', fontSize: 14, lineHeight: 1 }}>×</button>
              </div>
            ))}
          </ACard>

          <ACard pad={16}>
            <AToggleRow label="Allow remote requests" sub="clients can use this router as DNS" on={allowRemote} onChange={setAllowRemote} />
          </ACard>

          <ACard pad={14}>
            <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono, marginBottom: 4 }}>Cache size: {dns?.cacheSize || 2048} KB</div>
            <div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>Max TTL: {dns?.cacheMaxTtl || '1w'}</div>
          </ACard>

          {saveMsg && <div style={{ fontSize: 11, color: saveMsg.includes('✓') ? A.good : A.bad, fontFamily: A.mono }}>{saveMsg}</div>}
          <ABtn kind="primary" onClick={handleSave} full>Save DNS settings</ABtn>
        </div>
      </div>
    </div>
  );
};

const NatScreen = ({ sessionId }) => {
  const [rules, setRules] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [showForm, setShowForm] = React.useState(false);
  const [chain, setChain] = React.useState('srcnat');
  const [srcAddr, setSrcAddr] = React.useState('');
  const [action, setAction] = React.useState('masquerade');
  const [page, setPage] = React.useState(0);
  const PAGE_SIZE = 12;

  React.useEffect(() => {
    if (!sessionId) return;
    const fetch = async () => {
      setLoading(true);
      try {
        const data = await API.getNat(sessionId);
        setRules(data);
      } catch (err) {
        console.error(err);
      } finally {
        setLoading(false);
      }
    };
    fetch();
  }, [sessionId]);

  const handleAdd = async () => {
    try {
      await API.addNat(sessionId, chain, srcAddr, '', action, '', '');
      setChain('srcnat');
      setSrcAddr('');
      setAction('masquerade');
      setShowForm(false);
      const data = await API.getNat(sessionId);
      setRules(data);
    } catch (err) {
      alert('Error: ' + err.message);
    }
  };

  const handleDelete = async (id) => {
    if (!window.confirm('Delete this NAT rule?')) return;
    try {
      await API.removeNat(sessionId, id);
      const data = await API.getNat(sessionId);
      setRules(data);
    } catch (err) {
      alert('Error: ' + err.message);
    }
  };

  if (loading) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
        <h2 style={{ color: A.text }}>NAT Rules</h2>
        <ABtn variant="primary" onClick={() => setShowForm(!showForm)}>+ Add Rule</ABtn>
      </div>

      {showForm && (
        <ACard pad={16} style={{ marginBottom: 16 }}>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Chain</label>
            <select value={chain} onChange={e => setChain(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }}>
              <option>srcnat</option>
              <option>dstnat</option>
            </select>
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Source Address</label>
            <input type="text" placeholder="192.168.1.0/24" value={srcAddr} onChange={e => setSrcAddr(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }} />
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Action</label>
            <select value={action} onChange={e => setAction(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }}>
              <option>masquerade</option>
              <option>redirect</option>
              <option>dst-nat</option>
            </select>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <ABtn variant="primary" onClick={handleAdd} style={{ flex: 1 }}>Add</ABtn>
            <ABtn variant="secondary" onClick={() => setShowForm(false)} style={{ flex: 1 }}>Cancel</ABtn>
          </div>
        </ACard>
      )}

      {(() => {
        const startIdx = page * PAGE_SIZE;
        const endIdx = startIdx + PAGE_SIZE;
        const paginatedRules = rules.slice(startIdx, endIdx);
        const totalPages = Math.ceil(rules.length / PAGE_SIZE);

        return (
          <div style={{ display: 'flex', flexDirection: 'column', flex: 1 }}>
            <div style={{ flex: 1, overflow: 'auto', marginBottom: totalPages > 1 ? 16 : 0 }}>
              {paginatedRules.map(rule => (
                <ACard key={rule.id} pad={12} style={{ marginBottom: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 12, fontWeight: 600, color: A.text }}>{rule.action}</div>
                      <div style={{ fontSize: 10, color: A.textDim }}>{rule.chain}</div>
                    </div>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                      <APill tone={rule.disabled ? 'dim' : 'good'}>{rule.srcAddress || 'all'}</APill>
                      <button onClick={() => handleDelete(rule.id)} style={{
                        background: 'rgba(239,68,68,0.2)', color: '#FCA5A5', border: 'none', borderRadius: 4, padding: '4px 8px', cursor: 'pointer', fontSize: 11, fontWeight: 500, minWidth: 60
                      }}>Delete</button>
                    </div>
                  </div>
                </ACard>
              ))}
            </div>
            {totalPages > 1 && (
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', justifyContent: 'center', borderTop: `1px solid ${A.border}`, paddingTop: 16 }}>
                <button onClick={() => setPage(Math.max(0, page - 1))} disabled={page === 0} style={{
                  padding: '6px 12px', background: page === 0 ? A.surface : A.accent, color: A.text, border: 'none',
                  borderRadius: 4, cursor: page === 0 ? 'not-allowed' : 'pointer', fontSize: 12, opacity: page === 0 ? 0.5 : 1
                }}>← Prev</button>
                <span style={{ color: A.textDim, fontSize: 12 }}>Page {page + 1} of {totalPages}</span>
                <button onClick={() => setPage(Math.min(totalPages - 1, page + 1))} disabled={page === totalPages - 1} style={{
                  padding: '6px 12px', background: page === totalPages - 1 ? A.surface : A.accent, color: A.text, border: 'none',
                  borderRadius: 4, cursor: page === totalPages - 1 ? 'not-allowed' : 'pointer', fontSize: 12, opacity: page === totalPages - 1 ? 0.5 : 1
                }}>Next →</button>
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
};

// ========== MAIN APP ==========

const App = () => {
  // Restore session from localStorage on page refresh (6h TTL)
  const [sessionId, setSessionId] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('netforge_session') || 'null');
      if (saved?.sessionId && Date.now() - saved.ts < 6 * 3600 * 1000) return saved.sessionId;
    } catch {}
    return null;
  });
  const [router, setRouter] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('netforge_session') || 'null');
      if (saved?.sessionId && Date.now() - saved.ts < 6 * 3600 * 1000)
        return { host: saved.host, port: saved.port, username: saved.username };
    } catch {}
    return null;
  });
  const [page, setPage] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('netforge_session') || 'null');
      if (saved?.sessionId && Date.now() - saved.ts < 6 * 3600 * 1000) return 'Dashboard';
    } catch {}
    return 'Login';
  });
  const [alerts, setAlerts] = React.useState([]);
  const [history, setHistory] = React.useState(() => AlertUtils.loadHistory());
  const [showHistory, setShowHistory] = React.useState(false);

  const addAlert = React.useCallback((metric, value, threshold, severity) => {
    const id = Math.random().toString(36).substring(7);
    const alert = { id, metric, value, threshold, severity, timestamp: Date.now() };

    // Add to active alerts (max 5)
    setAlerts(prev => {
      const updated = [alert, ...prev];
      return updated.slice(0, 5);
    });

    // Add to history
    setHistory(prev => {
      const updated = [alert, ...prev];
      AlertUtils.saveHistory(updated);
      return updated;
    });
  }, []);

  const dismissAlert = React.useCallback((id) => {
    setAlerts(prev => prev.filter(a => a.id !== id));
  }, []);

  const clearHistory = React.useCallback(() => {
    setHistory([]);
    AlertUtils.saveHistory([]);
  }, []);

  const alertCtxValue = {
    alerts,
    history,
    addAlert,
    dismissAlert,
    clearHistory,
    showHistory,
    toggleHistory: () => setShowHistory(s => !s)
  };

  // Re-init WebSocket when session is restored from localStorage on page load
  React.useEffect(() => {
    if (sessionId) {
      API.initWebSocket(sessionId);
    }
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  // Handle session expiry (401 from any API call)
  React.useEffect(() => {
    const onExpired = () => {
      try { localStorage.removeItem('netforge_session'); } catch {}
      if (API.wsManager) { try { API.wsManager.close(); } catch {} API.wsManager = null; }
      setSessionId(null); setRouter(null); setPage('Login');
    };
    window.addEventListener('netforge:session-expired', onExpired);
    return () => window.removeEventListener('netforge:session-expired', onExpired);
  }, []);

  // Redirect to login if session is gone
  React.useEffect(() => {
    if (!sessionId && page !== 'Login') setPage('Login');
  }, [sessionId, page]);

  const handleLogout = async () => {
    try { localStorage.removeItem('netforge_session'); } catch {}
    if (API.wsManager) {
      try { API.wsManager.close(); } catch {}
      API.wsManager = null;
    }
    try { if (sessionId) await API.logout(sessionId); } catch {}
    setSessionId(null); setRouter(null); setPage('Login');
  };

  const renderScreen = () => {
    if (!sessionId && page !== 'Login') return null;
    switch (page) {
      case 'Login':       return <LoginScreen setPage={setPage} setSessionId={setSessionId} setRouter={setRouter} />;
      case 'Dashboard':   return <DashboardScreen sessionId={sessionId} router={router} />;
      case 'Interfaces':  return <InterfacesScreen sessionId={sessionId} />;
      case 'IP Addresses':return <IpAddressesScreen sessionId={sessionId} />;
      case 'Routes':      return <RoutesScreen sessionId={sessionId} />;
      case 'DNS':         return <DnsScreen sessionId={sessionId} />;
      case 'NAT':         return <NatScreen sessionId={sessionId} />;
      case 'WAN':         return <WANScreen sessionId={sessionId} />;
      case 'Firewall':    return <FirewallScreen sessionId={sessionId} />;
      case 'Bandwidth':   return <BandwidthScreen sessionId={sessionId} />;
      case 'Clients':     return <ClientsScreen sessionId={sessionId} />;
      case 'Hotspot':     return <HotspotScreen sessionId={sessionId} />;
      case 'Wireless':    return <WirelessScreen sessionId={sessionId} />;
      case 'VPN':         return <VpnScreen sessionId={sessionId} />;
      case 'Logs':        return <LogsScreen sessionId={sessionId} />;
      case 'Scripts':     return <ScriptsScreen sessionId={sessionId} />;
      case 'Backup':      return <BackupScreen sessionId={sessionId} />;
      case 'Users':         return <UsersScreen sessionId={sessionId} />;
      case 'Automation':    return <AutomationScreen sessionId={sessionId} />;
      case 'NetworkHealth': return <NetworkHealthScreen sessionId={sessionId} />;
      case 'PortForward':   return <PortForwardScreen sessionId={sessionId} />;
      case 'AccessControl': return <AccessControlScreen sessionId={sessionId} />;
      case 'Terminal':      return <TerminalScreen sessionId={sessionId} />;
      case 'VLANs':         return <VlanScreen sessionId={sessionId} />;
      case 'Settings':      return <SettingsScreen sessionId={sessionId} router={router} />;
      default:            return null;
    }
  };

  if (page === 'Login') return renderScreen();

  const pageLabelMap = Object.fromEntries(NAV_ITEMS.map(i => [i.page, i.label]));
  const pageLabel = pageLabelMap[page] || page;

  return (
    <AlertCtx.Provider value={alertCtxValue}>
      <div style={{ width: '100%', height: '100%', background: A.bgLayered, color: A.text, display: 'flex', flexDirection: 'column', fontFamily: A.ui, fontSize: 13, letterSpacing: '-0.005em', overflow: 'hidden' }}>

        {/* ── Title bar ── */}
        <div style={{ height: 32, display: 'flex', alignItems: 'center', flex: '0 0 auto', borderBottom: `1px solid ${A.border}`, background: 'rgba(7,11,20,0.5)', padding: '0 12px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: A.textDim, fontSize: 12 }}>
            <NetForgeMark size={14} color={A.accent} />
            <span style={{ fontWeight: 500, color: A.text }}>NetForge</span>
            <span style={{ color: A.textFaint }}>·</span>
            <span>{pageLabel}</span>
          </div>
          <div style={{ flex: 1 }} />
          <button onClick={() => setShowHistory(!showHistory)} style={{ background: 'none', border: 'none', color: alerts.length > 0 ? A.warn : A.textFaint, cursor: 'pointer', fontSize: 11, padding: '2px 8px', borderRadius: 6, fontFamily: A.ui, position: 'relative' }}>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"><path d="M8 1a5 5 0 0 1 5 5v2l1 2H2l1-2V6a5 5 0 0 1 5-5zM6 13a2 2 0 0 0 4 0"/></svg>
            {alerts.length > 0 && <span style={{ position: 'absolute', top: 0, right: 4, width: 7, height: 7, borderRadius: 999, background: A.warn, border: `2px solid rgba(7,11,20,0.9)` }} />}
          </button>
        </div>

        {/* ── Main layout ── */}
        <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
          <ASidebar
            active={page}
            router={router}
            onNavigate={setPage}
            onLogout={handleLogout}
            alertCount={alerts.length}
          />
          <main style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
            {renderScreen()}
          </main>
        </div>

        {/* Toast Container */}
        <ToastContainer alerts={alerts} onDismiss={dismissAlert} />

        {/* Alert History Panel */}
        {showHistory && (
          <AlertHistoryPanel
            history={history}
            onClose={() => setShowHistory(false)}
            onClear={clearHistory}
          />
        )}
      </div>
    </AlertCtx.Provider>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
