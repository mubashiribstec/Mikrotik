                </div>
              </div>

              {showPanel && (
                <div style={{ width: 272, flexShrink: 0 }}>
                  <ACard pad={16}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: A.text, marginBottom: 14 }}>Add WireGuard peer</div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                      <ALabeledField label="Peer name / comment" sub="any label" value={peerName} onChange={e => setPeerName(e.target.value)} />
                      <ALabeledField label="Allowed IPs" sub="tunnel address (e.g. 10.0.0.2/32)" value={peerIp} onChange={e => setPeerIp(e.target.value)} mono />
                      <ABtn kind="secondary" onClick={handleGenKeys}>Generate Keys</ABtn>
                      {genKeys && (
                        <div style={{ background: 'rgba(0,0,0,0.2)', borderRadius: 8, padding: '8px 10px', fontSize: 10, fontFamily: A.mono }}>
                          <div style={{ color: A.textFaint, marginBottom: 3 }}>Public key (paste into router):</div>
                          <div style={{ color: A.good, wordBreak: 'break-all' }}>{genKeys.publicKey}</div>
                          <div style={{ color: A.textFaint, marginTop: 6, marginBottom: 3 }}>Private key (for client config — keep secret):</div>
                          <div style={{ color: A.warn, wordBreak: 'break-all' }}>{genKeys.privateKey}</div>
                        </div>
                      )}
                      <div style={{ display: 'flex', gap: 8 }}>
                        <ABtn kind="secondary" onClick={() => { setShowPanel(false); setGenKeys(null); }}>Cancel</ABtn>
                        <ABtn kind="primary" onClick={handleCreate} full>Create</ABtn>
                      </div>
                    </div>
                  </ACard>
                </div>
              )}
            </div>
          </>
        )}

        {/* PPTP */}
        {activeProto === 'pptp' && (
          <div style={{ display: 'flex', gap: 12 }}>
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 12 }}>
              <ACard pad={16}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 600, color: A.text }}>PPTP Server</div>
                    <div style={{ fontSize: 11, color: A.textFaint }}>Legacy VPN — not recommended for production</div>
                  </div>
                  <ABtn kind={pptpEnabled ? 'danger' : 'primary'} onClick={handlePptpToggle}>{pptpEnabled ? 'Disable' : 'Enable'}</ABtn>
                </div>
                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                  <ALabeledField label="Local address" value={pptpLocal} onChange={e => setPptpLocal(e.target.value)} mono style={{ flex: '1 1 120px' }} />
                  <ALabeledField label="Remote pool start" value={pptpStart} onChange={e => setPptpStart(e.target.value)} mono style={{ flex: '1 1 120px' }} />
                  <ALabeledField label="Remote pool end" value={pptpEnd} onChange={e => setPptpEnd(e.target.value)} mono style={{ flex: '1 1 120px' }} />
                </div>
                {serverMsg && <div style={{ fontSize: 11, marginTop: 10, color: serverMsg.includes('✓') ? A.good : A.bad }}>{serverMsg}</div>}
              </ACard>

              <ACard pad={0} style={{ overflow: 'hidden' }}>
                <div style={{ padding: '10px 16px', borderBottom: `1px solid ${A.border}` }}>
                  <span style={{ fontSize: 12, fontWeight: 600, color: A.text }}>PPTP users (PPP secrets)</span>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 100px 1fr 60px', padding: '8px 16px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em' }}>
                  <span>Username</span><span>Service</span><span>Profile</span><span></span>
                </div>
                <div style={{ maxHeight: 200, overflow: 'auto' }}>
                  {pppSecrets.filter(s => !s.service || s.service === 'pptp' || s.service === 'any').length === 0 ? (
                    <div style={{ padding: '20px', textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No PPTP users</div>
                  ) : pppSecrets.filter(s => !s.service || s.service === 'pptp' || s.service === 'any').map((s, i) => (
                    <div key={i} style={{ display: 'grid', gridTemplateColumns: '1fr 100px 1fr 60px', padding: '8px 16px', borderBottom: `1px solid ${A.border}`, alignItems: 'center', fontSize: 12 }}>
                      <span style={{ fontFamily: A.mono }}>{s.name}</span>
                      <APill tone="dim">{s.service || 'any'}</APill>
                      <span style={{ fontSize: 11, color: A.textDim }}>{s.profile || '—'}</span>
                      <button onClick={() => handleRemovePppSecret(s.name)} style={{ background: 'rgba(239,68,68,0.15)', color: '#FCA5A5', border: 'none', borderRadius: 6, padding: '3px 8px', cursor: 'pointer', fontSize: 10 }}>Del</button>
                    </div>
                  ))}
                </div>
              </ACard>
            </div>

            <div style={{ width: 240, flexShrink: 0 }}>
              <ACard pad={16}>
                <div style={{ fontSize: 13, fontWeight: 600, color: A.text, marginBottom: 12 }}>Add PPTP user</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  <ALabeledField label="Username" value={pppUser} onChange={e => setPppUser(e.target.value)} mono />
                  <ALabeledField label="Password" type="password" value={pppPass} onChange={e => setPppPass(e.target.value)} />
                  <ABtn kind="primary" onClick={handleAddPppUser} full>Add user</ABtn>
                </div>
              </ACard>
            </div>
          </div>
        )}

        {/* L2TP */}
        {activeProto === 'l2tp' && (
          <div style={{ display: 'flex', gap: 12 }}>
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 12 }}>
              <ACard pad={16}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 600, color: A.text }}>L2TP/IPsec Server</div>
                    <div style={{ fontSize: 11, color: A.textFaint }}>Native Windows/iOS/macOS client support</div>
                  </div>
                  <ABtn kind={l2tpEnabled ? 'danger' : 'primary'} onClick={handleL2tpToggle}>{l2tpEnabled ? 'Disable' : 'Enable'}</ABtn>
                </div>
                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                  <ALabeledField label="Local address" value={l2tpLocal} onChange={e => setL2tpLocal(e.target.value)} mono style={{ flex: '1 1 120px' }} />
                  <ALabeledField label="Remote pool start" value={l2tpStart} onChange={e => setL2tpStart(e.target.value)} mono style={{ flex: '1 1 120px' }} />
                  <ALabeledField label="Remote pool end" value={l2tpEnd} onChange={e => setL2tpEnd(e.target.value)} mono style={{ flex: '1 1 120px' }} />
                  <ALabeledField label="IPsec shared secret" value={l2tpSecret} onChange={e => setL2tpSecret(e.target.value)} mono style={{ flex: '2 1 200px' }} />
                </div>
                {serverMsg && <div style={{ fontSize: 11, marginTop: 10, color: serverMsg.includes('✓') ? A.good : A.bad }}>{serverMsg}</div>}
              </ACard>

              <ACard pad={0} style={{ overflow: 'hidden' }}>
                <div style={{ padding: '10px 16px', borderBottom: `1px solid ${A.border}` }}>
                  <span style={{ fontSize: 12, fontWeight: 600, color: A.text }}>L2TP users (PPP secrets)</span>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 100px 1fr 60px', padding: '8px 16px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em' }}>
                  <span>Username</span><span>Service</span><span>Profile</span><span></span>
                </div>
                <div style={{ maxHeight: 200, overflow: 'auto' }}>
                  {pppSecrets.filter(s => !s.service || s.service === 'l2tp' || s.service === 'any').length === 0 ? (
                    <div style={{ padding: '20px', textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No L2TP users</div>
                  ) : pppSecrets.filter(s => !s.service || s.service === 'l2tp' || s.service === 'any').map((s, i) => (
                    <div key={i} style={{ display: 'grid', gridTemplateColumns: '1fr 100px 1fr 60px', padding: '8px 16px', borderBottom: `1px solid ${A.border}`, alignItems: 'center', fontSize: 12 }}>
                      <span style={{ fontFamily: A.mono }}>{s.name}</span>
                      <APill tone="dim">{s.service || 'any'}</APill>
                      <span style={{ fontSize: 11, color: A.textDim }}>{s.profile || '—'}</span>
                      <button onClick={() => handleRemovePppSecret(s.name)} style={{ background: 'rgba(239,68,68,0.15)', color: '#FCA5A5', border: 'none', borderRadius: 6, padding: '3px 8px', cursor: 'pointer', fontSize: 10 }}>Del</button>
                    </div>
                  ))}
                </div>
              </ACard>
            </div>

            <div style={{ width: 240, flexShrink: 0 }}>
              <ACard pad={16}>
                <div style={{ fontSize: 13, fontWeight: 600, color: A.text, marginBottom: 12 }}>Add L2TP user</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  <ALabeledField label="Username" value={pppUser} onChange={e => setPppUser(e.target.value)} mono />
                  <ALabeledField label="Password" type="password" value={pppPass} onChange={e => setPppPass(e.target.value)} />
                  <ABtn kind="primary" onClick={handleAddPppUser} full>Add user</ABtn>
                </div>
              </ACard>
            </div>
          </div>
        )}

        {/* OpenVPN */}
        {activeProto === 'ovpn' && (
          <ACard pad={24} style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: A.text, marginBottom: 8 }}>OpenVPN</div>
            <div style={{ fontSize: 12, color: A.textFaint }}>OpenVPN configuration requires certificate management. Export config from RouterOS via /export and apply via Winbox or terminal.</div>
          </ACard>
        )}
      </div>
      {qrTarget && <QrModal config={qrTarget} onClose={() => setQrTarget(null)} />}
    </div>
  );
};

const LOG_SEVERITIES = ['info','warning','error','debug'];
const LOG_SEV_TONE   = { info: 'good', warning: 'warn', error: 'bad', debug: 'dim' };

const LogsScreen = ({ sessionId }) => {
  const [logs, setLogs]           = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [search, setSearch]       = React.useState('');
  const [activeTopic, setActiveTopic] = React.useState(null);
  const [activeSevs, setActiveSevs]   = React.useState(new Set(LOG_SEVERITIES));

  React.useEffect(() => {
    if (!sessionId) return;
    const fetch = async () => {
      setLoading(true);
      try { const d = await API.getLogs(sessionId); setLogs(Array.isArray(d) ? d : []); } catch {}
      setLoading(false);
    };
    fetch();
    const iv = setInterval(fetch, 5000);
    return () => clearInterval(iv);
  }, [sessionId]);

  const topicCounts = React.useMemo(() => {
    const m = {};
    logs.forEach(l => { const t = l.topic || 'system'; m[t] = (m[t] || 0) + 1; });
    return m;
  }, [logs]);

  const topics = Object.keys(topicCounts).sort();

  const toggleSev = (s) => setActiveSevs(prev => {
    const n = new Set(prev);
    if (n.has(s)) n.delete(s); else n.add(s);
    return n;
  });

  const inferSev = (log) => {
    const t = (log.topic || '').toLowerCase();
    const m = (log.msg  || '').toLowerCase();
    if (t === 'error' || m.includes('error') || m.includes('fail'))  return 'error';
    if (t === 'warning' || m.includes('warn'))                        return 'warning';
    if (t === 'debug')                                                 return 'debug';
    return 'info';
  };

  const filtered = React.useMemo(() => logs.filter(l => {
    const sev = inferSev(l);
    if (!activeSevs.has(sev)) return false;
    if (activeTopic && (l.topic || 'system') !== activeTopic) return false;
    if (search) {
      const q = search.toLowerCase();
      return (l.msg||'').toLowerCase().includes(q) || (l.topic||'').toLowerCase().includes(q) || (l.source||'').toLowerCase().includes(q);
    }
    return true;
  }), [logs, activeSevs, activeTopic, search]);

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>System Logs</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>{filtered.length} of {logs.length} entries</div>
        </div>
        <APill tone="dim" mono>live · 5s</APill>
      </div>

      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', padding: '12px 20px 20px', gap: 12 }}>
        {/* left filter rail */}
        <div style={{ width: 196, flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 12 }}>
          {/* topics */}
          <ACard pad={0}>
            <div style={{ padding: '10px 14px 8px', borderBottom: `1px solid ${A.border}`, fontSize: 11, fontWeight: 600, color: A.textDim, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Topics</div>
            <div style={{ overflow: 'auto', maxHeight: 260 }}>
              <div onClick={() => setActiveTopic(null)} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 14px', cursor: 'pointer', background: !activeTopic ? A.accentSoft : 'transparent' }}>
                <span style={{ fontSize: 12, color: !activeTopic ? '#BFDBFE' : A.textDim }}>All topics</span>
                <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint }}>{logs.length}</span>
              </div>
              {topics.map(t => (
                <div key={t} onClick={() => setActiveTopic(activeTopic === t ? null : t)} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 14px', cursor: 'pointer', background: activeTopic === t ? A.accentSoft : 'transparent' }}>
                  <span style={{ fontSize: 12, color: activeTopic === t ? '#BFDBFE' : A.textDim, fontFamily: A.mono }}>{t}</span>
                  <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint }}>{topicCounts[t]}</span>
                </div>
              ))}
            </div>
          </ACard>

          {/* severities */}
          <ACard pad={12}>
            <div style={{ fontSize: 11, fontWeight: 600, color: A.textDim, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 10 }}>Severity</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {LOG_SEVERITIES.map(s => (
                <div key={s} onClick={() => toggleSev(s)} style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', opacity: activeSevs.has(s) ? 1 : 0.4 }}>
                  <div style={{ width: 14, height: 14, borderRadius: 3, border: `2px solid ${activeSevs.has(s) ? A.accent : 'rgba(255,255,255,0.2)'}`, background: activeSevs.has(s) ? A.accentSoft : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                    {activeSevs.has(s) && <div style={{ width: 6, height: 6, borderRadius: 1, background: A.accent }} />}
                  </div>
                  <APill tone={LOG_SEV_TONE[s]}>{s}</APill>
                </div>
              ))}
            </div>
          </ACard>
        </div>

        {/* right log table */}
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12 }}>
          {/* search bar */}
          <div style={{ padding: '10px 14px', borderBottom: `1px solid ${A.border}`, flexShrink: 0 }}>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search logs…" style={{ width: '100%', padding: '7px 12px', background: 'rgba(0,0,0,0.2)', border: `1px solid ${A.border}`, borderRadius: 8, fontFamily: A.mono, fontSize: 12, color: A.text, outline: 'none', boxSizing: 'border-box' }} />
          </div>
          {/* header */}
          <div style={{ display: 'grid', gridTemplateColumns: '140px 100px 110px 1fr', padding: '8px 14px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', flexShrink: 0 }}>
            <span>Time</span><span>Topic</span><span>Source</span><span>Message</span>
          </div>
          {/* rows */}
          <div style={{ flex: 1, overflow: 'auto' }}>
            {filtered.length === 0 ? (
              <div style={{ padding: 32, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No logs match filter</div>
            ) : filtered.map((log, i) => {
              const sev = inferSev(log);
              return (
                <div key={i} style={{
                  display: 'grid', gridTemplateColumns: '140px 100px 110px 1fr',
                  padding: '8px 14px', borderBottom: i < filtered.length - 1 ? `1px solid rgba(255,255,255,0.04)` : 'none',
                  background: i % 2 === 1 ? 'rgba(255,255,255,0.01)' : 'transparent', alignItems: 'baseline',
                }}>
                  <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint }}>{log.time || '—'}</span>
                  <APill tone={LOG_SEV_TONE[sev]}>{log.topic || 'system'}</APill>
                  <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{log.source || '—'}</span>
                  <span style={{ fontSize: 12, color: sev === 'error' ? '#FCA5A5' : sev === 'warning' ? '#FCD34D' : A.text }}>{log.msg || ''}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
};

const SCHED_OPTS = [
  { id: 'manual', label: 'Manual' },
  { id: '30s',    label: 'Every 30s' },
  { id: '1h',     label: 'Hourly' },
  { id: 'daily',  label: 'Daily 22:00' },
  { id: 'custom', label: 'Custom cron' },
];

const ScriptsScreen = ({ sessionId }) => {
  const [scripts, setScripts]     = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [selected, setSelected]   = React.useState(null);
  const [schedule, setSchedule]   = React.useState('manual');
  const [executing, setExecuting] = React.useState(null);
  const [execOutput, setExecOutput] = React.useState(null);
  const [execStatus, setExecStatus] = React.useState('idle');
  const [execElapsed, setExecElapsed] = React.useState(0);
  const [showNew, setShowNew]     = React.useState(false);
  const [newName, setNewName]     = React.useState('');
  const [newSource, setNewSource] = React.useState('# RouterOS script\n/log info "hello from NetForge"');
  const [newMsg, setNewMsg]       = React.useState('');

  const allScripts = React.useMemo(() => {
    const templates = Object.values(SCRIPT_TEMPLATES).map(t => ({
      name: t.name, schedule: t.schedule, lastRun: 'Never',
      status: 'template', label: t.label, description: t.description, source: t.source || '',
    }));
    return [...templates, ...scripts];
  }, [scripts]);

  React.useEffect(() => {
    if (!sessionId) return;
    const fetch = async () => {
      setLoading(true);
      try { const d = await API.getScripts(sessionId); setScripts(d); } catch {}
      setLoading(false);
    };
    fetch();
  }, [sessionId]);

  React.useEffect(() => {
    if (!executing || execStatus === 'done' || execStatus === 'error') return;
    const poll = async () => {
      try {
        const r = await API.getScriptOutput(sessionId, executing);
        setExecOutput(r.output); setExecStatus(r.status); setExecElapsed(r.elapsed);
        if (r.status !== 'running') setTimeout(() => { setExecuting(null); setExecStatus('idle'); }, 5000);
      } catch {}
    };
    const iv = setInterval(poll, 500);
    return () => clearInterval(iv);
  }, [executing, execStatus]);

  const handleRun = async (scriptName, isTemplate, templateSource) => {
    setExecOutput('Starting…\n'); setExecStatus('running'); setExecElapsed(0);
    try {
      if (isTemplate && templateSource) {
        // Deploy template to router first, then run it
        setExecOutput('Deploying template to router…\n');
        await API.addScript(sessionId, scriptName, templateSource);
        const d = await API.getScripts(sessionId); setScripts(d);
      }
      const r = await API.executeScript(sessionId, scriptName);
      setExecuting(r.executionId);
    } catch (e) { setExecOutput(`Error: ${e.message}`); setExecStatus('error'); setExecuting(null); }
  };

  const handleAddScript = async () => {
    if (!newName.trim()) { setNewMsg('Name required'); return; }
    setNewMsg('Saving…');
    try {
      await API.addScript(sessionId, newName.trim(), newSource);
      // If a schedule was selected, wire it to the scheduler
      if (schedule && schedule !== 'manual') {
        const schedMap = {
          'startup': 'startup',
          'hourly': '01:00:00',
          'daily': '00:00:00',
          'weekly': '00:00:00',
        };
        const startTime = schedMap[schedule] || '00:00:00';
        const interval = schedule === 'startup' ? '0s' : schedule === 'hourly' ? '1h' : schedule === 'daily' ? '1d' : '7d';
        try {
          await API.addScheduler(sessionId, `sched-${newName.trim()}`, newName.trim(), startTime, interval, `NetForge: run ${newName.trim()}`);
        } catch {}
      }
      setNewMsg('✓ Saved' + (schedule !== 'manual' ? ' + scheduled' : ''));
      setNewName(''); setShowNew(false);
      const d = await API.getScripts(sessionId); setScripts(d);
    } catch (e) { setNewMsg('✗ ' + e.message); }
    setTimeout(() => setNewMsg(''), 3000);
  };

  const handleDeleteScript = async (name) => {
    if (!window.confirm(`Delete script "${name}"?`)) return;
    try {
      await API.removeScript(sessionId, name);
      const d = await API.getScripts(sessionId); setScripts(d);
      setSelected(null);
    } catch (e) { alert(e.message); }
  };

  const sel = selected !== null ? allScripts[selected] : null;

  const statusTone = (s) => s === 'ok' || s === 'success' ? 'good' : s === 'failed' ? 'bad' : s === 'running' ? 'accent' : 'dim';

  if (loading) return <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><ASkeleton /></div>;

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      {/* top bar */}
      <div style={{ padding: '14px 20px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Scripts · Scheduler</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>{allScripts.length} scripts · /system script · /system scheduler</div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <ABtn kind="primary" onClick={() => { setShowNew(true); setNewMsg(''); }}>+ New script</ABtn>
        </div>
      </div>

      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', padding: '0 20px 20px', gap: 12 }}>
        {/* left: script list */}
        <div style={{ width: 280, flexShrink: 0, display: 'flex', flexDirection: 'column', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12, overflow: 'hidden' }}>
          <div style={{ flex: 1, overflow: 'auto' }}>
            {allScripts.map((script, i) => (
              <div key={script.name} onClick={() => setSelected(i)} style={{
                padding: '12px 16px', borderBottom: i < allScripts.length - 1 ? `1px solid ${A.border}` : 'none',
                cursor: 'pointer', background: selected === i ? 'rgba(59,130,246,0.08)' : 'transparent', transition: 'background 0.1s',
              }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                  <span style={{ fontSize: 12, fontWeight: 600, color: A.text, fontFamily: A.mono }}>{script.label || script.name}</span>
                  <APill tone={statusTone(script.status)}>{script.status || 'template'}</APill>
                </div>
                <div style={{ fontSize: 10, color: A.textFaint, marginBottom: 6 }}>{script.description || '—'}</div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint }}>{script.lastRun || 'never'} · {script.schedule || 'manual'}</span>
                  <button onClick={e => { e.stopPropagation(); handleRun(script.name, script.status === 'template', script.source); }} disabled={executing !== null} style={{ padding: '3px 10px', background: executing === script.name ? A.accentSoft : 'rgba(255,255,255,0.06)', border: `1px solid ${A.border}`, borderRadius: 6, color: executing === script.name ? '#BFDBFE' : A.textDim, fontSize: 10, cursor: 'pointer' }}>
                    {executing === script.name ? '▌ …' : script.status === 'template' ? '⬆ Deploy' : '▶ Run'}
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* right: code + output */}
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', gap: 12 }}>
          {showNew ? (
            <ACard pad={0} style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
              <div style={{ padding: '10px 16px', borderBottom: `1px solid ${A.border}`, display: 'flex', alignItems: 'center', gap: 10 }}>
                <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="script-name"
                  style={{ flex: 1, padding: '5px 10px', background: 'rgba(0,0,0,0.2)', border: `1px solid ${A.border}`, borderRadius: 7, color: A.text, fontFamily: A.mono, fontSize: 12, outline: 'none' }} />
                <ABtn kind="secondary" onClick={() => setShowNew(false)}>Cancel</ABtn>
                <ABtn kind="primary" onClick={handleAddScript}>Save to router</ABtn>
                {newMsg && <span style={{ fontSize: 11, color: newMsg.includes('✓') ? A.good : A.bad, fontFamily: A.mono }}>{newMsg}</span>}
              </div>
              <textarea value={newSource} onChange={e => setNewSource(e.target.value)}
                style={{ flex: 1, resize: 'none', padding: 16, background: 'rgba(0,0,0,0.25)', border: 'none', outline: 'none', fontFamily: A.mono, fontSize: 11, color: '#86EFAC', lineHeight: 1.7 }} />
            </ACard>
          ) : sel ? (<>
            {/* code panel */}
            <ACard pad={0} style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
              <div style={{ padding: '10px 16px', borderBottom: `1px solid ${A.border}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <span style={{ fontSize: 12, fontWeight: 600, color: A.text, fontFamily: A.mono }}>{sel.label || sel.name}</span>
                <div style={{ display: 'flex', gap: 6 }}>
                  <ABtn kind="primary" onClick={() => handleRun(sel.name, sel.status === 'template', sel.source)} disabled={executing !== null}>{sel.status === 'template' ? '⬆ Deploy & Run' : '▶ Run now'}</ABtn>
                  {sel.status !== 'template' && (
                    <ABtn kind="secondary" onClick={() => handleDeleteScript(sel.name)}>Delete</ABtn>
                  )}
                </div>
              </div>
              <div style={{ flex: 1, overflow: 'auto', padding: 16, background: 'rgba(0,0,0,0.25)', fontFamily: A.mono, fontSize: 11, color: '#86EFAC', lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>
                {sel.source || `# RouterOS script: ${sel.name}\n# description: ${sel.description || 'No description'}\n\n/log info "${sel.name} executed by NetForge"`}
              </div>
            </ACard>

            {/* schedule + output */}
            <div style={{ display: 'flex', gap: 12, flexShrink: 0 }}>
              <ACard pad={14} style={{ flex: 1 }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: A.text, marginBottom: 10 }}>Schedule</div>
                <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
                  {SCHED_OPTS.map(opt => (
                    <button key={opt.id} onClick={() => setSchedule(opt.id)} style={{ padding: '5px 10px', borderRadius: 7, border: `1px solid ${schedule === opt.id ? A.accent : A.border}`, background: schedule === opt.id ? A.accentSoft : 'transparent', color: schedule === opt.id ? '#BFDBFE' : A.textDim, fontSize: 11, fontFamily: A.ui, cursor: 'pointer' }}>{opt.label}</button>
                  ))}
                </div>
              </ACard>
              {(execOutput) && (
                <ACard pad={0} style={{ flex: 2, overflow: 'hidden' }}>
                  <TerminalOutput output={execOutput} status={execStatus} exitCode={execStatus === 'done' ? 0 : execStatus === 'error' ? 1 : null} elapsed={execElapsed} isLoading={execStatus === 'running'} />
                </ACard>
              )}
            </div>
          </>) : (
            <ACard pad={32}>
              <div style={{ textAlign: 'center', color: A.textFaint, fontSize: 12 }}>Select a script to view and run, or click + New script to create one</div>
            </ACard>
          )}
        </div>
      </div>
    </div>
  );
};

    const setA = new Set(textA.split('\n').map(l => l.trim()).filter(Boolean));
    const setB = new Set(textB.split('\n').map(l => l.trim()).filter(Boolean));
    const removed = [...setA].filter(l => !setB.has(l)).map(l => ({ type:'removed', line:l }));
    const added   = [...setB].filter(l => !setA.has(l)).map(l => ({ type:'added',   line:l }));
    return [...removed, ...added];
  };

  const typeTone = (t) => {
    if (!t) return 'dim';
    const s = t.toLowerCase();
    if (s.includes('manual')) return 'accent';
    if (s.includes('scheduler') || s.includes('auto')) return 'good';
    return 'dim';

                    </ASelect>
                  </div>
                  <div>
                    <div style={{ fontSize:11, color:A.textMuted, marginBottom:4 }}>Snapshot B</div>
                    <ASelect value={snapB} onChange={e => setSnapB(e.target.value)}>

                      {snapshots.map(s => <option key={s.id} value={s.id}>{new Date(s.ts).toLocaleString()} ({Math.round(s.size/1024)}KB)</option>)}

                  <button onClick={async () => {
                    if (!snapA || !snapB || snapA === snapB) return;

                      setDiffLines(computeDiff(a.text, b.text));

                  }} style={{ background:A.accent, color:'#fff', border:'none', borderRadius:8, padding:'8px 20px', cursor:'pointer', fontSize:13, height:34 }}>

                </div>
              </div>
              {diffLines.length > 0 && (

                  <div style={{ padding:'10px 14px', borderBottom:`1px solid ${A.border}`, display:'flex', gap:16, fontSize:12 }}>

              <APill tone={typeTone(b.trigger)}>{b.trigger || 'manual'}</APill>
              <APill tone={b.filename?.endsWith('.rsc') ? 'accent' : 'dim'}>{b.filename?.endsWith('.rsc') ? 'export' : 'binary'}</APill>
            </div>
          ))}
        </div>

        {/* right: schedule + destinations */}
        <div style={{ width: 280, flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 12 }}>
          {/* schedule */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>Schedule via /system scheduler</div>

                  </div>
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{opt.label}</div>

              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>

                {schedMsg && <span style={{ fontSize: 11, color: schedMsg.includes('✓') ? A.good : A.bad, fontFamily: A.mono, flexShrink: 0 }}>{schedMsg}</span>}
              </div>
            </div>
          </ACard>

          {/* destinations */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 12 }}>Backup destinations</div>

          {/* retention */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 8 }}>Retention</div>
            <div style={{ fontSize: 11, color: A.textFaint }}>Keep last <span style={{ color: A.text, fontFamily: A.mono }}>30</span> backups · ~3.7 MB on disk</div>
          </ACard>
        </div>
      </div>}
    </div>
  );
};

const AutomationScreen = ({ sessionId }) => {
  const [tasks, setTasks]       = React.useState([]);

  const [busy, setBusy]         = React.useState({});
  const [msgs, setMsgs]         = React.useState({});

  const [cName, setCName]       = React.useState('');
  const [cScript, setCScript]   = React.useState('');
  const [cInterval, setCInterval] = React.useState('1h');
  const [cTime, setCTime]       = React.useState('00:00:00');
  const [cMsg, setCMsg]         = React.useState('');
  const [activeTab, setActiveTab] = React.useState('recipes');

  const load = React.useCallback(async () => {
    try { const d = await API.getScheduler(sessionId); setTasks(Array.isArray(d) ? d : []); } catch {}
    setLoading(false);
  }, [sessionId]);

  React.useEffect(() => {
    if (!sessionId) return;
    load();
    const iv = setInterval(load, 10000);
    return () => clearInterval(iv);
  }, [sessionId, load]);

  const setMsg = (id, msg, ok) => {
    setMsgs(p => ({ ...p, [id]: { msg, ok } }));
    setTimeout(() => setMsgs(p => { const n={...p}; delete n[id]; return n; }), 5000);
  };

  const isDeployed = (recipe) =>
    recipe.schedulers.some(s => tasks.find(t => t.name === s)) ||
    (recipe.schedulers.length === 0 && recipe.scripts.some(s => tasks.find(t => t.name === s)));

  const handleDeploy = async (recipe) => {
    const deployed = isDeployed(recipe);
    setBusy(p => ({ ...p, [recipe.id]: true }));
    try {
      if (deployed) {
        await API.removeRecipe(sessionId, recipe.id);
        setMsg(recipe.id, '✓ Removed', true);
      } else {
        const r = await API.deployRecipe(sessionId, recipe.id);
        setMsg(recipe.id, `✓ Deployed: ${r.steps?.join(' · ')}`, true);
      }
      await load();
    } catch (e) { setMsg(recipe.id, '✗ ' + e.message, false); }
    setBusy(p => ({ ...p, [recipe.id]: false }));
  };

  const handleToggleTask = async (task) => {
    setBusy(p => ({ ...p, [task.name]: true }));
    try {
      await API.toggleScheduler(sessionId, task.name, !task.disabled);
      await load();
    } catch (e) { setMsg(task.name, '✗ ' + e.message, false); }
    setBusy(p => ({ ...p, [task.name]: false }));

        ))}
      </div>

      <div style={{ flex: 1, overflow: 'auto', padding: '0 20px 20px' }}>

        {activeTab === 'recipes' && (
          <>
            <div style={{ fontSize: 11, color: A.textFaint, marginBottom: 14 }}>
              One-click deploy pre-built automations. Each recipe creates RouterOS scripts + scheduler entries. Click again to remove.
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 20 }}>
              {AUTOMATION_RECIPES.map(recipe => {
                const deployed = isDeployed(recipe);
                const isBusy = busy[recipe.id];
                const m = msgs[recipe.id];
                return (
                  <ACard key={recipe.id} pad={16} style={{ border: `1px solid ${deployed ? toneColor[recipe.tone] : A.border}`, background: deployed ? toneBg[recipe.tone] : A.surface }}>
                    <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, marginBottom: 10 }}>
                      <div style={{ width: 34, height: 34, borderRadius: 9, display: 'grid', placeItems: 'center', background: deployed ? toneBg[recipe.tone] : 'rgba(255,255,255,0.04)', flexShrink: 0 }}>
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke={deployed ? toneColor[recipe.tone] : A.textDim} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d={recipe.icon}/></svg>
                      </div>
                      <div style={{ flex: 1 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                          <span style={{ fontSize: 13, fontWeight: 600, color: A.text }}>{recipe.title}</span>
                          {deployed && <APill tone={recipe.tone}>active</APill>}
                        </div>
                        <div style={{ fontSize: 11, color: A.textFaint, lineHeight: 1.5 }}>{recipe.desc}</div>
                      </div>
                    </div>
                    {m && <div style={{ fontSize: 11, color: m.ok ? A.good : A.bad, marginBottom: 8, fontFamily: A.mono }}>{m.msg}</div>}
                    <ABtn kind={deployed ? 'secondary' : 'primary'} onClick={() => !isBusy && handleDeploy(recipe)} full>
                      {isBusy ? 'Working…' : deployed ? 'Remove automation' : 'Deploy'}
                    </ABtn>
                  </ACard>
                );
              })}
            </div>

            {showCustom && (
              <ACard pad={16}>
                <div style={{ fontSize: 13, fontWeight: 600, color: A.text, marginBottom: 14 }}>Custom automation task</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  <ALabeledField label="Task name" sub="alphanumeric + - _" value={cName} onChange={e => setCName(e.target.value)} mono />
                  <div>
                    <div style={{ fontSize: 11, fontWeight: 500, color: A.text, marginBottom: 4 }}>RouterOS script</div>
                    <textarea value={cScript} onChange={e => setCScript(e.target.value)} rows={4}
                      style={{ width: '100%', resize: 'vertical', padding: 10, background: 'rgba(0,0,0,0.25)', border: `1px solid ${A.border}`, borderRadius: 8, color: '#86EFAC', fontFamily: A.mono, fontSize: 11, outline: 'none', boxSizing: 'border-box' }}
                      placeholder="/log info &quot;hello from NetForge&quot;;" />
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                    <ALabeledField label="Start time" sub="HH:MM:SS" value={cTime} onChange={e => setCTime(e.target.value)} mono />
                    <ALabeledField label="Interval" sub="e.g. 1h, 30m, 1d" value={cInterval} onChange={e => setCInterval(e.target.value)} mono />
                  </div>
                  {cMsg && <div style={{ fontSize: 11, color: cMsg.includes('✓') ? A.good : A.bad }}>{cMsg}</div>}
                  <div style={{ display: 'flex', gap: 8 }}>
                    <ABtn kind="secondary" onClick={() => setShowCustom(false)}>Cancel</ABtn>
                    <ABtn kind="primary" onClick={handleAddCustom} full>Create task</ABtn>
                  </div>
                </div>
              </ACard>
            )}
          </>
        )}

        {activeTab === 'tasks' && (
          <div style={{ display: 'flex', flexDirection: 'column', background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12, overflow: 'hidden' }}>
            <div style={{ display: 'grid', gridTemplateColumns: '160px 90px 90px 1fr 80px 80px', padding: '8px 16px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em' }}>
              <span>Name</span><span>Interval</span><span>Start time</span><span>Script</span><span>Runs</span><span>Actions</span>
            </div>
            {loading ? <div style={{ padding: 32, textAlign: 'center' }}><ASkeleton /></div>
            : tasks.length === 0 ? <div style={{ padding: 32, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No scheduled tasks. Deploy a recipe to get started.</div>
            : tasks.map((t, i) => (
              <div key={t.name} style={{
                display: 'grid', gridTemplateColumns: '160px 90px 90px 1fr 80px 80px',
                padding: '10px 16px', borderBottom: i < tasks.length - 1 ? `1px solid ${A.border}` : 'none',
                background: i % 2 === 1 ? 'rgba(255,255,255,0.015)' : 'transparent', alignItems: 'center',
                opacity: t.disabled ? 0.5 : 1,
              }}>
                <span style={{ fontSize: 11, fontWeight: 500, fontFamily: A.mono, color: A.text }}>{t.name}</span>
                <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textDim }}>{t.interval}</span>
                <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint }}>{t.startTime || '—'}</span>
                <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{t.onEvent || '—'}</span>
                <span style={{ fontSize: 11, fontFamily: A.mono, color: A.textDim }}>{t.runCount}</span>
                <div style={{ display: 'flex', gap: 4 }}>
                  <button onClick={() => handleToggleTask(t)} style={{ padding: '3px 8px', borderRadius: 5, border: `1px solid ${A.border}`, background: 'transparent', color: t.disabled ? A.good : A.warn, fontSize: 10, cursor: 'pointer' }}>{t.disabled ? 'Enable' : 'Pause'}</button>
                  <button onClick={() => handleRemoveTask(t.name)} style={{ padding: '3px 6px', borderRadius: 5, border: 'none', background: 'rgba(239,68,68,0.15)', color: '#FCA5A5', fontSize: 10, cursor: 'pointer' }}>✕</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

// ========== NETWORK HEALTH SCREEN ==========

const PING_TARGETS = [
  { host: '1.1.1.1',   label: 'Cloudflare DNS',  icon: '☁' },
  { host: '8.8.8.8',   label: 'Google DNS',       icon: '🔍' },
  { host: '9.9.9.9',   label: 'Quad9 DNS',        icon: '🛡' },
];

const NetworkHealthScreen = ({ sessionId }) => {
  const [results, setResults]     = React.useState({});
  const [loading, setLoading]     = React.useState({});
  const [netwatch, setNetwatch]   = React.useState([]);
  const [customHost, setCustomHost] = React.useState('');
  const [traceHost, setTraceHost] = React.useState('');
  const [traceResult, setTraceResult] = React.useState(null);
  const [tracing, setTracing]     = React.useState(false);
  const [nwHost, setNwHost]       = React.useState('');
  const [nwInterval, setNwInterval] = React.useState('30s');
  const [nwMsg, setNwMsg]         = React.useState('');
  const [activeTab, setActiveTab] = React.useState('ping');

  const loadNetwatch = React.useCallback(async () => {
    try { const d = await API.getNetwatch(sessionId); setNetwatch(Array.isArray(d) ? d : []); } catch {}
  }, [sessionId]);

  React.useEffect(() => {
    if (!sessionId) return;
    loadNetwatch();
    const iv = setInterval(loadNetwatch, 8000);
    return () => clearInterval(iv);
  }, [sessionId, loadNetwatch]);

  const runPing = async (host) => {
    setLoading(p => ({ ...p, [host]: true }));
    try {
      const r = await API.pingHost(sessionId, host, 5);
      setResults(p => ({ ...p, [host]: r }));
    } catch (e) { setResults(p => ({ ...p, [host]: { error: e.message } })); }
    setLoading(p => ({ ...p, [host]: false }));
  };

  const runAll = () => {
    const targets = [...PING_TARGETS];
    if (customHost.trim()) targets.push({ host: customHost.trim(), label: customHost.trim() });
    targets.forEach(t => runPing(t.host));
  };

  const runTrace = async () => {
    if (!traceHost.trim()) return;
    setTracing(true); setTraceResult(null);
    try { const r = await API.traceroute(sessionId, traceHost.trim()); setTraceResult(r); }
    catch (e) { setTraceResult({ error: e.message }); }
    setTracing(false);
  };

  const latencyColor = (avg) => avg === undefined ? A.textFaint : avg > 100 ? A.bad : avg > 30 ? A.warn : A.good;

  const handleAddNetwatch = async () => {
    if (!nwHost.trim()) return;
    setNwMsg('Adding…');
    try {
      await API.addNetwatch(sessionId, nwHost.trim(), nwInterval, '', 'NetForge monitor');
      setNwMsg('✓ Added'); setNwHost('');
      await loadNetwatch();
    } catch (e) { setNwMsg('✗ ' + e.message); }
    setTimeout(() => setNwMsg(''), 3000);
  };

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '14px 20px 12px', flexShrink: 0 }}>
        <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Network Health · Diagnostics</div>
        <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>Ping · Traceroute · Netwatch · ISP quality monitoring</div>
      </div>

      {/* tabs */}
      <div style={{ padding: '0 20px 10px', display: 'flex', gap: 6, flexShrink: 0 }}>
        {[{id:'ping', label:'Ping / Latency'}, {id:'traceroute', label:'Traceroute'}, {id:'netwatch', label:`Netwatch (${netwatch.length})`}].map(t => (
          <button key={t.id} onClick={() => setActiveTab(t.id)} style={{ padding: '6px 14px', borderRadius: 8, border: `1px solid ${activeTab===t.id?A.accent:A.border}`, background: activeTab===t.id ? A.accentSoft : 'transparent', color: activeTab===t.id ? '#BFDBFE' : A.textDim, fontSize: 12, cursor: 'pointer' }}>{t.label}</button>
        ))}
      </div>

      <div style={{ flex: 1, overflow: 'auto', padding: '0 20px 20px', display: 'flex', flexDirection: 'column', gap: 14 }}>

        {activeTab === 'ping' && (<>
          {/* quick ping */}
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <input value={customHost} onChange={e => setCustomHost(e.target.value)} placeholder="Custom host (e.g. your-isp-gateway)"
              style={{ flex: 1, padding: '7px 12px', background: 'rgba(0,0,0,0.2)', border: `1px solid ${A.border}`, borderRadius: 8, color: A.text, fontFamily: A.mono, fontSize: 12, outline: 'none' }}
              onKeyDown={e => e.key === 'Enter' && customHost && runPing(customHost)} />
            <ABtn kind="primary" onClick={runAll}>Ping all</ABtn>
          </div>

          {/* results grid */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12 }}>
            {[...PING_TARGETS, ...(customHost.trim() ? [{ host: customHost.trim(), label: customHost.trim() }] : [])].map(t => {
              const r = results[t.host];
              const busy = loading[t.host];
              return (
                <ACard key={t.host} pad={16} onClick={() => runPing(t.host)} style={{ cursor: 'pointer', border: `1px solid ${r && !r.error && r.avg !== undefined ? latencyColor(r.avg) + '60' : A.border}` }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                    <span style={{ fontSize: 12, fontWeight: 600, color: A.text }}>{t.label}</span>
                    {r && !r.error && <APill tone={r.loss > 0 ? 'bad' : r.avg > 100 ? 'warn' : 'good'}>{r.loss > 0 ? `${r.loss}% loss` : 'online'}</APill>}
                  </div>
                  <div style={{ fontSize: 9, fontFamily: A.mono, color: A.textFaint, marginBottom: 8 }}>{t.host}</div>
                  {busy ? (
                    <div style={{ fontSize: 11, color: A.textDim }}>Pinging…</div>
                  ) : r ? r.error ? (
                    <div style={{ fontSize: 11, color: A.bad }}>{r.error.substring(0, 40)}</div>
                  ) : (
                    <>
                      <div style={{ fontSize: 28, fontWeight: 700, fontFamily: A.mono, color: latencyColor(r.avg) }}>{r.avg !== undefined ? `${r.avg}` : '—'}<span style={{ fontSize: 13, fontWeight: 400, color: A.textDim }}> ms</span></div>
                      <div style={{ fontSize: 10, color: A.textFaint, fontFamily: A.mono, marginTop: 4 }}>min {r.min ?? '—'} · max {r.max ?? '—'} ms · {r.sent ?? '—'}/{r.received ?? '—'} pkts</div>
                      {r.history && r.history.length > 3 && (
                        <svg width="100%" height="30" viewBox={`0 0 ${r.history.length} 30`} preserveAspectRatio="none" style={{ marginTop: 8 }}>
                          <polyline fill="none" stroke={latencyColor(r.avg)} strokeWidth="1.5"
                            points={r.history.map((h, i) => `${i},${30 - Math.min(28, (h.avg / 200) * 28)}`).join(' ')} />
                        </svg>
                      )}
                    </>
                  ) : (
                    <div style={{ fontSize: 11, color: A.textFaint }}>Click to ping</div>
                  )}
                </ACard>
              );
            })}
          </div>
        </>)}

        {activeTab === 'traceroute' && (<>
          <div style={{ display: 'flex', gap: 8 }}>
            <input value={traceHost} onChange={e => setTraceHost(e.target.value)} placeholder="Target host (e.g. 8.8.8.8 or google.com)"
              style={{ flex: 1, padding: '7px 12px', background: 'rgba(0,0,0,0.2)', border: `1px solid ${A.border}`, borderRadius: 8, color: A.text, fontFamily: A.mono, fontSize: 12, outline: 'none' }}
              onKeyDown={e => e.key === 'Enter' && !tracing && runTrace()} />
            <ABtn kind="primary" onClick={runTrace} disabled={tracing || !traceHost.trim()}>{tracing ? 'Tracing…' : 'Trace route'}</ABtn>
          </div>
          {traceResult && (
            <ACard pad={0} style={{ overflow: 'hidden' }}>
              <div style={{ padding: '10px 16px', borderBottom: `1px solid ${A.border}` }}>
                <span style={{ fontSize: 12, fontWeight: 600 }}>Route to {traceResult.host}</span>
              </div>
              {traceResult.error ? (
                <div style={{ padding: 16, color: A.bad, fontSize: 11 }}>{traceResult.error}</div>
              ) : traceResult.hops?.length > 0 ? (
                traceResult.hops.map((h, i) => (
                  <div key={i} style={{ display: 'flex', gap: 16, padding: '8px 16px', borderBottom: i < traceResult.hops.length - 1 ? `1px solid rgba(255,255,255,0.04)` : 'none', alignItems: 'center' }}>
                    <span style={{ fontSize: 11, fontFamily: A.mono, color: A.textFaint, minWidth: 24, textAlign: 'right' }}>{h.hop}</span>
                    <span style={{ fontSize: 11, fontFamily: A.mono, color: A.text, minWidth: 130 }}>{h.address}</span>
                    <span style={{ fontSize: 11, fontFamily: A.mono, color: h.rtt > 100 ? A.warn : A.good }}>{h.rtt} ms</span>
                    <div style={{ flex: 1, height: 4, background: 'rgba(255,255,255,0.06)', borderRadius: 2, overflow: 'hidden' }}>
                      <div style={{ width: `${Math.min(100, h.rtt / 3)}%`, height: '100%', background: h.rtt > 100 ? A.warn : A.good }} />
                    </div>
                  </div>
                ))
              ) : (
                <div style={{ padding: 16, fontFamily: A.mono, fontSize: 11, color: A.textFaint, whiteSpace: 'pre-wrap' }}>{traceResult.raw || 'No hop data'}</div>
              )}
            </ACard>
          )}
        </>)}

        {activeTab === 'netwatch' && (<>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <input value={nwHost} onChange={e => setNwHost(e.target.value)} placeholder="Host to monitor (e.g. ISP gateway 192.168.1.1)"
              style={{ flex: 1, padding: '7px 12px', background: 'rgba(0,0,0,0.2)', border: `1px solid ${A.border}`, borderRadius: 8, color: A.text, fontFamily: A.mono, fontSize: 12, outline: 'none' }} />
            <select value={nwInterval} onChange={e => setNwInterval(e.target.value)} style={{ padding: '7px 10px', background: 'rgba(0,0,0,0.2)', border: `1px solid ${A.border}`, borderRadius: 8, color: A.text, fontSize: 12 }}>
              {['5s','10s','30s','1m','5m'].map(v => <option key={v} value={v}>{v}</option>)}
            </select>
            <ABtn kind="primary" onClick={handleAddNetwatch}>Add monitor</ABtn>
            {nwMsg && <span style={{ fontSize: 11, color: nwMsg.includes('✓') ? A.good : A.bad, fontFamily: A.mono }}>{nwMsg}</span>}
          </div>

          <div style={{ background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12, overflow: 'hidden' }}>
            <div style={{ display: 'grid', gridTemplateColumns: '160px 60px 80px 1fr 80px', padding: '8px 16px', borderBottom: `1px solid ${A.border}`, fontSize: 10, color: A.textFaint, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em' }}>
              <span>Host</span><span>Status</span><span>Interval</span><span>Comment</span><span>Action</span>
            </div>
            {netwatch.length === 0 ? (
              <div style={{ padding: 32, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No monitors. Add a host above to start monitoring WAN health.</div>
            ) : netwatch.map((w, i) => (
              <div key={w.id} style={{
                display: 'grid', gridTemplateColumns: '160px 60px 80px 1fr 80px',
                padding: '10px 16px', borderBottom: i < netwatch.length - 1 ? `1px solid ${A.border}` : 'none',
                background: i % 2 === 1 ? 'rgba(255,255,255,0.015)' : 'transparent', alignItems: 'center',
              }}>
                <span style={{ fontSize: 11, fontFamily: A.mono, color: A.text }}>{w.host}</span>
                <APill tone={w.status === 'up' ? 'good' : w.status === 'down' ? 'bad' : 'dim'}>{w.status || '?'}</APill>
                <span style={{ fontSize: 10, fontFamily: A.mono, color: A.textDim }}>{w.interval}</span>
                <span style={{ fontSize: 10, color: A.textFaint }}>{w.comment || '—'}</span>
                <button onClick={() => API.removeNetwatch(sessionId, w.id).then(loadNetwatch)} style={{ background: 'rgba(239,68,68,0.15)', color: '#FCA5A5', border: 'none', borderRadius: 6, padding: '4px 8px', cursor: 'pointer', fontSize: 11 }}>Remove</button>
              </div>
            ))}
          </div>
        </>)}
      </div>
    </div>
  );
};

// ========== PORT FORWARD WIZARD ==========

const PORT_FORWARD_PRESETS = [
  { label: 'Remote Desktop (RDP)', extPort: 3389, intPort: 3389, proto: 'tcp', icon: 'M2 3h12v10H2zM5 13v2M11 13v2M4 15h8' },
  { label: 'Web Server (HTTP)',    extPort: 80,   intPort: 80,   proto: 'tcp', icon: 'M8 2a6 6 0 1 0 0 12A6 6 0 0 0 8 2z' },
  { label: 'HTTPS',                extPort: 443,  intPort: 443,  proto: 'tcp', icon: 'M8 1L3 4v4c0 3.5 2.2 6.7 5 7.4' },
  { label: 'FTP',                  extPort: 21,   intPort: 21,   proto: 'tcp', icon: 'M3 3h10M3 8h10M3 13h6' },
  { label: 'SSH',                  extPort: 22,   intPort: 22,   proto: 'tcp', icon: 'M2 2h12v12H2z' },
  { label: 'CCTV / NVR (HTTP)',    extPort: 8080, intPort: 8080, proto: 'tcp', icon: 'M1 6h14M1 10h14M3 3v10M13 3v10' },
  { label: 'CCTV (RTSP)',          extPort: 554,  intPort: 554,  proto: 'tcp', icon: 'M1 6h14M1 10h14' },
  { label: 'VoIP (SIP)',           extPort: 5060, intPort: 5060, proto: 'udp', icon: 'M3 5h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3' },
  { label: 'Game Server',          extPort: 27015,intPort: 27015,proto: 'udp', icon: 'M8 4a4 4 0 1 0 0 8A4 4 0 0 0 8 4z' },
  { label: 'Custom',               extPort: '',   intPort: '',   proto: 'tcp', icon: 'M8 1v14M1 8h14' },
];

const PortForwardScreen = ({ sessionId }) => {
  const [rules, setRules]         = React.useState([]);
  const [loadingRules, setLoadingRules] = React.useState(true);
  const [preset, setPreset]       = React.useState(null);
  const [extPort, setExtPort]     = React.useState('');
  const [intIp, setIntIp]         = React.useState('');
  const [intPort, setIntPort]     = React.useState('');
  const [proto, setProto]         = React.useState('tcp');
  const [comment, setComment]     = React.useState('');
  const [wanIface, setWanIface]   = React.useState('');
  const [addMsg, setAddMsg]       = React.useState('');
  const [pfProto, setPfProto]     = React.useState('tcp');
  const [pfDstPort, setPfDstPort] = React.useState('');
  const [pfToAddr, setPfToAddr]   = React.useState('');
  const [pfToPort, setPfToPort]   = React.useState('');
  const [pfInIface, setPfInIface] = React.useState('');

  const loadRules = React.useCallback(async () => {
    setLoadingRules(true);
    try {
      const d = await API.getNat(sessionId);
      setRules((Array.isArray(d) ? d : []).filter(r => r.chain === 'dstnat' || r.action === 'dst-nat'));
    } catch {}
    setLoadingRules(false);
  }, [sessionId]);

  React.useEffect(() => {
    if (!sessionId) return;
    loadRules();
    const iv = setInterval(loadRules, 8000);
    return () => clearInterval(iv);
  }, [sessionId, loadRules]);

  const selectPreset = (p) => {
    setPreset(p.label);
    if (p.extPort) setExtPort(String(p.extPort));
    if (p.intPort) setIntPort(String(p.intPort));
    setProto(p.proto || 'tcp');
    setComment(p.label !== 'Custom' ? p.label : '');
  };

  const handleAdd = async () => {
    const dstPort = pfDstPort || extPort;
    const toAddr  = pfToAddr  || intIp;
    if (!dstPort || !toAddr) { setAddMsg('External port and internal IP required'); return; }
    setAddMsg('Creating…');
    try {
      const r = await API.call(sessionId, '/api/nat/port-forward', {
        method: 'POST',
        body: JSON.stringify({
          dstPort: parseInt(dstPort),
          toAddresses: toAddr.trim(),
          toPort: (pfToPort || intPort) ? parseInt(pfToPort || intPort) : parseInt(dstPort),
          inInterface: pfInIface || wanIface || '',
          protocol: pfProto || proto,
          comment,
        }),
      });
      setAddMsg('✓ ' + r.message);
      setExtPort(''); setIntIp(''); setIntPort(''); setComment(''); setPreset(null);
      setPfDstPort(''); setPfToAddr(''); setPfToPort(''); setPfInIface('');
      await loadRules();
    } catch (e) { setAddMsg('✗ ' + e.message); }
    setTimeout(() => setAddMsg(''), 4000);
  };

  return (
    <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '14px 20px 12px', flexShrink: 0 }}>
        <div style={{ fontSize: 16, fontWeight: 600, color: A.text }}>Port Forwarding · Wizard</div>
        <div style={{ fontSize: 11, color: A.textFaint, marginTop: 2 }}>Open ports for remote access · /ip firewall nat dstnat</div>
      </div>

      <div style={{ flex: 1, overflow: 'auto', padding: '0 20px 20px', display: 'flex', gap: 16, alignItems: 'flex-start' }}>
        {/* left: wizard */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 12 }}>
          {/* preset chips */}
          <ACard pad={14}>
            <div style={{ fontSize: 11, fontWeight: 600, color: A.textDim, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 10 }}>Common services</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 6 }}>
              {PORT_FORWARD_PRESETS.map(p => (
                <button key={p.label} onClick={() => selectPreset(p)} style={{
                  padding: '8px 6px', borderRadius: 8, border: `1px solid ${preset === p.label ? A.accent : A.border}`,
                  background: preset === p.label ? A.accentSoft : 'transparent',
                  color: preset === p.label ? '#BFDBFE' : A.textDim, fontSize: 10, cursor: 'pointer', textAlign: 'center', lineHeight: 1.4,
                }}>
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block', margin: '0 auto 4px' }}><path d={p.icon}/></svg>
                  {p.label}
                </button>
              ))}
            </div>
          </ACard>

          {/* form */}
          <ACard pad={16}>
            <div style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 14 }}>Port forward configuration</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 12 }}>
              <ALabeledField label="External port" sub="internet-facing port" value={extPort} onChange={e => setExtPort(e.target.value)} mono type="number" />
              <ALabeledField label="Internal IP" sub="LAN server address" value={intIp} onChange={e => setIntIp(e.target.value)} mono />
              <ALabeledField label="Internal port" sub="leave blank = same as external" value={intPort} onChange={e => setIntPort(e.target.value)} mono type="number" />
              <ALabeledField label="Comment / label" sub="e.g. Office Server" value={comment} onChange={e => setComment(e.target.value)} />
            </div>
            <div style={{ display: 'flex', gap: 10, marginBottom: 12 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, fontWeight: 500, color: A.text, marginBottom: 6 }}>Protocol</div>
                <div style={{ display: 'flex', gap: 5 }}>
                  {['tcp', 'udp', 'tcp+udp'].map(p => (
                    <button key={p} onClick={() => setProto(p)} style={{ flex: 1, padding: '6px 0', borderRadius: 7, border: `1px solid ${proto === p ? A.accent : A.border}`, background: proto === p ? A.accentSoft : 'transparent', color: proto === p ? '#BFDBFE' : A.textDim, fontFamily: A.mono, fontSize: 11, cursor: 'pointer' }}>{p}</button>
                  ))}
                </div>
              </div>
              <ALabeledField label="WAN interface filter" sub="blank = any interface" value={wanIface} onChange={e => setWanIface(e.target.value)} mono />
            </div>
            {addMsg && <div style={{ fontSize: 11, color: addMsg.includes('✓') ? A.good : A.bad, marginBottom: 8 }}>{addMsg}</div>}
            <ABtn kind="primary" onClick={handleAdd} full>Create port forward</ABtn>
          </ACard>
        </div>

        {/* right: existing rules */}
        <div style={{ width: 360, flexShrink: 0 }}>
          <div style={{ fontSize: 11, fontWeight: 600, color: A.textDim, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 8 }}>Active port forwards ({rules.length})</div>
          <div style={{ background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12, overflow: 'hidden' }}>
            {loadingRules ? <div style={{ padding: 20 }}><ASkeleton /></div>
            : rules.length === 0 ? <div style={{ padding: 24, textAlign: 'center', color: A.textFaint, fontSize: 12 }}>No port forwards configured</div>
            : rules.map((r, i) => (
              <div key={r.id} style={{ padding: '10px 14px', borderBottom: i < rules.length - 1 ? `1px solid ${A.border}` : 'none', display: 'flex', alignItems: 'center', gap: 10 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{r.comment || `Rule ${r.id}`}</div>
                  <div style={{ fontSize: 10, fontFamily: A.mono, color: A.textFaint }}>
                    {r.protocol || '—'} · {r.dstPort || '—'} → {r.toAddresses ? r.toAddresses + (r.toPort ? ':' + r.toPort : '') : '—'}
                  </div>
                </div>
                <APill tone={r.disabled ? 'dim' : 'good'}>{r.disabled ? 'off' : 'active'}</APill>
                <button onClick={() => API.removeNat(sessionId, r.id).then(loadRules)} style={{ background: 'rgba(239,68,68,0.15)', color: '#FCA5A5', border: 'none', borderRadius: 6, padding: '4px 8px', cursor: 'pointer', fontSize: 11 }}>✕</button>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
};

// ========== ACCESS CONTROL SCREEN ==========

const ACCESS_PORT_LIST = [
  { port: 8291, name: 'Winbox',  desc: 'MikroTik GUI' },
  { port: 22,   name: 'SSH',     desc: 'Secure Shell' },
  { port: 80,   name: 'HTTP',    desc: 'Web interface' },
  { port: 443,  name: 'HTTPS',   desc: 'Web interface SSL' },
  { port: 8728, name: 'API',     desc: 'RouterOS API' },
  { port: 8729, name: 'API-SSL', desc: 'RouterOS API SSL' },
];

const AccessControlScreen = ({ sessionId }) => {
  const [status, setStatus]         = React.useState(null);
  const [loading, setLoading]       = React.useState(true);
  const [applying, setApplying]     = React.useState(false);
  const [msg, setMsg]               = React.useState(null);
  const [selPorts, setSelPorts]     = React.useState([8291, 22, 80, 443, 8728]);
  const [bruteForce, setBruteForce] = React.useState(true);
  const [newIp, setNewIp]           = React.useState('');
  const [newComment, setNewComment] = React.useState('');
  const [addMsg, setAddMsg]         = React.useState(null);
  const [tab, setTab]               = React.useState('allowed'); // 'allowed' | 'blocked'

  const load = async () => {
    setLoading(true);
    try { const d = await API.getAccessStatus(sessionId); setStatus(d); } catch {}
    setLoading(false);
  };

  React.useEffect(() => { load(); }, []);

  const togglePort = (p) => setSelPorts(prev => prev.includes(p) ? prev.filter(x => x !== p) : [...prev, p]);

  const handleApply = async () => {
    if (!status?.allowedIps?.length) {
      if (!window.confirm('WARNING: No allowed IPs configured. Applying will lock EVERYONE out of the router including you. Are you absolutely sure?')) return;
    }
    setApplying(true); setMsg(null);
    try {
      await API.applyAccessControl(sessionId, selPorts, bruteForce);
      setMsg({ ok: true, text: `Access control applied — ${selPorts.length} ports protected` });
      load();
    } catch (e) { setMsg({ ok: false, text: e.message }); }
    setApplying(false);
  };

  const handleRemove = async () => {
    if (!confirm('Remove all access control rules? All ports will be open to everyone.')) return;
    setApplying(true); setMsg(null);
    try {
      await API.removeAccessControl(sessionId);
      setMsg({ ok: true, text: 'Access control rules removed' });
      load();
    } catch (e) { setMsg({ ok: false, text: e.message }); }
    setApplying(false);
  };

  const handleAddIp = async () => {
    if (!newIp.trim()) return;
    setAddMsg(null);
    try {
      await API.addAllowedIp(sessionId, newIp.trim(), newComment.trim());
      setNewIp(''); setNewComment('');
      setAddMsg({ ok: true, text: `${newIp.trim()} added` });
      load();
    } catch (e) { setAddMsg({ ok: false, text: e.message }); }
  };

  const handleRemoveIp = async (id) => {
    try { await API.removeAllowedIp(sessionId, id); load(); } catch {}
  };

  const handleUnblock = async (id) => {
    try { await API.unblockIp(sessionId, id); load(); } catch {}
  };

  const isActive = status?.active;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>

      {/* Status + deploy bar */}
      <ACard>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
          <div style={{ flex: 1 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
              <div style={{ width: 8, height: 8, borderRadius: '50%', background: isActive ? '#22C55E' : '#EF4444', flexShrink: 0 }} />
              <span style={{ fontSize: 14, fontWeight: 600 }}>Router Access Control</span>
              <span style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>{isActive ? 'ACTIVE' : 'INACTIVE'}</span>
            </div>
            <div style={{ fontSize: 11, color: A.textFaint }}>
              Restricts Winbox / SSH / API access to allowed IPs only. Blocks brute-force login attempts.
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            {isActive && (
              <button onClick={handleRemove} disabled={applying}
                style={{ padding: '7px 14px', borderRadius: 8, fontSize: 12, fontWeight: 600, border: '1px solid rgba(239,68,68,0.4)', background: 'rgba(239,68,68,0.1)', color: '#FCA5A5', cursor: 'pointer' }}>
                {applying ? '…' : 'Disable'}
              </button>
            )}
            <button onClick={handleApply} disabled={applying || selPorts.length === 0}
              style={{ padding: '7px 16px', borderRadius: 8, fontSize: 12, fontWeight: 600, border: 'none', background: selPorts.length === 0 ? 'rgba(59,130,246,0.2)' : A.accent, color: '#fff', cursor: selPorts.length === 0 ? 'not-allowed' : 'pointer', opacity: applying ? 0.7 : 1 }}>
              {applying ? 'Applying…' : isActive ? 'Re-apply' : 'Apply Rules'}
            </button>
          </div>
        </div>

        {msg && (
          <div style={{ marginTop: 12, padding: '8px 12px', borderRadius: 7, fontSize: 12, background: msg.ok ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.08)', color: msg.ok ? '#86EFAC' : '#FCA5A5', border: `1px solid ${msg.ok ? 'rgba(34,197,94,0.25)' : 'rgba(239,68,68,0.25)'}` }}>
            {msg.text}
          </div>
        )}

        {/* Safety warning */}
        <div style={{ marginTop: 12, padding: '10px 12px', borderRadius: 8, background: 'rgba(245,158,11,0.08)', border: '1px solid rgba(245,158,11,0.25)', fontSize: 11, color: '#FCD34D' }}>
          ⚠ Make sure your current IP or subnet is in the Allowed IPs list before applying, or you will be locked out of the router.
        </div>
      </ACard>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>

        {/* Port selection */}
        <ACard>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>Protected Ports</div>
          <div style={{ fontSize: 11, color: A.textFaint, marginBottom: 12 }}>Select which ports to restrict to allowed IPs only</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {ACCESS_PORT_LIST.map(p => {
              const on = selPorts.includes(p.port);
              return (
                <div key={p.port} onClick={() => togglePort(p.port)}
                  style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', borderRadius: 8, cursor: 'pointer', background: on ? 'rgba(59,130,246,0.1)' : 'rgba(255,255,255,0.02)', border: `1px solid ${on ? A.accent : A.border}` }}>
                  <div style={{ width: 16, height: 16, borderRadius: 4, background: on ? A.accent : 'transparent', border: `2px solid ${on ? A.accent : A.border}`, display: 'grid', placeItems: 'center', flexShrink: 0 }}>
                    {on && <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5l2.5 2.5L8 2.5" stroke="#fff" strokeWidth="1.5" fill="none" strokeLinecap="round"/></svg>}
                  </div>
                  <div style={{ flex: 1 }}>
                    <span style={{ fontSize: 12, fontWeight: 600, fontFamily: A.mono, color: on ? '#93C5FD' : A.text }}>{p.port}</span>
                    <span style={{ fontSize: 12, color: A.textFaint, marginLeft: 8 }}>{p.name}</span>
                  </div>
                  <span style={{ fontSize: 10, color: A.textFaint }}>{p.desc}</span>
                </div>
              );
            })}
          </div>

          {/* Brute force toggle */}
          <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${A.border}` }}>
            <div onClick={() => setBruteForce(v => !v)}
              style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', borderRadius: 8, cursor: 'pointer', background: bruteForce ? 'rgba(59,130,246,0.1)' : 'rgba(255,255,255,0.02)', border: `1px solid ${bruteForce ? A.accent : A.border}` }}>
              <div style={{ width: 32, height: 18, borderRadius: 999, background: bruteForce ? A.accent : 'rgba(255,255,255,0.1)', position: 'relative', flexShrink: 0 }}>
                <div style={{ width: 14, height: 14, borderRadius: 999, background: '#fff', position: 'absolute', top: 2, left: bruteForce ? 16 : 2, transition: 'left 0.2s' }} />
              </div>
              <div>
                <div style={{ fontSize: 12, fontWeight: 600 }}>Brute-force Protection</div>
                <div style={{ fontSize: 10, color: A.textFaint }}>Track login attempts → auto-block after repeated hits (1 day ban)</div>
              </div>
            </div>
          </div>
        </ACard>

        {/* Allowed IPs */}
        <ACard>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 12 }}>Allowed IPs / Subnets</div>

          {/* Add form */}
          <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
            <input value={newIp} onChange={e => setNewIp(e.target.value)}
              placeholder="IP or CIDR (e.g. 192.168.1.0/24)"
              style={{ flex: 2, background: A.input, border: `1px solid ${A.border}`, borderRadius: 7, padding: '7px 10px', color: A.text, fontSize: 12, fontFamily: A.mono, outline: 'none' }} />
            <input value={newComment} onChange={e => setNewComment(e.target.value)}
              placeholder="Label (optional)"
              style={{ flex: 1, background: A.input, border: `1px solid ${A.border}`, borderRadius: 7, padding: '7px 10px', color: A.text, fontSize: 12, outline: 'none' }} />
            <button onClick={handleAddIp}
              style={{ padding: '7px 12px', borderRadius: 7, background: A.accent, color: '#fff', border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600, whiteSpace: 'nowrap' }}>
              + Add
            </button>
          </div>
          {addMsg && <div style={{ fontSize: 11, color: addMsg.ok ? '#86EFAC' : '#FCA5A5', marginBottom: 8 }}>{addMsg.text}</div>}

          {/* Allowed list */}
          {loading ? (
            <div style={{ color: A.textFaint, fontSize: 12 }}>Loading…</div>
          ) : (status?.allowedIps || []).length === 0 ? (
            <div style={{ color: A.textFaint, fontSize: 12, textAlign: 'center', padding: 20 }}>No allowed IPs yet. Add your IP/subnet above.</div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4, maxHeight: 320, overflowY: 'auto' }}>
              {(status.allowedIps || []).map(ip => (
                <div key={ip.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '7px 10px', borderRadius: 7, background: 'rgba(255,255,255,0.02)', border: `1px solid ${A.border}` }}>
                  <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#22C55E" strokeWidth="1.5" strokeLinecap="round"><circle cx="8" cy="8" r="6"/><path d="M5 8l2 2 4-4"/></svg>
                  <span style={{ flex: 1, fontFamily: A.mono, fontSize: 12 }}>{ip.address}</span>
                  {ip.comment && <span style={{ fontSize: 11, color: A.textFaint }}>{ip.comment}</span>}
                  <button onClick={() => handleRemoveIp(ip.id)}
                    style={{ background: 'rgba(239,68,68,0.12)', color: '#FCA5A5', border: 'none', borderRadius: 5, padding: '3px 8px', cursor: 'pointer', fontSize: 11 }}>✕</button>
                </div>
              ))}
            </div>
          )}
        </ACard>
      </div>

      {/* Blocked IPs */}
      <ACard>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
          <div style={{ fontSize: 13, fontWeight: 600 }}>Auto-blocked IPs</div>
          <span style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>brute-force detection · login_attempts → blocked_ips</span>
          <button onClick={load} style={{ marginLeft: 'auto', background: 'transparent', border: `1px solid ${A.border}`, borderRadius: 6, padding: '3px 10px', color: A.textFaint, cursor: 'pointer', fontSize: 11 }}>Refresh</button>
        </div>

        {loading ? (
          <div style={{ color: A.textFaint, fontSize: 12 }}>Loading…</div>
        ) : (status?.blockedIps || []).length === 0 ? (
          <div style={{ color: A.textFaint, fontSize: 12, textAlign: 'center', padding: 16 }}>No blocked IPs — brute-force protection is clean</div>
        ) : (
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${A.border}` }}>
                  {['IP Address', 'List', 'Timeout', ''].map(h => (
                    <th key={h} style={{ padding: '6px 10px', textAlign: 'left', color: A.textFaint, fontWeight: 500, fontSize: 11 }}>{h}</th>
