// ========== WEBSOCKET MANAGER ==========

class WebSocketManagerClass {
  constructor(sessionId) {
    this.sessionId = sessionId;
    this.ws = null;
    this.subscriptions = new Map();
    this.isConnected = false;
    this.reconnectAttempts = 0;
    this.maxReconnectAttempts = 5;
    this.reconnectDelay = 1000;
    this.connect();
  }

  connect() {
    try {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${protocol}//${window.location.host}/ws?sessionId=${this.sessionId}`;

      this.ws = new WebSocket(url);
      this.ws.onopen = () => {
        this.isConnected = true;
        this.reconnectAttempts = 0;
        for (const endpoint of this.subscriptions.keys()) {
          this.sendSubscribe(endpoint);
        }
      };

      this.ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          const callbacks = this.subscriptions.get(msg.type);
          if (callbacks) {
            callbacks.forEach(cb => cb(msg.data));
          }
        } catch (err) {
          console.error('WS parse:', err);
        }
      };

      this.ws.onerror = () => {
        this.isConnected = false;
      };

      this.ws.onclose = () => {
        this.isConnected = false;
        this.attemptReconnect();
      };
    } catch (err) {
      this.isConnected = false;
      this.attemptReconnect();
    }
  }

  attemptReconnect() {
    if (this.reconnectAttempts >= this.maxReconnectAttempts) return;
    this.reconnectAttempts++;
    const delay = this.reconnectDelay * Math.pow(2, this.reconnectAttempts - 1);
    setTimeout(() => this.connect(), delay);
  }

  sendSubscribe(endpoint) {
    if (this.isConnected && this.ws.readyState === WebSocket.OPEN) {
      this.ws.send(JSON.stringify({ action: 'subscribe', endpoint }));
    }
  }

  subscribe(endpoint, callback) {
    if (!this.subscriptions.has(endpoint)) {
      this.subscriptions.set(endpoint, new Set());
      this.sendSubscribe(endpoint);
    }
    this.subscriptions.get(endpoint).add(callback);
  }

  unsubscribe(endpoint, callback) {
    const callbacks = this.subscriptions.get(endpoint);
    if (callbacks) {
      callbacks.delete(callback);
      if (callbacks.size === 0) {
        this.subscriptions.delete(endpoint);
      }
    }
  }

  close() {
    if (this.ws) {
      this.ws.close();
    }
  }
}

// ========== API HELPER ==========
const API = {
  baseUrl: window.location.origin,
  wsManager: null,

  initWebSocket(sessionId) {
    if (!this.wsManager) {
      this.wsManager = new WebSocketManagerClass(sessionId);
    }
  },

  subscribe(endpoint, callback) {
    if (this.wsManager && this.wsManager.isConnected) {
      this.wsManager.subscribe(endpoint, callback);
    }
  },

  unsubscribe(endpoint, callback) {
    if (this.wsManager) {
      this.wsManager.unsubscribe(endpoint, callback);
    }
  },

  async call(sessionId, endpoint, options = {}) {
    if (!sessionId && endpoint !== '/api/login') {
      throw new Error('No session. Please login first.');
    }

    const url = `${this.baseUrl}${endpoint}`;
    const headers = {
      'Content-Type': 'application/json',
      ...options.headers,
    };

    if (sessionId) {
      headers['x-session-id'] = sessionId;
    }

    try {
      const response = await fetch(url, {
        ...options,
        headers,
      });

      if (response.status === 401) {
        throw new Error('Session expired. Please login again.');
      }

      if (!response.ok) {
        const error = await response.json().catch(() => ({ error: response.statusText }));
        throw new Error(error.error || response.statusText);
      }

      return await response.json();
    } catch (err) {
      throw err;
    }
  },

  async login(host, port, username, password) {
    return this.call(null, '/api/login', {
      method: 'POST',
      body: JSON.stringify({ host, port: parseInt(port) || 22, username, password }),
    });
  },

  async logout(sessionId) {
    return this.call(sessionId, '/api/logout', {
      method: 'POST',
      body: JSON.stringify({ sessionId }),
    });
  },

  async getSystemStats(sessionId) {
    return this.call(sessionId, '/api/system-stats');

  async getInterfaces(sessionId) {

  async getFirewall(sessionId) {

  async getBandwidth(sessionId) {

  async getDhcpClients(sessionId) {

  async getWireless(sessionId) {
    return this.call(sessionId, '/api/wireless');
  },

  async getVpn(sessionId) {

  async getLogs(sessionId) {

  async getScripts(sessionId) {

  async getBackups(sessionId) {

  },

  async executeScript(sessionId, scriptName) {
    return this.call(sessionId, '/api/scripts/execute', {
      method: 'POST',
      body: JSON.stringify({ scriptName }),
    });
  },

  async getScriptOutput(executionId) {
    const url = `${this.baseUrl}/api/scripts/${executionId}/output`;
    try {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(response.statusText);
      }
      return await response.json();
    } catch (err) {
      throw err;
    }
  },

  // IP Addresses
  async getIpAddresses(sessionId) {
    return this.call(sessionId, '/api/ip-addresses');
  },

  async addIpAddress(sessionId, address, iface, comment) {
    return this.call(sessionId, '/api/ip-addresses/add', {
      method: 'POST',
      body: JSON.stringify({ address, interface: iface, comment }),
    });
  },

  async removeIpAddress(sessionId, id) {
    return this.call(sessionId, '/api/ip-addresses/remove', {
      method: 'POST',
      body: JSON.stringify({ id }),
    });
  },

  // Routes
  async getRoutes(sessionId) {
    return this.call(sessionId, '/api/routes');
  },

  async addRoute(sessionId, destination, gateway, distance, comment) {
    return this.call(sessionId, '/api/routes/add', {
      method: 'POST',
      body: JSON.stringify({ destination, gateway, distance, comment }),
    });

  // DNS
  async getDns(sessionId) {
    return this.call(sessionId, '/api/dns');

// ========== CHART HELPERS ==========

const pathFromValues = (vals, w, h, fill) => {
  if (!vals || vals.length < 2) return fill ? `M0,${h} L${w},${h} Z` : '';
  const max = Math.max(...vals, 1);
  const stepX = w / (vals.length - 1);
  const pts = vals.map((v, i) => `${(i * stepX).toFixed(1)},${(h - (v / max) * (h - 6) - 3).toFixed(1)}`);
  const line = 'M' + pts.join(' L');
  return fill ? `${line} L${w},${h} L0,${h} Z` : line;
};

const LineChart = ({ values = [], w = 200, h = 32, stroke = A.accent, fill }) => {
  const f = fill || `${stroke}22`;
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: 'block' }}>
      <path d={pathFromValues(values, w, h, true)} fill={f} />
      <path d={pathFromValues(values, w, h, false)} fill="none" stroke={stroke} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
};

const ALERT_THRESHOLDS = {
  cpu: { warn: 80, critical: 95 },

const AlertUtils = {
  MAX_HISTORY: 50,
  MAX_STORAGE_SIZE: 100000, // ~100KB limit

  loadHistory: () => {
    try {
      const stored = localStorage.getItem('netforge_alert_history');
      return stored ? JSON.parse(stored) : [];
    } catch (err) {
      console.error('Failed to load alert history:', err);
      return [];
    }
  },

  saveHistory: (history) => {
    try {
      const limited = history.slice(0, AlertUtils.MAX_HISTORY);
      const serialized = JSON.stringify(limited);

      // Check size before saving
      if (serialized.length > AlertUtils.MAX_STORAGE_SIZE) {
        console.warn('Alert history too large, trimming');
        limited.splice(0, Math.floor(limited.length / 2));
        AlertUtils.saveHistory(limited);
        return;
      }

      localStorage.setItem('netforge_alert_history', serialized);
    } catch (err) {
      console.error('Failed to save alert history:', err);
      // If storage is full, clear and try again
      if (err.name === 'QuotaExceededError') {
        localStorage.removeItem('netforge_alert_history');
        console.warn('Alert history cleared due to storage limit');
      }
    }
  },

  shouldAlert: (alertCache, metric, severity) => {
    const key = `${metric}-${severity}`;
    const lastAlert = alertCache.current?.get(key) || 0;
    const now = Date.now();
    if (now - lastAlert > 30000) {
      alertCache.current?.set(key, now);
      return true;
    }
    return false;
  }
};

  const [host, setHost] = React.useState('192.168.88.1');

  const [username, setUsername] = React.useState('admin');
  const [password, setPassword] = React.useState('');
  const [error, setError] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [testing, setTesting] = React.useState(false);
  const [useTls, setUseTls] = React.useState(false);
  const [saveCredentials, setSaveCredentials] = React.useState(true);
  const [recents, setRecents] = React.useState([]);
  const [activeIdx, setActiveIdx] = React.useState(null);

  // Load recent connections on mount
  React.useEffect(() => {
    try {
      const stored = JSON.parse(localStorage.getItem('netforge_recents') || '[]');
      setRecents(stored);
      if (stored.length > 0) {
        setHost(stored[0].host);
        setPort(String(stored[0].port || '22'));
        setUsername(stored[0].username || 'admin');
        setActiveIdx(0);
      }
    } catch {}
  }, []);

  const saveRecent = (conn) => {
    try {
      const existing = JSON.parse(localStorage.getItem('netforge_recents') || '[]');
      const filtered = existing.filter(r => !(r.host === conn.host && r.username === conn.username));
      const updated = [conn, ...filtered].slice(0, 4);
      localStorage.setItem('netforge_recents', JSON.stringify(updated));
    } catch {}
  };

  const selectRecent = (r, i) => {
    setActiveIdx(i);
    setHost(r.host);
    setPort(String(r.port || '22'));
    setUsername(r.username || 'admin');
    setError(null);
  };

  const recentTone = (r) => {
    if (!r.timestamp) return 'dim';
    const sec = (Date.now() - r.timestamp) / 1000;
    if (sec < 86400) return 'good';
    if (sec < 604800) return 'dim';
    return 'warn';
  };

  const recentTime = (r) => {
    if (!r.timestamp) return '—';
    const sec = (Date.now() - r.timestamp) / 1000;
    if (sec < 60) return 'just now';
    if (sec < 3600) return `${Math.floor(sec / 60)} min ago`;
    if (sec < 86400) return `${Math.floor(sec / 3600)}h ago`;
    const days = Math.floor(sec / 86400);
    if (days === 1) return 'yesterday';
    if (days < 7) return `${days} days`;
    return `${Math.floor(days / 7)} weeks`;
  };

  const deviceLabel = React.useMemo(() => {
    if (activeIdx !== null && recents[activeIdx]) return recents[activeIdx].name;
    return `Router · ${host}`;
  }, [host, activeIdx, recents]);

  const handleLogin = async () => {
    setError(null);
    setLoading(true);
    try {
      const result = await API.login(host, port, username, password);
      const sessionId = result.sessionId;
      API.initWebSocket(sessionId);
      await new Promise((resolve) => {
        const check = () => API.wsManager?.isConnected ? resolve() : setTimeout(check, 100);
        setTimeout(() => resolve(), 2000);
        check();

      if (saveCredentials) {
        saveRecent({ name: deviceLabel, host, port: parseInt(port) || 22, username, timestamp: Date.now() });

      setSessionId(sessionId);
      setRouter({ host, port: parseInt(port), username });
      setPage('Dashboard');
    } catch (err) {
      setError(err.message || 'Connection failed');
    } finally {
      setLoading(false);
    }

    setError(null);
    setTesting(true);
    try {
      const r = await API.login(host, port, username, password);

            </div>
            <ALabeledField label="Password" sub="router password" value={password} onChange={e => setPassword(e.target.value)} type="password" mono />
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              <AToggleRow label="Use TLS (api-ssl)" sub="api-ssl port 8729" on={useTls} onChange={setUseTls} />
              <AToggleRow label="Save credentials" sub="stored locally" on={saveCredentials} onChange={setSaveCredentials} />
            </div>
          </div>

          {error && (
            <div style={{ marginTop: 14, padding: '10px 12px', borderRadius: 8, fontSize: 12, fontWeight: 500, background: isOk ? 'rgba(34,197,94,0.08)' : 'rgba(239,68,68,0.08)', color: isOk ? '#86EFAC' : '#FCA5A5', border: `1px solid ${isOk ? 'rgba(34,197,94,0.25)' : 'rgba(239,68,68,0.25)'}` }}>
              {error}
            </div>
          )}

          <div style={{ flex: 1 }} />

          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 16, paddingTop: 16, borderTop: `1px solid ${A.border}`, flexShrink: 0 }}>
            <APill tone="good" mono>ready</APill>
            <span style={{ flex: 1 }} />
            <ABtn kind="secondary" onClick={handleTest} disabled={testing || loading}>{testing ? 'Testing…' : 'Test'}</ABtn>
            <ABtn kind="primary" onClick={handleLogin} disabled={loading || !host || !username}>{loading ? 'Connecting…' : 'Connect'}</ABtn>
          </div>
        </div>

      </div>
    </div>
  );
};

const DashboardScreen = ({ sessionId, router }) => {
  const [stats,       setStats]       = React.useState(null);
  const [traffic,     setTraffic]     = React.useState({ rx: Array(28).fill(0), tx: Array(28).fill(0) });
  const [wans,        setWans]        = React.useState([]);
  const [clientCount, setClientCount] = React.useState(0);
  const [talkers,     setTalkers]     = React.useState([]);
  const [loading,     setLoading]     = React.useState(true);
  const [refreshing,  setRefreshing]  = React.useState(false);
  const alertCtx = React.useContext(AlertCtx);
  const alertStateCache = React.useRef(new Map());

  const checkThresholds = (data) => {
    if (!data) return;
    const check = (metric, value, thresholds) => {
      const key = `${metric}-state`;
      const prev = alertStateCache.current.get(key) || 'ok';
      const cur = value > thresholds.critical ? 'critical' : value > thresholds.warn ? 'warn' : 'ok';
      if (cur !== prev && cur !== 'ok') alertCtx.addAlert(metric, value, cur === 'critical' ? thresholds.critical : thresholds.warn, cur);
      alertStateCache.current.set(key, cur);
    };
    check('cpu',     data.cpu,     ALERT_THRESHOLDS.cpu);
    check('memory',  data.memory,  ALERT_THRESHOLDS.memory);
    check('storage', data.storage, ALERT_THRESHOLDS.storage);
  };

  const fetchAll = React.useCallback(async (isManual = false) => {
    if (isManual) setRefreshing(true);
    try {
      const [sRes, tRes, wRes, dRes, kRes] = await Promise.allSettled([
        API.getSystemStats(sessionId),
        API.call(sessionId, '/api/traffic'),
        API.getWanStatus(sessionId),
        API.getDhcpClients(sessionId),
        API.call(sessionId, '/api/top-talkers'),
      ]);
      if (sRes.status === 'fulfilled') { setStats(sRes.value); checkThresholds(sRes.value); }
      if (tRes.status === 'fulfilled') setTraffic(tRes.value);
      if (wRes.status === 'fulfilled') setWans(wRes.value);
      if (dRes.status === 'fulfilled') setClientCount(Array.isArray(dRes.value) ? dRes.value.length : 0);
      if (kRes.status === 'fulfilled') setTalkers(Array.isArray(kRes.value) ? kRes.value : []);
      setLoading(false);
    } catch {}
    if (isManual) setRefreshing(false);
  }, [sessionId]);

  React.useEffect(() => {
    if (!sessionId) return;
    fetchAll();
    const iv = setInterval(fetchAll, 5000);
    return () => clearInterval(iv);
  }, [sessionId, fetchAll]);

  // Kbps → human-readable
  const fmtKbps = (kbps) => {
    if (kbps >= 1024 * 1024) return `${(kbps / 1024 / 1024).toFixed(1)} Gbps`;
    if (kbps >= 1024)        return `${(kbps / 1024).toFixed(1)} Mbps`;
    return `${kbps} Kbps`;
  };

  const rxNow = traffic.rx[traffic.rx.length - 1] || 0;
  const txNow = traffic.tx[traffic.tx.length - 1] || 0;

  const kpiTone = (val, warn, bad) => val >= bad ? 'bad' : val >= warn ? 'warn' : 'good';
  const cpuTone   = kpiTone(stats?.cpu    || 0, 70, 90);
  const memTone   = kpiTone(stats?.memory || 0, 80, 95);
  const diskTone  = kpiTone(stats?.storage|| 0, 80, 95);

  if (loading) return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <ATopBar title="Dashboard" sub="loading…" />
      <div style={{ flex: 1, padding: 18, display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 14 }}>
        {[1,2,3,4].map(i => <ASkeleton key={i} />)}

    </div>
  );

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

      {/* ── Top bar ── */}

        <div>
          <div style={{ fontSize: 15, fontWeight: 600, letterSpacing: '-0.015em' }}>

            connected · uptime {stats?.uptime || '—'} · cpu {stats?.cpu || 0}%
          </div>
        </div>
        <span style={{ flex: 1 }} />
        <ABtn kind="secondary" onClick={() => fetchAll(true)} disabled={refreshing}>

const InterfacesScreen = ({ sessionId }) => {

const WANScreen = ({ sessionId }) => {
  const [wans, setWans] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const alertCtx = React.useContext(AlertCtx);
  const wanAlertState = React.useRef(new Map());

  const checkWanStatus = (data) => {
    if (!data) return;
    data.forEach(wan => {
      const key = `wan-${wan.name}`;
      const prevState = wanAlertState.current.get(key) || 'up';

      // Only alert on transition from up to down
      if (wan.status === 'down' && prevState === 'up') {
        alertCtx.addAlert('wan', 0, 0, 'critical');
      }

      wanAlertState.current.set(key, wan.status);
    });
  };

  React.useEffect(() => {
    if (!sessionId) return;

    const handleData = (data) => {
      setWans(data);
      setLoading(false);
      setError(null);
      checkWanStatus(data);
    };

    let unsubscribe;
    let interval;

    const useWS = API.wsManager?.isConnected;

    if (useWS) {
      API.subscribe('/api/wan-status', handleData);
      unsubscribe = () => API.unsubscribe('/api/wan-status', handleData);
    } else {
      const fetchWans = async () => {
        setLoading(true);
        setError(null);
        try {
          const data = await API.getWanStatus(sessionId);
          handleData(data);
        } catch (err) {
          setError(err.message);
          setLoading(false);
        }
      };

      fetchWans();
      interval = setInterval(fetchWans, 5000);
    }

    return () => {
      if (unsubscribe) unsubscribe();
      if (interval) clearInterval(interval);
    };
  }, [sessionId]);

  if (loading) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><ASkeleton /></div>;
  if (error) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><AAlert>{error}</AAlert></div>;

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
      <h2 style={{ color: A.text, marginBottom: 16 }}>WAN Links</h2>
      {wans.map((wan, i) => (
        <ACard key={i} pad={16} style={{ marginBottom: 12 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
            <div style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{wan.name}</div>
            <APill tone={wan.status === 'up' ? 'good' : 'bad'}>{wan.status}</APill>
          </div>
          <div style={{ fontSize: 10, color: A.textFaint, marginBottom: 4 }}>IP: {wan.ip}</div>
          <div style={{ background: A.surface, height: 4, borderRadius: 2, overflow: 'hidden' }}>

const ScriptsScreen = ({ sessionId }) => {
  const [scripts, setScripts] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [executing, setExecuting] = React.useState(null);
  const [execOutput, setExecOutput] = React.useState(null);
  const [execStatus, setExecStatus] = React.useState('idle');
  const [execElapsed, setExecElapsed] = React.useState(0);

  // Combine API scripts with templates
  const allScripts = React.useMemo(() => {
    const templates = Object.values(SCRIPT_TEMPLATES).map(t => ({
      name: t.name,
      schedule: t.schedule,
      lastRun: 'Never',
      status: 'template',
      label: t.label,
      description: t.description,
      icon: t.icon
    }));
    return [...templates, ...scripts];
  }, [scripts]);

  React.useEffect(() => {
    if (!sessionId) return;
    const fetchScripts = async () => {
      setLoading(true);
      setError(null);
      try {
        const data = await API.getScripts(sessionId);
        setScripts(data);
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    };
    fetchScripts();
  }, [sessionId]);

  // Poll execution output
  React.useEffect(() => {
    if (!executing || execStatus === 'done' || execStatus === 'error') return;

    const poll = async () => {
      try {
        const result = await API.getScriptOutput(executing);
        setExecOutput(result.output);
        setExecStatus(result.status);
        setExecElapsed(result.elapsed);

        if (result.status !== 'running') {
          // Execution complete
          setTimeout(() => {
            // Keep showing for 5 seconds
            setTimeout(() => {
              setExecuting(null);
              setExecStatus('idle');
            }, 5000);
          }, 0);
        }
      } catch (err) {
        console.error('Poll error:', err);
      }
    };

    const interval = setInterval(poll, 500);
    return () => clearInterval(interval);
  }, [executing, execStatus]);

  const handleExecute = async (scriptName) => {
    try {
      setExecOutput('Starting...\n');
      setExecStatus('running');
      setExecElapsed(0);

      const result = await API.executeScript(sessionId, scriptName);
      setExecuting(result.executionId);
    } catch (err) {
      setExecOutput(`Error: ${err.message}`);
      setExecStatus('error');
      setExecuting(null);
    }
  };

  if (loading) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><ASkeleton /></div>;
  if (error) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><AAlert>{error}</AAlert></div>;

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
      <h2 style={{ color: A.text, marginBottom: 16 }}>Scripts & Tasks</h2>

      {executing && (
        <div style={{ marginBottom: 16 }}>
          <h3 style={{ fontSize: 12, fontWeight: 600, color: A.text, marginBottom: 8 }}>Execution Output</h3>
          <TerminalOutput
            output={execOutput}
            status={execStatus}
            exitCode={execStatus === 'done' ? 0 : execStatus === 'error' ? 1 : null}
            elapsed={execElapsed}
            isLoading={execStatus === 'running'}
          />
          {execStatus !== 'running' && (
            <div style={{ fontSize: 10, color: A.textDim, marginBottom: 16 }}>
              Completed in {(execElapsed / 1000).toFixed(2)}s
            </div>
          )}
        </div>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 12 }}>
        {allScripts.map(script => (
          <ACard key={script.name} pad={12}>
            <div style={{ marginBottom: 12 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                {script.icon && <span style={{ fontSize: 16 }}>{script.icon}</span>}
                <div style={{ fontSize: 12, fontWeight: 600, color: A.text, flex: 1 }}>
                  {script.label || script.name}
                </div>
                {script.status === 'template' && <APill tone="dim">Template</APill>}
                {script.status === 'success' && <APill tone="good">Success</APill>}
              </div>
              {script.description && (
                <div style={{ fontSize: 10, color: A.textFaint, marginBottom: 8 }}>
                  {script.description}
                </div>
              )}
            </div>

            <div style={{ fontSize: 9, color: A.textDim, marginBottom: 10, paddingBottom: 10, borderBottom: `1px solid ${A.border}` }}>
              <div>Schedule: {script.schedule}</div>
              <div>Last: {script.lastRun}</div>
            </div>

            <ABtn
              variant="secondary"
              onClick={() => handleExecute(script.name)}
              disabled={executing !== null}
              style={{ width: '100%' }}
            >
              {executing === script.name ? '▌ Running...' : '▶ Run'}
            </ABtn>
          </ACard>
        ))}
      </div>
    </div>
  );
};

    fetchBackups();
    const interval = setInterval(fetchBackups, 5000);
    return () => clearInterval(interval);
  }, [sessionId]);

  if (loading) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><ASkeleton /></div>;
  if (error) return <div style={{ flex: 1, overflow: 'auto', padding: 16 }}><AAlert>{error}</AAlert></div>;

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
      <h2 style={{ color: A.text, marginBottom: 16 }}>Backups</h2>
      {backups.map(backup => (
        <ACard key={backup.filename} pad={12} style={{ marginBottom: 8 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
            <div>
              <div style={{ fontSize: 12, fontWeight: 500, fontFamily: A.mono, color: A.text }}>{backup.filename}</div>
            </div>
            <APill tone="good">{backup.trigger}</APill>
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: A.textDim }}>
            <span>{backup.size}</span>
            <span>{backup.timestamp}</span>
          </div>
        </ACard>
      ))}
    </div>
  );
};

            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Source Address</label>
            <input type="text" placeholder="192.168.1.0/24" value={srcAddr} onChange={e => setSrcAddr(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }} />
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 11, color: A.textDim, marginBottom: 4, display: 'block' }}>Action</label>
            <select value={action} onChange={e => setAction(e.target.value)}
              style={{ width: '100%', padding: 8, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6, fontFamily: A.ui, marginBottom: 12 }}>
              <option>masquerade</option>
              <option>redirect</option>
              <option>dst-nat</option>
            </select>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <ABtn variant="primary" onClick={handleAdd} style={{ flex: 1 }}>Add</ABtn>
            <ABtn variant="secondary" onClick={() => setShowForm(false)} style={{ flex: 1 }}>Cancel</ABtn>
          </div>
        </ACard>
      )}

      {(() => {
        const startIdx = page * PAGE_SIZE;
        const endIdx = startIdx + PAGE_SIZE;
        const paginatedRules = rules.slice(startIdx, endIdx);
        const totalPages = Math.ceil(rules.length / PAGE_SIZE);

        return (
          <div style={{ display: 'flex', flexDirection: 'column', flex: 1 }}>
            <div style={{ flex: 1, overflow: 'auto', marginBottom: totalPages > 1 ? 16 : 0 }}>
              {paginatedRules.map(rule => (
                <ACard key={rule.id} pad={12} style={{ marginBottom: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 12, fontWeight: 600, color: A.text }}>{rule.action}</div>
                      <div style={{ fontSize: 10, color: A.textDim }}>{rule.chain}</div>
                    </div>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                      <APill tone={rule.disabled ? 'dim' : 'good'}>{rule.srcAddress || 'all'}</APill>
                      <button onClick={() => handleDelete(rule.id)} style={{
                        background: 'rgba(239,68,68,0.2)', color: '#FCA5A5', border: 'none', borderRadius: 4, padding: '4px 8px', cursor: 'pointer', fontSize: 11, fontWeight: 500, minWidth: 60
                      }}>Delete</button>
                    </div>
                  </div>
                </ACard>
              ))}
            </div>
            {totalPages > 1 && (
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', justifyContent: 'center', borderTop: `1px solid ${A.border}`, paddingTop: 16 }}>
                <button onClick={() => setPage(Math.max(0, page - 1))} disabled={page === 0} style={{
                  padding: '6px 12px', background: page === 0 ? A.surface : A.accentLine, color: A.text, border: 'none',
                  borderRadius: 4, cursor: page === 0 ? 'not-allowed' : 'pointer', fontSize: 12, opacity: page === 0 ? 0.5 : 1
                }}>← Prev</button>
                <span style={{ color: A.textDim, fontSize: 12 }}>Page {page + 1} of {totalPages}</span>
                <button onClick={() => setPage(Math.min(totalPages - 1, page + 1))} disabled={page === totalPages - 1} style={{
                  padding: '6px 12px', background: page === totalPages - 1 ? A.surface : A.accentLine, color: A.text, border: 'none',
                  borderRadius: 4, cursor: page === totalPages - 1 ? 'not-allowed' : 'pointer', fontSize: 12, opacity: page === totalPages - 1 ? 0.5 : 1
                }}>Next →</button>
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
};

// ========== MAIN APP ==========

const App = () => {
  const [page, setPage] = React.useState('Login');
  const [sessionId, setSessionId] = React.useState(null);
  const [router, setRouter] = React.useState(null);
  const [alerts, setAlerts] = React.useState([]);
  const [history, setHistory] = React.useState(() => AlertUtils.loadHistory());
  const [showHistory, setShowHistory] = React.useState(false);

  const addAlert = React.useCallback((metric, value, threshold, severity) => {
    const id = Math.random().toString(36).substring(7);
    const alert = { id, metric, value, threshold, severity, timestamp: Date.now() };

    // Add to active alerts (max 5)
    setAlerts(prev => {
      const updated = [alert, ...prev];
      return updated.slice(0, 5);
    });

    // Add to history
    setHistory(prev => {
      const updated = [alert, ...prev];
      AlertUtils.saveHistory(updated);
      return updated;
    });
  }, []);

  const dismissAlert = React.useCallback((id) => {
    setAlerts(prev => prev.filter(a => a.id !== id));
  }, []);

  const clearHistory = React.useCallback(() => {
    setHistory([]);
    AlertUtils.saveHistory([]);
  }, []);

  const alertCtxValue = {
    alerts,
    history,
    addAlert,
    dismissAlert,
    clearHistory,
    showHistory,
    toggleHistory: () => setShowHistory(s => !s)
  };

  const handleLogout = async () => {
    // Close WebSocket connection first
    if (API.wsManager) {
      API.wsManager.close();
      API.wsManager = null;
    }

    try {
      if (sessionId) {
        await API.logout(sessionId);
      }
    } catch (err) {
      console.error('Logout error:', err);
    }

    setSessionId(null);
    setRouter(null);
    setPage('Login');
  };

  const renderScreen = () => {
    if (!sessionId && page !== 'Login') { setPage('Login'); return null; }
    switch (page) {
      case 'Login':       return <LoginScreen setPage={setPage} setSessionId={setSessionId} setRouter={setRouter} />;
      case 'Dashboard':   return <DashboardScreen sessionId={sessionId} router={router} />;
      case 'Interfaces':  return <InterfacesScreen sessionId={sessionId} />;
      case 'IP Addresses':return <IpAddressesScreen sessionId={sessionId} />;
      case 'Routes':      return <RoutesScreen sessionId={sessionId} />;
      case 'DNS':         return <DnsScreen sessionId={sessionId} />;
      case 'NAT':         return <NatScreen sessionId={sessionId} />;
      case 'WAN':         return <WANScreen sessionId={sessionId} />;
      case 'Firewall':    return <FirewallScreen sessionId={sessionId} />;
      case 'Bandwidth':   return <BandwidthScreen sessionId={sessionId} />;
      case 'Clients':     return <ClientsScreen sessionId={sessionId} />;
      case 'Hotspot':     return <HotspotScreen sessionId={sessionId} />;
      case 'Wireless':    return <WirelessScreen sessionId={sessionId} />;
      case 'VPN':         return <VpnScreen sessionId={sessionId} />;
      case 'Logs':        return <LogsScreen sessionId={sessionId} />;
      case 'Scripts':     return <ScriptsScreen sessionId={sessionId} />;
      case 'Backup':      return <BackupScreen sessionId={sessionId} />;
      case 'Settings':    return <SettingsScreen sessionId={sessionId} router={router} />;
      default:            return null;
    }
  };

  if (page === 'Login') return renderScreen();

  const pageLabelMap = Object.fromEntries(NAV_ITEMS.map(i => [i.page, i.label]));
  const pageLabel = pageLabelMap[page] || page;

  return (
    <AlertCtx.Provider value={alertCtxValue}>
      <div style={{ width: '100%', height: '100%', background: A.bgLayered, color: A.text, display: 'flex', flexDirection: 'column', fontFamily: A.ui, fontSize: 13, letterSpacing: '-0.005em', overflow: 'hidden' }}>

        {/* ── Title bar ── */}
        <div style={{ height: 32, display: 'flex', alignItems: 'center', flex: '0 0 auto', borderBottom: `1px solid ${A.border}`, background: 'rgba(7,11,20,0.5)', padding: '0 12px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: A.textDim, fontSize: 12 }}>
            <NetForgeMark size={14} color={A.accent} />
            <span style={{ fontWeight: 500, color: A.text }}>NetForge</span>
            <span style={{ color: A.textFaint }}>·</span>
            <span>{pageLabel}</span>
          </div>
          <div style={{ flex: 1 }} />
          <button onClick={() => setShowHistory(!showHistory)} style={{ background: 'none', border: 'none', color: alerts.length > 0 ? A.warn : A.textFaint, cursor: 'pointer', fontSize: 11, padding: '2px 8px', borderRadius: 6, fontFamily: A.ui, position: 'relative' }}>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"><path d="M8 1a5 5 0 0 1 5 5v2l1 2H2l1-2V6a5 5 0 0 1 5-5zM6 13a2 2 0 0 0 4 0"/></svg>
            {alerts.length > 0 && <span style={{ position: 'absolute', top: 0, right: 4, width: 7, height: 7, borderRadius: 999, background: A.warn, border: `2px solid rgba(7,11,20,0.9)` }} />}
          </button>
        </div>

        {/* ── Main layout ── */}
        <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
          <ASidebar
            active={page}
            router={router}
            onNavigate={setPage}
            onLogout={handleLogout}
            alertCount={alerts.length}
          />
          <main style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
            {renderScreen()}
          </main>
        </div>

        {/* Toast Container */}
        <ToastContainer alerts={alerts} onDismiss={dismissAlert} />

        {/* Alert History Panel */}
        {showHistory && (
          <AlertHistoryPanel
            history={history}
            onClose={() => setShowHistory(false)}
            onClear={clearHistory}
          />
        )}
      </div>
    </AlertCtx.Provider>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
