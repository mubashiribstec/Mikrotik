<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NetForge — MikroTik Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #070c18; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
    #root { width: 100%; height: 100%; }
    *::-webkit-scrollbar { width: 0; height: 0; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  </style>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">

// ========== CONTEXT ==========
const NavCtx = React.createContext({ page: 'Login', setPage: () => {} });
const AuthCtx = React.createContext({ sessionId: null, setSessionId: () => {}, router: null, logout: () => {} });
const DataCtx = React.createContext({ data: {}, loading: false });

// ========== DESIGN TOKENS ==========
const A = {
  bg: '#0B1220',
  bgLayered: 'radial-gradient(120% 80% at 0% 0%, rgba(56,118,255,0.18), transparent 55%), radial-gradient(80% 60% at 100% 100%, rgba(99,102,241,0.10), transparent 60%), #0B1220',
  surface: 'rgba(255,255,255,0.035)',
  surfaceStrong: 'rgba(255,255,255,0.06)',
  border: 'rgba(255,255,255,0.07)',
  borderStrong: 'rgba(255,255,255,0.12)',
  text: '#E6EAF2',
  textDim: 'rgba(230,234,242,0.62)',
  textFaint: 'rgba(230,234,242,0.42)',
  accent: '#3B82F6',
  accentSoft: 'rgba(59,130,246,0.16)',
  good: '#22C55E',
  warn: '#F59E0B',
  bad: '#EF4444',
  mono: '"JetBrains Mono", ui-monospace, monospace',
  ui: 'Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif',
};

// ========== ATOM COMPONENTS ==========

const ABase = ({ children }) => (
  <div style={{ width: '100%', height: '100%', background: A.bgLayered, color: A.text,
    fontFamily: A.ui, fontSize: 13, lineHeight: 1.45, letterSpacing: '-0.005em',
    display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
    {children}
  </div>
);

const ATitleBar = ({ title, router, onLogout }) => (
  <div style={{ height: 32, display: 'flex', alignItems: 'center', flex: '0 0 auto',
    borderBottom: `1px solid ${A.border}`, background: 'rgba(7,11,20,0.5)' }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 12px', color: A.textDim, fontSize: 12 }}>
      <span style={{ fontWeight: 500, color: A.text }}>NetForge</span>
      <span style={{ color: A.textFaint }}>·</span>
      <span>{title}</span>
      {router && <span style={{ color: A.textFaint, marginLeft: 8 }}>@ {router}</span>}
    </div>
    <div style={{ flex: 1 }} />
    {onLogout && (
      <button onClick={onLogout} style={{
        padding: '6px 12px', marginRight: 12, border: 'none', background: 'transparent',
        color: A.textDim, cursor: 'pointer', fontFamily: A.ui, fontSize: 12, display: 'flex',
        alignItems: 'center', gap: 6, transition: 'color 0.2s'
      }} onMouseEnter={e => e.target.style.color = A.text}
         onMouseLeave={e => e.target.style.color = A.textDim}>
        🚪 Logout
      </button>
    )}
  </div>
);

const APill = ({ children, tone = 'dim' }) => {
  const tones = {
    dim: { bg: 'rgba(255,255,255,0.05)', fg: A.textDim, dot: A.textFaint },
    good: { bg: 'rgba(34,197,94,0.12)', fg: '#86EFAC', dot: A.good },
    warn: { bg: 'rgba(245,158,11,0.12)', fg: '#FCD34D', dot: A.warn },
    bad: { bg: 'rgba(239,68,68,0.12)', fg: '#FCA5A5', dot: A.bad },
  }[tone];
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '3px 9px 3px 8px', borderRadius: 999, background: tones.bg,
      fontFamily: A.ui, fontSize: 11, color: tones.fg, fontWeight: 500 }}>
      <span style={{ width: 6, height: 6, borderRadius: 999, background: tones.dot }} />
      {children}
    </span>
  );
};

const ABtn = ({ children, kind = 'ghost', onClick, full = false, disabled = false }) => {
  const styles = {
    primary: { bg: A.accent, fg: '#fff', shadow: '0 4px 14px rgba(59,130,246,0.35)' },
    secondary: { bg: A.surfaceStrong, fg: A.text, shadow: 'none' },
    ghost: { bg: 'transparent', fg: A.textDim, shadow: 'none' },
  }[kind];
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display: 'inline-flex', alignItems: 'center', gap: 8, padding: '7px 12px',
      borderRadius: 8, border: 'none', background: styles.bg, color: styles.fg,
      fontFamily: A.ui, fontSize: 13, fontWeight: 500, cursor: disabled ? 'not-allowed' : 'pointer',
      boxShadow: styles.shadow, width: full ? '100%' : undefined, justifyContent: 'center',
      opacity: disabled ? 0.5 : 1, transition: 'all 0.2s'
    }}>
      {children}
    </button>
  );
};

const ACard = ({ children, pad = 16, style, animated = true }) => (
  <div style={{ background: A.surface, border: `1px solid ${A.border}`, borderRadius: 12,
    padding: pad, backdropFilter: 'blur(8px)', animation: animated ? 'slideIn 0.4s ease-out' : 'none', ...style }}>
    {children}
  </div>
);

const AInput = ({ label, value, onChange, type = 'text', placeholder }) => (
  <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
    <span style={{ fontSize: 12, fontWeight: 500 }}>{label}</span>
    <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
      style={{
        padding: '9px 11px', background: A.surface, border: `1px solid ${A.borderStrong}`,
        borderRadius: 9, color: A.text, fontFamily: A.ui, fontSize: 13, outline: 'none',
      }} />
  </label>
);

const ASection = ({ title, children }) => (
  <div style={{ marginBottom: 20 }}>
    <h3 style={{ fontSize: 12, fontWeight: 600, marginBottom: 12, color: A.text, textTransform: 'uppercase', letterSpacing: '0.05em' }}>
      {title}
    </h3>
    {children}
  </div>
);

const ARadio = ({ name, options, value, onChange }) => (
  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
    {options.map(opt => (
      <label key={opt} style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
        <input type="radio" name={name} value={opt} checked={value === opt} onChange={e => onChange(e.target.value)} />
        <span style={{ fontSize: 12, color: A.text }}>{opt}</span>
      </label>
    ))}
  </div>
);

const AKpi = ({ label, value, unit, trend, color = A.accent }) => (
  <ACard animated={true} style={{ position: 'relative' }}>
    <div style={{ fontSize: 11, color: A.textFaint, marginBottom: 6 }}>{label}</div>
    <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between' }}>
      <div>
        <div style={{ fontSize: 28, fontWeight: 700, color: color, animation: 'fadeIn 0.4s ease-out' }}>
          {value}{unit}
        </div>
      </div>
      {trend && (
        <div style={{ fontSize: 11, color: trend > 0 ? A.good : A.warn, fontWeight: 600 }}>
          {trend > 0 ? '↑' : '↓'} {Math.abs(trend)}%
        </div>
      )}
    </div>
  </ACard>
);

const AAction = ({ icon, label, onClick }) => (
  <button onClick={onClick} style={{
    display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8,
    padding: 12, borderRadius: 12, border: `1px solid ${A.border}`,
    background: A.accentSoft, color: A.accent, cursor: 'pointer',
    fontFamily: A.ui, fontSize: 12, fontWeight: 500, transition: 'all 0.2s'
  }} onMouseEnter={e => e.target.style.transform = 'translateY(-2px)'}
     onMouseLeave={e => e.target.style.transform = 'translateY(0)'}>
    <div style={{ fontSize: 20 }}>{icon}</div>
    {label}
  </button>
);

const AStatCard = ({ label, value, unit, icon }) => (
  <ACard pad={12}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
      <div style={{ fontSize: 24 }}>{icon}</div>
      <div>
        <div style={{ fontSize: 11, color: A.textFaint }}>{label}</div>
        <div style={{ fontSize: 20, fontWeight: 700, color: A.accent }}>{value}<span style={{ fontSize: 12, color: A.textDim }}>{unit}</span></div>
      </div>
    </div>
  </ACard>
);

const AProtocolCard = ({ name, port, status, peers, traffic }) => (
  <ACard pad={14}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: 12 }}>
      <div>
        <div style={{ fontSize: 13, fontWeight: 600, color: A.text }}>{name}</div>
        <div style={{ fontSize: 11, color: A.textFaint }}>Port {port}</div>
      </div>
      <APill tone={status === 'enabled' ? 'good' : 'dim'}>{status}</APill>
    </div>
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, fontSize: 11, color: A.textDim }}>
      <div><span style={{ color: A.textFaint }}>Peers:</span> <span style={{ color: A.text, fontWeight: 600 }}>{peers}</span></div>
      <div><span style={{ color: A.textFaint }}>Traffic:</span> <span style={{ color: A.accent, fontWeight: 600 }}>{traffic}</span></div>
    </div>
  </ACard>
);

const AQrGenerator = ({ text }) => (
  <div style={{ background: A.surface, padding: 16, borderRadius: 8, border: `1px solid ${A.border}`, textAlign: 'center', marginTop: 12 }}>
    <div style={{ width: 120, height: 120, background: '#fff', borderRadius: 4, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, color: '#000' }}>
      QR: {text.substring(0, 10)}...
    </div>
    <div style={{ fontSize: 10, color: A.textFaint, marginTop: 8 }}>Scan to connect</div>
  </div>
);

// ========== SIDEBAR COMPONENT ==========

const ASidebar = ({ page, onPageChange, onLogout }) => {
  const navItems = [
    { name: 'Dashboard', icon: '📊' },
    { name: 'Interfaces', icon: '🌐' },
    { name: 'WAN', icon: '🗺️' },
    { name: 'Firewall', icon: '🔥' },
    { name: 'Bandwidth', icon: '📈' },
    { name: 'Clients', icon: '👥' },
    { name: 'Hotspot', icon: '📡' },
    { name: 'Wireless', icon: '📶' },
    { name: 'VPN', icon: '🔐' },
    { name: 'Logs', icon: '📋' },
    { name: 'Scripts', icon: '⚙️' },
    { name: 'Backup', icon: '💾' },
    { name: 'Settings', icon: '⚡' },
  ];

  return (
    <div style={{ width: 180, borderRight: `1px solid ${A.border}`, overflow: 'auto', display: 'flex', flexDirection: 'column' }}>
      {navItems.map((item) => (
        <button key={item.name} onClick={() => onPageChange(item.name)} style={{
          flex: '0 0 auto', padding: '10px 12px', border: 'none', background: page === item.name ? A.accentSoft : 'transparent',
          color: page === item.name ? A.accent : A.textDim, cursor: 'pointer',
          fontFamily: A.ui, fontSize: 12, fontWeight: page === item.name ? 500 : 400,
          display: 'flex', alignItems: 'center', gap: 8, borderLeft: page === item.name ? `2px solid ${A.accent}` : '2px solid transparent',
          transition: 'all 0.2s ease-out',
        }}>
          <span>{item.icon}</span>
          <span>{item.name}</span>
        </button>
      ))}
      <div style={{ flex: 1 }} />
      <button onClick={onLogout} style={{
        flex: '0 0 auto', padding: '10px 12px', border: 'none', background: 'transparent',
        color: A.textDim, cursor: 'pointer', fontFamily: A.ui, fontSize: 12,
        display: 'flex', alignItems: 'center', gap: 8, borderTop: `1px solid ${A.border}`,
      }}>
        🚪
        <span>Logout</span>
      </button>
    </div>
  );
};

// ========== SCREENS ==========

const DashboardScreen = () => (
  <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'auto', padding: 16 }}>
    <ASection title="System Status">
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 12, marginBottom: 16 }}>
        <AKpi label="CPU" value={42} unit="%" trend={5} />
        <AKpi label="Memory" value={68} unit="%" trend={2} />
        <AKpi label="Storage" value={25} unit="%" trend={-1} />
        <AKpi label="Uptime" value="45" unit="d" color={A.good} />
      </div>
    </ASection>

    <ASection title="Quick Actions">
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12 }}>
        <AAction icon="🔄" label="Reboot" onClick={() => alert('Reboot')} />
        <AAction icon="💾" label="Backup" onClick={() => alert('Backup')} />
        <AAction icon="📊" label="Logs" onClick={() => alert('Logs')} />
        <AAction icon="⚙️" label="Config" onClick={() => alert('Config')} />
      </div>
    </ASection>

    <ASection title="Status Overview">
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <ACard>
          <div style={{ fontSize: 12, color: A.textFaint, marginBottom: 8 }}>Connected Interfaces</div>
          <div style={{ fontSize: 20, fontWeight: 700, color: A.good }}>7 / 8</div>
        </ACard>
        <ACard>
          <div style={{ fontSize: 12, color: A.textFaint, marginBottom: 8 }}>Active Sessions</div>
          <div style={{ fontSize: 20, fontWeight: 700, color: A.accent }}>24</div>
        </ACard>
      </div>
    </ASection>
  </div>
);

const InterfacesScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>Network Interfaces</h2>
    {[1,2,3,4,5,6,7,8].map(i => (
      <ACard key={i} pad={12} style={{ marginBottom: 8 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div><div style={{ fontSize: 12, fontWeight: 500, color: A.text }}>ether{i}</div><div style={{ fontSize: 11, color: A.textFaint }}>Status: {i <= 7 ? 'up' : 'down'}</div></div>
          <div style={{ fontSize: 12, color: A.accent, fontWeight: 600 }}>{Math.floor(Math.random() * 80) + 10}%</div>
        </div>
      </ACard>
    ))}
  </div>
);

const WANScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>WAN & Load Balance</h2>
    <ACard pad={16}>
      <div style={{ marginBottom: 16 }}>
        <label style={{ fontSize: 11, color: A.textFaint }}>Load Balancing Method:</label>
        <select style={{ width: '100%', padding: 8, marginTop: 6, background: A.surface, color: A.text, border: `1px solid ${A.border}`, borderRadius: 6 }}>
          <option>PCC (Per-Connection)</option>
          <option>NTH (Round-Robin)</option>
          <option>Failover</option>
        </select>
      </div>
    </ACard>
    <ACard pad={16} style={{ marginTop: 12 }}>
      <div style={{ fontSize: 11, color: A.textFaint, marginBottom: 8 }}>Distribution</div>
      <div style={{ display: 'flex', gap: 6 }}>
        <div style={{ flex: 1, height: 40, background: 'rgba(34,197,94,0.3)', borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 600 }}>WAN1: 45%</div>
        <div style={{ flex: 1, height: 40, background: 'rgba(59,130,246,0.3)', borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 600 }}>WAN2: 55%</div>
      </div>
    </ACard>
  </div>
);

const FirewallScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>Firewall Rules</h2>
    {['YouTube.com', 'Facebook.com', 'TikTok.com'].map(site => (
      <ACard key={site} pad={12} style={{ marginBottom: 8 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div style={{ fontSize: 12, color: A.text }}>{site}</div>
          <button style={{ padding: 4, fontSize: 10, cursor: 'pointer', background: 'none', border: 'none', color: A.textDim }}>×</button>
        </div>
      </ACard>
    ))}
  </div>
);

const BandwidthScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>Bandwidth Queues</h2>
    {[
      { name: 'download_limit', limit: '10M', usage: 65 },
      { name: 'vod_stream', limit: '30M', usage: 42 },
      { name: 'voice', limit: 'unlimited', usage: 8 },
      { name: 'gaming', limit: '100M', usage: 28 },
    ].map(q => (
      <ACard key={q.name} pad={12} style={{ marginBottom: 12 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
          <div><div style={{ color: A.text, fontWeight: 600, fontSize: 12 }}>{q.name}</div><div style={{ fontSize: 11, color: A.textFaint }}>{q.limit}</div></div>
          <div style={{ color: A.accent, fontWeight: 600, fontSize: 12 }}>{q.usage}%</div>
        </div>
        <div style={{ height: 6, background: A.border, borderRadius: 3, overflow: 'hidden' }}><div style={{ width: `${q.usage}%`, height: '100%', background: A.accent, transition: 'width 0.3s' }} /></div>
      </ACard>
    ))}
  </div>
);

const ClientsScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>DHCP & Clients</h2>
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 12, marginBottom: 16 }}>
      <AStatCard label="Active Leases" value="42" unit="" icon="📋" />
      <AStatCard label="Pool Usage" value="68" unit="%" icon="📊" />
      <AStatCard label="Reserved" value="12" unit="" icon="🔒" />
      <AStatCard label="Unknown" value="3" unit="" icon="❓" />
    </div>
    {[
      { vendor: 'Apple', ip: '192.168.1.100', mac: '00:1A:2B:3C:4D:5E', iface: 'ether1', lease: '18h', rx: 420, tx: 850 },
      { vendor: 'Samsung', ip: '192.168.1.105', mac: '00:2A:3B:4C:5D:6E', iface: 'ether2', lease: '14h', rx: 650, tx: 1200 },
    ].map(c => (
      <ACard key={c.mac} pad={12} style={{ marginBottom: 8 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
          <div><div style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{c.vendor}</div><div style={{ fontSize: 11, color: A.textFaint, fontFamily: A.mono }}>{c.ip}</div></div>
          <APill tone="good">{c.iface}</APill>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: A.textDim }}>
          <span>Lease: {c.lease}</span>
          <span>↓{c.rx}MB / ↑{c.tx}MB</span>
        </div>
      </ACard>
    ))}
  </div>
);

const HotspotScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>Hotspot & PPPoE</h2>
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 }}>
      <AStatCard label="Online Users" value="8" unit="" icon="👥" />
      <AStatCard label="Total Users" value="24" unit="" icon="👤" />
    </div>
    {[
      { name: 'user1@example.com', plan: 'Premium 10M', online: true, uptime: '4h 32m', data: '2.3 GB' },
      { name: 'user2@example.com', plan: 'Basic 5M', online: true, uptime: '2h 15m', data: '0.8 GB' },
    ].map(u => (
      <ACard key={u.name} pad={12} style={{ marginBottom: 8 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
          <div><div style={{ fontSize: 12, fontWeight: 500, color: A.text }}>{u.name}</div><div style={{ fontSize: 11, color: A.textFaint }}>{u.plan}</div></div>
          <APill tone={u.online ? 'good' : 'dim'}>{u.online ? 'Online' : 'Offline'}</APill>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: A.textDim }}>
          <span>Uptime: {u.uptime}</span>
          <span style={{ color: A.accent, fontWeight: 600 }}>{u.data}</span>
        </div>
      </ACard>
    ))}
  </div>
);

const WirelessScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>
    <h2 style={{ color: A.text, marginBottom: 16 }}>Wireless SSIDs</h2>
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 }}>
      <AStatCard label="Active SSIDs" value="3" unit="" icon="📡" />
      <AStatCard label="Clients" value="18" unit="" icon="📱" />
    </div>
    {[
      { name: 'NetForge-Main', freq: '2.4 GHz', clients: 12, signal: 92 },
      { name: 'NetForge-Guest', freq: '2.4 GHz', clients: 4, signal: 78 },
      { name: 'NetForge-5G', freq: '5 GHz', clients: 2, signal: 88 },
    ].map(s => (
      <ACard key={s.name} pad={12} style={{ marginBottom: 12 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 10 }}>
          <div><div style={{ fontSize: 12, fontWeight: 600, color: A.text }}>{s.name}</div><div style={{ fontSize: 11, color: A.textFaint }}>{s.freq}</div></div>
          <div style={{ textAlign: 'right' }}><div style={{ fontSize: 12, fontWeight: 600, color: A.accent }}>{s.signal}%</div><div style={{ fontSize: 11, color: A.textDim }}>{s.clients} clients</div></div>
        </div>
        <div style={{ height: 6, background: A.border, borderRadius: 3, overflow: 'hidden' }}><div style={{ width: `${s.signal}%`, height: '100%', background: A.accent, transition: 'width 0.3s' }} /></div>
      </ACard>
    ))}
  </div>
);

const VpnScreen = () => (
  <div style={{ flex: 1, overflow: 'auto', padding: 16 }}>

const LoginScreen = () => {
  const [host, setHost] = React.useState('192.168.1.1');
  const [port, setPort] = React.useState('22');
  const [username, setUsername] = React.useState('admin');
  const [password, setPassword] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState(null);
  const { setSessionId } = React.useContext(AuthCtx);

  const handleLogin = async () => {
    if (!password) {
      setError('Password is required');
      return;
    }
    setLoading(true);
    setError(null);
    try {
      setSessionId(`session-${Date.now()}`, { host, port: parseInt(port), username });
    } catch (err) {
      setError(err.message);
      setLoading(false);
    }
  };

  return (
    <ABase>
      <ATitleBar title="Login" />
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 32 }}>
        <div style={{ width: 400 }}>
          <div style={{ marginBottom: 32, textAlign: 'center' }}>
            <h1 style={{ fontSize: 24, fontWeight: 700, marginBottom: 12, color: A.text }}>NetForge</h1>
            <p style={{ fontSize: 13, color: A.textDim }}>MikroTik Router Manager</p>
          </div>

          {error && <div style={{ background: 'rgba(239,68,68,0.12)', border: `1px solid rgba(239,68,68,0.3)`, borderRadius: 8, padding: 12, color: '#FCA5A5', fontSize: 12, marginBottom: 12 }}>{error}</div>}

          <div style={{ marginBottom: 12 }}>
            <AInput label="Router IP" value={host} onChange={setHost} placeholder="192.168.1.1" />
          </div>

          <div style={{ marginBottom: 12 }}>
            <AInput label="SSH Port" value={port} onChange={setPort} type="number" placeholder="22" />
          </div>

          <div style={{ marginBottom: 12 }}>
            <AInput label="Username" value={username} onChange={setUsername} placeholder="admin" />
          </div>

          <div style={{ marginBottom: 20 }}>
            <AInput label="Password" value={password} onChange={setPassword} type="password" placeholder="••••••••" />
          </div>

          <ABtn kind="primary" full onClick={handleLogin} disabled={loading}>
            {loading ? 'Connecting...' : 'Connect'}
          </ABtn>

          <div style={{ marginTop: 16, fontSize: 11, color: A.textFaint, textAlign: 'center' }}>
            Uses SSH to connect to your MikroTik router
          </div>
        </div>
      </div>
    </ABase>
  );
};

// ========== MAIN APP ==========

const App = () => {
  const [page, setPage] = React.useState('Login');
  const [sessionId, setSessionIdState] = React.useState(null);
  const [router, setRouter] = React.useState(null);

  const setSessionId = (id, routerInfo) => {
    setSessionIdState(id);
    setRouter(routerInfo);
    setPage('Dashboard');
  };

  const logout = () => {
    setSessionIdState(null);
    setRouter(null);
    setPage('Login');
  };

  const renderScreen = () => {
    switch(page) {
      case 'Dashboard': return <DashboardScreen />;
      case 'Interfaces': return <InterfacesScreen />;
      case 'WAN': return <WANScreen />;
      case 'Firewall': return <FirewallScreen />;
      case 'Bandwidth': return <BandwidthScreen />;
      case 'Clients': return <ClientsScreen />;
      case 'Hotspot': return <HotspotScreen />;
      case 'Wireless': return <WirelessScreen />;
      case 'VPN': return <VpnScreen />;
      case 'Logs': return <LogsScreen />;
      case 'Scripts': return <ScriptsScreen />;
      case 'Backup': return <BackupScreen />;
      case 'Settings': return <SettingsScreen />;
      default: return <LoginScreen />;
    }
  };

  if (!sessionId) {
    return (
      <AuthCtx.Provider value={{ sessionId, setSessionId, router, logout }}>
        <NavCtx.Provider value={{ page, setPage }}>
          <LoginScreen />
        </NavCtx.Provider>
      </AuthCtx.Provider>
    );
  }

  const routerDisplay = router ? `${router.host}:${router.port}` : '';

  return (
    <AuthCtx.Provider value={{ sessionId, setSessionId, router, logout }}>
      <NavCtx.Provider value={{ page, setPage }}>
        <ABase>
          <ATitleBar title={page} router={routerDisplay} onLogout={logout} />
          <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
            <ASidebar page={page} onPageChange={setPage} onLogout={logout} />
            {renderScreen()}
          </div>
        </ABase>
      </NavCtx.Provider>
    </AuthCtx.Provider>
  );
};

// ========== RENDER ==========

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
